solar","dir":"in","status":"working","what":"UPS systems compared and proposable","ref":"src/model/designChanges.ts:PROPOSABLE"},{"to":"20-equipment-boq-pricing","dir":"both","status":"working","what":"BOQ design quantities in impact; BOQ revisions record designRev; variations fold into working BOQ","ref":"src/model/variations.ts:foldVariations"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"sheet change list and revision clouds; register falls back to project revision","ref":"src/model/sheetChanges.ts:sheetChanges"},{"to":"27-review-submissions-authority","dir":"out","status":"working","what":"review report modification summary and impact; VO PDF offered as submission","ref":"src/docs/reviewReport.ts"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"Save and issue / No change since IFC readiness","ref":"src/calc/projectReadiness.ts"},{"to":"31-headless-cli-mcp","dir":"both","status":"working","what":"headless edit tools create modification records; listing shows latest revision","ref":"src/headless/editTools.ts"},{"to":"01-app-shell","dir":"in","status":"working","what":"views mounted, user name/initials, stage gate button","ref":"src/App.tsx:1354,1664,1665"}],"gaps":[],"md":"# 26 — Revisions, checkpoints, design baseline, modifications, variations, change impact\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module keeps track of how the design changes over time. It has six parts:\n\n3. **Design baseline** — `src/model/designBaseline.ts`, `src/components/BaselineBar.tsx`. A pointer to one issued revision (default: the latest) that the working draft is measured against. The bar above the workspace shows how many changes of each class the draft has.\n4. **Checkpoints** — `src/model/checkpoints.ts`, `src/components/docs/CheckpointsPanel.tsx`. Private safety copies of the whole project, kept in the computer's browser storage (IndexedDB), **not** in the project file. The app takes one automatically before big changes (max. 20 automatic ones kept; named ones kept until deleted).\n5. **Modification records (MOD-001…) and change impact** — `src/model/designChanges.ts`, `src/model/designImpact.ts`, `src/components/docs/ModificationsPanel.tsx`, `src/components/docs/ChangesView.tsx`. A proposed value change (circuit, panel, UPS or project setting) with reason, before/after values, a decision (accept/reject with a typed name) and an explicit, all-or-nothing \"apply\". The impact preview lists the panels affected, studies to run again, drawings and schedules that show the equipment, and BOQ design-quantity changes.\n6. **Variations (VO-001…)** — `src/model/variations.ts`, `src/components/docs/VariationsView.tsx`, `src/docs/variationReport.ts`. The commercial change account: additions/omissions against the BOQ revision marked as the contract, with contract sum → revised sum → anticipated final sum, PDF register/VO sheets and Excel.\n\nAlso here: **SLD sheet revision clouds** — `src/model/sheetChanges.ts` keeps what each system SLD sheet drew at its last issue and lists the panels/circuits changed since, so the engineer can cloud them.\n\n## 2. Files, components, functions and stores\n\n(\"Store\" = the place the app keeps the project in memory; here the project object passed through `onChange` / `setProject` in `src/App.tsx`. \"Snapshot\" = a frozen deep copy of the project.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/model/revisions.ts` | model | `Snapshot` (:14), `snapshotOf` (:16), `nextRevisionId` (:22), `issueRevision` (:29), `currentRevision` (:41), `changedSinceRevision` (:45), `changeCountsSinceRevision` (:52), `restoreRevision` (:62), `revisionStamp` (:79), `Change`/`Diff` (:88), `countByClass` (:107), `FEEDER_FIELDS` (:117), `BOARD_FIELDS` (:128), `PROJECT_FIELDS` (:140), `DATA_SETS` (:147), `fieldChanges` (:176), `diffProjects` (:207) | Issue/restore revisions; field-by-field comparison of two project versions with per-board demand kW before/after. |\n| `src/model/datasetDiff.ts` | model | `FieldChange`, `LEAF_LABELS` (:6), `leafLabel`, `isEmpty`, `show`, `canon` (:53), `same` (:68), `pairText` (:72), `leafChanges` (:95) | Generic nested diff: lists matched by `id`, exact numbers (no rounding), at most 40 lines then \"… and n more\". |\n| `src/model/designBaseline.ts` | model | `DesignBaseline`, `baselineOf` (:15), `setBaseline` (:23), `clearBaseline` (:28), `draftSummary` (:40) | Baseline pointer and \"draft vs baseline\" counts. |\n| `src/model/checkpoints.ts` | model / store | `Checkpoint`, `MAX_AUTO_CHECKPOINTS = 20` (:9), `CheckpointStore`, `newCheckpoint` (:18), `excess` (:26), `saveCheckpoint` (:31), `restoredFrom` (:41), `autoCheckpoint` (:49), `CHECKPOINTS_CHANGED`, `MemoryStore`, `idbStore` (:68) | Safety copies in IndexedDB; automatic pruning of the oldest automatic ones. |\n| `src/model/designChanges.ts` | model | `ModificationRecord`, `ModOp`, `PROPOSABLE` (:64), `currentValue` (:79), `newModification` (:101), `addOp` (:110), `conflictsOf` (:133), `withProposal` (:144), `impactOfProposal` (:149), `transition` (:167), `reconcile` (:193), `applyModification` (:211), `recordFromDraft` (:242), `designFingerprint` (:275), `followUp` (:283), `appliedFollowUp` (:293) | Modification record life cycle (draft → proposed → review → accepted/rejected/superseded), conflict detection, atomic apply. |\n| `src/model/proposalRules.ts` | model | `stableHash` (:9), `opProblem` (:24), `validateRecord` (:38), `baselineStatus` (:63), `baselineMessage` (:69) | Structural checks on records; detects a baseline revision whose content changed. |\n| `src/model/proposalRegister.ts` | model | `registerRow` (:18), `filterRegister` (:30), `opView` (:45) | Rows of the modification register. |\n| `src/model/proposalPreview.ts` | model | (preview builder, :123 uses `impactBetween`) | Fresh calculation preview of a proposal (shown by `ProposalPreviewPanel`). |\n| `src/model/bulkEdit.ts` | model | `searchEquipment` and bulk-edit builders | Bulk edits built as draft modification records. |\n| `src/model/designImpact.ts` | model | `DesignImpact`, `impactBetween` (:49), `chainUp` (:38) | Panels affected (changed / upstream / downstream), studies to re-run (via `fingerprint` from `src/calc/runs.ts`), documents, BOQ quantity changes (`buildBom`), assumptions. |\n| `src/model/sheetChanges.ts` | model | `sheetItems` (:34), `sheetChanges` (:68), `changeText` (:87), `cloudChanges` (:91) | Revision clouds for system SLD sheets. |\n| `src/model/variations.ts` | model | `Variation`, `VoLine`, `lineAmount`, `netOf`, `valueOf` (:58), `contractRevision` (:61), `setContractRevision`, `variationTotals` (:85), `saveVariation`, `deleteVariation`, `NEXT_STATUS` (:111), `contractRate` (:116), `foldVariations` (:128) | Variation account and folding approved VOs into the working BOQ. |\n| `src/components/docs/RevisionsView.tsx` | screen | `RevisionsView` (:24), `issue` (:58), `exportChanges` (:72) | Reports → Revisions: issue, list, compare any two, filter by class, CSV export, set baseline, restore. |\n| `src/components/docs/CheckpointsPanel.tsx` | screen | `CheckpointsPanel` (:13), `create`, `restore` (:43), `exportBackup` (:50), `importBackup` (:58), `del` | Below the Revisions page: create/restore/delete checkpoints, export/import `.lvds-backup`. |\n| `src/components/BaselineBar.tsx` | screen | `BaselineBar` (:9) | Status bar on the design workspace (\"Baseline: Rev B · Working draft: 3 engineering · 1 drawings changes\"). |\n| `src/components/docs/ChangesView.tsx` | screen | `ImpactPanel` (:16), `ChangesView` (:72) | Design changes page: modifications, bulk edit, draft-vs-baseline impact. |\n| `src/components/docs/ModificationsPanel.tsx` | screen | `ModificationsPanel` (:25), `create`, `fromDraft`, `step`, `apply`, `addChange` | Modification register and editor. |\n| `src/components/docs/VariationsView.tsx` | screen | `VariationsView` (:26), `VoEditor` (:114), `pdf`, `excel`, `fold` | BOM / Cost → Variations tab. |\n| `src/docs/variationReport.ts` | report | `buildVariationHtml` (:27), `buildVariationWorkbook` (:102) | Variation register + VO sheets (PDF via HTML, black and white) and Excel. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Project object, boards, feeders, all data sets | 02-project-storage | `src/types.ts:Project`, `Revision` (:1038) |\n| Board demand kW for the diff | 06-network-sld-editor | `src/calc/electrical.ts:boardDemandKw` (used in `diffProjects` :290, `RevisionsView.demandOf`) |\n| Circuit reference / schedule circuit test / load items text | 07-load-schedule-panels | `src/calc/loadSchedule.ts:circuitRef`, `isScheduleCircuit`, `loadItemsText`; `src/calc/summary.ts:boardTotals` (`sheetItems`) |\n| Earthing plan normalisation | 09-earthing | `src/model/earthingPlan.ts:withEarthPitIds` (`diffProjects` :274) |\n| UPS systems | 15-ups-solar | `Project.upsSystems` (diff :264, `PROPOSABLE.ups` :70) |\n| BOQ design quantities, BOQ revisions, price list | 20-equipment-boq-pricing | `src/calc/bom.ts:buildBom` (`impactBetween` :109), `src/model/boqRevisions.ts:boqRevisionsOf`, `nextBoqRevisionId`, `src/model/priceList.ts:designQty`, `validVat` |\n| Drawing set, sheet layout | 24-drawings-sld-sheets | `src/model/drawingSet.ts:sheetProject`, `src/diagram/layout.ts:layoutSystem` (`sheetItems` :36) |\n| Stage gate issuing a revision | 03-parameters-rules | `src/model/designStage.ts:advanceStage` (:82) calls `issueRevision` + `setBaseline` |\n| User name / initials for \"by\" | 01-app-shell | `src/App.tsx:1664-1665` (`prefs.profile.name`, `initialsOf`) |\n| Backup zip | 02-project-storage | `src/model/projectBackup.ts:buildBackup`, `readBackupFile`, `checkpointsFor` |\n| Headless proposals | 31-headless-cli-mcp | `src/headless/editTools.ts` uses `newModification`, `addOp`, `transition`, `withProposal` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Revision letter + date stamp on forms, reports, workbooks | 25-reports-exports, 07-load-schedule-panels, 12-transformer-generator, 13-power-factor-correction, 15-ups-solar, 19-cable-tray-containment, 04-building-load-assessment | `revisionStamp` in `src/docs/report*.ts`, `pfcReport.ts`, `trayReport.ts`, `upsSolarReport.ts`, `buildingSummary.ts`, `conceptReport.ts`, `formWorkbook.ts`, `boqWorkbook.ts`, `xlsxTemplate.ts`, `MdSheetView.tsx`, `TxSummaryView.tsx`, `RiserFormView.tsx`, `ExportCentre.tsx` |\n| Revision letter and history rows in SLD title blocks | 24-drawings-sld-sheets, 23-cad-sheets-plot-titleblock | `src/docs/sldSheet.ts:titleBlockOf` (:41), `sheetTitleBlock` (:63), `src/model/titleBlock.ts:titleBlockHtml` (:188 revision cell), `revRowValues` |\n| Project revision as fallback sheet revision in register | 24-drawings-sld-sheets | `src/docs/registerWorkbook.ts:buildRegisterWorkbook` (:61), `src/model/drawingSet.ts:sheetRev` |\n| Sheet changes / clouds / issued items | 24-drawings-sld-sheets | `src/components/sld/SheetWorkspace.tsx:448,539,665`, `src/components/docs/DrawingsView.tsx:469` (`sheetItems`, `sheetChanges`, `cloudChanges`) |\n| \"Save and issue\" and \"No change since IFC\" readiness | 28-dashboard-readiness | `src/calc/projectReadiness.ts:37,85` (`changedSinceRevision`), `src/calc/dashboard.ts:72` |\n| Modification summary + impact in review report | 27-review-submissions-authority | `src/docs/reviewReport.ts:41-77` (`baselineOf`, `impactBetween`, `modifications`) |\n| VO PDF offered as a submission | 27-review-submissions-authority | `VariationsView.pdf` → `src/model/submissions.ts:offerSubmission` |\n| Folded VOs change the working BOQ | 20-equipment-boq-pricing | `foldVariations` writes `Project.boq.manual`, `.overrides`, `.sections` |\n| BOQ revision records the design revision | 20-equipment-boq-pricing | `src/model/boqRevisions.ts:147,157` (`designRev: currentRevision(...)`) |\n| Latest revision in project listing / package stamp | 31-headless-cli-mcp, 25-reports-exports | `src/headless/project.ts:114`, `src/model/projectStore.ts:44`, `src/docs/issuePackage.ts:packageStamp` (:66) |\n| Proposals waiting | 31-headless-cli-mcp | `src/headless/exportTools.ts:63` |\n\n## 5. User flow — from button click to result\n\n**Issue and compare a revision**\n1. Reports → Revisions (`src/App.tsx:1665` renders `RevisionsView`).\n2. Type description and initials → **Issue revision** → `RevisionsView.issue` → `issueRevision` (deep copy via `snapshotOf`) → `autoCheckpoint` (fire-and-forget) → `onChange` (= `setProject`).\n3. The table lists revisions with circuits count and max demand (`demandOf`). **Compare with current** sets From/To → `diffProjects(a, b)` (memoised) → groups by board, class filter check boxes (`countByClass`), demand table (`Diff.boardKw`).\n4. **Export changes (CSV)** → `exportChanges` → `saveCsv`.\n5. **Use as baseline** → `setBaseline`. **Restore** → `ask` → `autoCheckpoint` → `restoreRevision` → `setProject` (no forced undo step).\n\n**Baseline bar** — On every edit (deferred) `BaselineBar` → `draftSummary` → `diffProjects(baseline snapshot, project)`; \"Impact…\" opens the Design changes page, \"Compare with baseline\" opens Revisions.\n\n**Checkpoint**\n1. Revisions page → `CheckpointsPanel` → **Create checkpoint…** → `askText` → `newCheckpoint` (deep copy) → `saveCheckpoint` (IndexedDB put, prune with `excess`, list again).\n2. **Restore…** → saves an automatic checkpoint of now → `restoredFrom` → `setProject(p, { step: true })`.\n3. **Export / Import backup** → `buildBackup` / `readBackupFile` → replace the open project (with `autoCheckpoint` first) or open as copy (`copyProject`, `checkpointsFor`).\n\n**Modification**\n1. Design changes page (`ChangesView`) → `ModificationsPanel` → **New modification…** → `newModification` (records baseline id + `stableHash` of its snapshot).\n2. Add changes → `addOp` (checks `PROPOSABLE` and type, captures \"before\"). Edits are buffered until **Save draft**.\n3. **Propose / Start review / Accept… / Reject…** → `transition` (requires title, reason, ops, typed name; refuses accept on conflict or changed baseline).\n4. Preview: `ImpactPanel` with `impactOfProposal` and `ProposalPreviewPanel`.\n5. **Apply to the working design…** → confirm table (`opView`) → `applyModification` (stop / skip / overwrite on conflicts) → `onApply` = `setProject(p, { step: true })`.\n6. Or **Record the draft's changes…** → `recordFromDraft` (ops from baseline values, marked `applied.source = 'draft'`).\n\n**Variation**\n1. BOM / Cost → Variations (`BomView.tsx:284`) → mark **Contract BOQ** → `setContractRevision`.\n2. **+ Variation** → `VoEditor` (add BOQ items at `contractRate`, or new items) → Save → `saveVariation`.\n3. **Bring n approved into BOQ** → `foldVariations` → working BOQ overrides/manual lines; VO gets `foldedInto` = next BOQ revision.\n4. **Register PDF / ⎙ / Excel** → `buildVariationHtml` → `savePdf` → `offerSubmission`; `buildVariationWorkbook`.\n\n**Revision clouds (SLD sheets)** — on sheet issue `issueSheets(..., sheetItems)` stores `issuedItems`; later `SheetWorkspace` shows `sheetChanges`, ticked items → `cloudChanges` at the next sheet revision.\n\n## 6. Linked to (working connections)\n\n- **03-parameters-rules** — stage gate issues a revision and sets the baseline (`designStage.ts:advanceStage`); `stepBackStage` keeps the revision.\n- **06 / 07** — boards and circuits compared field by field; demand per board before/after.\n- **09-earthing** — earthing plan compared after pit-ID normalisation.\n- **16-load-flow-engines** — study fingerprints decide \"studies to run again\"; `appliedFollowUp` tells whether results are current after applying a modification.\n- **20-equipment-boq-pricing** — BOQ design quantities in the impact; variations fold into the BOQ; BOQ revisions record `designRev`.\n- **24-drawings-sld-sheets** — sheet clouds, sheet `issuedItems`, register falls back to project revision.\n- **25-reports-exports** — `revisionStamp` on most printed documents.\n- **27-review-submissions-authority** — review report modification summary + impact; VO PDF offered as a submission.\n- **28-dashboard-readiness** — \"Save and issue\" / \"No change since IFC\" readiness items.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"27-review-submissions-authority","name":"Review, submissions & authority rules","full":"Review, submissions & authority rules","group":"Documents & workflow","summary":"Authority/standard/company rule sets (design references) whose values are applied to project settings and rule rows; design review comments, a received-documents register, a submissions register with transmittals, and checks, register rows and an impact preview for modification proposals.","files":[{"path":"src/model/designReference.ts","kind":"model","symbols":["BUILT_IN_REFERENCES","resolveReference","applyReference","appliedStatus","changedSinceApplied","settingSource","startChoices","referenceIssues"]},{"path":"src/model/designRules.ts","kind":"model","symbols":["resolveRule","hasRules","normaliseRules"]},{"path":"src/model/reviewComments.ts","kind":"model","symbols":["newComment","moveComment","stampOf","needsReReview","reviewSummary","openTenderQueries"]},{"path":"src/model/receivedDocs.ts","kind":"model","symbols":["addDoc","updateDoc","removeDoc","setBaselineDoc","docIssues"]},{"path":"src/model/submissions.ts","kind":"model","symbols":["submissionsOf","issueAsSubmission","submissionForIssue","resubmit","dueOf","submissionCounts","offerSubmission","draftFromOffer"]},{"path":"src/model/proposalRules.ts","kind":"model","symbols":["stableHash","opProblem","validateRecord","baselineStatus"]},{"path":"src/model/proposalRegister.ts","kind":"model","symbols":["registerRow","filterRegister","opView"]},{"path":"src/mod ew report and proposals","ref":"src/docs/reviewReport.ts:buildReviewDoc"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"proposal preview in modification panel","ref":"src/components/docs/ModificationsPanel.tsx:266"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"whole-network results for proposal preview; feeders/boards for comment stamps","ref":"src/model/proposalPreview.ts:previewProposal"},{"to":"15-ups-solar","dir":"in","status":"working","what":"UPS sizing before/after a proposal","ref":"src/model/proposalPreview.ts:upsChanges"},{"to":"20-equipment-boq-pricing","dir":"in","status":"working","what":"BOQ export offers a submission with draft-aware revision","ref":"src/components/docs/BomView.tsx:121"},{"to":"25-reports-exports","dir":"out","status":"working","what":"submission register in export centre","ref":"src/components/docs/exportCatalogue.ts:192"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"review summary, tender queries, proposal to-dos, submission counts","ref":"src/calc/projectReadiness.ts:27"},{"to":"32-component-database","dir":"out","status":"working","what":"user rule sets synced to Library.json","ref":"src/model/designReference.ts:saveUserReferences"},{"to":"01-app-shell","dir":"both","status":"working","what":"views mounted, project-start rule-set choice and submission offer banner","ref":"src/App.tsx:885"},{"to":"34-electron-desktop","dir":"out","status":"working","what":"PDF/Word saving and PDF merge for review report","ref":"src/components/docs/ReviewView.tsx:exportAs"}],"gaps":[],"md":"# 27 — Review comments, received documents, submissions, authority rule sets and proposals\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module covers what goes on around the design rather than the design calculations:\n\n- **Authority rule sets (design references).** These are named sets of design values from an authority (DEWA, ADDC, EtihadWE), a standard (IEC 60364, BS 7671) or your own company practice. Each value can carry a clause and a note. There are also \"rule rows\" (minimum wire and ELCB/RCD sensitivity by load type) and free \"entries\" that are for reading only. Applying a set writes its values into the project settings and records which set and version was used. A set can build on another (\"extends\") and store only what differs.\n- **Review comments.** A person's findings, questions and tender queries about the design. Each one has a status workflow, and a closed comment is flagged when the item it refers to changes.\n- **Received documents.** A register of documents received from others (number, revision, originator), with one marked as the baseline the work started from.\n- **Submissions.** A register of everything sent out (BOQ, drawings, reports, variations), with recipient, due date, response, comments and resubmissions. It also produces a transmittal sheet and a register as PDF or Excel.\n- **Proposals (modification records).** Rules that check whether a record is sound, a register row for each record, outstanding items for the Overview, and an impact preview. The preview runs the whole-network calculation on the working design and again with the proposal applied, then lists the circuit, status, UPS, drawing and BOQ differences. The records themselves belong to module 26.\n- **Reports.** The design review report (PDF and Word), the contractor's technical clarification report, and the submission register and transmittal.\n\nTerms used below:\n- \"store\" means the place the app keeps the open project in memory (`Project` in `src/types.ts`).\n- \"library\" means the user's own references kept in browser `localStorage` (the browser's built-in storage on this computer) and synced to `LV Database/Library.json`.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/model/designReference.ts` | model | `REF_FIELDS`:26, `BUILT_IN_REFERENCES`:94, `resolveReference`:299, `applyReference`:372, `referenceChanges`:356, `appliedStatus`:407, `changedSinceApplied`:393, `settingSource`:454, `referenceSourceOf`:400, `startChoices`:442, `referenceIssues`:256, `importReferences`:323, `exportReferences`:317, `loadUserReferences`/`saveUserReferences`:223/229 | Authority, standard and company rule sets. Layering (`extends`), applying a set to a project, showing what changed since it was applied, and choosing a set at project start. |\n| `src/model/designRules.ts` | model (shared with 03) | `RULE_KINDS`, `resolveRule`, `hasRules`, `ruleKey`, `normaliseRules`, `ruleIssues` | Rule rows (`minWireMm2`, `elcbMa`) with a condition (category, load type, minimum kW). The most specific matching row wins. |\n| `src/model/reviewComments.ts` | model | `newComment`:64, `moveComment`:102, `stampOf`:51, `refState`:81, `needsReReview`:88, `reviewSummary`:117, `openTenderQueries`:128, `allowedNext`:97 | Review-comment records and their workflow. Records a \"stamp\" (fingerprint) of the item's engineering values when a comment is raised and when it is closed. |\n| `src/model/receivedDocs.ts` | model | `addDoc`:36, `updateDoc`:50, `removeDoc`:55, `setBaselineDoc`:61, `baselineDoc`:68, `docIssues`:72 | Register of received documents, with automatic \"superseded by\" links and a single baseline document. |\n| `src/model/submissions.ts` | model | `submissionsOf`:94, `issueAsSubmission`:74, `submissionForIssue`:87, `resubmit`:111, `dueOf`:63, `isOverdue`:64, `timeText`:66, `submissionCounts`:118, `recipientGroup`:47, `offerSubmission`/`onSubmissionOffer`/`draftFromOffer`:131–140, `RECIPIENTS`:17, `DEFAULT_DAYS`:46 | Submission records. Drawing transmittals are merged in automatically. Calculates due dates and overdue status, links resubmissions, and lets an export offer to record a submission. |\n| `src/model/proposalRules.ts` | model | `stableHash`:9, `opProblem`:24, `validateRecord`:38, `baselineStatus`:63, `baselineMessage`:69 | Checks that a modification record is sound and that its baseline revision is still the same content. |\n| `src/model/proposalRegister.ts` | model | `registerRow`:18, `filterRegister`:30, `affectedEquipment`:16, `opView`:45 | Register rows and the current / expected / proposed view of each change. |\n| `src/components/BriefEditor.tsx` | screen (wizard step) | `AuthorityPicker`:107 | Country → authority → rule-set choice in the new-project wizard. |\n| `src/components/docs/ReviewView.tsx` | screen | `ReviewView` (`raise`, `move`, `recordDecision`, `exportAs`) | Raise and move comments, set up the review report, record the reviewer's decision, and export review or clarification PDF/Word. |\n| `src/components/docs/ReceivedDocsView.tsx` | screen | `ReceivedDocsView` (`add`) | Register documents, mark the baseline, add a link, remove. |\n| `src/components/docs/SubmissionsView.tsx` | screen | `SubmissionsView`, `SubEditor`, `ResponseDays` | Submission register, editor, response times, and transmittal/register export. |\n| `src/components/docs/ProposalPreviewPanel.tsx` | screen | `ProposalPreviewPanel` | The impact-preview tabs inside the modification panel (module 26). |\n| `src/docs/reviewReport.ts` | report | `buildReviewDoc`:39, `reviewHtml`:117, `SECTION_IDS`:18 | Design review report document model built from a frozen copy of the project. |\n| `src/docs/reviewWord.ts` | report | `buildReviewDocx`:8 | The same document model rendered to Word. |\n| `src/docs/clarificationReport.ts` | report | `buildClarificationDoc`:14 | Contractor's technical clarification report: received design, discrepancies, proposed changes, questions. |\n| `src/docs/submissionReport.ts` | report | `buildSubmissionRegisterHtml`:14, `buildTransmittalHtml`:50, `buildSubmissionWorkbook`:77 | Submission register (PDF, landscape), transmittal (PDF, portrait), register workbook (Excel). |\n| `src/types.ts` | store fields | `reviewComments`:532, `reviewReport`:534, `submissions bmission after an export | 20-equipment-boq-pricing, 25-reports-exports, 26-revisions-changes | `offerSubmission` calls in `src/components/docs/BomView.tsx`:121, `StudyReportsView.tsx`:148/151, `VariationsView.tsx`:42 |\n| Library sync of user references | 32-component-database | `src/model/designReference.ts:saveUserReferences` → `pushLibrary` (`src/database/librarySync.ts`) |\n| Brief authority text | 04-building-load-assessment (brief) / 01-app-shell (wizard) | `src/model/brief.ts` `ProjectBrief.authority`; read by `reviewReport.ts:buildReviewDoc`:71 |\n| PDF/Word saving | 34-electron-desktop | `savePdf`, `saveBinary`, `window.lvds.files.pdfBytes` in `ReviewView.tsx:exportAs` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Rule rows (min wire, ELCB) copied into `p.designRules` | 07-load-schedule-panels | `src/calc/loadSchedule.ts:minWireMm2`:137 (floor when sizing in `src/model/schedule.ts:refresh`:21; flagged in `src/docs/loadScheduleDoc.ts`:73), `elcbGroups` sensitivity :333 |\n| MD demand factor (`info.mdDemandFactor`) | 07-load-schedule-panels | `src/docs/mdSheet.ts`:110, `src/docs/riserForm.ts`:48 |\n| \"From DEWA v1 · clause\" source lines | 03-parameters-rules | `src/components/ProjectSettings.tsx`:30 → `settingSource` |\n| Reference name and version in the design basis | 25-reports-exports | `src/docs/designBasis.ts`:173, :179 (`referenceSourceOf`) |\n| Reference name in Excel templates | 25-reports-exports | `src/docs/xlsxTemplate.ts`:72 |\n| Review summary and tender-query gates | 28-dashboard-readiness | `src/calc/projectReadiness.ts`:27, :55, :78 (`reviewSummary`, `openTenderQueries`) |\n| Proposal to-do items | 28-dashboard-readiness | `src/calc/dashboard.ts`:160 (`proposalOutstanding`); `ProjectDashboard.tsx`:218 |\n| Submission counts and overdue items | 28-dashboard-readiness | `src/components/docs/ProjectDashboard.tsx`:230 (`submissionCounts`, `isOverdue`) |\n| Transmittal PDF of a "re-review\" when `needsReReview` is true (the stamp has changed or the item is gone).\n4. Export PDF/Word: `exportAs` → `buildReviewDoc` (frozen copy + `buildDashboard` findings) → `reviewHtml` / `buildReviewDocx`. When the \"diagrams\" section is ticked, the PDF also gets the sheets from `prepareSheets`, joined with `mergePdfs`.\n5. Clarification PDF/Word: `buildClarificationDoc`.\n\n**D. Received document**\n2. \"Use as baseline\" → `setBaselineDoc`. Warnings come from `docIssues`.\n\n**E. Submission**\n1. After a BOQ, study report or variation PDF, the export calls `offerSubmission`. `App.tsx`:1234 shows \"Record submission\" → `draftFromOffer` → `SubmissionsView` opens the draft.\n2. A drawing issue (`issueSheets`) appears in the register automatically through `submissionsOf` → `fromTransmittals`.\n3. In `SubEditor` the user edits recipient, documents (number, title, rev typed as text), status, response and comments → `saveSubmission`.\n4. Resubmit (↻): `resubmit` copies the documents with the same revs, links the old and new submissions, and marks the old one superseded if it was still open.\n5. Transmittal (⎙): `buildTransmittalHtml`. Register PDF or Excel: `buildSubmissionRegisterHtml` / `buildSubmissionWorkbook`.\n\n**F. Proposal preview**\n1. Modifications → record → \"Calculate preview\": `ProposalPreviewPanel.run` → `previewProposal` (two full `runCalculations`, `sizeUps`, `buildBom`).\n\n## 6. Linked to (working connections)\n\n- **07-load-schedule-panels**: rule rows and min-wire/ELCB values set the circuit wire floor (`schedule.ts:refresh`). A hand-set wire below the minimum is shown as \"warn\" (`loadScheduleDoc.ts:73`, `LoadScheduleView.tsx:397`). The ELCB group sensitivity is chosen from the rules (`loadSchedule.ts:333`).\n- **24-drawings-sld-sheets**: drawing transmittals become submissions with no extra step, and the transmittal sheet is shared (`DrawingsView.tsx:122`).\n- **26-revisions-changes**: the review report compares the working design against the baseline revision (`impactBetween`). Proposal records are validated, listed, previewed and counted.\n- **28-dashboard-readiness**: review summary, tender queries, proposal to-dos and submission counts all reach the Overview and readiness gates.\n- **25-reports-exports**: the design basis prints the applied reference and, for each value, \"Design reference: X vN\" (`designBasis.ts:173/179`). The export centre includes the submission register.\n- **32-component-database**: user references sync through `pushLibrary`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"28-dashboard-readiness","name":"Dashboard & readiness","full":"Dashboard & readiness","group":"Documents & workflow","summary":"The Projects home screen (searchable list of saved project files) and the project Overview: headline numbers, load breakdowns, transformer loading, study tallies and a To do list built live from the project plus the last calculation run, split by scope and design stage. Readiness stages and the design-stage checklist are derived from that To do list;","files":[{"path":"src/calc/dashboard.ts","kind":"calc","symbols":["buildDashboard","Dashboard","TodoItem","DashTransformer","DashBar","lengthText","sizesText"]},{"path":"src/calc/projectReadiness.ts","kind":"calc","symbols":["projectReadiness","stageChecklist","splitTodo","ReadinessStage","StageCard","StageCheck","CALC_SCOPE","MAIN_KINDS"]},{"path":"src/calc/statusText.ts","kind":"calc","symbols":["STATUS_TEXT","REPORT_STATUS_TEXT","statusText","statusOfText","CALC_DISCLAIMER"]},{"path":"src/calc/runs.ts","kind":"calc","symbols":["runCalculations","staleStudies","INPUTS","STUDY_LABEL","CalcRun"]},{"path":"src/components/docs/ProjectDashboard.tsx","kind":"screen","symbols":["ProjectDashboard","Tile","Bars","exportPdf"]},{"path":"src/components/ProjectsDashboard.tsx","kind":"screen","symbols":["ProjectsDashboard","Th"]},{"pat *Live** = computed again from the project on every screen refresh, without pressing Run (load sums, transformer loading, generator, PFC, UPS, PV, busbar risers).\n- **Scope** = the job's brief: which systems are part of this job (`src/model/brief.ts`). **Stage** = the design stage the project is at (`src/model/designStage.ts`).\n\n### Which studies the dashboard / readiness check\n\n**Checked (items that can appear in To do):**\n\n| # | Check | Source function | Live or from Run | Link (`go.view`) |\n|---|---|---|---|---|\n| 5 | Discrimination between breaker pairs (not / partly selective) | `run.selectivity` from `evaluateSelectivity` | Run | `coordination` |\n| 6 | Life-safety circuit not on fire-rated cable | `fireRatingIssues` (`src/model/cableTypes.ts:64`) | live | `design` + feeder |\n| 7 | Transformer loading vs project limit | own calc in `buildDashboard` (`dashboard.ts:76-80`) | live | `sizing` |\n| 8 | Breaker Icu below transformer LV fault level | `sizeTransformers(...).checks.icuOk` (`src/calc/txGen.ts:101`) | live | `sizing` |\n| 10 | Main board PF below target with **no** capacitor bank | `planPfc` (`src/calc/pfc.ts`) | live | `pfc` |\n| 11 | Board designed far below its rooms' expected load | `dbChecks` (`src/calc/building.ts:163`) | live | `load-schedule` + board |\n| 12 | Board busbar Icw below fault level | `busbarIcwChecks` (`src/calc/busbarIcw.ts:16`) | live | `design` + board |\n| 13 | Busway riser above data / Icw below fault level | `sizeRiser` (`src/calc/busbar.ts`) | live | `busbar` |\n| 14 | UPS: rating, battery string, runtime, DC breaker, BMS, surge, leading kvar, recharge | `sizeUps` (`src/calc/ups.ts`) | live | `ups` |\n| 15 | Calculation inputs out of range (voltage, PF, kW, cores, Icu…) | `projectInputIssues` (`src/model/projectValidate.ts:43`) | live | `sizing` / `design` / none |\n| 16 | Ambient outside derating table | `ambientCheck` (`src/calc/cableTable.ts:112`) | live | none |\n| 17 | Strict cable data / reference values | `cableDataFindings` (`cableTable.ts:208`) | live | `database` |\n| 18 | Ground temperature / soil resistivity for buried cables | `groundChecks` (`src/calc/installation.ts:67`) | live | none |\n| 19 | Main board without transformer kVA / %Z / supply fault level | inline (`dashboard.ts:209`) | live | `sizing` |\n| 20 | References to deleted panels / circuits | `checkReferences` (`src/model/integrity.ts`) | live | from the reference, often none |\n| 21 | Solar PV design status | `sizePv` (`src/calc/solar.ts:148`) | live | `solar` |\n| 22 | Drawing set sheet / title-block checks | `sheetChecks` (`src/model/drawingSet.ts:571`) | live | `drawings` |\n| 23 | Submission-form fields (owner, plot, consultant, area) | inline (`dashboard.ts:217`) | live | none |\n| 24 | Critical / re-review review comments (readiness only, not in To do) | `reviewSummary` (`src/model/reviewComments.ts`) | live | stage go `dashboard` |\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/dashboard.ts` | calc | `buildDashboard` (:68), types `Dashboard`, `TodoItem`, `DashTransformer`, `DashBar`; `lengthText` (:240), `sizesText` (:243) | Builds every number and the To do list from the live project plus the last `CalcRun`. |\n| `src/calc/projectReadiness.ts` | calc | `projectReadiness` (:22), `stageChecklist` (:50), `splitTodo` (:17), types `ReadinessStage`, `StageCard`, `StageCheck`; constants `CALC_SCOPE` (:12), `MAIN_KINDS` (:46), `STAGE_ORDER` (:94) | Six readiness stages, the per-design-stage checklist, and the scope split of To do. |\n| `src/calc/statusText.ts` | calc | `STATUS_TEXT`, `REPORT_STATUS_TEXT`, `statusText`, `statusOfText`, `CALC_DISCLAIMER` | Fixed wording of results (used by 19 screens/reports). |\n| `src/components/docs/ProjectDashboard.tsx` | screen | `ProjectDashboard` (default), `Tile` (:20), `Bars` (:31), `exportPdf` (:81) | Overview screen; stage cards, brief/deliverables, tiles, breakdowns, To do (scope + stage split). |\n| `src/components/ProjectsDashboard.tsx` | screen | `ProjectsDashboard` (default), `Th` (:59) | Home screen with the project list. |\n| `src/components/SystemSummaryCards.tsx` | screen | `SystemSummaryCards` (default) | System summary gauge and bus-voltage table shown under the SLD (results tabs). |\n| `src/model/projectList.ts` | model | `filterProjects` (:30), `sortProjects` (:41), `facets` (:62), `matchesText` (:23), `detailsOf` (:85), `applyDetails` (:104), `parseTags` (:93), `withArchived` (:119) | Search / filter / sort of `ProjectMeta`, and the \"Details\" edit of name, status, client, tags, notes. |\n| `src/model/designStage.ts` | model (shared with 03) | `splitByStage` (:51), `viewStage` (:47), `VIEW_STAGE` (:39), `stageOf`, `advanceStage` | Which To-do item belongs to which design stage. |\n| `src/model/brief.ts` | model (shared with 03) | `viewInScope` (:157), `VIEW_SCOPE` (:150), `inScope`, `deliverableProgress` | Which To-do item belongs to the job's scope. |\n| `src/App.tsx` | screen (shell) | `view === 'dashboard'` block (:1601-1619), `view === 'projects'` block (:1666-1688), `openProject` (:759), `issueStage` (:409), `stepBack` (:420), `setFileStatus` (:835), `patchProjectFile` (:813) | Wires the two dashboards into the app; `onGo` handler (:1614) opens the target screen, selecting a board or feeder. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Boards, feeders, demand totals | 06-network-sld-editor | `src/calc/summary.ts` `systemSummary`, `boardTotals`, `boardsInSupplyOrder`; `src/calc/sizing.ts` `boardDemandKva` |\n| Circuit check results (VD, Iz, In, Icu) | 08-voltage-drop, 11-breaker-cable-selection | `src/calc/electrical.ts` `evaluateProject` (via `CalcRun.results`) |\n| Earth fault loop results | 09-earthing | `src/calc/earthing.ts` `evaluateEarthingAll` (via `CalcRun.earthing`) |\n| Discrimination results | 10-protection-coordination | `src/calc/protection.ts` `evaluateSelectivity` (via `CalcRun.selectivity`) |\n| Transformer / generator sizing | 12-transformer-generator | `src/calc/txGen.ts` `sizeTransformers`, `sizeGeneratorByBoards` |\n| PFC plan | 13-power-factor-correction | `src/calc/pfc.ts` `planPfc` |\n| Busway risers, busbar Icw | 14-busbar | `src/calc/busbar.ts` `sizeRiser`; `src/calc/busbarIcw.ts` `busbarIcwChecks` |\n| UPS, PV | 15-ups-solar | `src/calc/ups.ts` `sizeUps`; `src/calc/solar.ts` `sizePv` |\n| Building GFA, levels, DB vs room load | 04-building-load-assessment | `src/calc/building.ts` `summarizeBuilding`, `dbChecks` |\n| Space-plan areas (area fallback) | 05-space-planning | `project.spacePlan.areas` read in `buildDashboard` (:101) |\n| Cable data, ambient, ground conditions | 11-breaker-cable-selection | `src/calc/cableTable.ts` `ambientCheck`, `cableDataFindings`; `src/calc/installation.ts` `groundChecks` |\n| Input validation, references | 02-project-storage | `src/model/projectValidate.ts` `projectInputIssues`; `src/model/integrity.ts` `checkReferences` |\n| Fire-rated cable rule | 19-cable-tray-containment / 11 | `src/model/cableTypes.ts` `fireRatingIssues` |\n| Drawing set checks | 24-drawings-sld-sheets | `src/model/drawingSet.ts` `sheetChecks` |\n| Revisions, change since revision | 26-revisions-changes | `src/model/revisions.ts` `currentRevision`, `changedSinceRevision`, `revisionStamp`; `src/model/proposalStatus.ts` `proposalOutstanding` |\n| Review comments, tender queries, submissions | 27-review-submissions-authority | `src/model/reviewComments.ts` `reviewSummary`, `openTenderQueries`; `src/model/submissions.ts` `submissionCounts`, `isOverdue` |\n| Scope, deliverables, design stage | 03-parameters-rules | `src/model/brief.ts` `viewInScope`, `deliverableProgress`; `src/model/designStage.ts` `splitByStage`, `stageOf`, `gateOf` |\n| Project settings (limits) | 03-parameters-rules | `settingsOf` (`src/types.ts`) `transformerMaxLoadingPct` |\n| Project file list, trash, recent | 02-project-storage | `src/model/projectStore.ts` `ProjectMeta`, `TrashedProject`, `whenText` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Overview screen | 01-app-shell | `src/App.tsx:1601` `ProjectDashboard` |\n| Project summary PDF (Overview button) | 25-reports-exports | `ProjectDashboard.exportPdf` → `src/util/files.ts` `savePdf` |\n| Project summary PDF in Export centre | 25-reports-exports | `src/components/docs/exportCatalogue.ts:184` |\n| Project summary as first part of the issue package | 25-reports-exports | `src/components/docs/StudyReportsView.tsx:212` |\n| To-do findings in the review report | 27-review-submissions-authority | `src/components/docs/ReviewView.tsx:39` `doc` |\n| \"Designed so far\" demand on the load assessment | 04-building-load-assessment | `src/components/docs/LoadAssessmentView.tsx:41` |\n| `project_summary`, `run_checks` tools | 31-headless-cli-mcp | `src/headless/tools.ts:98`, `:166` |\n| Status wording | 25, 19, 06, 07 … (19 files) | `STATUS_TEXT` / `REPORT_STATUS_TEXT` importers, e.g. `src/docs/compliance.ts`, `src/docs/calcReport.ts`, `src/components/ResultsTable.tsx` |\n| Project status / details / archive written to a file | 02-project-storage | `App.tsx` `setFileStatus`, `archiveFile`, `openDetails` → `patchProjectFile` |\n\n## 5. User flow — from button click to result\n\n**Projects (home)**\n1. Opening the app or clicking \"Projects\" in the breadcrumb sets `view = 'projects'` (`App.tsx:1203`); `ProjectsDashboard` renders `list` sorted by `sortProjects(filterProjects(list, f), sort)`.\n2. Typing in search / picking a filter calls `set(...)` → `filterProjects` / `matchesText` (`projectList.ts:23-38`).\n3. Clicking a card or name calls `onOpen(file)` → `openProject` (`App.tsx:759`): the same, unsaved-free file goes straight to `dashboard`; otherwise `guard` asks about unsaved changes, `loadProjectStamped` → `loadIntoApp` → `setView('dashboard')` (`App.tsx:737`) and a fresh `runCalculations` (`App.tsx:726`).\n4. Changing the status drop-down calls `onStatus` → `setFileStatus` → `patchProjectFile` (writes the file now, or marks the open project changed).\n\n**Overview**\n2. `stageChecklist` → `projectReadiness` build the stage cards (`:74`); `splitTodo` (scope) then `splitByStage` (stage) split To do into counted / later / outside (`:75-76`).\n4. Clicking a To-do line or a tile calls `onGo(go)` (`App.tsx:1614`): with `feederId` → `design` + `selectFeeder`; with `boardId` → `setActiveBoardId`; then `setView(go.view)`.\n5. Clicking a stage check calls `onOpen(x.go)` (`settings` opens the settings dialog; `dashboard` scrolls to To do).\n6. \"Issue … → next stage\" calls `issueStage` (`App.tsx:409`) → `advanceStage` records a revision and moves the stage.\n7. \"1-page PDF summary\" calls `exportPdf` → `buildDashboardHtml(project, d)` → `savePdf` (A4 landscape).\n\n## 6. Linked to (working connections)\n\n- 06-network-sld-editor: demand, PF and transformer kVA from `systemSummary` (same function as the SLD summary card — headline MD agrees with the SLD).\n- 08 / 11 / 09 / 10: study tallies and To-do items read straight from the `CalcRun` arrays — not recomputed.\n- 12, 13, 14, 15: live calls to the study functions `sizeTransformers`, `sizeGeneratorByBoards`, `planPfc`, `sizeRiser`, `busbarIcwChecks`, `sizeUps`, `sizePv` (the study code, not a copy).\n- 24: drawing-set checks via `sheetChecks`; readiness \"Drawings\" stage.\n- 26: revision label, \"changed since revision\", modifications card and To do; stage issue creates a revision.\n- 27: review comments block \"Resolve issues\"; submissions card; tender queries in the Tender stage.\n- 31: headless tools reuse `buildDashboard`.\n- 02: project list metadata, archive, trash, details edit.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"30-exchange-inbox","name":"Data exchange & inbox","full":"Data exchange & inbox","group":"Documents & workflow","summary":"Checks room, luminaire and ELV load packages from other programs against contract lvds.exchange v1, shows what accepting them would change, and applies only the rows the engineer accepts, logged with the package hash. Also writes a rooms package and an lvds.design package (boards, circuits, results) for other programs, from the headless tools only.","files":[{"path":"src/exchange/contracts.ts","kind":"model","symbols":["exchangePackage","roomsPackage","fixturesPackage","loadsPackage","canonicalJson","hashedText","EXCHANGE_VERSION"]},{"path":"src/exchange/designContract.ts","kind":"model","symbols":["designPackage","DESIGN_SCHEMA","DESIGN_VERSION"]},{"path":"src/exchange/designExport.ts","kind":"report","symbols":["designExport","designHashedText","r3"]},{"path":"src/exchange/inbox.ts","kind":"calc","symbols":["readPackage","reviewPackage","decide","roomPlans","applyRooms","storeItems","roomsExport","elvLink","acceptedElvLoads","exchangeOf"]},{"path":"src/components/elv/InboxView.tsx","kind":"screen","symbols":["InboxView","InboxItem"]},{"path":"src/App.tsx","kind":"store","symbols":["inbox","inboxKey","inboxHere","onSend","onOpen","onDecided"]},{"path":"src/headless/exchangeTools.ts","kind":"headless","symbols":["EXCHANGE_TOOLS","exchange_check","exchange_review","exchange_apply"]},{"path":"src/headless/exportTools.ts","kind":"headless","symbols":["export_rooms_package","export_design_package","export_elv_loads_package"]},{"path":"src/elv/package.ts","kind":"model","symbols":["elvLoadsPackage"]},{"path":"contracts/","kind":"model","symbols":["exchange-package.schema.json","rooms.schema.json","fixtures.schema.json","loads.schema.json","design.schema.json"]}],"links":[{"to":"04-building-load-assessment","dir":"both","status":"working","what":"buildings, levels, room types in; accepted rooms written to Building information","ref":"src/exchange/inbox.ts:applyRooms"},{"to":"02-project-storage","dir":"out","status":"working","what":"decision applied as one undo step; exchange log saved in project file","ref":"src/App.tsx:onDecided"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"exchange field tracked in revision comparisons","ref":"src/model/revisions.ts:152"},{"to":"31-headless-cli-mcp","dir":"both","status":"working","what":"exchange_check/review/apply and export tools","ref":"src/headless/exchangeTools.ts:EXCHANGE_TOOLS"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"boards, circuits and calculation run for the design export","ref":"src/exchange/designExport.ts:designExport"},{"to":"09-earthing","dir":"in","status":"working","what":"Zs, max Zs, disconnection time in the design export","ref":"src/exchange/designExport.ts:designExport"},{"to":"01-app-shell","dir":"out","status":"working","what":"Inbox ribbon button with waiting count","ref":"src/components/Ribbon.tsx:545"},{"to":"27-review-submissions-authority","dir":"in","status":"working","what":"Received documents page opens the inbox","ref":"src/App.tsx:1660"}],"gaps":[],"md":"# 30 — Data exchange contracts, design export, inbox\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module is the door between LV Design Studio and other programs.\n\n- **Incoming (the inbox).** Other programs send *exchange packages*: JSON files with room schedules (from CAD or IFC/BIM), luminaire schedules (lighting design program) or ELV upstream loads (from the app's own ELV estimate). A package is checked against a written *contract* (a fixed list of fields, units and limits), compared with the project, and nothing changes until the engineer ticks the rows to take and signs the decision with a name. Each decision is logged with the package's SHA-256 hash (a fingerprint of the file's contents), so the same file arriving again is recognised.\n- **Outgoing.** Two exports: a *rooms package* (the project's rooms for ELV design) and a *design package* (`lvds.design`: boards, circuits, breaker, cable, load and calculated results, for BIM add-ins and scripts). Both are only reachable from the headless tools (the command-line / MCP interface, module 31-headless-cli-mcp), not from a screen.\n\nTerms used below: *zod* = the library the code uses to describe and check the shape of data; *schema* = that description, also written out as JSON Schema files in `contracts/` for other programs; *store / project state* = the copy of the project the app keeps in memory; *undo step* = one entry in the undo history.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/exchange/designExport.ts` | calc / report | `designExport`, `designHashedText`, `r3`, `opt` | Runs every study now (`runCalculations`), maps boards and circuits to the design contract, adds a study-input fingerprint and a sha256 (not covering `exportedAt`), then validates its own output with `designPackage.parse` before returning it. |\n| `src/components/elv/InboxView.tsx` | screen | `InboxView` (default export), `InboxItem`, `act`, `open` | Inbox page: \"Open package file…\", list of waiting packages, change table with tick boxes, \"Decided by\" name, Reject / Accept selected, History table, \"Place on boards…\" after ELV loads. |\n| `src/App.tsx:338-341, 1656-1659` | store | `inbox` state, `inboxKey`, `inboxHere`, `onSend`, `onOpen`, `onDecided` | Holds the waiting packages in memory per project (`project.id ?? project.name`); on a decision writes the new project as one undo step (`setProject(next, { step: true })`) and drops the package from the list. |\n| `src/components/Ribbon.tsx:545` | screen | `view('inbox', …)`, `inboxCount` | Ribbon button with a \"n to review\" badge. |\n| `src/headless/exchangeTools.ts` | headless | `EXCHANGE_TOOLS` (`exchange_check`, `exchange_review`, `exchange_apply`), `readFile`, `checked`, `summary` | Same check / review / decide from the CLI or MCP. Reads only inside the projects folder, max 20 MB; `exchange_apply` previews by default and needs `approvedBy`; writing keeps a backup and an `undo_change` entry (`src/headless/editTools.ts:edit`). |\n| `src/headless/exportTools.ts:278-310` | headless | `export_rooms_package`, `export_design_package`, `export_elv_loads_package` | The three exports (preview first; exporting needs `approvedBy`). |\n| `src/elv/package.ts` | model | `elvLoadsPackage`, `ELV_CATALOGUE_REVISION` | Builds the ELV loads package from the ELV estimate (module 29-elv) with `source.file = \"\u003cproject name> — ELV estimate\"`. |\n| `src/util/sha256.ts` | util | `sha256Hex` | Synchronous SHA-256 used by the screens. |\n| `tests/fixtures/exchange/` | test data | `villa-gf-rooms.ifc.json`, `villa-luminaires.dialux.json`, `villa-elv-loads.json` | Sample packages used by `inbox.test.ts`. |\n\nStored in the project file: `Project.exchange` (`src/types.ts:518`) = `{ log: ExchangeRecord[]; packages: AcceptedPackage[] }`. Rooms themselves are stored in `project.building.rooms` with a `source` link (`RoomSource`, `src/types.ts:746`).\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Package file chosen by the user (any JSON) | 01-app-shell (file picker) | `src/components/elv/InboxView.tsx:open` |\n| ELV loads package sent from the ELV page | 29-elv | `src/components/elv/ElvView.tsx:send` → `src/elv/package.ts:elvLoadsPackage` → `src/App.tsx:1656 onSend` |\n| Package file from the projects folder (CLI / MCP) | 31-headless-cli-mcp | `src/headless/exchangeTools.ts:readFile` (`findFile`, `readFileWithin`) |\n| Buildings, levels, rooms, room types | 04-building-load-assessment | `src/calc/building.ts:buildingInfoOf`, `roomTypesOf`, `nextRoomId` (used in `inbox.ts:roomPlans`, `applyRooms`) |\n| Room-type guess from a name | 22-cad-electrical | `src/model/cadRooms.ts:guessRoomType` |\n| Boards, circuits, all study results (for the design export) | 06-network-sld-editor, 08-voltage-drop, 09-earthing, 11-breaker-cable-selection | `src/calc/runs.ts:runCalculations`, `fingerprint`; `src/calc/summary.ts:boardSummary`; `src/calc/earthing.ts:breakerTypeOf`; `src/calc/cableTable.ts:cpcOf`; `src/calc/electrical.ts:runsOf` |\n| Permanent uids of boards/circuits | 02-project-storage | `src/model/stableIds.ts:withUids` |\n| ELV devices on plans | 29-elv | `project.elvDevices` in `designExport.ts:designExport` |\n| Engineer's name default | 03-parameters-rules (user profile) | `src/App.tsx:1657 prefs.profile.name` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Rooms added / changed / renamed / removed in Building information | 04-building-load-assessment (load assessment, room loads) | `inbox.ts:applyRooms` writes `project.building.rooms` |\n| Accepted ELV loads with link `app:file#id` | 29-elv (placement on boards as circuits) | `inbox.ts:acceptedElvLoads` → `src/calc/elvPlacement.ts:planElvPlacement`, `src/components/elv/ElvView.tsx:59` |\n| Decision log `X-NNN` | 26-revisions-changes (listed as \"Exchange packages (imports)\" in revision diffs) | `src/model/revisions.ts:152`, `src/model/changeClass.ts:34` |\n| New project state as one undo step | 02-project-storage | `src/App.tsx:1659 setProject(next, { step: true })`; headless: `src/headless/editTools.ts:edit` (backup + `undo_change`) |\n| Rooms package JSON | external ELV program | `src/headless/exportTools.ts:export_rooms_package` → `inbox.ts:roomsExport` |\n| Design package JSON (`lvds.design`) | external BIM add-ins / scripts | `src/headless/exportTools.ts:export_design_package` → `designExport.ts:designExport` |\n| Inbox badge count | 01-app-shell | `src/components/Ribbon.tsx:545` |\n\n## 5. User flow — from button click to result\n\n1. User opens **Inbox** from the ribbon (`Ribbon.tsx:545`) or is sent there by **Send to LV** on the ELV page (`ElvView.tsx:send` → `App.tsx:onSend`, which replaces any waiting package of the same kind and source file).\n2. **Open package file…** → `InboxView.open` reads the text, `JSON.parse`, then `inbox.ts:readPackage`:\n   - zod check of every field (`exchangePackage.safeParse`), errors reported by row number (first 200);\n3. On every render `InboxView` calls `reviewPackage`:\n   - **rooms** (`roomChanges` / `roomPlans`): only from `cad` or `ifc`; each row's building and level found by ID then by name (else a \"problem\" row); matched to a project room first by source link (same app, same file, same `sourceId`), else by same name on the same level; area difference ≥ 0.05 m², type, count or move → *changed*; different name → *renamed*; rooms linked to the same file but not in the package → *removed*.\n   - **luminaires / ELV loads** (`itemChanges`): room references resolved to project room IDs; compared with the last accepted package **from the same source file** (not with the project's circuits) → added / changed / removed.\n   - `seenBefore`: the log is searched for the same hash.\n5. `App.tsx:onDecided` writes the new project as one undo step and removes the package from the waiting list. **Undo** (Ctrl+Z) restores the project, but not the waiting package.\n7. Headless equivalent: `exchange_check` → `exchange_review` → `exchange_apply` (preview, then `mode: \"apply\"` with `approvedBy`).\n\n## 6. Linked to (working connections)\n\n- **29-elv** — ELV loads package in (`elv/package.ts:elvLoadsPackage`), accepted loads out (`acceptedElvLoads` → `calc/elvPlacement.ts:planElvPlacement`).\n- **02-project-storage** — decision applied as one undo step (`App.tsx:1659`); the `exchange` field is saved in the project file (`types.ts:518`).\n- **26-revisions-changes** — `exchange` is a tracked field in revision comparisons (`model/revisions.ts:152`, `model/changeClass.ts:34`).\n- **31-headless-cli-mcp** — `EXCHANGE_TOOLS`, `export_rooms_package`, `export_design_package`, `export_elv_loads_package`.\n- **06 / 08 / 09 / 11** — design export reads the full calculation run (`runCalculations`) and checks the result against its own contract.\n- **27-review-submissions-authority** — Received documents page links to the inbox (`App.tsx:1660 onInbox`).\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"}],"edges":[{"a":"01-app-shell","b":"02-project-storage","working":[{"from":"01-app-shell","status":"working","what":"open, save, recovery, conflict, unsaved flag, undo history","ref":"src/App.tsx:loadIntoApp","dir":"both"},{"from":"02-project-storage","status":"working","what":"data link","ref":"src/App.tsx:saveProject","dir":"in"}],"broken":[]},{"a":"03-parameters-rules","b":"01-app-shell","working":[{"from":"01-app-shell","status":"working","what":"preferences, new-project defaults, design stage gate","ref":"src/App.tsx:createProject","dir":"in"}],"broken":[]},{"a":"01-app-shell","b":"04-building-load-assessment","working":[{"from":"01-app-shell","status":"working","what":"routes Building, Load assessment; concept report button","ref":"src/App.tsx:App","dir":"out"},{"from":"04-building-load-assessment","status":"working","what":"brief scope decides which screens and findings count","ref":"src/model/brief.ts:viewInScope","dir":"out"}],"broken":[]},{"a":"01-app-shell","b":"05-space-planning","working":[{"from":"01-app-shell","status":"working","what":"routes Space plan, Substation area","ref":"src/App.tsx:App","dir":"out"}],"broken":[]},{"a":"01-app-shell","b":"06-network-sld-editor","working":[{"from":"01-app-shell","status":"working","what":"SLD workspace, panel tree, run results (runCalculations), board/feeder forms","ref":"src/App.tsx:runNow","dir":"both"}],"broken":[]},{"a":"01-app-shell","b":"07-load-schedule-panels","working":[{"from":"01-app-shell","status":"working","what":"routes Load schedule, Panels","ref":"src/App.tsx:App","dir":"out"}],"broken":[]},{"a":"01-app-shell", , Parameters.xlsx, profile defaults, setup templates and design references. It also covers {Name} text parameters, feeder presets and design stages. Many calculations still use fixed numbers (TN-S, k = 143, XLPE ambient table, method E, 1 % sub-main VD budget, 0.85 margins, 50 Hz reactance) instead of project parameters. | `src/types.ts`, `src/components/ProjectSettings.tsx`, `src/model/designRules.ts`, `src/components/docs/RuleRows.tsx` +10 more |\n| 32 | [Component database & library](32-component-database.md) | The LV Database is a folder of 14 Excel workbooks (loads, cables, breakers, parameters, transformers, generators, busbar, equipment, room types, luminaires, unit types, prices, rules, cable schedule) plus Library.json, read by the desktop app and pushed into the calculation modules, with built-in fallbacks. | `electron/databaseSpec.json`, `electron/database.cjs`, `electron/main.cjs`, `src/database/database.ts` +8 more |\n| 34 | [Desktop wrapper (Electron)](34-electron-desktop.md) | The desktop wrapper: the Electron main process opens the window and does all disk, dialog, printer and Python work for the screens through 48 IPC channels exposed by the preload bridge, each checked for sender (trust.cjs) and payload (ipcValidate.cjs, limits.cjs). Project and database files are written atomically with backups and conflict checks; CI scripts guard dependencies, privacy and package contents. The weakest spots are Library.json read errors being turned into an empty library that is then pushed over the shared file, and Design CAD Save writing straight over the user's drawing. | `electron/main.cjs`, `electron/preload.cjs`, `electron/ipcValidate.cjs`, `electron/limits.cjs` +19 more |\n| 31 | [Headless CLI & MCP](31-headless-cli-mcp.md) | One list of 45 tools, offered as the lvds command line, an MCP server for AI assistants and a token-protected local HTTP API, runs the app's own calculations on project files without the window. Value changes become proposals for the engineer; structure changes are written with a backup and change log; exports need an approver and use a hidden Electron window for PDFs and sheet DXF. | `src/headless/main.ts`, `src/headless/cli.ts`, `src/headless/mcp.ts`, `src/headless/api.ts` +15 more |\n\n## Design inputs\n\n| # | Module | What it does | Main files |\n|---|---|---|---|\n| 04 | [Building & load assessment](04-building-load-assessment.md) | Holds the buildings, levels, rooms, flat layouts and room types, generates DBs and load schedules from them, and estimates concept-stage maximum demand, transformers and generator from a building type (load assessment). The assessment reaches the network only when the user presses Create MDB + feeders, which copies it into MDB(s) and feeders; | `src/calc/building.ts`, `src/calc/buildingDesign.ts`, `src/calc/loadAssessment.ts`, `src/calc/loadAssessmentMdb.ts` +14 more |\n| 05 | [Space planning & substation](05-space-planning.md) | Power-density space plan (areas x W/m2 x demand factor -> MDB/SMDB -> transformers -> RMUs) with automatic assignment and a Create SLD button that builds and sizes the network. The Substation area page gives the Dubai Municipality DM-D-013 minimum substation, RMU and LV room sizes per substation and prints the form as an A4 PDF. | `src/calc/spacePlan.ts`, `src/calc/dmSubstation.ts`, `src/docs/dmForm.ts`, `src/docs/planSheet.ts` +6 more |\n| 06 | [Network / SLD editor & core calc](06-network-sld-editor.md) | The Design view: system and board SLDs, equipment palette, inspector, board/feeder forms, copy/move/rename and Build hierarchy. | `src/calc/electrical.ts`, `src/calc/network/index.ts`, `src/calc/runs.ts`, `src/calc/summary.ts` +32 more |\n| 07 | [Load schedule & panels](07-load-schedule-panels.md) | DB load distribution schedules (points x WATT/UNIT, R/Y/B ways, ELCB groups, spares), connected load / maximum demand forms for MDB/SMDB/MCC, circuit and bulk editing, phase balance and the panels page. | `src/calc/loadSchedule.ts`, `src/calc/phaseBalance.ts`, `src/model/schedule.ts`, `src/model/phases.ts` +21 more |\n\n## Studies\n\n| # | Module | What it does | Main files |\n|---|---|---|---|\n| 08 | [Voltage drop](08-voltage-drop.md) | Works out the source-to-load voltage drop of every panel-to-panel and equipment cable (optionally each DB's worst final circuit) by the R + X method: k x I x L x (R cos phi + X sin phi) / runs, with k = sqrt3 (3-phase) or 2 (1-phase), R corrected for conductor temperature, incomer PF taken from downstream P and Q per phase, and the upstream drops added. Totals are checked against one project limit, and motors also against a starting-drop limit. Results go to the page, CSV and a black-and-white PDF. The core copy in evaluateFeeder feeds the cable schedule, the calc report and the SLD. | `src/calc/voltageDrop.ts`, `src/calc/electrical.ts`, `src/calc/cableTable.ts`, `src/calc/motor.ts` +8 more |\n| 09 | [Earthing & earth fault loop](09-earthing.md) | Earth fault loop study (TN-S only): Zs = Ze + (R1 + R2), minimum If = 0.95 U0 / Zs against the instantaneous trip or 5 x IΔn, 0.4 s / 5 s per IEC 60364-4-41, and an adiabatic CPC check with k = 143. A separate earthing schematic lays out RMU, transformer, LV and generator earth pits with site tests against DEWA limits, plus earth riser and floor earthing sheets. The two parts share only cpcOf and the board-sheet line (boardEarth); | `src/calc/earthing.ts`, `src/calc/cableTable.ts`, `src/calc/electrical.ts`, `src/calc/runs.ts` +7 more |\n| 10 | [Protection coordination](10-protection-coordination.md) | Draws generic (non-manufacturer) log-log time-current curves. Results reach the discrimination report table, compliance summary, dashboard and MCP; | `src/calc/protection.ts`, `src/calc/earthing.ts`, `src/components/studies/CoordinationStudy.tsx`, `src/components/DiscriminationPanel.tsx` +8 more |\n| 11 | [Breaker & cable selection](11-breaker-cable-selection.md) | Checks and recommends each circuit's breaker (In, type, Icu) and cable (size, parallel runs) using Ib \u003c= In \u003c= Iz, an 85 % loading margin, a voltage-drop budget and Icu >= busbar fault. Iz comes from the cable data (built-in reference or Cables.xlsx) for the IEC 60364-5-52 installation method with ambient / ground, soil and grouping factors. The same recommend() is reused by every auto-sizing path in the app. | `src/components/studies/SelectionStudy.tsx`, `src/calc/sizing.ts`, `src/calc/electrical.ts`, `src/calc/installation.ts` +7 more |\n| 12 | [Transformer & generator](12-transformer-generator.md) | Sizes one transformer per main board from the network demand (boardTotals, after optional planned PFC, growth and loading limit) with FLC, ACB, LV fault, regulation and bus-coupler outage checks, and sizes the standby generator from whole boards with a largest-motor-start check (X'd 25 %, dip 15 %). It also checks parallel transformers (load share by kVA/uk, coupler current), describes ATS / interlocked changeovers for the SLD and BOQ, and builds the DEWA TCL summary at transformer level. Chosen sizes can be written back to the main board (kVA, Z %, busbar) and the standby board (kVA). | `src/calc/txGen.ts`, `src/calc/sizing.ts`, `src/calc/parallelTx.ts`, `src/calc/motor.ts` +9 more |\n| 13 | [Power factor correction](13-power-factor-correction.md) | Sizes capacitor banks to the project PF target with Qc = P(tan φ1 − tan φ2): a design study on the network (central, group or individual, bottom-up, with steps, detuning, breaker ≥ 1.43 × In and cable) and a standalone calculator for existing installations with its own PDF report. Banks can be written back to the SLD, where an APFC switching rule counts only the switched kvar in all built-in totals. | `src/calc/pfc.ts`, `src/calc/pfcCalc.ts`, `src/calc/capSwitching.ts`, `src/components/studies/PfcStudy.tsx` +6 more |\n| 14 | [Busbar & busway](14-busbar.md) | Sizes busbar trunking risers for high-rise buildings (demand with diversity, In, ambient derating, Cu/Al selection from a data table, floor-by-floor voltage drop, Icw vs source fault level, size, weight, BOQ parts) and checks a board's typed busbar Icw against its fault level. | `src/calc/busbar.ts`, `src/calc/busbarIcw.ts`, `src/components/studies/BusbarStudy.tsx`, `src/components/BoardFields.tsx` +9 more |\n| 15 | [UPS & solar PV](15-ups-solar.md) | Sizes each UPS from a UPS board's demand or a typed load list. The UPS must cover both kVA and kW (output PF). The battery is sized for constant power with capacity-at-rate, ageing, temperature and margin, with optional manufacturer table, BMS, surge, recharge and generator leading-kvar checks. Sizes one PV array: strings from temperature-corrected Voc/Vmp against the inverter limits (IEC 62548), yield from peak sun hours × PR, and one PV generation feeder on the SLD. | `src/calc/ups.ts`, `src/calc/solar.ts`, `src/model/pvFeeder.ts`, `src/components/studies/UpsStudy.tsx` +4 more |\n| 16 | [Load flow engines](16-load-flow-engines.md) | Runs the project's network through the built-in IEC hand-calculation and, in the desktop app, through OpenDSS or pandapower via a Python helper, and compares Ib, voltage drop and fault levels per circuit. Engine results can also replace the built-in labels on the SLD. A separate TypeScript per-phase (unbalanced) load flow with the neutral feeds the Phase balance study report. | `src/engines/types.ts`, `src/engines/builtin.ts`, `src/engines/external.ts`, `src/engines/index.ts` +12 more |\n| 33 | [Quick calcs & existing checks](33-quick-calcs-existing.md) | A stand-alone Quick calculators screen with 11 tabs (current/power, cable and breaker, voltage drop, transformer, motor, PF correction, fault at cable end, lux, Ohm's law, energy, units). motor.ts holds the starter multiples and starting kVA used across the app. Existing-installation checks turn a board's recorded maximum demand into covering load and check transformer, incomer, existing feeders, spare ways, shared supply and RMU, shown on the sizing page and in the sizing report section. | `src/components/QuickCalcs.tsx`, `src/components/QuickAsides.tsx`, `src/components/quickInputs.ts`, `src/calc/quick.ts` +5 more |\n\n## Equipment & containment\n\n| # | Module | What it does | Main files |\n|---|---|---|---|\n| 17 | [Enclosure & Form 4](17-enclosure-form4.md) | Sizes the physical space of boards. DBs/EDBs are checked by DIN-module count (equipment + spare \u003c= the supplier catalogue's usable modules for the ELCB/incomer case). The chosen size is frozen on the board and printed in the BOQ. | `src/calc/enclosure.ts`, `src/calc/form4.ts`, `src/model/form4Count.ts`, `src/model/enclosureLibrary.ts` +8 more |\n| 18 | [Lighting & emergency lighting](18-lighting-emergency.md) | Lumen-method lux design (quick calculator for rectangles, and Light room for any room outline on a CAD plan) and emergency escape lighting by the spacing-table method after BS 5266-1 / EN 1838 (routes, points of emphasis, open areas, exit signs). Placed lights become lighting points on a circuit and a luminaire schedule that feeds the BOQ. | `src/calc/lighting.ts`, `src/calc/roomLighting.ts`, `src/calc/emergencyLighting.ts`, `src/model/roomLights.ts` +11 more |\n| 19 | [Cable schedule, tray & containment](19-cable-tray-containment.md) | The cable schedule lists every SLD cable with its reference, length, tray route, Ib, In, Iz, voltage drop and status. The cable tray schedule sizes each tray route from the cable diameters (spacing or fill %), gives tiers, spare, weight, bend radius, a cross-section, a tray BOQ and an IEC grouping factor that goes back into the method-E cable ratings. The custom containment calculator sizes tray, ladder, basket, trunking, conduit, a trench or a duct bank on its own, without the design. | `src/components/docs/Documents.tsx`, `src/docs/schedules.ts`, `src/model/cableRefs.ts`, `src/components/docs/TrayScheduleView.tsx` +11 more |\n| 20 | [Equipment, BOQ & pricing](20-equipment-boq-pricing.md) | Rolls every design item (boards, breakers, cables, glands, busway, trays, earthing, transformers, generators, PFC banks, PV, EV chargers, CAD luminaires, ELV lines) into a tender BOQ by section A-J/P with stable item keys. wastage, overrides, scope, packages, markup, discount, VAT and issued BOQ revisions are applied before Excel/PDF output. A separate equipment schedule lists transformers and boards. | `src/calc/bom.ts`, `src/model/priceList.ts`, `src/model/boqScope.ts`, `src/model/boqRevisions.ts` +13 more |\n| 29 | [ELV systems](29-elv.md) | Estimates fire alarm, CCTV, access control, ICT and PA devices from room type and area, or counts devices placed on the floor plan, and sizes the panels, PoE switches, controllers and amplifiers with their upstream kW. Checks detector, Wi-Fi and speaker coverage per room, builds loop, zone, port and BOQ schedules (PDF, Excel, A3 plan sheets, DXF), and sends the ELV supplies to LV as an exchange package that becomes linked, sized circuits on LV boards. | `src/elv/defaults.ts`, `src/elv/devices.ts`, `src/elv/estimate.ts`, `src/elv/placed.ts` +18 more |\n\n## CAD & drawings\n\n| # | Module | What it does | Main files |\n|---|---|---|---|\n| 21 | [Design CAD core](21-cad-core.md) | The app's own 2D drafting screen: a Rust/WebAssembly engine reads DWG/DXF plans, and the engineer draws, edits, dimensions, hatches, blocks and annotates over them. All drawn work, erased handles, blocks, layers, styles and references are saved in the project file keyed by the drawing's file name; the DWG stays outside the project and is written only as a separate copy on SAVE/SAVEAS. | `src/components/cad/CadPage.tsx`, `src/components/cad/CadCanvas.tsx`, `src/components/cad/cadCommands.ts`, `src/components/cad/cadState.ts` +32 more |\n| 22 | [CAD electrical (devices on plans)](22-cad-electrical.md) | The electrical layer on Design CAD floor plans: rooms from outlines, LV points and DBs placed on circuits (keeping circuit point counts in step), multi-device edits, circuit wiring, drawn cable routes and tray runs, and Update schedules that writes measured lengths into Feeder.lengthM (used by voltage drop and cable schedule). | `src/model/cadDevices.ts`, `src/model/deviceEdit.ts`, `src/model/cadRooms.ts`, `src/model/cadPlaces.ts` +20 more |\n| 23 | [CAD sheets, plot & title block](23-cad-sheets-plot-titleblock.md) | Paper side of Design CAD: each plan sheet is a layout with viewports onto the model (scale, plan type, frozen layers, references) and placed legend/notes tables; the Sheets panel hosts every submission sheet with free markups; pen tables, page setups, named setups and batch plots keep printing black-and-white; the title block designer makes grid or imported drawn templates whose fields read project and drawing-register data. | `src/model/planViewports.ts`, `src/components/cad/CadLayouts.tsx`, `src/components/cad/CadPage.tsx`, `src/components/cad/CadSheets.tsx` +18 more |\n| 24 | [Drawings, SLD sheets & register](24-drawings-sld-sheets.md) | Keeps the project's drawing set (SLD, DB, riser, earthing, plan and legend sheets) with numbering, revisions, issues and readiness checks, and exports it as PDF, DXF, DWG, ZIP and a drawing register built from the actual sheets. | `src/model/drawingSet.ts`, `src/model/dbRiser.ts`, `src/model/riserMockup.ts`, `src/components/docs/DrawingsView.tsx` +34 more |\n\n## Documents & workflow\n\n| # | Module | What it does | Main files |\n|---|---|---|---|\n| 25 | [Reports & exports](25-reports-exports.md) | Builds the calculation report, the scoped study reports (PDF, Word, Excel) with design basis, compliance and appendices, the frozen-run issue package and the export centre of 20 PDFs, on a shared black-and-white print engine and Chromium PDF rendering. Network studies (load, sizing, cable, VD, short circuit, earth fault loop, discrimination, PFC, busbar, phase balance) are covered; | `src/docs/calcReport.ts`, `src/docs/studyReport.ts`, `src/docs/calcSections.ts`, `src/docs/calcRecord.ts` +26 more |\n| 26 | [Revisions & changes](26-revisions-changes.md) | Issues design revisions (Rev A, B, C...) as full snapshots inside the project file and compares any two field by field, with every field classed engineering, drawing, commercial or admin. A baseline pointer measures the working draft; checkpoints are private IndexedDB safety copies. Modification records (MOD) propose, decide and atomically apply value changes with an impact preview, and variations (VO) keep the contract-sum account against the contract BOQ. Restore paths keep different data and can drop issued records; | `src/model/revisions.ts`, `src/model/changeClass.ts`, `src/model/datasetDiff.ts`, `src/model/designBaseline.ts` +14 more |\n| 27 | [Review, submissions & authority rules](27-review-submissions-authority.md) | Authority/standard/company rule sets (design references) whose values are applied to project settings and rule rows; design review comments, a received-documents register, a submissions register with transmittals, and checks, register rows and an impact preview for modification proposals. | `src/model/designReference.ts`, `src/model/designRules.ts`, `src/model/reviewComments.ts`, `src/model/receivedDocs.ts` +15 more |\n| 28 | [Dashboard & readiness](28-dashboard-readiness.md) | The Projects home screen (searchable list of saved project files) and the project Overview: headline numbers, load breakdowns, transformer loading, study tallies and a To do list built live from the project plus the last calculation run, split by scope and design stage. Readiness stages and the design-stage checklist are derived from that To do list; | `src/calc/dashboard.ts`, `src/calc/projectReadiness.ts`, `src/calc/statusText.ts`, `src/calc/runs.ts` +8 more |\n| 30 | [Data exchange & inbox](30-exchange-inbox.md) | Checks room, luminaire and ELV load packages from other programs against contract lvds.exchange v1, shows what accepting them would change, and applies only the rows the engineer accepts
