watched, written with Backups/","ref":"electron/database.cjs:writeBook / src/App.tsx:initDatabase"},{"to":"25-reports-exports","dir":"both","status":"working","what":"PDF bytes, text and binary exports; browser download / print dialog on the web","ref":"src/util/files.ts:renderPdf"},{"to":"24-drawings-sld-sheets","dir":"in","status":"working","what":"DXF / SVG exports saved through files:saveText / saveBinary","ref":"src/util/files.ts:saveText"},{"to":"23-cad-sheets-plot-titleblock","dir":"both","status":"working","what":"printer list and silent black-and-white print","ref":"electron/pdfRender.cjs:htmlToPrinter"},{"to":"21-cad-core","dir":"both","status":"working","what":"WebAssembly engine, drawing bytes, block folders, pending Open-with plans","ref":"src/engines/cad/cadEngine.ts"},{"to":"16-load-flow-engines","dir":"both","status":"working","what":"Python engine probe/run with timeout and output caps","ref":"electron/engineRunner.cjs:runJsonProcess"},{"to":"01-app-shell","dir":"both","status":"working","what":"data link","ref":"electron/errorLog.cjs:watchWindow"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"projects list meta for the dashboard","ref":"electron/projectFiles.cjs:listProjectsMeta"},{"to":"31-headless-cli-mcp","dir":"both","status":"working","what":"headless DXF sheets / PDF reports through the app renderer","ref":"electron/headlessExport.cjs:run / src/headless/electronExport.ts:runInRenderer"}],"gaps":[],"md":"# 34 — Electron desktop (main process, preload/IPC, safe file access, engine runner, PDF render, trust)\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\n- **Main process** = the Node.js program Electron runs behind the window (`electron/main.cjs`). It opens the window,\n  shows open/save dialogs, reads and writes files, runs the Python engine and prints PDFs.\n- **Preload / bridge** = a small script (`electron/preload.cjs`) that gives the page one object, `window.lvds`, with\n  named functions. Each function sends a message on a named **IPC channel** (inter-process communication = a message\n  from the window to the main process, e.g. `projects:save`) and waits for the answer.\n- **Trust check** (`electron/trust.cjs`, `trustedHandler`): every channel answers only the app's own page, in its main\n  window, top frame. Anything else is refused before work starts.\n- **Project files** (`electron/projectFiles.cjs`): save with `.bak`, conflict detection by content hash, recovery copies\n  (autosave), 30-day trash, the project list cache.\n- **LV Database** (`electron/database.cjs`): the Excel workbooks and `Library.json`, created, read, watched and written.\n- **CI guards** (`scripts/check-audit.mjs`, `check-privacy.mjs`, `check-package.mjs`, `check-manual.mjs`, allowlists in\n  `security/`): dependency advisories, personal paths/e-mails, package contents, manual consistency.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `electron/main.cjs` | main process | `readSettings`, `writeSettings`, `ensureProjectsFolder`, `createWindow`, `projectPath`, `readProject`, `initDatabase`, `runEngine`, `planOpened`, `chosenDrawings` | Window, settings (`settings.json`: projects folder, database folder, Python path), every IPC handler (48 `handle(…)` channels). |\n| `electron/preload.cjs` | bridge | `contextBridge.exposeInMainWorld('lvds', …)` | `window.lvds.settings / projects / recovery / log / database / folderTemplates / engines / cadFile / files` (48 invoke channels + 2 events `database:changed`, `cad:pending`). |\n| `electron/ipcValidate.cjs` | validation | `saveTextArgs`, `saveBinaryArgs`, `overwriteBinaryArgs`, `pdfArgs`, `printArgs`, `projectSaveArgs`, `recoveryArgs`, `logText`, `workbookRows`, `libraryData`, `engineRequest`, `folderTemplate`, `folderTemplateId`, `folderTemplatesExportArgs`, `ALLOWED_PERMISSIONS`, `PAGE_SIZES` | Shape and size checks of IPC payloads. |\n| `electron/limits.cjs` | validation | `LIMITS`, `readFileLimited`, `readTextFileLimited`, `readJsonLimited`, `assertTextWithin`, `assertJsonWithin`, `boundedCollector` | One table of size limits (project 50 MB, workbook 20 MB, PDF HTML 64 MB, binary export 128 MB, engine request 20 MB…). |\n| `electron/safeFs.cjs` | file access | `assertNotLink`, `readFileNoFollow`, `writeNewFile`, `replaceFile`, `copyFileNoFollow`, `ensureRealDir`, `listFiles`, `makePrivateTempDir` | Link-safe reads, atomic replace, private temp folders. |\n| `electron/trust.cjs` | security | `devUrlFrom`, `appUrlTest`, `appOriginTest`, `senderProblem`, `trustedHandler`, `permissionRequestOk`, `permissionCheckOk`, `externalUrl` | Who may call IPC; which permissions; which links open in the system browser (https only). |\n| `electron/projectFiles.cjs` | file access | `writeFileSafe`, `stampOf`, `decideSave`, `uniqueFileName`, `conflictSiblings`, `listProjectsMeta`, `metaFromProject`, `writeRecovery`, `readRecoveries`, `clearRecovery`, `moveToTrash`, `listTrash`, `restoreFromTrash`, `purgeTrash`, `bestEffort` | Project save/backup/conflict, recovery copies, trash, list cache. |\n| `electron/database.cjs` | file access | `ensureDatabase`, `createWorkbook`, `readDatabase`, `readBook`, `writeBook`, `backup`, `watchDatabase`, `readLibrary`, `writeLibrary`, `folderFor`, `setFolder` | LV Database workbooks (ExcelJS) and `Library.json`. Spec of books/columns: `electron/databaseSpec.json`. |\n| `electron/folderTemplates.cjs` | file access | `read`, `write`, `save`, `remove`, `setDefault`, `importText`, `exportText` | User folder templates in `folder-templates.json` (settings folder). |\n| `electron/pdfRender.cjs` | report output | `pdfSession`, `htmlToPdf`, `printerList`, `htmlToPrinter`, `SHEETS`, `MICRONS` | HTML → PDF bytes in a hidden window with no scripts and no network; silent print to a listed printer, black-and-white (`color: false`). |\n| `electron/engineRunner.cjs` | engine | `runJsonProcess` | Runs `engines/python/lvds_engine.py` once per request: JSON on stdin/stdout, timeout, bounded output, kill on failure. |\n| `electron/cadFile.cjs` | file access | `readDrawingBytes`, `listDrawingFolder`, `engineBytes`, `readDrawingFile`, `MAX_BYTES` | DWG/DXF bytes and the WebAssembly reader for Design CAD (100 MB cap). `readDrawingFile` is used only by `tests/cadFile.test.ts`. |\n| `electron/headlessExport.cjs` | headless | `run`, `finish` | `--lvds-headless-export \u003cjob> \u003cresult>`: hidden window renders DXF sheets / PDF reports for `lvds`. |\n| `electron/headlessPreload.cjs` | bridge | `lvds.files.pdfBytes` | The only bridge the headless window gets. |\n| `src/global.d.ts` | types | `Window.lvds`, `FolderTemplatesState` | TypeScript description of the bridge for the screens. |\n| `src/util/webApp.ts` | web fallback | `isWebVersion`, `useWebApp`, `newerOffered`, `downloadProjectFile`, `chooseProjectFile`, `backupContents` | Web version: offline service worker, install prompt, project file download/upload. |\n| `security/audit-allowlist.json`, `security/privacy-allowlist.json` | CI data | `advisories`, `exceptions` | Accepted advisories (one: minimatch GHSA-g3hv-75wg-m249, expires 2027-01-17); privacy exceptions (none). |\n| `scripts/check-audit.mjs` | CI | `advisoriesOf`, `allowlistProblems`, `evaluate`, `npmAudit` | `npm audit` (shipped and all) against the allowlist; 92-day expiry cap. |\n| `scripts/check-privacy.mjs` | CI | `scanText`, `pdfText`, `scanRepo`, `scanCommits` | Personal paths / e-mails in tracked files and commit addresses. |\n| `scripts/check-package.mjs` | CI | `asarFiles`, `packageProblems`, `badNoticesIn` | Built package: no `node_modules` in app.asar, needed files present, ≤ 20 MB, English locales, licence texts. |\n| `scripts/check-manual.mjs` | CI | `records`, `scalar` | Manual index / component map / visuals consistency (run inside `npm run lint`). |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Project to save, file name, expected stamp, force | 02-project-storage | `src/model/projectStore.ts` (`bridge()`, `b.projects.save/read/stat`) |\n| Recovery copies (autosave) | 02-project-storage | `src/model/projectStore.ts:194` `writeRecovery` → `recovery:write` |\n| Database seeds (default cable/breaker/transformer rows) | 32-component-database | `src/database/database.ts:312` `databaseSeeds` → `src/App.tsx:372` `initDatabase` |\n| Workbook rows to write | 32-component-database, 04-building-load-assessment | `src/components/docs/DatabaseView.tsx:97` `save`; `src/components/docs/BuildingView.tsx:290`; `src/components/docs/BuildingReuse.tsx:253` |\n| Library.json content (title blocks, components, price lists, CAD layer templates…) | 32-component-database | `src/database/librarySync.ts` `pushLibrary` |\n| Report HTML for PDF, sheet size | 25-reports-exports | `src/util/files.ts` `renderPdf`, `savePdf` |\n| Text / binary exports (CSV, DXF, xlsx, docx, zip) | 25-reports-exports, 24-drawings-sld-sheets | `src/util/files.ts` `saveText`, `saveBinaryAt` |\n| Sheets to plot on a printer | 23-cad-sheets-plot-titleblock | `src/util/printers.ts` `canPrint`, `src/components/docs/sheetRender.tsx:404` |\n| DWG/DXF save-over bytes | 21-cad-core | `src/components/cad/CadPage.tsx:915` `writeCopy` |\n| Drawing paths to read (incl. xref paths found inside a drawing) | 21-cad-core | `src/engines/cad/cadEngine.ts:230-279`, `src/components/cad/CadRefs.tsx:164` `lookFor`, `src/model/cadRefs.ts:122` `xrefCandidates` |\n| Engine request (project, OpenDSS script, cable data) | 16-load-flow-engines | `src/engines/external.ts` `engineRequest`, `pythonEngine.run` |\n| Error log text | 01-app-shell | `src/util/errorLog.ts:46` `logError` |\n| Export job (sheets DXF / report PDF) | 31-headless-cli-mcp | `src/headless/electronExport.ts:72` `runInRenderer` (writes `job.json`) |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Project + file stamp, save result / conflict | 02-project-storage | `src/model/projectStore.ts:78` (`loadProjectStamped`), conflict dialog |\n| Projects list (dashboard meta) | 28-dashboard-readiness, 02-project-storage | `projectFiles.listProjectsMeta` → `projects:list` |\n| Recovery copies, newest first, `fileChangedSince` | 02-project-storage, 01-app-shell | `readRecoveries` → `src/App.tsx:1225` banner |\n| Raw database (`books`, `readAt`, `created`) and `database:changed` | 32-component-database | `src/App.tsx:372-381` `receiveDatabase` → `parseDatabase`, `syncLibrary` |\n| Library.json → localStorage | 32-component-database, 23-cad-sheets-plot-titleblock | `src/database/librarySync.ts` `pullLibrary` |\n| PDF bytes | 25-reports-exports | `src/util/files.ts:99` `renderPdf` (merged/finished with pdf-lib) |\n| Saved path messages | many screens | `src/util/files.ts` `saveText`, `saveBinaryAt`, `savePdf` |\n| Printer list, print result | 23-cad-sheets-plot-titleblock | `src/util/printers.ts`, `src/components/docs/OutputDialogs.tsx:175` |\n| DWG/DXF bytes, WebAssembly engine, folder listings, pending \"Open with\" plans | 21-cad-core | `src/engines/cad/cadEngine.ts`, `src/App.tsx:389` (`takePending`), `CadPage.tsx:379/1283` |\n| Engine results / probe | 16-load-flow-engines | `src/engines/external.ts` `probeEngines`, `pythonEngine.run`; `src/components/EngineCompare.tsx` |\n| Headless result files (base64) | 31-headless-cli-mcp | `src/headless/electronExport.ts:87-91` |\n\n## 5. User flow — from button click to result\n\nExample A, **Save project** (desktop):\n1. The screen calls `saveProjectFile` in `src/model/projectStore.ts`, which calls `window.lvds.projects.save(file, data, expected, force)`.\n2. `electron/preload.cjs` sends `projects:save`.\n3. `trust.trustedHandler` checks the sender (`senderProblem`): main window, top frame, app page.\n4. `check.projectSaveArgs` checks it is a project (boards + feeders arrays) and ≤ 50 MB.\n5. `projectPath` makes sure the name is a plain `.json` inside the projects folder and not a link.\n7. `projectFiles.writeFileSafe`: new temp file → `.bak` copy → rename → read back and compare hash → returns the new stamp.\n\nExample B, **Export PDF report**:\n1. Report screen calls `savePdf` (`src/util/files.ts:139`).\n2. `renderPdf` → `window.lvds.files.pdfBytes` → `files:pdfBytes` → `check.pdfArgs` → `pdfRender.htmlToPdf` (hidden window, no JS, no network, private temp folder).\n3. pdf-lib adds frame, bookmarks, metadata in the renderer.\n4. `saveBinary` → `files:saveBinary` → save dialog → `fs.writeFileSync` to the chosen path.\n\nExample C, **Run OpenDSS / pandapower**:\n1. `EngineCompare` → `pythonEngine.run` (`src/engines/external.ts`) → `engines:run`.\n2. `check.engineRequest` → `runEngine` → `engineRunner.runJsonProcess` (Python from settings, 120 s timeout, 50 MB output cap).\n3. JSON answer or `{ error }` back to the screen.\n\nExample D, **Open a DWG from Explorer/Finder while the app is closed**: `app.on('open-file')` (macOS) or `process.argv`\n(Windows) → `pendingPlans` → the page asks `cad:takePending` (`src/App.tsx:389`) → `cadFile.readDrawingBytes`.\n\n## 6. Linked to (working connections)\n\n- 02-project-storage: open/save/stat/conflict, recovery copies, trash, project list — all through `projectFiles.cjs`; web fallback in `projectStore.ts` (browser storage).\n- 32-component-database: workbooks created, read, watched (`database:changed`), written with a backup in `Backups/` (20 kept); `Library.json` read/write.\n- 25-reports-exports: PDF bytes, text/binary exports; web fallback = print dialog / browser download (`src/util/files.ts`).\n- 23-cad-sheets-plot-titleblock: printers and silent print (black-and-white).\n- 21-cad-core: WebAssembly engine bytes, open/read/stat drawings, block-library folders, Save over a drawing chosen with Save As this session.\n- 16-load-flow-engines: Python engine run/probe; web fallback returns a plain error message.\n- 31-headless-cli-mcp: headless DXF / PDF export through the same renderer code and `htmlToPdf`.\n- CI: `check-audit`, `check-privacy` and `check-package` run in `.github/workflows/ci.yml` (lines 29, 35, 84); `check-manual` runs in `npm run lint`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"31-headless-cli-mcp","name":"Headless CLI & MCP","full":"Headless CLI & MCP","group":"Core platform","summary":"One list of 45 tools, offered as the lvds command line, an MCP server for AI assistants and a token-protected local HTTP API, runs the app's own calculations on project files without the window. Value changes become proposals for the engineer; structure changes are written with a backup and change log; exports need an approver and use a hidden Electron window for PDFs and sheet DXF.","files":[{"path":"src/headless/main.ts","kind":"entry","symbols":["main"]},{"path":"src/headless/cli.ts","kind":"cli","symbols":["ALIASES","parseArgs","flagValue","formatText","usage","help","SERVE_HELP","main"]},{"path":"src/headless/mcp.ts","kind":"server","symbols":["createMcp","startMcp","READ_INSTRUCTIONS","WRITE_INSTRUCTIONS"]},{"path":"src/headless/api.ts","kind":"server","symbols":["createApi","startApi","tokenMatches","writeApiToken","newApiToken","apiTokenFile","fromQuery","readBody"]},{"path":"src/headless/tools.ts","kind":"calc","symbols":["TOOLS","allTools","offeredTools","toolByName","callTool","circuitRow","circuitIssues","clientLabel","r"]},{"path":"src/headless/editTools.ts","kind":"calc","symbols":["EDIT_TOOLS","edit","proposal","proposeTool","supplyOrder","BOARD_RATING","authorOf","AUTHOR"]},{"path":"src/headless/buildingTools.ts","kind":"calc","symbols":["BUILDING_TOOLS"]},{"path":"src/headless/cadTools.ts","kind":"calc","symbols":["CAD_TOOLS","readPlan","layerMap","findLevel","withChosenUnits"]},{"path":"src/headless/exchangeTools.ts","kind":"calc","symbols":["EXCHANGE_TOOLS tus":"working","what":"size_circuits, add_circuit, calc_cable_size use recommend/selectCable","ref":"src/headless/editTools.ts:size_circuits"},{"to":"12-transformer-generator","dir":"in","status":"working","what":"transformer loading and generators in project_summary; calc_transformer","ref":"src/headless/tools.ts:project_summary"},{"to":"19-cable-tray-containment","dir":"in","status":"working","what":"cable, tray and containment schedules as reports only","ref":"src/headless/exportTools.ts:export_report"},{"to":"20-equipment-boq-pricing","dir":"in","status":"working","what":"BOQ workbook with the same buildBom/priceBom/numberBom path as BomView","ref":"src/headless/exportTools.ts:export_boq_xlsx"},{"to":"21-cad-core","dir":"in","status":"working","what":"DWG/DXF read by readCadDrawing (WASM inlined in the CLI)","ref":"src/headless/cadTools.ts:readPlan"},{"to":"22-cad-electrical","dir":"both","status":"working","what":"rooms from CAD with the same sequence as floorPlanActions.putRooms; ELV devices placed on levels","ref":"src/headless/cadTools.ts:rooms_from_cad"},{"to":"25-reports-exports","dir":"in","status":"working","what":"all Export centre catalogue entries as HTML, or PDF through the hidden window","ref":"src/headless/exportTools.ts:export_report"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"value changes added as proposed modification records","ref":"src/headless/editTools.ts:proposal"},{"to":"29-elv","dir":"both","status":"working","what":"ELV estimate, devices, schedules, loads placement and loads package","ref":"src/headless/elvTools.ts:ELV_TOOLS"},{"to":"30-exchange-inbox","dir":"both","status":"working","what":"package check/review/apply; rooms and design package exports exist only here","ref":"src/headless/exchangeTools.ts:EXCHANGE_TOOLS"},{"to":"33-quick-calcs-existing","dir":"in","status":"working","what":"calc_* share src/calc/quick.ts with QuickCalcs","ref":"src/headless/tools.ts:TOOLS"},{"to":"34-electron-desktop","dir":"both","status":"working","what":"hidden Electron export window, --lvds-headless-export in main.cjs, recovery folder and settings read","ref":"electron/headlessExport.cjs:run"},{"to":"04-building-load-assessment","dir":"out","status":"working","what":"add_building / add_level; no load assessment numbers returned","ref":"src/headless/buildingTools.ts:BUILDING_TOOLS"}],"gaps":[],"md":"# 31 — Headless CLI (`lvds`) and MCP server tools\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\n\"Headless\" means the app's calculation code runs **without the window**. One list of *tools* (a tool = a named command with checked inputs and a short JSON result) is offered three ways:\n\n| Way in | Started by | Who uses it | Can change projects? |\n|---|---|---|---|\n| Command line `lvds \u003ccommand>` | `src/headless/cli.ts` `main` | the engineer in a terminal, scripts, CI | yes, but every change tool previews unless `--apply` / `--propose` / `--export` is given |\n| MCP server `lvds mcp` (MCP = Model Context Protocol, the way an AI assistant calls local tools over stdin/stdout) | `src/headless/mcp.ts` `createMcp` | Claude Desktop / Claude Code / a local model | only when started with `--write`; even then preview by default |\n| Local HTTP API `lvds serve` | `src/headless/api.ts` `createApi` | Excel, Python, other local programs | only with `--write`, and only by POST with JSON |\n\nAll three call the same `callTool` (`src/headless/tools.ts:332`), which checks the arguments against the tool's input schema (zod = a library that checks the shape and range of each input; `.strict()` refuses unknown inputs) before the tool runs.\n\nThe bundle is built by `npm run build:cli` (`vite.cli.config.ts`) into one Node file `dist-cli/lvds.mjs` (dependencies and the CAD reader WebAssembly inlined).\n\n### 1.1 Coverage — every study / feature and whether CLI/MCP exposes it\n\n| Study / feature (module ID) | Exposed? | Tool(s) | Notes |\n|---|---|---|---|\n| Project list, summary, connected/maximum demand (28, 06) | Yes | `list_projects`, `project_summary` | `systemSummary`, `buildDashboard` |\n| Panels and circuits, Ib/In/Iz, loading (06, 07) | Yes | `list_panels`, `get_panel`, `circuit_results` | `boardSummary`, `run.results` |\n| Voltage drop (08) | Yes | `circuit_results` (vdPct, vdTotalPct), `calc_voltage_drop`, report `voltage-drop` | quick calc is copper only |\n| Short circuit / fault level (06) | Yes | `list_panels` (faultKA), `circuit_results`, `calc_fault_level`, `calc_transformer` | |\n| Discrimination / selectivity (10) | Partly | `run_checks` issues | no TCC curves, no device settings |\n| Load flow engines, OpenDSS, Python (16) | No | — | |\n| Enclosure / Form 4 (17) | No | — | |\n| Lighting / emergency lighting (18) | No (except import) | luminaire rows via `exchange_apply` | no lux calc |\n| Cable schedule, tray, containment (19) | Report only | reports `cable-schedule`, `tray-schedule`, `containment` | |\n| Equipment schedule, BOQ, pricing (20) | Yes (export) | `export_boq_xlsx`, reports `boq`, `boq-summary`, `equipment-schedule` | |\n| Load schedules, DEWA forms (07, 25) | Yes (export) | `export_forms_xlsx`, `export_schedule_template`, reports `load-schedules`, `md-forms` | no phase-balance tool |\n| Space planning, DM substation (05) | Report only | report `dm-form` | |\n| Building information: buildings, levels (04) | Yes (add only) | `add_building`, `add_level` | no load-assessment / concept-brief numbers |\n| CAD floor plans DWG/DXF (21, 22) | Yes (read) | `cad_plan`, `rooms_from_cad` | 2D only; no device placement except ELV |\n| Drawing set / SLD / riser sheets (24) | Yes (DXF, needs Electron) | `export_dxf drawing sld`, report `drawing-register` | |\n| Reports / export centre (25) | Yes | `list_exports`, `export_report` (all 20 catalogue entries, HTML or PDF) | |\n| Revisions, changes, variations (26) | Partly | proposals (`propose_changes`, `size_circuits`), `list_changes` (tool log only), report `variations` | no revision / checkpoint tool |\n| ELV estimate, devices, schedules, loads (29) | Yes | `elv_estimate`, `elv_devices`, `elv_place_devices`, `elv_schedules`, `elv_place_loads`, `export_elv_loads_package` | |\n| Existing-installation checks (33) | No | — | |\n\n## 2. Files, components, functions and stores\n\nThere is no in-memory store here: each tool call opens the project file, works on a copy and (for change tools) writes it back.\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/headless/main.ts` | entry | `main(...)` call, `DOMParser` stand-in | Entry of `dist-cli/lvds.mjs`; adds `@xmldom/xmldom` DOMParser for the DXF code. |\n| `src/headless/mcp.ts` | server | `createMcp` (:13), `startMcp`, `READ_INSTRUCTIONS`, `WRITE_INSTRUCTIONS` | Registers every offered tool with the MCP SDK; read-only/write annotations; client name recorded. |\n| `src/headless/api.ts` | server | `createApi` (:59), `startApi`, `tokenMatches`, `writeApiToken`, `fromQuery` (:24), `readBody` | 127.0.0.1-only HTTP JSON API with bearer token, refuses browser requests (Origin / Sec-Fetch-Site), writes only by POST JSON. |\n| `src/headless/tools.ts` | tools (read) | `TOOLS`, `allTools`, `offeredTools`, `toolByName`, `callTool` (:332), `circuitRow` (:287), `circuitIssues` (:306), `clientLabel`, `r` | Read tools and 7 quick calcs; the one input-checking path. |\n| `src/headless/editTools.ts` | tools (write) | `EDIT_TOOLS`, `edit` (:53), `proposal` (:92), `proposeTool`, `supplyOrder`, `BOARD_RATING` (:85), `authorOf` | Proposals, structure changes, delete with `approvedBy`, `list_changes`, `undo_change`; checks before/after every change. |\n| `src/headless/buildingTools.ts` | tools (write) | `BUILDING_TOOLS` (`add_building`, `add_level`) | Buildings and levels so an exchange rooms package can be placed. |\n| `src/headless/cadTools.ts` | tools | `CAD_TOOLS` (`cad_plan`, `rooms_from_cad`), `readPlan`, `layerMap`, `findLevel`, `withChosenUnits` | DWG/DXF read by the built-in Rust/WASM reader; rooms into Building information. |\n| `src/headless/exchangeTools.ts` | tools | `EXCHANGE_TOOLS`, `readFile`, `checked`, `summary` | Exchange package check, review, apply with hash and approver. |\n| `src/headless/elvTools.ts` | tools | `ELV_TOOLS`, `elvSettingsFor`, `elvInput`, `listDevices` | ELV estimate, devices on a level, schedules, place loads on LV boards. |\n| `src/headless/exportTools.ts` | tools (export) | `EXPORT_TOOLS`, `runExport` (:68), `readiness` (:58), `sheetsDxf` (:137), `templateFile`, `SHEET_TYPES` (:131) | Preview → approval → write new files into `Exports/\u003cproject>/\u003cdate>/`, export log. |\n| `src/headless/electronExport.ts` | bridge | `findRenderer` (:54), `runInRenderer` (:72), `asarHasHeadlessExport`, `appRoot` | Finds Electron (source folder or installed app) and runs one export job through temp files. |\n| `src/headless/rendererExport.ts` | bridge (renderer side) | `ExportJob`, `runJob` (:17), `install` | Runs `dxfFiles` or `CATALOGUE.build` + `renderPdf` inside the hidden window. |\n| `src/headless/project.ts` | file access | `projectsFolder`, `appDataDir`, `parseProject`, `resolveProject`, `openProject` (:82), `listProjects`, `unsavedCopyInApp` (:36), `redactPaths` | Find/open projects, same shape check and migration as the app, read-only. |\n| `src/headless/write.ts` | file access | `commitText` (:110), `commitProject`, `undoChange` (:139), `writeBlocked` (:61), `writeAtomic` (:51), `readLog`, `changeEntry`, `MAX_BACKUPS` | Safe project writes: refuse if unsaved in app or changed since read, temp+rename+read-back, backup, change log. |\n| `src/headless/safeFiles.ts` | file access | `confine` (:43), `readFileWithin`, `readFileLimited`, `realDirs`, `areRealDirs`, `writeNewFile` (:127), `openToAppend`, `findFile`, `isInside`, `MAX_PROJECT_BYTES` | Path confinement to the projects folder (MCP/API), no-follow opens, size limits, exclusive file creation. |\n| `vite.cli.config.ts` | build | `defineConfig` | Bundles `src/headless/main.ts` to `dist-cli/lvds.mjs`, Node 20, WASM inlined. |\n| `electron/headlessExport.cjs` | Electron | `run`, `finish` | Hidden sandboxed window on the built `dist/index.html?lvds-export`, own temp profile, no permissions, 10-min limit. |\n| `electron/headlessPreload.cjs` | Electron | `contextBridge` `lvds.files.pdfBytes` | The single bridge the hidden window needs (HTML → PDF). |\n| `electron/main.cjs` (:19-20, :135) | Electron | `headless` flag | Installed app with `--lvds-headless-export` runs only the export. |\n| `src/main.tsx` (:12-13) | renderer | `?lvds-export` branch | Loads `rendererExport.install` instead of the app. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Project file, shape check, migration | 02-project-storage | `src/headless/project.ts` `parseProject` → `checkProjectShape`, `isFutureSchema`, `migrateProject` |\n| \"Project open with unsaved changes\" signal | 34-electron-desktop | `project.ts` `unsavedCopyInApp` reads the app's `recovery/\u003cid>.json` (same name rule as `electron/projectFiles.cjs` `safeId`) |\n| Projects folder setting | 01-app-shell / 34-electron-desktop | `project.ts` `projectsFolder` reads the app's `settings.json` |\n| Network results (Ib, Iz, VD, fault, Zs, selectivity) | 06-network-sld-editor, 08, 09, 10 | `src/calc/runs.ts` `runCalculations`; `src/calc/summary.ts` `boardSummary`, `systemSummary`, `boardsInSupplyOrder` |\n| To-do list, studies tally, transformer loading | 28-dashboard-readiness | `src/calc/dashboard.ts` `buildDashboard` |\n| Input range issues | 02-project-storage | `src/model/projectValidate.ts` `projectInputIssues` |\n| Quick calcs | 33-quick-calcs-existing | `src/calc/quick.ts` `currentFromPower`, `voltageDrop`, `cableFor`, `transformer`, `faultFromTransformer`, `motor`, `pfCorrection`; `src/calc/motor.ts` `STARTERS` |\n| Breaker / cable sizing | 11-breaker-cable-selection | `src/calc/sizing.ts` `recommend`, `applyRecommendation`; `src/calc/electrical.ts` `selectCable`, `evaluateFeeder`, `runsOf` |\n| Proposals (modification records) | 26-revisions-changes | `src/model/designChanges.ts` `newModification`, `addOp`, `transition`, `withRecord`, `withProposal`, `PROPOSABLE` |\n| Structure edits | 06-network-sld-editor, 07-load-schedule-panels | `src/model/moveBoard.ts`, `renamePanels.ts`, `copyBoard.ts`, `edit.ts` `deleteBoard`, `schedule.ts` `deleteCircuit`, `integrity.ts` `removeDanglingReferences`, `stableIds.ts` `withUids` |\n| Buildings, levels | 04-building-load-assessment | `src/model/buildingEdit.ts` `addBuilding`, `addLevel`, `findBuilding`; `src/calc/building.ts` `LEVEL_KINDS`, `buildingInfoOf` |\n| DWG/DXF reading, rooms | 21-cad-core, 22-cad-electrical | `src/engines/cad/reader.ts` `readCadDrawing`; `src/model/cadDrawing.ts` `planFromDrawing`; `src/model/cadRooms.ts` `roomsFromPlan`, `proposeRooms`, `applyRooms`, `layerMapFor`; `src/model/cadUnits.ts` `planUnits` |\n| Exchange packages | 30-exchange-inbox | `src/exchange/inbox.ts` `readPackage`, `reviewPackage`, `decide`, `roomsExport`; `src/exchange/designExport.ts` `designExport` |\n| ELV | 29-elv | `src/elv/estimate.ts` `estimateElv`, `elvSettings`; `src/elv/placed.ts`; `src/elv/schedules.ts` `elvSchedules`; `src/calc/elvPlace.ts` `placeElvLoads`; `src/elv/package.ts` `elvLoadsPackage` |\n| Report catalogue, PDF render | 25-reports-exports | `src/components/docs/exportCatalogue.ts` `CATALOGUE`, `unavailable`; `src/util/files.ts` `renderPdf`, `safeFileName` |\n| Forms, template, BOQ workbooks | 07, 20, 25 | `src/docs/formWorkbook.ts` `buildFormWorkbook`; `src/docs/xlsxTemplate.ts` `fillLoadScheduleTemplate`; `src/calc/bom.ts` `buildBom`; `src/model/priceList.ts` `priceBom`; `src/model/boqRevisions.ts` `numberBom`; `src/docs/boqWorkbook.ts` |\n| Drawing set, sheet DXF | 24-drawings-sld-sheets, 23 | `src/model/drawingSet.ts` `setOf`, `drawable`, `autoSize`, `sheetRev`; `src/components/docs/sheetRender.tsx` `dxfFiles`; `src/docs/sheetDxf.ts` `buildSheetDxfPages` |\n| Earthing drawing | 09-earthing | `src/diagram/earthingDrawing.ts` `earthingDrawing`; `src/model/earthingPlan.ts` `earthingLayout` |\n| Electron hidden window, PDF IPC validation | 34-electron-desktop | `electron/headlessExport.cjs`, `electron/pdfRender.cjs` `htmlToPdf`, `electron/ipcValidate.cjs` `pdfArgs` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Changed project file (+ uids on new boards/circuits) | 02-project-storage (app opens it; save conflict by hash) | `write.ts` `commitProject` → app `electron/projectFiles.cjs` `decideSave` detects the change on next save |\n| Proposal record MOD-00x (status proposed) | 26-revisions-changes (Reports → Changes, engineer accepts/applies) | `editTools.ts` `proposeTool` → `withRecord` |\n| Backups and change log `\u003cfolder>/.lvds-agent/backups/\u003cfile>/\u003cid>.json`, `log.jsonl` | this module (`list_changes`, `undo_change`) | `write.ts` `commitText`, `readLog` |\n| Export files `\u003cfolder>/Exports/\u003cproject>/\u003cdate>/…` and `.lvds-agent/exports.jsonl` | the engineer / other programs | `exportTools.ts` `runExport`, `safeFiles.ts` `writeNewFile` |\n| Rooms package / design package / ELV loads package JSON | 30-exchange-inbox, external BIM/ELV tools | `export_rooms_package`, `export_design_package`, `export_elv_loads_package` |\n| Rooms on a level in Building information | 04-building-load-assessment, 29-elv | `rooms_from_cad` → `applyRooms` |\n| ELV circuits on LV boards | 07-load-schedule-panels, 06 | `elv_place_loads` → `placeElvLoads` |\n| Short JSON results to an AI client / program | external | `mcp.ts` `createMcp`, `api.ts` `createApi` |\n\n## 5. User flow — from button click to result\n\nThere is no button: the \"click\" is a command or a tool call.\n\n1. User runs `lvds size \"Villa\" --propose` (or an AI client calls `size_circuits` with `mode: \"propose\"`). `cli.ts` `main` → `parseArgs` turns flags into arguments; `--propose` sets `args.mode` to the tool's commit mode (`cli.ts:182`); the first plain argument becomes `project`.\n2. `toolByName` finds the tool (alias `size` → `size_circuits`); `callTool` (`tools.ts:332`) checks the arguments with the tool's zod schema (strict) and fills defaults.\n3. The tool calls `edit` (`editTools.ts:53`) → `openProject` (`project.ts:82`) → `resolveProject` / `findFile` / `confine` (MCP/API: inside the projects folder only, no links) → `readFileWithin` (size ≤ 50 MB) → `parseProject` (shape check + migration in memory).\n4. The tool's plan runs: `proposeTool` → in-scope circuits by `evaluateFeeder`, sorted by `supplyOrder`, each sized with `recommend(…,'fix')` / `applyRecommendation`; changed fields become `ValueChange`s → `proposal` (`newModification`, `addOp`, `transition('proposed')`).\n6. Preview: returns, nothing written. Commit: `commitProject` → `withUids` → `commitText` → `writeBlocked` (recovery copy in the app? file changed since read?) → backup written exclusively → `writeAtomic` (temp, fsync, rename, read back) → log line appended → old backups pruned (50 kept).\n7. The engineer opens the project in the app; the proposal is in Reports → Changes to accept and apply (one undo step).\n\n## 6. Linked to (working connections)\n\n- 02-project-storage: same shape check and migration on read (`parseProject`); app save detects a headless write by hash (`electron/projectFiles.cjs` `decideSave`) and headless refuses to write while the app holds a recovery copy (`writeBlocked`).\n- 06 / 08 / 09 / 10 / 11: all circuit results come from `runCalculations`, `evaluateFeeder`, `recommend` — the same functions the app uses.\n- 28-dashboard-readiness: `run_checks` returns the dashboard to-do list from `buildDashboard`.\n- 33-quick-calcs-existing: `calc_*` use `src/calc/quick.ts`, shared with `QuickCalcs.tsx`.\n- 26-revisions-changes: value changes go through `designChanges.ts` rules (field list `PROPOSABLE`, `transition`).\n- 21 / 22: `rooms_from_cad` matches the app's `floorPlanActions.ts` `planState` / `putRooms` sequence.\n- 29-elv, 30-exchange-inbox: same `estimateElv`, `placeElvLoads`, `decide`, `reviewPackage` as `ElvView`, `PlaceElvDialog`, `InboxView`.\n- 25-reports-exports, 24-drawings-sld-sheets: HTML/PDF reports and sheet DXF are made by the app's `CATALOGUE` and `dxfFiles` (PDF/sheets in hidden Electron).\n- 34-electron-desktop: `electron/main.cjs:19-20` routes `--lvds-headless-export` to `headlessExport.cjs`; `src/main.tsx:12` loads `rendererExport`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"04-building-load-assessment","name":"Building & load assessment","full":"Building & load assessment","group":"Design inputs","summary":"Holds the buildings, levels, rooms, flat layouts and room types, generates DBs and load schedules from them, and estimates concept-stage maximum demand, transformers and generator from a building type (load assessment). The assessment reaches the network only when the user presses Create MDB + feeders, which copies it into MDB(s) and feeders;","files":[{"path":"src/calc/building.ts","kind":"calc","symbols":["DEFAULT_ROOM_TYPES","roomTypesOf","roomLoad","summarizeBuilding","builtUpAreaOf","dbChecks","nextRoomId","roomsFromTable","spaceAreasFromRooms","floorsOf"]},{"path":"src/calc/buildingDesign.ts","kind":"calc","symbols":["DEFAULT_RULES","plannedDbs","generateBuildingDbs","applyRiserLengths","incomerLengthM","defaultServices","addServices","roomDensities","floorLoads","unitLoads"]},{"path":"src/calc/loadAssessment.ts","kind":"calc","symbols":["DEFAULT_SPACES","DEFAULT_FACTORS","DEFAULT_DIVERSITY","DEFAULT_SUPPLY","DEFAULT_TYPES","STANDARD_TX_KVA","STANDARD_GEN_KVA","loadLaLibrary","saveLaLibrary","laTypes","buildingFigures","newAssessment","rowsFromRooms","setAreaMode","assess"]},{"path":"src/calc/loadAssessmen ols":["BuildingInfo","ProjectBuilding","BuildingLevel","BuildingRoom","RoomType","UnitType","Project.building","Project.loadAssessment"]}],"links":[{"to":"32-component-database","dir":"in","status":"working","what":"transformer and generator sizes, room types (RoomTypes.xlsx), flat layouts (UnitTypes.xlsx)","ref":"src/calc/loadAssessment.ts:txSizesOf"},{"to":"03-parameters-rules","dir":"in","status":"working","what":"watts per point, points per circuit and meter limits for generated DBs","ref":"src/calc/buildingDesign.ts:genPointWatts"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"board demand for the designed-so-far comparison and DB check","ref":"src/calc/building.ts:dbChecks"},{"to":"07-load-schedule-panels","dir":"out","status":"working","what":"DBs, circuits and incomers generated from rooms and flats","ref":"src/calc/buildingDesign.ts:generateBuildingDbs"},{"to":"07-load-schedule-panels","dir":"out","status":"working","what":"DB against rooms check and built-up area for the MD sheet","ref":"src/calc/building.ts:builtUpAreaOf"},{"to":"11-breaker-cable-selection","dir":"out","status":"working","what":"assessment feeders and generated incomers sized with recommend optimise","ref":"src/calc/loadAssessmentMdb.ts:createMdbFromAssessment"},{"to":"05-space-planning","dir":"out","status":"working","what":"space planning areas from the rooms","ref":"src/calc/building.ts:spaceAreasFromRooms"},{"to":"14-busbar","dir":"out","status":"working","what":"building summary (floors, heights) for busbar risers","ref":"src/calc/building.ts:summarizeBuilding"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"floor list used by riser and DB riser diagrams","ref":"src/model/levels.ts:floorList"},{"to":"22-cad-electrical","dir":"in","status":"working","what":"rooms traced on CAD plans written into Building information","ref":"src/model/cadRooms.ts"},{"to":"25-reports-exports","dir":"out","status":"working","what":"load assessment section in Design Basis (PDF, Word), concept report, building summary in export centre","ref":"src/docs/designBasis.ts:loadAssessmentBasis"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"readiness items Building and GFA, Load assessment; DB checks on the dashboard","ref":"src/calc/projectReadiness.ts:59"},{"to":"31-headless-cli-mcp","dir":"in","status":"working","what":"add-building and add-level commands","ref":"src/headless/buildingTools.ts"},{"to":"02-project-storage","dir":"out","status":"working","what":"building, loadAssessment and brief saved in the project file, undo steps, change classes","ref":"src/types.ts:653"},{"to":"01-app-shell","dir":"out","status":"working","what":"brief scope decides which screens and findings count","ref":"src/model/brief.ts:viewInScope"}],"gaps":[],"md":"# 04 — Building model, load assessment (incl. MDB), concept brief and concept report\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module holds the architectural data of the project and the first, concept-stage estimate of the electrical load.\n\n- **Building information**: buildings, levels (a \"typical\" level can stand for many identical floors), rooms with a room type and an area, flat/tenant layouts (\"unit types\") placed on levels, and room types with a W/m² density and a demand factor. It also generates DBs and load schedules from the rooms, adds common-area services as feeders, checks each DB against the rooms it serves, and prints a building load summary (TCL / MDL per floor).\n- **Load assessment**: before any load schedule exists, it estimates maximum demand (MD) from a building type: area schedule × W/m² for lighting, small power and cooling, plus services (DHW, cooking, lifts, pumps, EV, special loads, fire and life safety), a diversity per category, a coincidence factor and spare. From the MD it picks the transformers (count × kVA, N or N+1) and a standby generator. \"Create MDB + feeders\" turns the result into one MDB per duty transformer with one feeder per load category.\n- **Project brief** (the \"concept brief\"): role (consultant / contractor), authority, scope, parties and deliverables. It decides which screens count as \"in scope\".\n- **Concept design report**: a one-page black-and-white A4 PDF built from the load assessment (or the SLD when there is none) and the substation room areas.\n\n\"Store\" in this document means the project object kept in memory (`Project` in `src/types.ts`); every edit here replaces part of it (`project.building`, `project.loadAssessment`, `project.brief`) and is saved with the project file.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/building.ts` | calc | `DEFAULT_ROOM_TYPES`, `roomTypesOf`, `roomLoad`, `summarizeBuilding`, `builtUpAreaOf`, `dbChecks`, `nextRoomId`, `roomsFromTable`, `spaceAreasFromRooms`, `floorsOf`, `loadRoomTypeLibrary` | Room loads (area × W/m² × DF), per-level and per-building totals, GFA/BUA, floor list with tags (B1, G, L01…R), DB-vs-rooms check (±30 %), paste of an architect's area schedule, rooms → space-planning areas |\n| `src/calc/buildingDesign.ts` | calc | `DEFAULT_RULES`, `plannedDbs`, `generateBuildingDbs`, `applyRiserLengths`, `incomerLengthM`, `defaultServices`, `addServices`, `roomDensities`, `floorLoads`, `unitLoads` | Generates a common DB per floor and a DB per flat with lighting/socket/AC/WH/cooker circuits from room rules; incomer length from the riser; common services as feeders; W/m² and LPD checks |\n| `src/calc/loadAssessmentMdb.ts` | calc | `assessmentFeeders`, `spreadFeeders`, `createMdbFromAssessment`, `LA_MDB` | Assessment → MDB(s) tagged `generated: 'la:mdb'` and feeders tagged `fromRoom: 'la:\u003ckey>'`; feeders sized with `recommend(..., 'optimise')` |\n| `src/model/buildingEdit.ts` | model | `findBuilding`, `addBuilding`, `addLevel` | Add buildings/levels without the UI (used by the headless CLI) |\n| `src/model/buildingPreset.ts` | model | `bundleFrom`, `mergeBundle`, `roomTypeDiff`, `presetFromBuilding`, `loadBuildingPresets`/`saveBuildingPresets`, `importBuildingPresets`, `unitTypeLibrary`, `withLibraryUnits`, `missingRoomTypes` | Building presets and copying buildings from a past project; flat-layout library |\n| `src/model/levels.ts` | model | `floorList`, `findFloor`, `floorLabel`, `matchFloor`, `boardLocation`, `boardsWithoutLevel` | The single list of floors that boards, rooms and drawings link to (by id, not name) |\n| `src/model/brief.ts` | model | `ProjectBrief`, `newBrief`, `deliverableCatalog`, `withScope`, `withRole`, `resetToRole`, `applyBrief`, `inScope`, `viewInScope` | Project brief: role, authority, scope, parties, deliverables; fills the project header (owner, consultant…) |\n| `src/components/docs/BuildingView.tsx` | screen | `BuildingView` | Building information page: levels, rooms, room types, paste rooms, presets, generate DBs, services, density panel, DB check, summary PDF/Excel |\n| `src/components/docs/BuildingDesignPanels.tsx` | screen | `RoomRulesTable`, `UnitTypesCard`, `LevelUnitsDialog`, `GenerateDialog`, `ServicesDialog`, `DensityPanel` | Dialogs and panels used by `BuildingView` |\n| `src/components/docs/BuildingReuse.tsx` | screen | `SavePresetDialog`, `ReuseDialog`, `UnitLibraryDialog` | Save/reuse building presets, copy from a past project |\n| `src/components/docs/LoadAssessmentView.tsx` | screen | `LoadAssessmentView` (`pickType`, `createMdb`, `fromBuilding`, `rowsFromBuilding`) | The load assessment page |\n| `src/components/docs/FurnitureFields.tsx` | screen | `FurnitureFields` | **Not part of this module**: drawing-sheet \"furniture\" (zones, legend, notes) — belongs to 23/24 |\n| `src/components/BriefEditor.tsx` | screen | `NewProjectWizard`, `BriefDialog`, `PartiesStep`, `ScopeStep`, `DeliverablesStep` | Brief editing in the new-project wizard and later |\n| `src/docs/buildingSummary.ts` | report | `buildingSheet`, `buildingSummaryHtml`, `buildingSummaryWorkbook` | Building load summary per building (PDF and Excel) |\n| `src/docs/conceptReport.ts` | report | `conceptReport`, `conceptReportHtml`, `buildConceptReportHtml` | One-page concept design report |\n| `src/docs/designBasis.ts` (callee) | report | `loadAssessmentBasis`, `laBandText`, `laTxText`, `laGenText` | Turns the assessment into the Design Basis section (used by the concept report) |\n| Stores | store | `Project.building` (`BuildingInfo`), `Project.loadAssessment` (`LoadAssessment`), `Project.brief` (`ProjectBrief`) — `src/types.ts:651-653`; local libraries in `localStorage`: `lvds.loadAssessmentLibrary`, `lvds.roomTypes`, `lvds.buildingPresets`, `lvds.unitTypes` | Project data saved in the project file; libraries saved on this computer |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Room types library (RoomTypes.xlsx), flat layouts (UnitTypes.xlsx), Transformers and Generators catalogues (sizes) | 32-component-database | `src/database/catalog.ts:catalog()` used in `building.ts:roomTypesOf`, `buildingPreset.ts:unitTypeLibrary`, `loadAssessment.ts:txSizesOf`/`genSizes` |\n| Watts per point, max points per circuit, meter limits | 03-parameters-rules (Rules.xlsx via catalog) | `buildingDesign.ts:genPointWatts`, `maxPerCircuit`, `meterFor` → `rule()` |\n| Rooms drawn on CAD plans (outline, area) | 22-cad-electrical | `src/model/cadRooms.ts` writes `project.building.rooms` (uses `roomTypesOf`) |\n| Rooms from the inbox / exchange package | 30-exchange-inbox | `src/exchange/inbox.ts` (uses `roomTypesOf`) |\n| Buildings and levels from the CLI | 31-headless-cli-mcp | `src/headless/buildingTools.ts` → `buildingEdit.ts:addBuilding`/`addLevel` |\n| Board demand for DB check, building summary and \"designed so far\" | 06-network-sld-editor / 07-load-schedule-panels | `src/calc/summary.ts:boardTotals` in `building.ts:dbChecks`, `buildingDesign.ts:floorLoads`; `src/calc/dashboard.ts:buildDashboard` in `LoadAssessmentView` |\n| Substation rooms for the concept report | 05-space-planning | `src/calc/dmSubstation.ts:substationsFromProject`, `dmSubstationAreas` in `conceptReport.ts:conceptReport` |\n| Revision stamp, design stage | 26-revisions-changes / 03-parameters-rules | `model/revisions.ts:revisionStamp`, `model/designStage.ts:STAGE_INFO` in `conceptReport.ts` |\n| Authority choice and templates for the brief | 27-review-submissions-authority | `BriefEditor.tsx:AuthorityPicker` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| MDB(s) with transformer kVA and one feeder per load category | 06-network-sld-editor, 12-transformer-generator, 07-load-schedule-panels | `loadAssessmentMdb.ts:createMdbFromAssessment` (boards via `model/transformers.ts:planTransformers`/`applyTransformers`/`withTransformer`) |\n| Feeder sizes on those MDBs | 11-breaker-cable-selection | `createMdbFromAssessment` → `sizing.ts:recommend(..., 'optimise')` |\n| Generated DBs, circuits, incomers from rooms | 07-load-schedule-panels, 06-network-sld-editor | `buildingDesign.ts:generateBuildingDbs` |\n| Common services feeders | 06-network-sld-editor | `buildingDesign.ts:addServices` |\n| Floor list / level links | 24-drawings-sld-sheets, 09-earthing, 21-cad-core, 18-lighting-emergency, 07-load-schedule-panels | `levels.ts:floorList` (used in `diagram/riserLayout.ts`, `model/dbRiser.ts`, `model/earthRiser.ts`, `model/luminaireSchedule.ts`, `components/cad/CadPage.tsx`, `PanelsPage.tsx`…) |\n| Space-planning areas from rooms | 05-space-planning | `building.ts:spaceAreasFromRooms` ← `SpacePlanView.tsx` |\n| Building summary in busbar riser | 14-busbar | `src/calc/busbar.ts` uses `summarizeBuilding` |\n| Built-up area for DEWA forms / MD sheet | 07-load-schedule-panels, 03-parameters-rules | `building.ts:builtUpAreaOf` ← `docs/mdSheet.ts`, `model/params.ts`, `ProjectSettings.tsx` |\n| DB-vs-rooms check | 28-dashboard-readiness, 07-load-schedule-panels | `building.ts:dbChecks` ← `calc/dashboard.ts`, `LoadScheduleView.tsx` |\n| Load assessment section in Design Basis (PDF and Word) | 25-reports-exports | `docs/designBasis.ts:loadAssessmentBasis` (when `inReport`), `docs/studyWord.ts:127` |\n| Concept design report PDF | 25-reports-exports | `App.tsx:1309 onConceptReport` → `conceptReport.ts:buildConceptReportHtml` |\n| Building summary PDF in export centre | 25-reports-exports | `components/docs/exportCatalogue.ts:188` → `buildingSummaryHtml` |\n| Readiness checklist items | 28-dashboard-readiness | `calc/projectReadiness.ts:59-60` |\n| Brief scope filtering of findings/screens | 01-app-shell, 28-dashboard-readiness | `brief.ts:inScope`, `viewInScope` |\n| Change class / revision labels | 26-revisions-changes | `model/changeClass.ts:37`, `model/revisions.ts:148` |\n\n## 5. User flow — from button click to result\n\n**Load assessment → MDB**\n1. Ribbon \"Concept\" tab → Load assessment (`Ribbon.tsx:515`) → `App.tsx:1623` mounts `LoadAssessmentView`.\n2. User picks a building type → `pickType` (`LoadAssessmentView.tsx:52`) → `buildingFigures(project)` reads GFA above ground, floors and car park from the **first** building → `newAssessment(type, base, lib)` copies the type's rows, services, factors and diversities into `project.loadAssessment`.\n3. Optional: \"GFA from Building\" (`fromBuilding`, line 114) re-reads `buildingFigures`; \"From Building rooms\" (`rowsFromBuilding`, line 120) replaces the area schedule with `rowsFromRooms(project, spaces)` (m² mode).\n4. Every edit (rows, services, factors, diversity, supply) calls `set(...)` → `onChange` → `setProject(p, { step: true })` (one undo step). `assess(a)` re-runs on each render (`useMemo` on `a`).\n5. Right column shows connected kW, MD kVA, VA/m² vs band, `tx` (count × kVA), generator, incomer A; and \"Designed so far\" from `buildDashboard`.\n6. \"Create MDB + feeders\" → `createMdb` (line 73) → `createMdbFromAssessment(project, a, target)`: one MDB per duty transformer (`planTransformers`), feeders from `assessmentFeeders` spread by `spreadFeeders`, each sized by `recommend(..., 'optimise')`; earlier `la:` feeders on those boards are replaced. A status line reports transformer loading.\n7. \"Add to Design Basis report\" sets `inReport: true` → printed by `designBasis.ts:loadAssessmentBasis`.\n\n**Building → DBs**\n1. Building view (`App.tsx:1622` → `BuildingView`): add building/levels/rooms, paste rooms (`roomsFromTable`), flats per level (`LevelUnitsDialog`).\n2. \"Generate DBs…\" → `GenerateDialog` → `generateBuildingDbs(project, buildingId, sourceBoard)` (DBs, circuits, phase balance, incomer sized).\n3. \"Common services…\" → `ServicesDialog` → `defaultServices` → `addServices(project, board, items)`.\n4. \"Summary PDF / Excel\" → `buildingSummaryHtml` / `buildingSummaryWorkbook`.\n\n**Concept report**: Ribbon \"Concept report\" → `App.tsx:1309` → `buildConceptReportHtml(project)` → `conceptReport` (assessment via `loadAssessmentBasis`, rooms via `substationsFromProject`/`dmSubstationAreas`) → `savePdf`.\n\n**Brief**: New project wizard (`NewProjectWizard`) or `BriefDialog` → `applyBrief(project, brief)` writes `project.brief` and header fields in `project.info`.\n\n## 6. Linked to (working connections)\n\n- 32-component-database: transformer and generator sizes in `assess` come from the catalogue first (`txSizesOf`, `genSizes`); room types and flat layouts from RoomTypes.xlsx / UnitTypes.xlsx.\n- 06/12: `createMdbFromAssessment` makes real MDBs with `sourceKva` = the assessment's transformer and feeders with load kW, demand factor = category diversity, `essential` for generator-backed shares — so the network, transformer and generator studies see the assessment once the button is pressed. Re-running updates the same boards (`generated: 'la:mdb'`) and replaces only `la:` feeders.\n- 11: each assessment feeder and each generated incomer is sized by `recommend(..., 'optimise')`.\n- 07: `generateBuildingDbs` writes load schedules; `dbChecks` compares DB demand with room-type demand.\n- 05: `spaceAreasFromRooms` feeds space planning; concept report reads substation room areas.\n- 25: Design Basis and Word study report print the assessment (`loadAssessmentBasis`); building summary is in the export catalogue.\n- 28: readiness checklist uses `p.building` and `p.loadAssessment`.\n- Levels: `levels.ts` is the single level list used by boards, CAD, risers and earthing (rename shows everywhere).\n- The assessment is stored in the project file (`types.ts:653`) and is part of undo (`step: true`) and revision change classes (`changeClass.ts:37`).\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"05-space-planning","name":"Space planning & substation","full":"Space planning & substation","group":"Design inputs","summary":"Power-density space plan (areas x W/m2 x demand factor -> MDB/SMDB -> transformers -> RMUs) with automatic assignment and a Create SLD button that builds and sizes the network. The Substation area page gives the Dubai Municipality DM-D-013 minimum substation, RMU and LV room sizes per substation and prints the form as an A4 PDF.","files":[{"path":"src/calc/spacePlan.ts","kind":"calc","symbols":["DEFAULT_USES","DEFAULT_PLAN_SETTINGS","PLAN_TRANSFORMER_SIZES","areaLoad","panelLoad","transformerLoad","transformersFor","planTransformerKva","summarize","autoAssign"]},{"path":"src/calc/dmSubstation.ts","kind":"calc","symbols":["DM_TYPES","dmType","CONVENTIONAL","DETACHED","POCKET","OPEN_ROOF","DM_NOTES","dmSubstationAreas","substationsFromProject"]},{"path":"src/docs/dmForm.ts","kind":"report","symbols":["buildDmFormHtml"]},{"path":"src/docs/planSheet.ts","kind":"screen","symbols":["buildPlanSheet","applyPlanEdits"]},{"path":"src/model/planToSld.ts","kind":"model","symbols":["planToSld","USE_LOAD_TYPE","lvRating"]},{"path":"src/components/docs/SpacePlanView.tsx","kind":"screen","symbols":["SpacePlanView","createSld","auto"]},{"path":"src/components/docs/SubstationAreaView.tsx","kind":"screen","symbols":["SubstationAreaView","fill","exportPdf","DmReferenceTable"]},{"path":"src/calc/building.ts","kind":"calc","symbols":["spaceAreasFromRooms"]},{"path":"src/App.tsx","kind":"screen","symbols":["space-planning view","substation-area view"]},{"path":"src/types.ts","kind":"model","symbols":["SpaceUse","SpaceArea","PlanPanel","PlanTransformer","SpacePlanSettings","SpacePlan","DmSubstationRoom"]}],"links":[{"to":"04-building-load-assessment","dir":"in","status":"working","what":"rooms and room types become areas and use types; floors checked against levels","ref":"src/calc/building.ts:spaceAreasFromRooms"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"SLD main boards (sourceKva, rmu) as fallback for DM substations","ref":"src/calc/dmSubstation.ts:substationsFromProject"},{"to":"11-breaker-cable-selection","dir":"out","status":"working","what":"created breakers and cables sized by applyAllRecommendations","ref":"src/model/planToSld.ts:planToSld"},{"to":"25-reports-exports","dir":"out","status":"working","what":"DM-D-013 PDF in Export centre; DM room areas in the concept report","ref":"src/components/docs/exportCatalogue.ts:dm-form"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"spacePlan and substations diffed and change-classed","ref":"src/model/revisions.ts:DATA_SETS"},{"to":"02-project-storage","dir":"both","status":"working","what":"saved as project.spacePlan and project.substations; Create SLD is one undo step","ref":"src/types.ts:Project"},{"to":"34-electron-desktop","dir":"out","status":"working","what":"DM form printed to PDF via savePdf","ref":"src/components/docs/SubstationAreaView.tsx:exportPdf"}],"gaps":[],"md":"# 05 — Space planning, substation area and DM substation sizing\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nTwo concept-stage pages (ribbon group \"1 Concept\", `src/components/Ribbon.tsx:519-520`, stage map `src/model/designStage.ts:40`):\n\n| Page (view id) | What the engineer gets |\n|---|---|\n| **Space plan** (`space-planning`) | Power-density planning: each area = m² × W/m² (or a fixed kW) × demand factor. Areas are fed from MDBs/SMDBs, MDBs from transformers, transformers from RMUs (ring main units, the 11 kV switchgear). Gives the maximum demand (kW, kVA), the number of transformers and RMUs needed, an automatic assignment, and a **Create SLD** button that replaces the project's boards and feeders with a sized network. |\n| **Substation area** (`substation-area`) | Minimum room sizes to Dubai Municipality form **DM-D-013**: substation / transformer room, RMU room and LV room (length × width, height, m²) by substation type and number of transformers, with the form's notes, and a one-page-per-substation A4 PDF of the form in English. |\n\n\"Store\" below means the project object kept in memory by the app (`setProject` in `src/App.tsx`); everything this module saves lives in two project fields: `project.spacePlan` (`SpacePlan`, `src/types.ts:831`) and `project.substations` (`DmSubstationRoom[]`, `src/types.ts:841`).\n\nWhere the numbers come from — short answer:\n\n| Value | Source | Where |\n|---|---|---|\n| Max loading %, PF, growth %, transformers per RMU | Space plan's **own** settings (default 80 %, 0.9, **0 %**, 2) — not the project design settings | `src/calc/spacePlan.ts:22` `DEFAULT_PLAN_SETTINGS` |\n| Transformer count | Calculated: ceil(kVA ÷ (size × loading limit)) | `src/calc/spacePlan.ts:119` `transformersFor` |\n| Transformer count per substation (DM page) | Space plan transformers grouped by RMU, else SLD main boards grouped by `board.rmu`, else typed by hand | `src/calc/dmSubstation.ts:138` `substationsFromProject` |\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/spacePlan.ts` | calc | `DEFAULT_USES`, `DEFAULT_PLAN_SETTINGS`, `PLAN_TRANSFORMER_SIZES`, `emptyPlan`, `usesOf`, `areaLoad`, `panelLoad`, `transformerLoad`, `transformersFor`, `planTransformerKva`, `summarize`, `autoAssign` | Area load (m² × W/m² × DF), panel load (own areas + SMDBs below), transformer loading %, plan summary (MD, transformers/RMUs needed, unassigned items), automatic area → MDB → transformer → RMU packing. |\n| `src/calc/dmSubstation.ts` | calc | `DM_TYPES`, `dmType`, `CONVENTIONAL`, `DETACHED`, `POCKET`, `OPEN_ROOF`, `DM_NOTES`, `NOTES_BY_TYPE`, `dmSubstationAreas`, `substationsFromProject` | DM-D-013 look-up tables, room list per type/count, error when the count exceeds the type's limit, and \"one substation per RMU\" derivation from the project. |\n| `src/docs/dmForm.ts` | report | `buildDmFormHtml` | HTML (printed to PDF) of the DM form: header, project info, room table, notes, remarks, undertaking, signature box; black-and-white. |\n| `src/docs/planSheet.ts` | screen helper | `buildPlanSheet`, `applyPlanEdits` | Excel-style grid model for the area schedule (paste from Excel), validation of typed values, linking floors to Building information levels. |\n| `src/model/planToSld.ts` | model | `planToSld`, `USE_LOAD_TYPE`, `lvRating` | Builds boards + feeders from the plan (one LV switchboard per transformer, planned MDB/SMDB, one feeder per area) then sizes all breakers and cables via `applyAllRecommendations` (`src/calc/sizing.ts:331`). |\n| `src/components/docs/SpacePlanView.tsx` | screen | `SpacePlanView` (`auto`, `createSld`, `addPanel`, `addTransformer`, `setUse`) | Settings bar, use-type editor, summary cards, area grid, panel table, transformer/RMU table, tree. |\n| `src/components/docs/SubstationAreaView.tsx` | screen | `SubstationAreaView` (`fill`, `add`, `exportPdf`), `DmReferenceTable` | One card per substation (type, count, kVA, building, remarks), totals, PDF export, full DM reference table. |\n| `src/calc/building.ts` | calc (other module) | `spaceAreasFromRooms` (`:241`) | \"Take areas from the rooms\": one area per Building-information room; room types replace the plan's use types. |\n| `src/App.tsx` | screen wiring | lazy imports `:32`, `:34`; views `:1630-1642`, `:1649` | Mounts both pages; after Create SLD switches to the Network design system view. |\n| `src/types.ts` | model | `SpaceUse` `:786`, `SpaceArea` `:793`, `PlanPanel` `:807`, `PlanTransformer` `:816`, `SpacePlanSettings` `:822`, `SpacePlan` `:831`, `DmSubstationRoom` `:841`; `Project.spacePlan` `:577`, `Project.substations` `:629` | Saved data shapes. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Areas typed or pasted in the grid | (this module) | `src/docs/planSheet.ts:77` `applyPlanEdits` |\n| Rooms, room types (W/m², DF), buildings, levels | 04-building-load-assessment | `src/calc/building.ts:241` `spaceAreasFromRooms`; `src/docs/planSheet.ts:21` `findFloor`/`matchFloor` |\n| Building names for the panel \"Building\" drop-down | 04-building-load-assessment | `src/components/docs/SpacePlanView.tsx:155` (`project.building.buildings`) |\n| SLD main boards (`sourceKva`, `rmu`, `location`) when the plan has no transformers | 06-network-sld-editor | `src/calc/dmSubstation.ts:155-157` `substationsFromProject` |\n| Project info (plot no., owner, consultant, contractor) for the DM form | 02-project-storage | `src/docs/dmForm.ts:15` `buildDmFormHtml` (`project.info`) |\n| Revision stamp on the DM form | 26-revisions-changes | `src/docs/dmForm.ts:24` `revisionStamp` |\n| System voltage for LV switchboard rating | 03-parameters-rules (`project.voltageV`) | `src/model/planToSld.ts:49` `lvRating` |\n| Standard breaker list | 11-breaker-cable-selection | `src/model/planToSld.ts:3,22` `STANDARD_BREAKER_A` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Boards, feeders (sized), `ties: []`, `vdSelection` cleared — replaces the SLD | 06-network-sld-editor, 11-breaker-cable-selection | `src/model/planToSld.ts:92-93` `planToSld` → `applyAllRecommendations` |\n| `board.rmu` and `board.sourceKva` on the new transformer boards | 09-earthing, 12-transformer-generator, 28-dashboard-readiness | `src/model/planToSld.ts:48`; read by `src/model/earthingPlan.ts:80`, `src/calc/dashboard.ts:76-81` |\n| Space-plan transformers → substations (one per RMU) | (this module, DM page); 25-reports-exports (concept report) | `src/calc/dmSubstation.ts:138` `substationsFromProject`; `src/docs/conceptReport.ts:32-33` |\n| DM room areas on the concept design report (\"5. Space requirements\") | 25-reports-exports | `src/docs/conceptReport.ts:34-38` `conceptReport` |\n| DM-D-013 PDF in the Export centre (\"Authority submission forms\") | 25-reports-exports | `src/components/docs/exportCatalogue.ts:148-151` |\n| DM-D-013 PDF from the page | 34-electron-desktop (PDF render) | `src/components/docs/SubstationAreaView.tsx:43` `exportPdf` → `savePdf` |\n| Readiness tick \"Substation and room areas\" | 28-dashboard-readiness | `src/calc/projectReadiness.ts:62` `stageChecklist` |\n| Space-plan total m² as GFA fallback on the dashboard | 28-dashboard-readiness | `src/calc/dashboard.ts:101-103` |\n| Change tracking of `spacePlan` and `substations` | 26-revisions-changes | `src/model/revisions.ts:149-150` `DATA_SETS`; `src/model/changeClass.ts:36` `PROJECT_CLASS` |\n| Help guide entry | 01-app-shell | `src/help/guide.ts:37` |\n\n## 5. User flow — from button click to result\n\n**Space plan**\n1. Ribbon → 1 Concept → *Space plan* sets view `space-planning`; `src/App.tsx:1630` mounts `SpacePlanView` with the in-memory project.\n2. Optional *Take areas from the rooms* → `spaceAreasFromRooms` (`src/calc/building.ts:241`) replaces areas and the use-type list.\n3. Engineer types / pastes areas in the grid → `ClassicGrid` → `applyPlanEdits` (`src/docs/planSheet.ts:77`) → `setPlan` → `onChange` → `setProject` (saved in `project.spacePlan`).\n4. Settings bar (size, max loading %, transformers per RMU, PF, growth %) → `setPlan` with new `settings` (`SpacePlanView.tsx:89-99`).\n5. Summary cards recompute on every change: `summarize` (`src/calc/spacePlan.ts:129`) → `areaLoad`, `kvaOf`, `planTransformerKva`, `transformersFor`.\n6. *Auto-assign* / *Re-plan from scratch* → `auto()` → `autoAssign` (`src/calc/spacePlan.ts:161`): areas → MDB per building (bin-packing to the loading limit), MDBs → transformers (largest first, same building preferred), transformers → RMUs (N each).\n7. Manual edits in the Panels and Transformers tables (`setPanel`, transformer size / RMU inputs).\n8. *Create SLD* → `createSld()` (`SpacePlanView.tsx:55`): blocks if `unassignedAreas`/`unfedPanels`, asks confirmation, `planToSld` (`src/model/planToSld.ts:30`), saves as an undo step, then `onCreated` in `App.tsx:1635` opens Network design (system view).\n\n**Substation area**\n1. Ribbon → *Substation area* → `SubstationAreaView` (`src/App.tsx:1649`).\n2. *Fill from project* → `fill()` → `substationsFromProject` (`src/calc/dmSubstation.ts:138`); replaces `project.substations` after confirmation.\n3. Or *+ Substation* → `add()`; then per card choose type / count / kVA / building / remarks → `patch()` → `project.substations`.\n4. Each card shows `dmSubstationAreas(type, n)` (`src/calc/dmSubstation.ts:99`) rooms or an error.\n5. *Export DM form (PDF)* or per-card *PDF* → `exportPdf` → `buildDmFormHtml` (`src/docs/dmForm.ts:14`) → `savePdf` (A4 portrait).\n\n## 6. Linked to (working connections)\n\n- **04-building-load-assessment** (in): rooms and room types become areas and use types (`spaceAreasFromRooms`); floor names checked against Building-information levels (`applyPlanEdits`, `src/docs/planSheet.ts:110-113`).\n- **06-network-sld-editor** (both): Create SLD writes boards/feeders (`planToSld`); DM page reads SLD main boards when the plan has no transformers (`substationsFromProject`).\n- **25-reports-exports** (out): DM form in the Export centre (`exportCatalogue.ts:148`); DM areas in the concept report (`conceptReport.ts:32-38`).\n- **28-dashboard-readiness** (out): concept checklist (`projectReadiness.ts:62`); GFA fallback (`dashboard.ts:101`).\n- **26-revisions-changes** (out): both fields diffed and classed (`revisions.ts:149-150`, `changeClass.ts:36`).\n- **02-project-storage** (both): saved in the project file; Create SLD is one undo step (`setProject(p, { step: true })`).\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"06-network-sld-editor","name":"Network / SLD editor & core calc","full":"Network / SLD editor & core calc","group":"Design inputs","summary":"The Design view: system and board SLDs, equipment palette, inspector, board/feeder forms, copy/move/rename and Build hierarchy.","files":[{"path":"src/calc/electrical.ts","kind":"calc","symbols":["designCurrentA","incomerBasis","voltageDropPct","upstreamVoltageDropPct","feederVdPctAt","feederRating","selectCable","selectCableRuns","transformerImpedance","supplyImpedance","cableImpedance","impedanceToBoard","parallelGroup","parallelZ","faultCurrentKA","evaluateFeeder","evaluateProject","boardDemandKw"]},{"path":"src/calc/network/index.ts","kind":"calc","symbols":["withNetwork","networkOf","memoized","perProject","forgetNetworks","boardOf","feedersOn"]},{"path":"src/calc/runs.ts","kind":"store","symbols":["runCalculations","staleStudies","fingerprint","INPUTS","STUDY_LABEL","CalcRun"]},{"path":"src/calc/summary.ts","kind":"calc","symbols":["boardTotals","boardSummary","systemSummary","boardsInSupplyOrder","loadingStatus"]},{"path":"src/calc/scenario.ts","kind":"calc","symbols":["generatorScenario","transformerOutage","GENERATOR_XD_SUBTRANSIENT_PCT"]},{"path":"src/App.tsx","kind":"screen","symbols":["run","staleKeys","calcProject","runNow","allResults", diagram (SLD), a per-board diagram, the earthing schematic and a riser view, with an equipment\npalette on the left and an inspector (properties panel) on the right. The user adds boards, feeders (outgoing circuits),\ntransformers, generators, capacitor banks, bus couplers and accessories by drag-and-drop or forms. Boards can be copied,\npasted, moved, renamed and built in bulk (Build hierarchy).\n\nUnder the screen sits the **core electrical calculation** used by every study:\n\n| Result | Where | Method (as coded) |\n|---|---|---|\n| Design current Ib | `src/calc/electrical.ts` `designCurrentA` | 3/4-core: P·DF ÷ (√3·U·cos φ); 2-core: P·DF ÷ (U0·cos φ); capacitor: Q ÷ (√3·U); incomer: most loaded phase S ÷ U0 from `incomerBasis` |\n| Cable rating Iz | `feederRating` → `src/calc/installation.ts` `feederRatingBasis` | tabulated rating for the installation method × ambient/ground × grouping (tray or parallel runs) × runs |\n| Voltage drop (own, upstream, total) | `voltageDropPct`, `upstreamVoltageDropPct`, `feederVdPctAt`, `vdPctFor` | 3-phase √3·I·(R cos φ + X sin φ)·L ÷ U; 1-phase 2·I·Z ÷ U0; R at `vdTempC` (or R20 × 1.2) |\n| Prospective fault at breaker and at cable end | `impedanceToBoard`, `faultCurrentKA`, `cableImpedance` | Ik″ = c·U ÷ (√3·|Z|), c = 1.05, transformer Z from uk%, cable R at 20 °C, parallel transformers on closed couplers |\n| Checks | `evaluateFeederOf` | VD total ≤ limit (warn > 85 %), Iz ≥ Ib, Ib ≤ In ≤ Iz, Icu ≥ Ik at the busbar, loading Ib/In (warn > 85 %) |\n| Board summary | `src/calc/summary.ts` `boardSummary`, `boardTotals`, `systemSummary` | connected/demand kW, kvar, kVA, PF, current, loading vs rating, busbar voltage, Ik″ |\n| Scenarios | `src/calc/scenario.ts` `generatorScenario`, `transformerOutage` | network re-built on standby generators (X″d 15 %) or with one transformer out and the bus tie closed |\n\n## 2. Files, components, functions and stores\n\n\"Store\" here means the React state in `App.tsx` that holds the project in memory (`useHistory`, the undo history).\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/electrical.ts` | calc | `designCurrentA`, `incomerBasis`, `voltageDropPct`, `upstreamVoltageDropPct`, `feederVdPctAt`, `feederRating`, `deratedAmpacityA`, `selectCable`, `selectCableRuns`, `transformerImpedance`, `supplyImpedance`, `cableImpedance`, `impedanceToBoard`, `parallelGroup`, `parallelZ`, `faultCurrentKA`, `evaluateFeeder`, `evaluateProject`, `boardDemandKw` | The core per-feeder calculation and its `FeederResult` (Ib, Iz, VD, fault levels, statuses) |\n| `src/calc/network/index.ts` | calc (cache) | `NetworkIndex`, `withNetwork`, `networkOf`, `memoized`, `perProject`, `forgetNetworks`, `boardOf`, `feedersOn` | Look-up tables (board by id, feeders by board, incomer of a board) and a memo so tree walks are done once per project object; keeps the last 4 projects |\n| `src/calc/summary.ts` | calc | `boardTotals`, `boardSummary`, `systemSummary`, `boardsInSupplyOrder`, `loadingStatus`, `loadTypeOf` | Board and system totals, loading, busbar voltage and Ik″ |\n| `src/calc/scenario.ts` | calc | `generatorScenario`, `transformerOutage`, `GENERATOR_XD_SUBTRANSIENT_PCT` | Generator-supply and transformer-outage versions of the network for the SLD |\n| `src/components/SystemDiagram.tsx` | screen | `SystemDiagram`, `sldLayout`, `nameBox`, hover card with quick fixes, cable label editor `saveCable`, drag/move handlers | The interactive system SLD |\n| `src/components/SingleLineDiagram.tsx` | screen | `SingleLineDiagram`, `wrapText` | One board's SLD (Board tab, board sheets) |\n| `src/components/BoardPanel.tsx` | screen | `BoardPanel` (tabs General / Supply / Electrical / Protection / Location) | Inspector for a board; edits apply as you type |\n| `src/components/BoardFields.tsx` | screen | `BoardFields`, `BOARD_FIELD_GROUPS` | Editable board fields shared by the inspector and the edit dialog |\n| `src/components/BoardForm.tsx` | screen | `BoardForm` | \"Add downstream board\" dialog: board + incomer feeder |\n| `src/components/BoardEditForm.tsx` | screen | `BoardEditForm` | Double-click edit dialog for a board (applies on Save) |\n| `src/components/FeederForm.tsx` | screen | `FeederForm`, `suggestCable` | Add / edit feeder dialog with live Ib and VD |\n| `src/components/InspectorPanel.tsx` | screen | `InspectorPanel` | Resizable right-hand panel wrapper |\n| `src/components/EquipmentPalette.tsx`, `paletteSymbols.tsx` | screen | `EquipmentPalette` | Drag source for `PaletteItem`s (loads, boards, devices, presets, components) |\n| `src/components/SystemSummaryCards.tsx` | screen | `SystemSummaryCards` | Results drawer: system summary and bus voltages & loading table |\n| `src/components/BuildHierarchyDialog.tsx`, `BranchPanel.tsx` | screen | `BuildHierarchyDialog`, `BranchPanel` | Bulk panel creation, repeat a branch on other floors, saved assemblies |\n| `src/components/PasteBoardDialog.tsx` | screen | `PasteBoardDialog` | Rename rules when pasting a copied board |\n| `src/model/sldEdit.ts` | model | `PALETTE`, `canDrop`, `applyDrop`, `dropMany`, `boardIncomer`, `sized`, `canMove`, `applyMove`, `removeTie`, `updateTie`, `tiePartner` | What a drop or a move does to the project |\n| `src/model/sldScope.ts` | model | `onSld`, `splitSld`, `SLD_FINAL_CIRCUIT_MAX_A` | Which ways are drawn on the SLD vs left to the DB schedule |\n| `src/model/hierarchy.ts` | model | `planHierarchy` (only tests), `applyHierarchy`, `levelRef`, `panelName`, `evenAssignment` | Older hierarchy planner; `applyHierarchy` still used |\n| `src/model/copyBoard.ts` | model | `suggestRename`, `planPaste`, `pasteBoard` | Copy / paste a board and everything below it |\n| `src/model/branchCopy.ts` | model | `extractBranch`, `planBranchCopies`, `applyBranchCopies`, assemblies (`loadAssemblies`, `saveAssemblies`) | Repeat a branch on other floors; assemblies kept in localStorage + Library.json |\n| `src/model/moveBoard.ts` | model | `moveBlocked`, `moveBoard`, `indentTarget`, `outdentTarget`, `reorderBoard`, `moveSummary` | Panel-tree moves |\n| `src/model/renamePanels.ts` | model | `renameProblems`, `renamePanels`, `renameByLevel`, `proposeNumbers` | Rename boards and update every reference |\n| `src/diagram/layout.ts` | diagram | `layoutSystem` | Positions of boards and ways on the system SLD |\n| `src/diagram/sldDevices.ts`, `panelBox.ts`, `panelLabels.ts` | diagram | `sldDevices`, `panelSymbolOf`, `incomerTexts`, `cableLines`, `breakerText` | Devices, symbols and texts per way and board |\n| `src/diagram/symbolLibrary.tsx`, `IecSymbols.tsx` | diagram | `Sym`, `SwitchSym`, `LoadSym`, `legendEntries` | IEC symbols and legend |\n| `src/diagram/heatmap.ts` | diagram | `feederRatio`, `boardRatio`, `earthRatio`, `heatColor` | Screen colouring by VD / loading / utilisation / fault duty / earth loop |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Boards, feeders, ties, trays, building, project fields | 02-project-storage | `src/types.ts` `Project`; `App.tsx` `useHistory` / `setProject` |\n| System voltage, VD limit, conductor temperature, ambient, ground temperature, soil resistivity, PF target | 03-parameters-rules | `project.voltageV`, `vdLimitPct`, `vdTempC`, `ambientC`, `groundTempC`, `soilResistivityKmW`; `src/types.ts` `settingsOf` |\n| Cable R, X, ampacity, method ratings | 32-component-database | `src/calc/cableTable.ts` `cables`, `getCable`, `resolveCable`, `setCables` |\n| Installation method derating | 11-breaker-cable-selection | `src/calc/installation.ts` `feederRatingBasis` |\n| Tray grouping factor | 19-cable-tray-containment | `src/calc/cableTray.ts` `trayGrouping` via `electrical.ts` `trayFactorOf` |\n| Per-phase P and Q of a board (incomer basis) | 07-load-schedule-panels | `src/calc/loadSchedule.ts` `boardPhasePQ` |\n| Recorded maximum demand of existing boards | 33-quick-calcs-existing | `src/model/existing.ts` `record SystemDiagram` (labels via `buildAnnotations`, heat colours, hover cards), the results drawer (`ResultsTable`, `SystemSummaryCards`), and the inspector (`SidePanel`, `BoardPanel`, `DiscriminationPanel`).\n8. Hover card on a failing way: `failReasons`, `quickFixes` → click → `App.tsx` `onFixFeeder` patches the live feeder.\n9. Supply menu → generator / transformer outage → `generatorScenario` / `transformerOutage` → `evaluateProject(genScenario.project)` live (not part of the run).\n\n## 6. Linked to (working connections)\n\n- 02-project-storage: every edit goes through `setProject` (undo history, `src/model/history.ts` `record`); drops, moves, paste, ties, quick fixes use `{ step: true }`. Auto-run flag is saved in `project.calc.autoRun`.\n- 03-parameters-rules: voltage, VD limit, conductor temperature and ambient are read live and are in the fingerprints (`runs.ts` `INPUTS`).\n- 07-load-schedule-panels: incomer current and VD come from `boardPhasePQ` (per-phase P/Q including single-phase circuits).\n- 09-earthing, 10-protection-coordination: computed in the same run (`runCalculations`) on one network index.\n- 11-breaker-cable-selection: drops are sized with `recommend`; quick fixes evaluate candidate sizes with `evaluateFeeder`.\n- 12-transformer-generator: closed couplers combine transformer impedances (`parallelGroup`, `parallelZ`); generator / outage scenarios on the SLD.\n- 16-load-flow-engines: external results overlay the SLD only while `engineRun.project === project` (`engineFresh`).\n- 19-cable-tray-containment: tray grouping factor feeds Iz (`trayFactorOf`), and trays are in the `checks` fingerprint.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"07-load-schedule-panels","name":"Load schedule & panels","full":"Load schedule & panels","group":"Design inputs","summary":"DB load distribution schedules (points x WATT/UNIT, R/Y/B ways, ELCB groups, spares)
