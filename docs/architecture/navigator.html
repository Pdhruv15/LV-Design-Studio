    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, href) => {
      const id = href.replace(/^\.\//, '').replace(/\.md(#.*)?$/, '');
      if (byId[id]) return `<a class="modlink" data-mod="${h(id)}">${t}</a>`;
      if (href === '00-index.md' || href === '99-integration-map.md') return `<a class="modlink" data-doc="${h(href)}">${t}</a>`;
      if (href === 'navigator.html') return t;
      return `<a href="${h(href)}">${t}</a>`;
    });
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${h(codes[+i])}</code>`);
  }
  const cells = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map((c) => c.replace(/\\\|/g, '|').trim());
  function md(src) {
    const L = src.replace(/\r/g, '').split('\n'); let out = '', i = 0, para = [];
    const flush = () => { if (para.length) { out += `<p>${inline(para.join(' '))}</p>`; para = []; } };
    while (i < L.length) {
      const l = L[i];
      if (/^```/.test(l)) {
        flush(); const lang = l.slice(3).trim(); const buf = []; i++;
        while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
        i++;
        out += lang === 'mermaid' ? `<p class="muted">(Mermaid diagram — see the Diagram tab for the interactive version.)</p><pre><code>${h(buf.join('\n'))}</code></pre>` : `<pre><code>${h(buf.join('\n'))}</code></pre>`;
        continue;
      }
      const hm = /^(#{1,6})\s+(.*)$/.exec(l);
      if (hm) { flush(); out += `<h${hm[1].length}>${inline(hm[2])}</h${hm[1].length}>`; i++; continue; }
      if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
        flush(); const head = cells(l); i += 2; let rows = '';
        while (i < L.length && /^\s*\|/.test(L[i])) { rows += '<tr>' + cells(L[i]).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++; }
        out += `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
        continue;
      }
      const lm = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(l);
      if (lm) {
        flush(); const ordered = /\d/.test(lm[2]); let items = '';
        while (i < L.length) {
          const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(L[i]);
          if (m) { items += `<li style="margin-left:${Math.min(m[1].length, 8) * 8}px">${inline(m[3])}</li>`; i++; }
          else if (/^\s{2,}\S/.test(L[i])) { items = items.replace(/<\/li>$/, ' ' + inline(L[i].trim()) + '</li>'); i++; }
          else break;
        }
        out += ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`;
        continue;
      }
      if (/^\s*>/.test(l)) { flush(); out += `<blockquote>${inline(l.replace(/^\s*>\s?/, ''))}</blockquote>`; i++; continue; }
      if (/^\s*(---|\*\*\*)\s*$/.test(l)) { flush(); out += '<hr>'; i++; continue; }
      if (!l.trim()) { flush(); i++; continue; }
      para.push(l.trim()); i++;
    }
    flush(); return out;
  }

  // ---------- sidebar ----------
  function renderList() {
    const q = $('#modfilter').value.toLowerCase(); let html = '';
    for (const [g, ids] of D.groups) {
      const ms = ids.map((id) => byId[id]).filter((m) => m && (!q || (m.id + ' ' + m.name + ' ' + (m.summary || '')).toLowerCase().includes(q)));
      if (!ms.length) continue;
      html += `<div class="grp">${h(g)}</div>`;
      for (const m of ms) {
        const hi = m.gaps.filter((x) => x.severity === 'high').length;
        html += `<div class="mod${selected === m.id ? ' sel' : ''}" data-id="${m.id}" title="${h(m.summary)}"><span class="n">${m.id.slice(0, 2)}</span><span class="t">${h(m.name)}</span>`
          + (D.public ? '' : `<span class="pill${hi ? ' h' : ''}" title="${hi} high of ${m.gaps.length} gaps">${hi ? hi + '/' : ''}${m.gaps.length}</span>`) + '</div>';
      }
    }
    $('#modlist').innerHTML = html;
  }
  $('#modfilter').addEventListener('input', renderList);
  $('#modlist').addEventListener('click', (e) => { const el = e.target.closest('.mod'); if (el) { select(el.dataset.id); show('mod'); } });

  // ---------- diagram ----------
  const W = 210, H = 36, GAP = 14, COLW = 250, TOP = 50, LEFT = 20;
  const pos = {};
  D.groups.forEach(([, ids], gi) => ids.filter((id) => byId[id]).forEach((id, k) => { pos[id] = { x: LEFT + gi * COLW + 10, y: TOP + 30 + k * (H + GAP) }; }));
  const maxRows = Math.max(...D.groups.map(([, ids]) => ids.length));
  const svgW = LEFT * 2 + D.groups.length * COLW, svgH = TOP + 50 + maxRows * (H + GAP);
  function edgePath(a, b, off) {
    const A = pos[a], B = pos[b];
    if (A.x === B.x) { const x = A.x + W, bend = 40 + Math.abs(A.y - B.y) / 6 + off; return `M${x},${A.y + H / 2} C${x + bend},${A.y + H / 2} ${x + bend},${B.y + H / 2} ${x},${B.y + H / 2}`; }
    const ltr = A.x < B.x; const x1 = ltr ? A.x + W : A.x, x2 = ltr ? B.x : B.x + W, y1 = A.y + H / 2 + off, y2 = B.y + H / 2 + off, dx = (x2 - x1) / 2;
    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  }
  function renderMap() {
    let s = `<defs><marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2e8b57"/></marker>`
      + `<marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d03030"/></marker></defs>`;
    D.groups.forEach(([g, ids], gi) => {
      const n = ids.filter((id) => byId[id]).length;
      s += `<rect class="gbox" x="${LEFT + gi * COLW}" y="${TOP}" width="${W + 20}" height="${40 + n * (H + GAP)}"/><text class="gtitle" x="${LEFT + gi * COLW + 10}" y="${TOP + 20}">${h(g)}</text>`;
    });
    D.edges.forEach((e, k) => {
      if (!pos[e.a] || !pos[e.b]) return;
      if (e.working.length) s += `<path class="edge ok" data-e="${k}" data-a="${e.a}" data-b="${e.b}" d="${edgePath(e.a, e.b, 0)}" marker-end="url(#aok)"/>`;
      if (e.broken.length) s += `<path class="edge bad" data-e="${k}" data-a="${e.a}" data-b="${e.b}" d="${edgePath(e.a, e.b, e.working.length ? 4 : 0)}" marker-end="url(#abad)"/>`;
    });
    for (const m of mods) {
      const p = pos[m.id]; if (!p) continue;
      const label = `${m.id.slice(0, 2)}  ${m.name}`; const t = label.length > 30 ? label.slice(0, 29) + '…' : label;
      s += `<g class="node" data-id="${m.id}" transform="translate(${p.x},${p.y})"><rect width="${W}" height="${H}"/><text x="8" y="${H / 2 + 4}">${h(t)}</text><title>${h(m.name)}</title></g>`;
    }
    const svg = $('#map'); svg.setAttribute('width', svgW); svg.setAttribute('height', svgH); svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`); svg.innerHTML = s;
  }
  function neighbours(id) { const n = new Set(); D.edges.forEach((e) => { if (e.a === id) n.add(e.b); if (e.b === id) n.add(e.a); }); return n; }
  function highlight() {
    const svg = $('#map'); svg.classList.toggle('focus', !!selected);
    const nb = selected ? neighbours(selected) : new Set();
    $$('.node', svg).forEach((g) => { g.classList.toggle('sel', g.dataset.id === selected); g.classList.toggle('nb', nb.has(g.dataset.id)); });
    $$('.edge', svg).forEach((p) => p.classList.toggle('hl', !!selected && (p.dataset.a === selected || p.dataset.b === selected)));
  }
  $('#map').addEventListener('click', (e) => { const g = e.target.closest('.node'); if (g) select(g.dataset.id); else { selected = null; highlight(); renderList(); renderCard(); } });
  const tip = $('#tip');
  $('#map').addEventListener('mousemove', (e) => {
    const p = e.target.closest('.edge');
    if (!p) { tip.style.display = 'none'; return; }
    const ed = D.edges[+p.dataset.e]; const list = p.classList.contains('ok') ? ed.working : ed.broken;
    tip.innerHTML = `<b>${h(ed.a)} → ${h(ed.b)}</b><br>` + list.map((l) => `${h(l.status)}: ${h(l.what)}`).join('<br>');
    tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px';
  });
  $('#map').addEventListener('mouseleave', () => (tip.style.display = 'none'));

  function linkLine(m, l) {
    const other = byId[l.to]; const arrow = l.dir === 'in' ? '← from' : l.dir === 'out' ? '→ to' : '↔';
    return `<li><span class="${l.status === 'working' ? 'linkok' : 'linkbad'}">${h(l.status)}</span> ${arrow} <a class="modlink" data-mod="${h(l.to)}">${h(other ? other.name : l.to)}</a> — ${h(l.what)}${l.ref ? `<br><code>${h(l.ref)}</code>` : ''}</li>`;
  }
  function renderCard() {
    const c = $('#card');
    if (!selected) { c.innerHTML = '<p class="muted">Select a module in the diagram or the list on the left.</p>'; return; }
    const m = byId[selected];
    const incoming = D.edges.filter((e) => e.b === m.id || e.a === m.id).flatMap((e) => [...e.working, ...e.broken].filter((l) => l.from !== m.id).map((l) => ({ ...l, other: l.from })));
    const ok = m.links.filter((l) => l.status === 'working'), bad = m.links.filter((l) => l.status !== 'working');
    const hi = m.gaps.filter((g) => g.severity === 'high');
    if (D.public) {
      const all = linksOf(m.id);
      c.innerHTML = `<h2>${h(m.id.slice(0, 2))} — ${h(m.name)}</h2><p>${h(m.summary)}</p><p><button class="btn" data-open="${m.id}">Open full details</button></p>`
        + `<b>Links (${all.length})</b><ul>${all.map((l) => `<li>${l.arrow} <a class="modlink" data-mod="${h(l.other)}">${h(byId[l.other]?.name ?? l.other)}</a> — ${h(l.what)}${l.ref ? `<br><code>${h(l.ref)}</code>` : ''}</li>`).join('') || '<li class="muted">none</li>'}</ul>`
        + `<b>Files (${(m.files || []).length})</b><ul>${(m.files || []).map((f) => `<li><code>${h(f.path)}</code>${f.kind ? ` <span class="tag">${h(f.kind)}</span>` : ''}</li>`).join('')}</ul>`;
      return;
    }
    c.innerHTML = `<h2>${h(m.id.slice(0, 2))} — ${h(m.name)}</h2><p class="muted">${h(m.full)}</p><p>${h(m.summary)}</p>`
      + `<p><button class="btn" data-open="${m.id}">Open full details</button> <button class="btn" data-gaps="${m.id}">Show its ${m.gaps.length} gaps</button></p>`
      + `<b>Working links (${ok.length})</b><ul>${ok.map((l) => linkLine(m, l)).join('') || '<li class="muted">none reported</li>'}</ul>`
      + `<b>Broken or missing links (${bad.length})</b><ul>${bad.map((l) => linkLine(m, l)).join('') || '<li class="muted">none reported</li>'}</ul>`
      + (incoming.length ? `<b>Reported by other modules (${incoming.length})</b><ul>${incoming.map((l) => `<li><span class="${l.status === 'working' ? 'linkok' : 'linkbad'}">${h(l.status)}</span> <a class="modlink" data-mod="${h(l.other)}">${h(byId[l.other]?.name ?? l.other)}</a> — ${h(l.what)}</li>`).join('')}</ul>` : '')
      + `<b>High-severity gaps (${hi.length})</b><ul>${hi.map((g) => `<li><b>${h(g.id)}</b> ${h(g.title)}<br><code>${h(g.file)}${g.line ? ':' + g.line : ''}</code>${g.func ? ` <code>${h(g.func)}</code>` : ''}</li>`).join('') || '<li class="muted">none</li>'}</ul>`
      + `<b>Files (${(m.files || []).length})</b><ul>${(m.files || []).map((f) => `<li><code>${h(f.path)}</code>${f.kind ? ` <span class="tag">${h(f.kind)}</span>` : ''}</li>`).join('')}</ul>`;
  }
  // Every link touching a module, whichever side reported it (public view: working links only).
  function linksOf(id) {
    const seen = new Set(), out = [];
    for (const e of D.edges) {
      if (e.a !== id && e.b !== id) continue;
      const other = e.a === id ? e.b : e.a, arrow = e.a === id ? '→ to' : '← from';
      for (const l of e.working) { const k = other + '|' + l.what; if (!seen.has(k)) { seen.add(k); out.push({ other, arrow, what: l.what, ref: l.ref }); } }
    }
    return out;
  }
  function select(id) {
    selected = id; renderList(); highlight(); renderCard();
    $('#modmd').innerHTML = md(byId[id].md);
    if (!D.public) $('#gapmod').value = '';
  }

  // ---------- gaps (left out of the public version) ----------
  if (!D.public) $('#gapmod').innerHTML += mods.map((m) => `<option value="${m.id}">${h(m.id.slice(0, 2) + ' ' + m.name)}</option>`).join('');
  let sortK = 'severity', sortDir = 1;
  function renderGaps() {
    const on = (n) => new Set($$(`input[name=${n}]:checked`).map((x) => x.value));
    const kinds = on('kind'), acts = on('action'), sevs = on('sev'), mod = $('#gapmod').value, q = $('#gapq').value.toLowerCase().trim();
    const rows = allGaps.filter((g) => kinds.has(g.kind) && acts.has(g.action) && sevs.has(g.severity) && (!mod || g.module === mod)
      && (!q || [g.id, g.title, g.detail, g.file, g.func, g.module].join(' ').toLowerCase().includes(q)));
    const key = (g) => sortK === 'severity' ? (sevRank[g.severity] ?? 3) : String(g[sortK] ?? '');
    rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : a.module.localeCompare(b.module)) * sortDir; });
    $('#gapcount').textContent = `${rows.length} of ${allGaps.length} gaps`;
    $('#gapbody').innerHTML = rows.map((g) => `<tr><td><b>${h(g.id)}</b></td><td><a class="modlink" data-mod="${h(g.module)}">${h(byId[g.module].name)}</a></td>`
      + `<td><span class="sev ${h(g.severity)}">${h(g.severity)}</span></td><td><span class="tag">${h(g.kind)}</span></td><td><span class="tag">${h(g.action)}</span></td>`
      + `<td><b>${h(g.title)}</b><br>${h(g.detail)}</td><td><code>${h(g.file)}${g.line ? ':' + g.line : ''}</code>${g.func ? `<br><code>${h(g.func)}</code>` : ''}</td>`
      + `<td>${g.verified === false ? '<span class="muted">unverified</span>' : 'yes'}</td></tr>`).join('');
  }
  if (!D.public) $$('.filters input, .filters select').forEach((el) => el.addEventListener('input', renderGaps));
  if (!D.public) $$('table.gaps th').forEach((th) => th.addEventListener('click', () => { const k = th.dataset.k; sortDir = sortK === k ? -sortDir : 1; sortK = k; renderGaps(); }));

  // ---------- tabs & links ----------
  function show(v, doc) {
    $$('nav.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === v && (v !== 'doc' || b.dataset.doc === doc)));
    $$('.view').forEach((s) => s.classList.toggle('on', s.id === 'v-' + v));
    if (v === 'doc') $('#docmd').innerHTML = md(D.extra[doc] || '');
    if (v === 'mod' && !selected) $('#modmd').innerHTML = '<p class="muted">Select a module on the left.</p>';
    $('main .view.on')?.scrollTo?.(0, 0);
  }
  $$('nav.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.v, b.dataset.doc)));
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-mod]'); if (a) { e.preventDefault(); select(a.dataset.mod); show('mod'); return; }
    const d = e.target.closest('a[data-doc]'); if (d) { e.preventDefault(); show('doc', d.dataset.doc); return; }
    const o = e.target.closest('[data-open]'); if (o) { select(o.dataset.open); show('mod'); return; }
    const g = e.target.closest('[data-gaps]'); if (g) { show('gaps'); $('#gapmod').value = g.dataset.gaps; renderGaps(); }
  });

  renderList(); renderMap(); if (!D.public) renderGaps();
})();
</script>
</body>
</html>
