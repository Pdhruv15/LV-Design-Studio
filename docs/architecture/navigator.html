ponents/cad/CadPage.tsx:layoutCmd"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"DXF to DWG conversion of exported SLD sheets","ref":"src/engines/cad/cadEngine.ts:dxfToDwg"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"CAD fields classified in change classes and revision lists","ref":"src/model/changeClass.ts:36"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"feeders for CIRCUIT attributes and cable routes","ref":"src/components/cad/CadPage.tsx:exportAs"},{"to":"32-component-database","dir":"out","status":"working","what":"layer mapping templates kept in the library","ref":"src/model/cadLayerTemplates.ts:pushLibrary"}],"gaps":[],"md":"# 21 — Design CAD core\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nDesign CAD is the app's own 2D drafting screen for floor plans. It opens the architect's DWG or DXF plan, shows it, and lets the engineer draw and annotate on top of it. The core covers:\n\n- **Reading drawings.** A Rust engine built on the acadrust library and compiled to WebAssembly reads DWG (R13–2018) and DXF. (WebAssembly = compiled code that runs inside the app window, so no other CAD program is needed.) It flattens model space into line segments, fills, texts and snap points. Blocks, colours (ByLayer, ByBlock, index, true colour), linetypes and hatches are resolved, and external references are listed (`engines/cad-reader/src/doc.rs` `CadDoc::new`).\n- **Canvas.** The canvas draws the plan and the drawn work, and handles zoom and pan, grips and snaps (`src/components/cad/CadCanvas.tsx`).\n- **Command line.** About 150 typed commands with aliases, each linked to a tool or a page action (`src/components/cad/cadCommands.ts` `CAD_COMMANDS`).\n- **Drawing tools.** Line, polyline, rectangle, polygon, circle, arc, ellipse, revision cloud, point, text, notes (MTEXT), leader, keynote, room tag, north arrow, hatch, dimensions (aligned, linear, continue, baseline, radius, diameter, angular).\n- **Editing tools.** Move, copy, rotate, mirror, scale, stretch, trim, extend, offset, fillet, chamfer, break, join, explode, array, divide, measure, draw order, match properties, CROP (cut a block along an outline), and erase (also for the architect's objects).\n- **Blocks and attributes.** Block definitions, inserts, attribute definitions (ATTDEF), attribute edit, attribute export (ATTEXT), the Blocks palette with a library folder, and recent blocks (`src/model/cadBlocks.ts`, `src/model/cadBlockLibrary.ts`, `src/model/cadAttributes.ts`).\n- **Measuring.** Distance, area, and room area found from the walls around a clicked point (`src/model/cadMeasure.ts`, `src/model/cadBoundary.ts`).\n- **Clipboard, view history and references.** Copy and paste between drawings (`src/model/cadClipboard.ts`), ZOOM Previous (`src/components/cad/cadViewHistory.ts`), and external references: overlay or attach, clip, bind on save (`src/model/cadRefs.ts`, `src/components/cad/CadRefs.tsx`).\n\n- `Project.cadSketch` (drawn objects)\n- `cadErased` (handles of architect objects erased in the app)\n- `cadBlockDefs`\n- `cadLayerStyle` and `cadLayerFile`\n- `cadRefs`\n- `cadPlanUnits`\n- `cadTextStyles`, `cadDimStyles`, `cadPointStyle` and `cadPatterns`\n\nThese fields are defined in `src/types.ts` (:594–620). A DWG is written only when the user runs SAVE, SAVE AS or SAVEDWG, and it goes to a separate copy (`src/components/cad/CadPage.tsx` `writeCopy` :905).\n\n## 2. Files, components, functions and stores\n\n(\"Store\" = the place the app keeps the project in memory. Here that is the `project` object; each change goes through `onChange` to the app's project state, which keeps the undo history.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/components/cad/CadPage.tsx` (3556 lines) | screen | `CadPage`, `change` (:629), `run` (:2295), `act` table (:2524), `writeCopy` (:905), `removeSelected` (:881), `copyClip`/`pasteClip` (:1592/:1601), `exportAs`, CROP handler (:860) | The whole Design CAD page: command dispatch, tools, every edit, save and export. |\n| `src/components/cad/CadCanvas.tsx` | screen | `CadCanvas` (sketch drawing :462–525) | Draws the plan segments, drawn items (hatches, leaders with arrowheads, dashed cable routes), devices with their symbol shapes, wiring, grips and snaps. |\n| `src/components/cad/cadCommands.ts` | model | `CAD_COMMANDS`, `CadAction`, `cadCommand`, `toolAlias` | Command and alias table. |\n| `src/components/cad/cadState.ts` | store | `useCad`, `CadTool`, `SavedCopy`, `rememberPath`, `pathOfPlan`, `rememberedDrawing`, `markDirty` | Open drawing tabs, tool, toggles, the session-only saved-copy map, and drawing paths in local storage. |\n| `src/components/cad/cadFileMenu.ts` | screen | `cadFileMenu`, `planLevel`, `setPlanLevel` | Plans per level, Replace plan, Units menu. |\n| `src/components/cad/cadPrompt.ts`, `CadCommandLine.tsx`, `CadDynInput.tsx` | screen | prompts, command line, dynamic input | Command-line UI. |\n| `src/components/cad/CadDialogs.tsx` | screen | text, dimension and point style dialogs; DIMSTYLE import (:234, `accept=\".dxf\"` :249) | Style dialogs. |\n| `src/components/cad/CadLayerManager.tsx`, `CadProperties.tsx`, `CadQuickSelect.tsx`, `ColourPicker.tsx` | screen | layer palette, properties palette, QSELECT | Layer and object properties. |\n| `src/components/cad/CadRefs.tsx`, `refFiles.ts` | screen | `useCadRefs`, `bound` (:100), `readRefFile`, `readSheetRefs` | External references: attach, clip, bind on save; references read for sheets. |\n| `src/components/cad/BlocksPalette.tsx`, `AnnotatePanel.tsx`, `SketchEditPanel.tsx`, `CadTextEdit.tsx`, `CadNoteEdit.tsx`, `CadTabs.tsx`, `CadSaveAs.tsx`, `CadDraftSettings.tsx` | screen | panels and dialogs | Blocks palette, annotation, edit options, in-place text editing, tabs, Save As, drafting settings. |\n| `src/components/cad/cadClipboardStore.ts` | store | `putClip`, `getClip` | Clipboard copy kept in memory, plus the system clipboard. |\n| `src/components/cad/cadViewHistory.ts` | store | `rememberView`, `previousView` | ZOOM Previous history, per open drawing, in memory. |\n| `src/model/cadSketch.ts` | model | `shapesOut` (:549), `ShapeOut` (:548), `blockDefsOut`, `pointStyleOut`, `dimOf`, `snapPoints`, `itemAt`, `typedPoint`, `trayLine` | Drawn-object geometry, and conversion to what the engine writes. |\n| `src/model/cadEdit.ts` | model | `trim`, `extend`, `offset`, `fillet`, `chamfer`, `breakAt`, `join`, `explode`, `mirrored` (:270), `scaled`, `stretched`, `arrayRect`, `arrayPolar`, `gripMoved` | Edit operations on drawn objects (pure functions). |\n| `src/model/cadBlocks.ts` | model | `CadBlockDef`, `blockDefsOf`, `withBlockDef`, `expandInsert`, `explodeInsert`, `attributePlacements` | Block table per drawing file. |\n| `src/model/cadBlockLibrary.ts` | model | `defFromGeometry` (:43), `defFromPieces` (:59), `loadRecentBlocks`, `pushRecentBlock` | Blocks from a library drawing, or from an architect's block; recent blocks. |\n| `src/model/cadAttributes.ts`, `cadText.ts`, `cadMtext.ts`, `cadDims.ts`, `cadHatch.ts`, `cadAnnotate.ts`, `cadPoints.ts`, `cadStyles.ts`, `dxfDimStyles.ts` | model | `leaderItems`, `textCorners`, `toDxfMtext`, `readDxfDimStyles` (:60), `currentTextStyle` | Annotation objects and styles. |\n| `src/model/cadClipboard.ts` | model | `clipPayload` (:46), `parseClip` (:111), `itemOf` (:77), `KINDS` (:30), `pastedItems`, `withPasted` | Clipboard payload: written, then read back and checked. |\n| `src/model/cadErased.ts` | model | `erasedOf`, `withErased`, `restoredErased`, `shownView` | Architect objects erased in the app, by handle. |\n| `src/model/cadPlans.ts` | model | `replacePlan` (:38), `moveKey` (:49), `withLevelPlan` | Which drawing is each level's plan; replacing a plan with a new revision. |\n| `src/model/cadUnits.ts`, `cadMeasure.ts`, `cadBoundary.ts` | calc | `planUnits`, `planScale`, `withPlanUnit`, `drawingUnits`, `areaOf`, `roomAround` (:68) | Drawing units, distances, areas, room outline from walls. |\n| `src/model/cadLayerState.ts`, `cadLayerStyle.ts`, `cadLayerTemplates.ts`, `cadColours.ts`, `cadProps.ts`, `cadQuickSelect.ts`, `cadDrawOrder.ts`, `cadCrop.ts`, `cadView.ts`, `cadDraft.ts`, `cadExports.ts`, `cadDraw.ts` | model | layer states, styles, templates in the library, object properties, draw order, CROP, view stack, drafting settings, export lists, dash and hatch drawing | Supporting models. |\n| `src/model/cadDrawing.ts` | model | `CadItem`, `parseReaderAnswer` (:174), `planFromDrawing` (:109), `curvePoints` | Plan entities from the simpler reader (CLI and Floor plan window). |\n| `src/engines/cad/cadEngine.ts` | engine | `openDrawing` (:190), `CadView`, `drawingWithDevices` (:291), `explodeObjects` (:305), `dxfToDwg` (:317), `refGeometryOf`, `readRefGeometry` | TypeScript side of the engine: open, save, explode. |\n| `src/engines/cad/cadOps.ts`, `cadWorker.ts` | engine | `engineOps`, `answerCall` | Runs the engine in a worker thread (or in the page as a fallback). |\n| `src/engines/cad/reader.ts` | engine | `readCadDrawing`, `MAX_DRAWING_BYTES` | The simple plan reader, used by the CLI. |\n| `engines/cad-reader/src/doc.rs` | engine (Rust) | `CadDoc::new` (:603), `Builder::entity_drawn` (:299), `describe` (:514), `entity_of` (:940), `define_block` (:1027), `with_additions` (:1051), `export_dxf` (:1126), `dwg_bytes` (:1135), `explode_objects` (:1151) | View reader, picking and snapping, and the DXF/DWG writer. |\n| `engines/cad-reader/src/doc/explode.rs` | engine (Rust) | `explode` | Exact pieces of an object, for CROP and the Blocks palette. |\n| `engines/cad-reader/src/lib.rs` | engine (Rust) | `item` (:65), `read`, `read_json`, `readDrawing` | Second, simpler reader: plan entities as JSON. |\n| `electron/cadFile.cjs` | desktop | `readDrawingFile`, `readDrawingBytes`, `listDrawingFolder`, `engineBytes`, `MAX_BYTES` | Reads drawing files in the main process. |\n| `electron/main.cjs` | desktop | `files:saveBinary` (:307), `files:overwriteBinary` (:319), `chosenDrawings` | Save dialog, and Save over a copy chosen this session. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Drawing bytes (open dialog, reopen by path, sample plans) | 34-electron-desktop | `electron/cadFile.cjs` `readDrawingBytes`; `src/engines/cad/cadEngine.ts` `chooseDrawing`, `reopenDrawing`, `sampleDrawing` |\n| Project object (sketch, layers, blocks, styles, references, erased handles) and undo | 02-project-storage | `src/App.tsx:1621` `onChange={(next) => setProject(next, { step: true })}` |\n| Levels and buildings (which level each plan belongs to) | 04-building-load-assessment | `src/model/cadPlans.ts` `withLevelPlan`, `src/components/cad/cadFileMenu.ts` `planLevel` |\n| Devices placed, LV points, boards, circuit wiring, trays and cable routes | 22-cad-electrical | `src/components/cad/CadPage.tsx` `writeCopy` (uses `placed`, `wiring`) |\n| Layouts and viewports (LAYOUT, MV and MS commands on the same page) | 23-cad-sheets-plot-titleblock | `src/components/cad/CadPage.tsx` `layoutCmd` (:733) |\n| Feeders (for the CIRCUIT attribute in ATTEXT, and for cable routes) | 06-network-sld-editor | `src/components/cad/CadPage.tsx` `exportAs` → `attributeRows(..., project.feeders)` |\n| Layer mapping templates (kept in the library) | 32-component-database | `src/model/cadLayerTemplates.ts` `pushLibrary` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Closed outlines, blocks with attributes, picking, wall segments | 22-cad-electrical | `src/model/cadViewPlan.ts` (`view.outlines()`), `src/components/CadLoadsDialog.tsx` (`view.blocks()`) |\n| Drawn trays and cable routes (lengths to schedules) | 22-cad-electrical, 19-cable-tray-containment | `src/model/cadPlanSchedules.ts` (reads `cadSketch`) |\n| Drawn work, blocks and references printed on plan sheets | 23-cad-sheets-plot-titleblock | `src/docs/planLayout.ts:262` `expandAll(sketchOf(...), blockDefsOf(...))`, `src/model/drawingSet.ts:504–507` |\n| DXF → DWG conversion for exported SLD sheets | 24-drawings-sld-sheets | `src/components/SldExportDialog.tsx:55`, `src/components/docs/sheetRender.tsx:305` → `dxfToDwg` |\n| Plan read by the CLI and MCP tools | 31-headless-cli-mcp | `src/headless/cadTools.ts` `readPlan` → `readCadDrawing` (lib.rs reader) |\n| CAD fields in revision and change classes | 26-revisions-changes | `src/model/changeClass.ts:36`, `src/model/revisions.ts:151–152` |\n| Saved DWG/DXF copy, PDF/PNG of the view, WBLOCK DXF, device, cable and attribute lists (Excel/CSV) | user file system | `src/components/cad/CadPage.tsx` `writeCopy`, `exportAs` |\n\n## 5. User flow — from button click to result\n\n1. **Open.** OPEN or Plans → a level calls `cadFileMenu.openFor`, then `chooseDrawing` or `reopenDrawing` (`cadEngine.ts`). The app starts a worker (`startEngine`), and `engineOps.open` builds a `CadDoc` (Rust `CadDoc::new`): model-space entities become segments, fills, texts and a snap grid. `useCad.open` adds a tab and remembers the path in local storage (`rememberPath`).\n2. **Pick a level and units.** `setPlanLevel` → `withLevelPlan`. Units: `withPlanUnit`. Both go through `change`, so each is one undo step.\n3. **Type a command.** `CadCommandLine` sends the text to `CadPage.run` (:2295). Typed points and options for the tool in use are read first, then layout commands, DRAWORDER, CLAYER, then `cadCommand(c)`. A tool command calls `cad.setTool(tool)`. An action runs `act[action]()`.\n4. **Draw or edit.** Canvas clicks go to `CadPage.click`. Each tool builds a `SketchItem` (via `cadSketch.ts` / `cadAnnotate.ts`) or edits one (`cadEdit.ts`). Then `addSketch`, `updateSketch` or `removeSketch` → `change(next, message)` → `onChange` → `setProject(next, { step: true })`, which is one undo step (⌘Z).\n5. **Erase or crop the architect's objects.** `removeSelected` → `withErased(project, file, handles)`. CROP → `explodeObjects` (Rust `explode_objects`) → `cropPieces` → new sketch items plus the original handle erased. The view hides erased objects through `view.erase` → `shownView`.\n6. **Save.** SAVE / SAVE AS → `writeCopy`:\n   - `shapesOut(sketch)`, `blockDefsOut(defs)`, `pointStyleOut`, the wiring as polylines, the wiring tags as texts, and the bound references (`xr.bound()`) are collected;\n   - `drawingWithDevices` → the worker's `save` → Rust `export_dxf` / `export_dwg` → `with_additions`: the original bytes are read again, erased handles removed, and shapes and devices added;\n   - `saveBinaryAt` (dialog) or `files:overwriteBinary` (a copy chosen this session) writes the file.\n\n## 6. Linked to (working connections)\n\n- 22-cad-electrical receives outlines, blocks (with CROP-erased ones left out, `CadLoadsDialog.tsx:44`), wall segments and drawn trays/routes.\n- 23-cad-sheets-plot-titleblock prints the sketch with block inserts expanded and the printing references (`planLayout.ts:262`, `refFiles.ts` `readSheetRefs`).\n- 24-drawings-sld-sheets uses the same engine for DXF → DWG (`dxfToDwg`).\n- 26-revisions-changes lists every CAD field (`changeClass.ts:36`, `revisions.ts:151`).\n- Engine memory is freed per drawing: a worker per drawing (`cadOps.ts`, `useCad.close`).\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"22-cad-electrical","name":"CAD electrical (devices on plans)","full":"CAD electrical (devices on plans)","group":"CAD & drawings","summary":"The electrical layer on Design CAD floor plans: rooms from outlines, LV points and DBs placed on circuits (keeping circuit point counts in step), multi-device edits, circuit wiring, drawn cable routes and tray runs, and Update schedules that writes measured lengths into Feeder.lengthM (used by voltage drop and cable schedule).","files":[{"path n to Feeder.lengthM on Update schedules","ref":"src/model/cadPlanSchedules.ts:updateSchedules"},{"to":"19-cable-tray-containment","dir":"out","status":"working","what":"tray route lengths, fittings and feeder tray routes from plans","ref":"src/model/cadTrays.ts:applyCadTrays"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"luminaires placed on plans in BOQ group J","ref":"src/calc/bom.ts:289"},{"to":"32-component-database","dir":"in","status":"working","what":"library loads for CAD block mapping","ref":"src/model/cadLoads.ts:resolveBlock"},{"to":"03-parameters-rules","dir":"in","status":"working","what":"max lighting points / 13 A sockets per circuit","ref":"src/model/deviceEdit.ts:circuitAfter"},{"to":"29-elv","dir":"both","status":"working","what":"shared selection, move, copy, delete, replace for ELV devices","ref":"src/model/deviceEdit.ts:moveDevices"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"lighting / power / containment plan sheets from the model","ref":"src/docs/planLayout.ts:contentOf"},{"to":"23-cad-sheets-plot-titleblock","dir":"out","status":"working","what":"plan layouts shown in CAD layouts and plot","ref":"src/docs/planLayout.ts:contentOf"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"lvPoints, cadWiring, cadPlanLinks tracked as change fields","ref":"src/model/changeClass.ts:36"}],"gaps":[],"md":"# 22 — CAD electrical: devices on plans, rooms, plan links, wiring, CAD loads and lengths\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThe electrical layer on top of the Design CAD drawing (module 21-cad-core). On a level's floor plan the engineer can:\n\n1. **Say which drawing is the plan of which level** (`cadPlans.ts`) — one file per level; devices and rooms are kept per level, not per file.\n2. **Read rooms** from closed outlines on layers given the role \"Room outline\" (`cadRooms.ts`), or click/trace a room (`floorPlanActions.ts:pickedRoom`), and write them to Building information (module 04) with name, area and outline.\n3. **Place LV points** (light, 13 A socket, twin socket, ceiling fan, exhaust fan, split A/C, water heater, emergency light / exit sign / direction sign) on a chosen circuit, and **place a DB** at a point (`cadDevices.ts`). Placing a point adds 1 to that circuit's point count in the load schedule; deleting it takes 1 off.\n4. **Edit many devices at once** (`deviceEdit.ts`): align, space, array on a line, replace type, move to another circuit (with a warning against the Rules-sheet maximum points per circuit), match, copy, delete.\n5. **Wire circuits** (`cadWiring.ts`): each wired circuit's devices are joined by drawn arcs plus a home run to the DB; a wiring length is worked out.\n6. **Draw cable routes and tray runs** (drawn items in `project.cadSketch`, tools in `CadPage.tsx`) and **Update schedules** (`cadPlanSchedules.ts:updateSchedules`): tray route lengths and fittings, feeder lengths, feeder tray routes, wiring lengths go into the network model.\n7. **Loads from CAD** (`cadLoads.ts`, `CadLoadsDialog.tsx`): fixture blocks with a circuit attribute (CCT = \"DB-GF1/R3\") in the open drawing are counted per circuit and, after review, replace the circuit's point counts / load items.\n8. **Plan sheets** (`src/docs/planLayout.ts`): lighting, power, ELV and containment layouts drawn from the model at true scale (output side, shared with 23 and 24).\n\n\"Store\" in this document = the project object the app keeps in memory and saves to the project file; every CAD action returns a new project (one undo step).\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/model/cadDevices.ts` | model | `LvPoint` (:15), `LV_PALETTE` (:44), `roomAt` (:56), `finalCircuits` (:71), `circuitLabel` (:74), `cableLabel`/`cablesOf` (:80–82), `withCount` (:86), `placeLvPoint` (:94), `moveLvPoint` (:101), `removeLvPoint` (:106), `placeBoard` (:116), `placedOn` (:125), `placeItem` (:139), `moveItem`/`removeItem` (:151–154) | Placed LV points (stored in `project.lvPoints`) and board positions (`Board.planPoint`, `Board.level`, `Board.location`). Keeps the circuit's `points` count in step. |\n| `src/model/deviceEdit.ts` | model | `editsFor` (:36), `arranged` (:58), `moveDevices` (:73), `copyDevices` (:84), `deleteDevices` (:102), `replaceDevices` (:117), `toCircuit` (:137), `circuitAfter` (:152), `matchDevice` (:166), `alongLine`/`placeAlong` (:175–187), `onBoard` (:196), `renameBoard` (:200) | Multi-device edits; recounts circuits; checks `rule('maxLtgPerCircuit')`, `rule('maxS13PerCircuit')`. |\n| `src/model/cadRooms.ts` | model | `LAYER_ROLES` (:8), `guessRole` (:21), `layerMapFor`/`withLayerMap` (:35–39), `outlineArea` (:46, arcs by bulge), `flattenOutline` (:65), `roomsFromPlan` (:94), `guessRoomType` (:145), `proposeRooms` (:172), `applyRooms` (:202) | Rooms from outlines; zone detection; room keeps its ID across drawing revisions by outline handle. |\n| `src/model/cadPlans.ts` | model | `plansOf` (:15), `planOfLevel`, `levelOfPlan`, `withLevelPlan` (:32), `replacePlan` (:40), `withoutLevelPlan` | Level ↔ plan file (`project.cadPlans`); a revised plan takes over the drawn work and layer settings. |\n| `src/model/floorPlanActions.ts` | model | `planState` (:24), `withPlan`, `putRooms` (:41), `pickedRoom` (:51), `renameRoom` (:58), `planRoutes` (:66), `putLengths` (:74), `trayPlan` (:80), `putTrays` (:91), `putBoards` (:99) | Only `putRooms`, `pickedRoom`, `renameRoom` are used (by `CadPage.tsx:2137, 3550`). The rest is used only by tests. |\n| `src/model/cadWiring.ts` | model | `CadWiring` (:17), `arcPoints`/`arcLength`, `wiringOrder` (:53), `wiringLengthM` (:69), `wiringTag` (:77), `wiringLengths` (:95), `levelWiring` (:100), `wireLevel` (:125), `toggleWiring` (:132), `applyWiringLengths` (:140) | Wiring arcs and home run; length = (route + drop × devices) × (1 + allowance), rounded up. |\n| `src/model/cadLengths.ts` | model | `CAD_LENGTH_DEFAULTS` (:6), `metresPerUnit` (:11), `pullCadLengths` (:45), `applyCadLengths` (:65), `lengthBreakdown` (:74) | Feeder length = (route + vertical + terminations) × (1 + waste), rounded up to a whole metre; writes `Feeder.lengthM`. |\n| `src/model/cadPlanSchedules.ts` | model | `planDrawings` (:24), `updateSchedules` (:51), `scheduleSummary` (:119) | \"Update schedules\" (SCHED): tray lengths + fittings, feeder lengths, feeder tray routes, wiring lengths from every level's plan. |\n| `src/model/cadLoads.ts` | model | `CIRCUIT_ATTRIBUTES` (:15), `resolveBlock` (:43), `findCircuit` (:53), `pullCadLoads` (:71), `applyCadLoads` (:131) | Fixture blocks → circuit load items and point counts (review first). |\n| `src/model/cadViewPlan.ts` | model | `outlinePoints`, `objectPath`, `layerStatsOf`, `planOfView` (:43) | Turns the open Design CAD view into a `CadPlan` for the room reader. |\n| `src/model/cadTrays.ts` | model | `chain`, `traysAlong`, `pullCadTrays` (:86), `applyCadTrays` (:124) | Which tray routes a cable runs along; tray route lengths (shared with 19). |\n| `src/model/roomLights.ts`, `src/model/emergencyPlace.ts`, `src/model/luminaireSchedule.ts` | model | `placeRoomLights`, `placeEmergency…`, `luminaireSchedule` | Lighting placements that call `placeLvPoint`; luminaire schedule from placed points (module 18). |\n| `src/components/cad/CadPage.tsx` | screen | `placeItem` call (:2081), `finishCable` (:2147), `link` tool (:1861), `schedules` (:2154), `addFound` (:2130), wire tools (:1054, :1065), device edits (:1490–1523, :1811) | The Design CAD page: all electrical tools on the Plan tab. |\n| `src/components/cad/DeviceToolbar.tsx` | screen | `DeviceToolbar` | Floating toolbar for picked devices; circuit list with \"before → after points\" and ⚠ over the rule maximum. |\n| `src/components/cad/DeviceEditPanel.tsx` | screen | `SelectionPanel`, `ArlSettings`, `MatchSettings` | Side panels for several devices, Array on line, Match. |\n| `src/components/CadLoadsDialog.tsx` | screen | `CadLoadsDialog` (:13), `read` (:44), `apply` (:49) | \"Loads from CAD floor plan\" dialog (opened from `App.tsx:1794`). |\n| `src/components/CadLayerTable.tsx` | screen | `CadLayerTable` (:14) | Layer roles table and layer templates. |\n| `src/components/docs/CircuitEditDialog.tsx` | screen | `planM` (:71) | Shows the wiring length \"from plan\" in the circuit editor (module 07 screen). |\n| `src/docs/planLayout.ts` | report | `contentOf` (:117), `addContainment` (~:100), `planLevels` (:144), `planFit` (:172) | Lighting / power / ELV / containment layout sheets from the model. |\n| `src/types.ts` | model | `Project.lvPoints` (:622), `Project.cadWiring` (:624), `Project.cadPlanLinks` (:628), `Feeder.cadVerticalM` (:254), `Feeder.lengthToCheck` (:256), `CadLengthSettings.dropM` (:499) | Saved fields. |\n| `src/model/planToSld.ts` | model (05) | `planToSld` (:30) | Space plan → boards and feeders (replaces them). |\n| `src/docs/planSheet.ts` | report (05) | `buildPlanSheet` (:19), `applyPlanEdits` (:77) | Space-plan area sheet; not CAD. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Drawing geometry, layers, blocks, texts, handles, units | 21-cad-core | `src/engines/cad/cadEngine.ts` `CadView`; `cadViewPlan.ts:planOfView`; `cadDrawing.ts:planFromDrawing` |\n| Drawn cable routes and tray runs (`SketchItem.cable`, `SketchItem.tray`) | 21-cad-core | `project.cadSketch`, read by `cadPlanSchedules.ts:planDrawings` |\n| Plan units (mm / cm / m), user override per file | 21-cad-core | `src/model/cadUnits.ts:planScale`, `planUnits` |\n| Buildings, levels, rooms with outlines | 04-building-load-assessment | `calc/building.ts:buildingInfoOf`, `model/levels.ts:floorList` |\n| Boards, circuits (`Feeder`), phase/way, `points`, `loadItems` | 06-network-sld-editor, 07-load-schedule-panels | `types.ts Feeder`, `calc/loadSchedule.ts:circuitRef`, `model/schedule.ts:updateCircuit` |\n| Max points per circuit | 03-parameters-rules | `database/catalog.ts:rule('maxLtgPerCircuit' / 'maxS13PerCircuit')` via `deviceEdit.ts:circuitAfter` |\n| Library loads (block → item, watts, schedule column) | 32-component-database | `database/database.ts:findLibraryLoad`, `loadItemFromLibrary` via `cadLoads.ts:resolveBlock` |\n| Luminaire chosen by Light room (LUX) | 18-lighting-emergency | `roomLights.ts:placeRoomLights` → `placeLvPoint(…, luminaire)` |\n| Tray plan (routes, lengths) | 19-cable-tray-containment | `calc/cableTray.ts:trayPlanOf`, `routeNames`, `joinPath` |\n| ELV device placement (same coordinates) | 29-elv | `components/elv/elvCadDevices.ts` (`moveElv`, `copyElv`, `removeElvs`, `replaceElv`) |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Circuit point counts (`Feeder.points`) and re-sized MCB / cable | 07-load-schedule-panels | `cadDevices.ts:withCount` → `schedule.ts:updateCircuit` → `refresh` |\n| Circuit load items / point counts from blocks | 07-load-schedule-panels | `cadLoads.ts:applyCadLoads` → `updateCircuit` |\n| `Feeder.lengthM` (measured route or wiring length) | 08-voltage-drop, 11-breaker-cable-selection, 19-cable-tray-containment | `cadLengths.ts:applyCadLengths`, `cadWiring.ts:applyWiringLengths`; read by `calc/voltageDrop.ts:84`, `calc/electrical.ts:108` |\n| `Feeder.trayRoute`, tray route lengths and fittings | 19-cable-tray-containment, 20-equipment-boq-pricing | `cadPlanSchedules.ts:updateSchedules` → `cadTrays.ts:applyCadTrays` |\n| Board level, location (room), plan position | 06-network-sld-editor, 24-drawings-sld-sheets | `cadDevices.ts:placeBoard` (`Board.planPoint`, `level`, `location`) |\n| Rooms with name, area, outline, type | 04-building-load-assessment, 18-lighting-emergency, 29-elv | `cadRooms.ts:applyRooms`, `floorPlanActions.ts:putRooms` |\n| Luminaire schedule and BOQ group J luminaire lines | 18-lighting-emergency, 20-equipment-boq-pricing | `luminaireSchedule.ts:luminaireSchedule` (reads `lvPoints`), `calc/bom.ts:289` |\n| Plan sheets (lighting, power, containment) | 23-cad-sheets-plot-titleblock, 24-drawings-sld-sheets, 25-reports-exports | `docs/planLayout.ts:contentOf`; `model/drawingSet.ts:526–531` |\n| Device and cable lists (Excel) | 25-reports-exports | `model/cadExports.ts:deviceRows`, `cableRows` |\n| Change classes / revision labels for `lvPoints`, `cadWiring`, `cadPlanLinks` | 26-revisions-changes | `model/changeClass.ts:36`, `model/revisions.ts:152` |\n\n## 5. User flow — from button click to result\n\n**A. Place a light on a circuit**\n1. Design CAD → Plan → Devices → DEV; pick \"Light\" and a circuit from the list `circuits = finalCircuits(project)` (`CadPage.tsx:540`).\n2. Click on the plan → `placeItem` (`CadPage.tsx:2081` → `cadDevices.ts:139`) → `placeLvPoint` (:94) adds `LvPoint {id:\"P12\", feederId, x, y, level}`.\n3. `withCount` (:86) → `schedule.ts:updateCircuit` with `points.ltg + 1` → `refresh` recomputes `loadKw` from points × WATT/UNIT and re-sizes MCB and cable unless sized by hand.\n4. Status line: \"Light placed on DB-GF1/R1 · Living lighting — 7 on the circuit\".\n\n**B. Wire and measure**\n1. WC (wire circuits) → `wireLevel` (`cadWiring.ts:125`) adds a `CadWiring {feederId}` for every circuit with devices on the level; W1 toggles one (`toggleWiring`).\n2. The canvas draws `levelWiring` (:100): nearest-neighbour arcs, home run to the DB if the DB is placed on this level, tag \"DB-GF1/L3 · 2C × 1.5 mm² · 23 m\".\n3. CR (cable route) → `finishCable` (`CadPage.tsx:2147`) draws a polyline with `cable: {feederId}`; LR copies a drawing line as such a route (`CadPage.tsx:1861`).\n4. SCHED → `schedules()` (`CadPage.tsx:2154`) → `updateSchedules` (`cadPlanSchedules.ts:51`):\n   - tray lengths and fittings per tray route → `applyCadTrays`;\n   - cable route length per feeder (all plans) → `pullCadLengths` (+ vertical 6 m + terminations 3 m, + 5 op.ts:84`).\n- **19-cable-tray-containment** — tray route lengths, fittings (bends, tees, reducers) and each feeder's tray route from the plans (`updateSchedules`).\n- **04-building-load-assessment** — rooms with outlines and areas; boards' level and room (`placeBoard`).\n- **18-lighting-emergency** — Light room and Emergency place LV points through `placeLvPoint`; the luminaire schedule reads `lvPoints`.\n- **20-equipment-boq-pricing** — luminaire lines in BOQ group J (`calc/bom.ts:289`).\n- **29-elv** — ELV devices share the selection, move, copy, delete and replace tools (`deviceEdit.ts`).\n- **24-drawings-sld-sheets / 23-cad-sheets-plot-titleblock** — plan sheets from the model (`planLayout.ts:contentOf`), so a design change shows on the sheet.\n- **26-revisions-changes** — `lvPoints`, `cadWiring`, `cadPlanLinks` are tracked fields (`changeClass.ts:36`, `revisions.ts:152`).\n- **31-headless-cli-mcp** — rooms only: `headless/cadTools.ts` uses `roomsFromPlan`, `proposeRooms`, `applyRooms`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"23-cad-sheets-plot-titleblock","name":"CAD sheets, plot & title block","full":"CAD sheets, plot & title block","group":"CAD & drawings","summary":"Paper side of Design CAD: each plan sheet is a layout with viewports onto the model (scale, plan type, frozen layers, references) and placed legend/notes tables; the Sheets panel hosts every submission sheet with free markups; pen tables, page setups, named setups and batch plots keep printing black-and-white; the title block designer makes grid or imported drawn templates whose fields read project and drawing-register data.","files":[{"path":"src/model/planViewports.ts","kind":"model","symbols":["PlanViewport","VP_SCALES","vpWindow","vpToPaper","vpToModel","withViewports","patchViewport","toggleFrozen","isFrozen"]},{"path":"src/components/cad/CadLayouts.tsx","kind":"screen","symbols" rkup, plot setup and title block\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module covers the **paper side** of Design CAD and the drawing sheets:\n\n2. **Sheets panel** (Design CAD → Sheets). It lists every submission sheet (SLD, board, riser, earthing and plan sheets). It opens one sheet with its markup tools, or the drawing register when no sheet is open. The panel is a container: the sheet workspace and register screens themselves belong to module 24.\n3. **Sheet markup.** Revision clouds, boxes, lines, arrows, notes and callouts, drawn in paper mm on one sheet. They print in the PDF and are written to the DXF.\n4. **Plot setup, pens and publish.** Pen tables give each kind of line a width in mm and an ink (black or a grey %). A CTB file can be imported as a pen table. Each sheet has a page setup, and the set has a default. Named page setups can be applied to many sheets at once. Batch-plot lists can be saved.\n5. **Title block designer.** There are two kinds of template:\n   - **grid templates**: cells that can be merged, holding text with `{Parameters}`, the logo, or a revision table;\n   - **drawn templates**: a company block or a whole sheet border imported from a DWG/DXF. Its attribute tags are mapped to fields automatically (DWG_NO → `{SheetNo}`, REV → `{Rev}`, DRN → `{DrawnBy}` …).\n\n   A template can be edited in Design CAD at 1:1 mm on the TB-* layers and brought back with TBSAVE. Sheets print templates as HTML/SVG (PDF). The DXF export writes them as lines and text, or as a BLOCK with ATTDEF/ATTRIB entries.\n\n## 2. Files, components, functions and stores\n\n(\"Store\" = the place the app keeps the project in memory. Here every change goes back as a new `Project` through `onChange`. \"Paper mm\" = millimetres on the printed sheet, measured from its top-left corner, y down.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/model/planViewports.ts` | model | `PlanViewport` (:10), `VP_SCALES` (:31), `vpWindow` (:36), `vpToPaper` (:41), `vpToModel` (:46), `insideVp`, `boxFrom`, `vpId`, `vpName`, `withViewports` (:64), `patchViewport` (:72), `toggleFrozen` (:81), `isFrozen` | Viewport data (`box` mm, `at` m, `scale`, `locked`, `shows`, `frozen`, `refsOff`, `frame`) and the model↔paper conversion (paper mm = model m × 1000 / scale). |\n| `src/components/cad/CadLayouts.tsx` | screen | `layoutsOf` (:19), `newLayout` (:23), `moveLayout` (:36), `LayoutTabs` (:49), `layoutOverlay`/`Frames` (:117), `TablePanel` (:227), `ViewportPanel` (:267), `changeViewports` (:308) | Layout tabs and their right-click menu (Rename, Copy, Move, Page setup, Delete), dashed viewport frames over the page preview (drag, resize, double-click for MS), properties of viewports and placed tables. |\n| `src/components/cad/CadPage.tsx` | screen | `layoutCmd` (:735), `addLayout` (:725), `setVps`/`patchVp` (:723), `writeCopy` (:903), LayoutTabs handlers (:3348–3353), `tbSave` (:2526) | Layout commands (LAYOUT, MV, MS, PS, VPSCALE, VPLOCK, LEGEND, NOTES, PAGESETUP, PLOT, paper markup tools). It also holds CAD Save (model only) and TBSAVE. |\n| `src/components/cad/CadSheets.tsx` | screen | `CadSheets` (default) | Design CAD → Sheets: `SheetList` and `SheetWorkspace` (module 24) next to the system diagram with sheet outlines. With no sheet open it shows `DrawingsView` (the register). Dragging a panel onto another outline calls `movePanelToSheet`. |\n| `src/components/cad/CadSaveAs.tsx` | screen | `formatOptions`, `CadSaveAs`, `CloseUnsaved` | SAVEAS dialog: DWG or DXF and version, and what goes in (drawn objects, devices, wiring, bind references). It has no option for layouts. |\n| `src/components/cad/CadDraftSettings.tsx`, `CadNoteEdit.tsx` | screen | `CadDraftSettings`, `CadNoteEdit`, `fillDom`, `parasFromDom` | Drafting settings (snap, grid, object snap, units) and the in-place MTEXT editor. These are core CAD (module 21) and only listed here. They have nothing to do with sheets. |\n| `src/model/sheetTables.ts` | model | `PlacedTable`, `TABLE_WIDTHS`, `tablesOf`, `hasTable`, `tableName`, `tableId`, `withTables`, `patchTable` | Legend and notes tables placed on a layout (paper mm, drawing area). The rows themselves are built in `src/docs/planLayout.ts`. |\n| `src/model/sheetMarkup.ts` | model | `SheetMarkup` (:11), `MARKUP_COLORS` (:32), `markupSvg` (:158), `markupLayerHtml` (:166), `markupDxf` (:172), `markupFromDrag` (:215), `cloudPoints`, `dragHandle`, `moveMarkup` | Free markups in paper mm. The same geometry goes to the screen, the PDF (SVG layer) and the DXF (layers E-MARKUP, E-MARKUP-BLUE, E-MARKUP-BLACK). |\n| `src/components/sld/SheetMarkupLayer.tsx`, `markupTools.ts` | screen | `SheetMarkupLayer`, `anchorAt`, `panelsIn`, `arrowFromDrag`, `MARKUP_TOOLS`, `ANCHORED_TOOLS` | Drawing and editing markups over the page. Panel clouds and panel arrows are anchored to boards and circuits; they are saved as `DrawingSheet.clouds` and `DrawingSheet.arrows`. |\n| `src/model/plotSetup.ts` | model | `Pen`, `PenTable`, `PlotSetup`, `NamedSetup`, `BatchList`, `DEFAULT_PENS` (:36), `tablesOf`, `plotOf` (:50), `pensFor` (:52), `inkOf` (:59), `diagramPenCss` (:67), `plotStamp` (:73), `parseCtb` (:83), `tableFromCtb` (:105), `withTable`, `applySetup`, `withSetup`, `withoutSetup`, `projectForBatch` (:165) | Pen tables, page setups, named setups and batch lists. They are saved in `Project.plot` and `DrawingSheet.plot`. |\n| `src/components/docs/PlotDialogs.tsx` | screen | `PageSetupDialog`, `PenTableDialog` | Page setup (paper, plan scale, pens, lineweights, drawn work, plot stamp) and the pen table editor with CTB import. |\n| `src/components/docs/OutputDialogs.tsx` | screen | named setups, batch plot (`plotTo`) | Output → Page setups and Batch plot (uses `projectForBatch`). |\n| `src/model/titleBlock.ts` | model | `TitleTemplate` (:43), `TbCell`, `DrawnShape`, `DrawnText`, `Border`, `PAPER_MM`, `borderOf` (:74), `detectArea` (:82), `revRowValues` (:119), `standardTemplate` (:132), `templateOf` (:167), `titleBlockHtml` (:179), `drawnTitleBlockHtml` (:216), grid helpers `mergeRight`/`mergeDown`/`split`/`addRow`/`addCol`/`removeRow`/`removeCol`, `loadTemplateLibrary`/`saveTemplateLibrary` | The template model and its HTML/SVG printing. Templates are chosen per kind of sheet and per paper (whole border). The library is kept on this computer (localStorage). |\n| `src/model/params.ts` | model | `paramList` (:27), `fillParams` (:90) | The `{Name}` values a title block prints (the project's data). This file belongs to module 03 and is used here. |\n| `src/model/titleBlockImport.ts` | model | `guessField` (:36), `drawnFromDrawing` (:57), `drawnFromPieces` (:71), `fitTexts` (:119), `SHEET_FIELDS` (:138), `REV_ROW_FIELD_LIST` (:140), `mapText` | Imports a DWG/DXF (the whole drawing or one exploded block) as a drawn template and guesses fields from tag names. |\n| `src/model/titleBlockCad.ts` | model | `TB_LAYERS`, `TB_FRAME`, `TB_FIELDS`, `tbDrawingDxf` (:29), `gridToDrawn` (:44), `tbSketchItems` (:71), `openTitleBlockInCad` (:105), `drawnFromSketch` (:127), `saveTitleBlockFromCad` (:188) | Edit in CAD: the template becomes the app's drawn objects in the file \"Title block \u003cid>.dxf\", and TBSAVE turns them back into the template. |\n| `src/components/docs/TitleBlockDesigner.tsx` | screen | `TitleBlockDesigner` (default), `DrawnEditor` (:201) | The designer screen: grid editor, drawn-template field mapping, border drawing area, logo area, library, JSON import/export, DWG/DXF import, Edit in CAD. |\n| `src/docs/titleBlockDxf.ts` | report | `drawnTitleBlockDxf` (:14), `templateTitleBlockDxf` (:58) | Writes a template to the sheet DXF. A drawn template becomes a BLOCK with ATTDEFs plus an INSERT with ATTRIBs; a grid template becomes lines and text. |\n| `src/docs/sldSheet.ts` (module 24, used here) | report | `titleBlockOf` (:41), `sheetTitleBlock` (:63), `titleBlockFragment` (:152), `buildSldSheetHtml`, `sheetBody` (:370), `pageTitleBlock` (:390) | Prints the title block on the sheet PDF and on report pages. |\n| `src/docs/sheetDxf.ts` (module 24, used here) | report | `sheetPages`, `buildSheetDxfPages` (:330) | The sheet DXF, including the title block, markups and placed tables. |\n| `src/docs/planLayout.ts` (module 22/24, used here) | report | `layoutViewports` (:508), `layoutPaper` (:519), `viewportDrawing` (:530), `drawingAreaMm` (:64), `planScale` (:60) | Draws a plan sheet through its viewports, with pens applied. |\n| `src/types.ts` | model | `Project.plot` (:612), `Project.titleTemplates` (:645), `DrawingInfo.titleTemplateId`/`titleTemplateByKind`/`borderByPaper` (:1028–1030) | Where the module's data is saved in the project file. |\n| `src/model/drawingSet.ts` | model | `DrawingSheet.viewports`/`tables`/`plot`/`markups` (:60–63), `sheetHash` (:551), `planValues` (:499) | Sheet data and the \"changed since issue\" fingerprint (it includes viewports, tables and markups). |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Plan sheets (layouts), sheet number, title, status, rev, people, scale, size, issue history | 24-drawings-sld-sheets | `src/model/drawingSet.ts` `DrawingSheet`, `renumber`, issue at :439; `src/components/docs/sheetRender.tsx:sheetInfo` |\n| Project name, owner, plot, area, consultant, contractor | 02-project-storage | `Project.name`, `Project.info` via `src/model/params.ts:paramList` |\n| People, submission date, authority ref, custom parameters | 03-parameters-rules | `Project.params` via `paramList` (`PEOPLE`) |\n| Current revision (id, date, description, by) | 26-revisions-changes | `src/model/revisions.ts:currentRevision`; `Project.revisions` in `sldSheet.ts:titleBlockOf` |\n| Voltage, frequency, TCL, max demand, transformer kVA (title block fields) | 06-network-sld-editor | `paramList` → `systemSummary` |\n| DWG/DXF geometry for a title block import | 21-cad-core | `src/engines/cad/cadEngine.ts:chooseDrawing`, `explodeObjects` |\n| Company logo | 03-parameters-rules (preferences / profile) | `src/model/profile.ts:readLogo` → `Project.drawing.logo` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Viewports and placed tables → the printed plan sheet (PDF) | 24-drawings-sld-sheets | `src/docs/planLayout.ts:viewportDrawing`, `layoutViewports` |\n| Title block HTML/SVG on sheets and report pages | 24-drawings-sld-sheets, 25-reports-exports | `src/docs/sldSheet.ts:titleBlockFragment`, `pageTitleBlock` |\n| Title block in DXF/DWG of sheets | 24-drawings-sld-sheets | `src/docs/sheetDxf.ts:sheetPages` → `templateTitleBlockDxf` / `drawnTitleBlockDxf` |\n| Pens, lineweights and plot stamp → sheet PDF | 24-drawings-sld-sheets | `src/components/docs/sheetRender.tsx:fullSheetInfo` (:236–249), `src/docs/planLayout.ts` (:367–433) |\n| Batch plot / print | 34-electron-desktop | `OutputDialogs.tsx:plotTo` → `electron/pdfRender.cjs` (`color: false`) |\n| Markups → PDF and DXF | 24-drawings-sld-sheets | `src/docs/sldSheet.ts` (:326 `markupLayerHtml`), `src/docs/sheetDxf.ts` (`markupDxf`) |\n| Viewports, tables and markups → \"changed since issue\" fingerprint | 26-revisions-changes | `src/model/drawingSet.ts:sheetHash` (:560), `planValues` (:510) |\n| Issue package and set PDF (same drawings) | 25-reports-exports | `sheetRender.tsx:drawingSetPdfParts` |\n| CAD Save (DWG/DXF) — model only | 21-cad-core | `CadPage.tsx:writeCopy` → `drawingWithDevices` |\n\n## 5. User flow — from button click to result\n\n**A. Make a layout and set its viewports**\n1. In Design CAD, with a level chosen, click **+** under the drawing (or type `LAYOUT P`). `LayoutTabs` → `addLayout` → `newLayout` adds a plan sheet after the set's other sheets of that type and calls `renumber`.\n2. Click the tab. `CadPage` shows the sheet page with `layoutOverlay` → `Frames`. With no viewports saved, `layoutViewports` works one out from the level (`planLayout.ts:508`).\n3. Type `MV` and click two corners. `Frames.onPointerDown` → `boxFrom` → `onNew` → `changeViewports` → `withViewports`. The worked-out viewport becomes the sheet's own on the first change.\n4. Pick a frame and use the **ViewportPanel**: scale (`VP_SCALES`), lock, plan type shown, references, frame prints, layers (`toggleFrozen`). Each change goes through `patchViewport` and is saved in `DrawingSheet.viewports`.\n5. Double-click inside a viewport for MS (work in the model through it); `PS` or a double-click outside returns to the paper.\n6. `LEGEND` / `NOTES` then a click places a `PlacedTable` (`withTables`). The `TablePanel` sets width, text height, columns, title and rows.\n\n**B. Page setup, pens and plot**\n1. Right-click the tab → **Page setup…** (or `PAGESETUP`). `PageSetupDialog` sets paper, scale (plan sheets), pen table, lineweights, drawn work and stamp.\n2. **Save for this sheet** writes `DrawingSheet.plot`. **Save as the set's default** writes `Project.plot.defaults` (`withDefaults`).\n3. Pen tables: `PenTableDialog` edits widths and inks. **Import CTB…** → `parseCtb` → `tableFromCtb` → `withTable`.\n4. `PLOT` / Export → PDF of this layout → `onPlot`. The sheet is built by `sheetHtml` → `fullSheetInfo` (pens, stamp) → `buildSldSheetHtml`, then printed. A batch plot uses `projectForBatch` then `plotTo`.\n\n**C. Title block**\n1. Project → Title block opens `TitleBlockDesigner`. Choose **Start from the standard block** (`standardTemplate`), **Import DWG / DXF…** (`chooseDrawing` → `drawnFromDrawing` or `explodeObjects` → `drawnFromPieces`, with fields guessed by `guessField`), or the library.\n2. Grid: click a cell and edit its text with `{Parameters}`, then merge or split. Drawn: map each text to a field (`mapText`). A paper-sized block can be ticked as a whole border and its drawing area found with `detectArea`.\n3. **Use on the SLD** sets `drawing.titleTemplateId`. Per-kind and per-paper choices (`titleTemplateByKind`, `borderByPaper`) are made in the register (module 24).\n4. **Edit in CAD** → `openTitleBlockInCad` (a grid template gets a drawn copy first) → draw on the TB-* layers → **TBSAVE** → `saveTitleBlockFromCad` → `drawnFromSketch`.\n5. On every sheet: `sheetBody` picks the border or template, and `titleBlockFragment` / `drawnTitleBlockHtml` fill fields from `paramList` plus the sheet's `extra` values (register number, title, rev, people, revision rows).\n\n**D. Markup**\n1. Open a sheet in Design CAD → Sheets and pick a tool (`MARKUP_TOOLS`). `SheetMarkupLayer` → `markupFromDrag` → `onChange` saves `DrawingSheet.markups`.\n2. The PDF prints them with `markupLayerHtml`; the DXF writes them with `markupDxf`.\n\n## 6. Linked to (working connections)\n\n- **03-parameters-rules / 02-project-storage**: `{Project}`, `{Owner}`, `{DesignedBy}`, `{SubmissionDate}`, `{AuthorityRef}` and custom parameters, through `paramList`.\n- **26-revisions-changes**: `{Rev}`, `{RevDate}` and revision rows `{Rev1}…` from issues or project revisions (`revRowValues`). The viewports, tables and markups of a plan sheet count in `sheetHash`, so \"changed since issue\" sees them.\n- **21-cad-core**: title block import uses the CAD engine (`chooseDrawing`, `explodeObjects`), and Edit in CAD uses the CAD drawn objects and layer styles.\n- **34-electron-desktop**: printing forces monochrome (`electron/pdfRender.cjs:65`).\n- **25-reports-exports**: the SLD pages of the study reports use the same title block (`pageTitleBlock`, template kind `report`).\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"24-drawings-sld-sheets","name":"Drawings, SLD sheets & register","full":"Drawings, SLD sheets & register","group":"CAD & drawings","summary":"Keeps the project's drawing set (SLD, DB, riser, earthing, plan and legend sheets) with numbering, revisions, issues and readiness checks, and exports it as PDF  part of the SLD (the panels ticked for the sheet; a feeder to a panel drawn elsewhere becomes \"To X — sheet N\");\n  - `board` — one DB's circuit diagram (optionally with its load schedule under it);\n  - `riser` — a building riser in one of three styles: busbar trunking / cable chain (blank `riserStyle`), individual feeders (`feeders`), or boards counted by level over several sheets (`byLevel`, the \"DB riser\");\n  - `earthing`, `earthRiser`, `earthFloor` — earthing drawings (drawn by module 09);\n  - `plan` — lighting / power / ELV / containment plan sheets (drawn by module 23);\n  - `legend` — the set's legend, abbreviations and general notes on one sheet.\n- **Sheet creation**: automatic sets (`autoSheets` — one per MDB, or overview + one per SMDB; `sheetsByCount` — at most n panels per sheet keeping branches together), or sheets added by hand.\n- **Numbering** (`renumber`): own sequences per type — `E-SLD-`, `E-RSR-` (risers), `E-ERT-` (earthing), `E-LTG-/E-PWR-/E-ELV-/E-CNT-` (plans); prefix, start, digits, suffix are set per set.\n- **Revision control**: `issueSheets` records an issue (transmittal T-001 …), moves each sheet to its next revision (`nextRev`: A→B, P1→P2), stores a fingerprint (`issuedHash`, from `sheetHash`) so a later change can be flagged (\"changed since it was issued\").\n- **Output** (`src/components/docs/sheetRender.tsx`): every sheet is drawn off-screen from the **current** design (`evaluateProject`, not the stored calculation run), framed with the title block (`buildSldSheetHtml`), then saved as one PDF, PDF per sheet, DXF per sheet (R12, `buildSheetDxfPages`), DWG (DXF converted by the CAD engine), a ZIP of everything, or sent to a printer.\n- **Drawing register**: built from the actual sheets of the set (`registerRows(set, …)`), as PDF (`registerHtml`), as the first page of the set PDF, or as Excel (`buildRegisterWorkbook`), with the issue history.\n- **Riser views** (`RiserView`): working views of the three riser styles with \"Add to sheet\".\n- **Busbar riser form** (`buildRiserForm`, `RiserFormView`): the DEWA \"Bus bar riser — details of connected load / max. demand\" table.\n- **Other drawing exports kept outside the set**: the \"Export SLD drawing\" dialog (`SldExportDialog`, the SLD as on screen, own title block in `Project.drawing`) and the board-wise sheets of Design ▸ Board (`boardSheetPages`, numbered `E-DB-` on the fly).\n\nTerms used below: *store* = the project object kept in memory and saved to the `.lvds` file; *fingerprint / hash* = a short code computed from what a sheet draws, used to detect change; *SVG* = the vector picture format the diagrams are drawn in; *DXF R12* = the plain CAD exchange format written by `src/docs/dxf.ts`.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/model/drawingSet.ts` | model | `DrawingSheet`, `DrawingSet`, `setOf`, `renumber` (:138), `drawable`, `addBoardSheets`, `addLegendSheet`, `addEarthingSheet`, `addRiserSheet` (:203), `addDbRiserSheets` (:208), `addEarthRiserSheet`, `earthSheetGaps`, `autoSheets` (:275), `sheetsByCount` (:300), `sheetOfBoard`, `sheetRefs`, `fromSheetLabels`, `sheetProject` (:356), `scaleOn`, `autoSize`, `nextRev`, `sheetRev`, `issueSheets` (:430), `moveSheet`, `filterSheets`, `statusColor`, `SHEET_HASH_V`, `shownValues` (:535), `sheetHash` (:551), `sheetChecks` (:571), `publishState` (:181), sheet templates (`loadSheetTemplates`, `applyTemplate`), `addSheet`, `movePanelToSheet` | The whole sheet-set data model and its rules (numbering, issue, fingerprints, checks, paper choice). |\n| `src/model/dbRiser.ts` | model | `dbRiserLayout` (:78), `dbRiserOffered` (:72), `dbRiserSummary` (:329), `dbRiserTitles` (:359), `refLines`, `rowsTotal`, `cablesAtGap` | \"Boards by level\" riser: floors as rows, typical floors on one row, board counts per kind, pages and sheet breaks. |\n| `src/model/riserMockup.ts` | model | `addG10RiserMockup` (:22) dsWithoutLevel` (used by `riserLayout`, `dbRiserLayout`) |\n| Busbar risers and busway rating | 14-busbar | `Project.busRisers`, `src/calc/busbar.ts:sizeRiser` (used by `riserLayout`, `feederRiserLayout`, `buildRiserForm`) |\n| Earthing drawings | 09-earthing | `src/diagram/earthingDrawing.ts:earthingDrawing`, `src/diagram/earthRiserDrawing.ts`, `src/model/earthRiser.ts:earthSheetTitles` |\n| Plan sheets, title-block templates, pens / plot stamp, markups | 23-cad-sheets-plot-titleblock | `src/docs/planLayout.ts:planDrawing`, `src/model/titleBlock.ts:borderOf`, `src/model/plotSetup.ts:pensFor, plotOf, diagramPenCss`, `src/model/sheetMarkup.ts` |\n| Load schedule table on board sheets; connected kW per phase and panel DF for the riser form | 07-load-schedule-panels | `src/docs/loadScheduleDoc.ts:scheduleTable`; `src/docs/mdSheet.ts:connectedPhaseKw, panelDf` |\n| Project revision, changed items for clouds | 26-revisions-changes | `src/model/revisions.ts:currentRevision`; `src/model/sheetChanges.ts:sheetItems` |\n| Cable type (fire rated), cable reference numbers | 19-cable-tray-containment | `src/model/cableTypes.ts:cableTypeOf`; `src/model/cableRefs.ts:cableRefsUsed` |\n| PDF rendering, printing | 34-electron-desktop | `electron/pdfRender.cjs:htmlToPdf, htmlToPrinter` via `src/util/files.ts:savePdf, renderPdf` |\n| DXF → DWG conversion | 21-cad-core | `src/engines/cad/cadEngine.ts:dxfToDwg` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| `Project.drawingSet` saved in the project file | 02-project-storage | `src/types.ts` (Project.drawingSet); `src/model/integrity.ts:removeDanglingReferences`; `src/model/projectMigrate.ts` |\n| Sheet set PDF parts for the issue package / study reports | 25-reports-exports | `src/components/docs/StudyReportsView.tsx:219` → `drawingSetPdfParts` |\n| Drawing register entry in the Export centre | 25-reports-exports | `src/components/docs/exportCatalogue.ts:154` → `registerHtml, registerRows` |\n| Transmittals (issues) → submissions | 27-review-submissions-authority | `src/model/submissions.ts:submissionForIssue`, `src/docs/submissionReport.ts:buildTransmittalHtml` |\n| Sheet readiness to-do items | 28-dashboard-readiness | `src/calc/dashboard.ts:216` → `sheetChecks` |\n| Sheet DXF from the CLI | 31-headless-cli-mcp | `src/headless/rendererExport.ts:runJob` → `dxfFiles`; `src/headless/exportTools.ts:sheetsDxf` |\n| Ribbon \"Publish / Rev X…\" state | 01-app-shell | `src/App.tsx:230` → `publishState` |\n| Riser sheet added by the busbar study mock-up | 14-busbar | `src/components/studies/BusbarStudy.tsx:addG10Mockup` → `addG10RiserMockup` |\n| Design CAD sheet list, layouts and panel drag between sheets | 23-cad-sheets-plot-titleblock | `src/components/cad/CadSheets.tsx` → `movePanelToSheet`; `SheetWorkspace` |\n\n## 5. User flow — from button click to result\n\n1. Reports → Drawings opens `DrawingsView`; `setOf(project)` gives the set (empty: prefix `E-SLD-`, register on).\n2. With no sheets, the screen previews three automatic sets (`sheetsByCount`, `autoSheets('perMdb')`, `autoSheets('perSmdb')`, plus `withEarthing`). \"Create sheets\" calls `replaceSet` → `onChange({...project, drawingSet})`.\n3. Risers are added from Design ▸ SLD ▸ Riser (`RiserView.addSheet` → `addRiserSheet` / `addDbRiserSheets`) or the Drawings \"Add riser\" select; earthing sheets from the earthing screen (`App.openEarthSheet` → `earthSheetFor`).\n4. Editing a sheet (title, size, status, values printed, notes, clouds, callouts, markups) happens in `DrawingsView` side panel or Design CAD → Sheets (`SheetWorkspace`). The live page is redrawn when `key` (`sheetHash` + a few fields, SheetWorkspace.tsx:249) changes, debounced 350 ms, via `sheetHtml`.\n5. Preview: `preview1` → `sheetHtml` → `renderSheet` (draws `SystemDiagram` / `SingleLineDiagram` / riser / earthing / plan off-screen) → `printableSvg` → `buildSldSheetHtml`.\n6. Issue: Issues tab or Publish → `issueSheets(set, ids, …, sheetHash, sheetItems)` stores rev, date, status, history, `issuedHash`, `issuedItems` and a transmittal.\n7. Export: \"Export set (one PDF)\" → `exportDrawingSet` → `renderDrawingSetPdf` → `drawingSetPdfParts` (register first when on) → `mergePdfs`. \"DXF per sheet\" → `exportSheetsDxf` → `prepareSheets` → `dxfOf` → `buildSheetDxfPages` → `svgToDxf` + `toDxf`. \"Everything as ZIP\" → `exportEverythingZip`. Register → `registerHtml` / `buildRegisterWorkbook`.\n8. Before publishing, `PublishDialog` lists `sheetChecks` (also shown on the dashboard).\n\n## 6. Linked to (working connections)\n\n- **02-project-storage**: deleted panels are removed from sheets, clouds and callouts (`integrity.ts:removeDanglingReferences`); renamed panels are renamed in `sheet.boards` (`renamePanels.ts`, `BOARD_LIST_KEYS = ['boards']`).\n- **14-busbar**: busbar risers drawn with their sized rating (`riserLayout` → `sizeRiser`); `p.busRisers` is part of the riser sheet fingerprint.\n- **09-earthing**: earthing and earth riser sheets, with a count check (`earthSheetGaps`).\n- **26-revisions-changes**: revision letters, history, \"Cloud the changes\" from `issuedItems` (`CloudChanges`).\n- **27-review-submissions-authority**: each issue becomes a transmittal (`submissionForIssue`).\n- **28-dashboard-readiness**: `sheetChecks` feed the to-do list.\n- **31-headless-cli-mcp**: `export_dxf drawing=sld` uses the same `dxfFiles` path in a hidden renderer.\n- **23-cad-sheets-plot-titleblock**: title-block templates, pens, plot stamp (PDF), plan sheets and markups share the same sheet objects.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"25-reports-exports","name":"Reports & exports","full":"Reports & exports","group":"Documents & workflow","summary":"Builds the calculation report, the scoped study reports (PDF, Word, Excel) with design basis, compliance and appendices, the f ReportData"},{"to":"08-voltage-drop","dir":"in","status":"working","what":"lf section and standalone VD report","ref":"src/components/docs/exportCatalogue.ts:CATALOGUE"},{"to":"11-breaker-cable-selection","dir":"in","status":"working","what":"cable section, cable-data source, fire-rated warnings","ref":"src/docs/studyReport.ts:baseSection"},{"to":"13-power-factor-correction","dir":"in","status":"working","what":"PFC plan section and compliance rows; network plan not a standalone export-centre entry","ref":"src/docs/studyReport.ts:pfcSection"},{"to":"16-load-flow-engines","dir":"in","status":"working","what":"unbalanced load flow in phase section","ref":"src/docs/studyReport.ts:baseSection"},{"to":"07-load-schedule-panels","dir":"in","status":"working","what":"phase balance, panel schedules in issue package, load schedules in export centre","ref":"src/components/docs/StudyReportsView.tsx:exportPack"},{"to":"04-building-load-assessment","dir":"in","status":"working","what":"load assessment in design basis when inReport; building summary","ref":"src/docs/designBasis.ts:buildDesignBasis"},{"to":"03-parameters-rules","dir":"in","status":"working","what":"study settings and design criteria with app-default flags","ref":"src/docs/designBasis.ts:buildDesignBasis"},{"to":"05-space-planning","dir":"in","status":"working","what":"DM-D-013 substation form in export centre","ref":"src/components/docs/exportCatalogue.ts:CATALOGUE"},{"to":"19-cable-tray-containment","dir":"in","status":"working","what":"cable schedule, tray schedule, containment PDFs","ref":"src/components/docs/exportCatalogue.ts:CATALOGUE"},{"to":"20-equipment-boq-pricing","dir":"in","status":"working","what":"BOQ and BOQ summary PDFs","ref":"src/components/docs/exportCatalogue.ts:CATALOGUE"},{"to":"26-revisions-changes","dir":"in","status":"working","what":"current revision on cover, stamps, variation register","ref":"src/docs/report.ts:reportHead"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"project summary in issue package and export centre","ref":"src/components/docs/StudyReportsView.tsx:exportPack"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"CLI/MCP reuses the export catalogue","ref":"src/headless/exportTools.ts"},{"to":"34-electron-desktop","dir":"out","status":"working","what":"HTML to PDF in sandboxed hidden window","ref":"electron/pdfRender.cjs:htmlToPdf"},{"to":"01-app-shell","dir":"out","status":"working","what":"anonymised sample calculation report","ref":"src/components/AnonymizedSampleDialog.tsx"}],"gaps":[],"md":"# 25 — Reports and exports\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module turns calculation results into documents for submission. It has five main outputs:\n\n1. **Calculation report** (`src/docs/calcReport.ts`, screen `ReportView` in `src/components/docs/Documents.tsx`). One compact A4-landscape PDF of the whole installation. Page 1 has a results summary, a \"Needs attention\" list and the design basis. Nine calculation sections follow, then assumptions and the calculation record.\n2. **Study reports** (`src/docs/studyReport.ts`, `calcSections.ts`, `designBasis.ts`, `compliance.ts`, `appendices.ts`, `reportFrame.ts`; screen `StudyReportsView`). This is a submission report: you choose a scope (the whole installation, or chosen boards and what they feed) and up to 12 studies. It has a cover, document control, a calculation record, a contents page, the design basis, the study sections, results and compliance, and appendices (detail tables, A3 SLD sheets, references). It exports as PDF, Word (.docx) or Excel (.xlsx). A ready-made **report type** (`reportTypes.ts`) presets which studies are ticked.\n3. **Issue package** (`issuePackage.ts`, `mergePdf.ts`, `exportPack` in `StudyReportsView`). One merged PDF built from **one frozen calculation run**. It contains a cover (with a snapshot ID, the contents, unresolved checks and assumptions), the project summary, the study report with SLDs, the drawing set and the panel schedules. Every page is stamped with the snapshot ID.\n4. **Export centre** (`ExportCentre.tsx`, `exportCatalogue.ts`). A tick-list of 20 PDF documents in 7 groups, exported as a zip or as one bookmarked PDF. The headless CLI/MCP uses the same catalogue (`src/headless/exportTools.ts`, `rendererExport.ts`).\n5. **PDF / Word / Excel engines.** These are `printStyles.ts`, `printDoc.ts` and `report.ts` (the shared black-and-white print look), `outline.ts` (PDF bookmarks), `pdfTools.ts` (page stamps, running header and footer, bookmarks), `mergePdf.ts`, `electron/pdfRender.cjs` (HTML → PDF with Chromium in a locked-down hidden window), `studyWord.ts` (docx), `studyWorkbook.ts`, `formWorkbook.ts` (authority MD/TCL forms) and `xlsxTemplate.ts` (fills a user's Excel load-schedule template).\n\n### Study coverage — where each study appears\n\n| Study (module) | Calculation report `CALC_REPORT_STUDIES` (`calcReport.ts:26`) | Study reports `STUDIES` (`studyReport.ts:59`) | Export centre `CATALOGUE` (`exportCatalogue.ts:81`) | Own-page export |\n|---|---|---|---|---|\n| Load assessment, network (board demand) — `load` (04/06) | Y | Y | via calc / study report | – |\n| Building load assessment (04) | – | Design-basis sub-section, only when `loadAssessment.inReport` (`designBasis.ts:205`) | `building-summary` (building summary, not the assessment). The concept report is **not** in the catalogue (`App.tsx:1309` only) | Building summary PDF/Excel (`BuildingView.tsx:48`) |\n| LV distribution — `dist` (06) | – | Y | via study report | – |\n| Voltage drop / load flow — `lf` (08) | Y | Y | `voltage-drop` (separate VD report) + via reports | VD PDF + CSV (`VoltageDropStudy.tsx:100`) |\n| Short circuit — `sc` (06) | Y | Y | via reports | – |\n| Earth fault loop (EFLI) — `earth` (09) | Y | Y | via reports | none (`EarthingStudy.tsx` has no export) |\n| Earth electrode / earthing system design (09) | – | – | – | – |\n| Protection coordination / discrimination — `disc` (10) | Y (selectivity table only) | Y (table only) | via reports | none; **no TCC chart in any report** (`CoordinationStudy.tsx`) |\n| Breaker and cable selection — `cable` (11) | Y | Y | via reports; `cable-schedule` | none (`SelectionStudy.tsx`) |\n| Transformer and generator sizing — `sizing` (12) | Y | Y | via reports; the TCL summary sheet sits inside `md-forms` | PDF/Excel sheet (`SizingStudy.tsx:66`) |\n| Power factor correction, network plan — `pfc` (13) | Y | Y | only `pfc-calc` (the standalone PFC calculator, not the network plan) | PDF/Excel sheet (`PfcStudy.tsx:63`) |\n| Busbar risers — `busbar` (14) | – | Y | via study report; riser VD inside `voltage-drop` | PDF/Excel sheet (`BusbarStudy.tsx:78`) |\n| Phase balance / unbalanced flow — `phase` (07/16) | – | Y | via study report | – |\n| UPS and battery (15) | – | Equipment-summary row + design-basis text, only with \"Results and compliance\" on (`compliance.ts:48`, `designBasis.ts:162`) | `ups` | PDF (`UpsStudy.tsx:45`) |\n| Solar PV (15) | – | One pointer line in the design basis (`designBasis.ts:166`) | `solar` | PDF (`SolarStudy.tsx:51`) |\n| Enclosure / Form 4 (17) | – | – | – | Own HTML inside the screen (`EnclosureSizing.tsx:150`, `Form4Sizing.tsx:61`) |\n| Space planning / DM substation (05) | – | – | `dm-form` (DM-D-013) | DM form PDF (`SubstationAreaView.tsx:46`) |\n| ELV (29) | – | – | – | PDF/Excel/DXF on the ELV schedules page (`ElvSchedules.tsx:35-86`) |\n| Containment / cable tray (19) | – | – | `containment`, `tray-schedule` | own pages |\n| Cable schedule — `schedules` (19) | Y | Y | `cable-schedule` | Documents → Cable schedule |\n\n## 2. Files, components, functions and stores\n\n(The \"store\" is where the app keeps the project in memory. Here it is the `project` object passed down from `App.tsx`. The setup of the study reports is saved in the project as `project.studyReport` and `project.studyReportPresets`.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/docs/calcReport.ts` | report | `CALC_REPORT_STUDIES` (:26), `calcReportData` (:33), `calcReportSections`, `buildReportHtml` (:67) | Standalone calculation report. It **re-runs** `evaluateProject` / `evaluateEarthingAll` / `evaluateSelectivity` itself and lays out the study sections. |\n| `src/docs/studyReport.ts` | report | `STUDIES` (:59), `setupOf`, `scopeOf` (:105), `drawingProject`, `buildSection` (:173), `baseSection` (:179), `pfcSection` (:466), `planReport` (:547), `buildStudyReportHtml` (:566), `sldStudies`, `tableHtml`, `cellHtml` | Section builders for the 12 study kinds, report scope, and the full design-report HTML. |\n| `src/docs/calcSections.ts` | report | `structureSection`, `loadSection`, `distributionSection`, `cableStatus` | Adds the standard Input → Criteria → Method → Result → Selection → Verification layout. Moves long tables to the appendices. |\n| `src/docs/calcRecord.ts` | report | `buildCalcRecord`, `calcRecordHtml` | \"Calculation record\": what was calculated, when, from what data, and the validation status (PRELIMINARY / CALCULATED — FOR ENGINEERING REVIEW). |\n| `src/docs/compliance.ts` | report | `buildResults` (:34), `resultsSections` (:162), `barChart` (:132) | Equipment, load and cable summaries, the master compliance table and grey/black bar charts. |\n| `src/docs/appendices.ts` | report | `planAppendices` (:40), `equipmentData` (:65), `APPENDIX_TITLE` | Appendix lettering A, B, C…: load, cable, fault, equipment, SLD and reference documents. |\n| `src/docs/reportFrame.ts` | report | `reportDoc`, `coverPageHtml`, `documentControlHtml`, `tocHtml`, `numberSections`, `numberSubsections`, `pageFrame`, `missingFields`, `ISSUE_STATUSES` | Cover, document control, contents, numbering, and the running header/footer data. |\n| `src/docs/reportTypes.ts` | model | `REPORT_TYPES`, `applyReportType`, `matchingType` | Six preset report types: full, calc, load, cable, sc, authority (\" c/calc/existing.ts:existingChecks` |\n| PFC plan | 13-power-factor-correction | `src/calc/pfc.ts:planPfc`, `pfcPlanOf` |\n| Busbar risers | 14-busbar | `src/calc/busbar.ts:sizeRiser`, `riserVd` |\n| UPS / PV | 15-ups-solar | `src/calc/ups.ts:sizeUps`, `src/calc/solar.ts:sizePv` |\n| Phase balance, unbalanced flow | 07-load-schedule-panels / 16-load-flow-engines | `src/calc/phaseBalance.ts:phaseBalance`, `src/calc/unbalancedFlow.ts:unbalancedFlow` |\n| Board summaries (demand, fault, loading) | 06 | `src/calc/summary.ts:boardSummary`, `systemSummary`, `boardsInSupplyOrder` |\n| Motor-start VD | 08-voltage-drop | `src/calc/voltageDrop.ts:vdRow`, `motorStartVdLimit` |\n| Building load assessment | 04-building-load-assessment | `src/calc/loadAssessment.ts:assess` → `designBasis.ts:loadAssessmentBasis` |\n| Study settings (growth, loading, PF target) | 03-parameters-rules | `src/calc/sizing.ts:settingsOf`, `STUDY_DEFAULTS` |\n| Design reference / authority source | 27-review-submissions-authority | `src/model/designReference.ts:referenceSourceOf`; `project.receivedDocs` |\n| Revisions | 26-revisions-changes | `src/model/revisions.ts:currentRevision`, `revisionStamp` |\n| Cable data source, fire rating | 11-breaker-cable-selection / 32-component-database | `src/calc/cableTable.ts:cableDataStatus`, `cableDataNotice`; `src/model/cableTypes.ts:cableTypeOf`, `fireRatingIssues` |\n| Cable schedule | 19-cable-tray-containment | `src/docs/schedules.ts:cableSchedule` |\n| SLD drawing (SVG) | 06 / 24-drawings-sld-sheets | `SystemDiagram` + `src/diagram/exportSvg.ts:printableSvg`; title block `src/docs/sldSheet.ts:pageTitleBlock` |\n| Input validation, references | 02-project-storage | `src/model/projectValidate.ts:projectInputIssues`, `src/model/integrity.ts:checkReferences` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Export catalogue (all PDFs) | 31-headless-cli-mcp | `src/headless/exportTools.ts` (`CATALOGUE`, levels and board summaries feed every network section. The study reports use the stored run, and the calc report re-runs the calculation.\n- **08-voltage-drop**: `lf` section and the separate VD report in the export centre (`buildVdReportHtml`).\n- **09-earthing**: `earth` section (Zs, If, disconnection, adiabatic CPC), plus the \"supply loop incomplete\" warning.\n- **10-protection-coordination**: `disc` selectivity table.\n- **11-breaker-cable-selection**: `cable` section, feeder cards, fire-rated cable warning (`fireRatingIssues`), cable-data source in the calculation record.\n- **12-transformer-generator**: `sizing` section, executive summary, compliance rows, parallel transformers, existing installation.\n- **13-power-factor-correction**: `pfc` section and compliance rows.\n- **14-busbar**: `busbar` section (study reports only).\n- **15-ups-solar**: UPS rows in the equipment summary; UPS and PV standalone PDFs in the export centre.\n- **04-building-load-assessment**: a design-basis sub-section when the assessment is marked `inReport`.\n- **26-revisions-changes**: revision on the cover, page-1 block and stamps.\n- **27-review-submissions-authority**: received documents in the Reference appendix; the export offers a submission entry.\n- **28-dashboard-readiness**: project summary in the issue package and in the export centre.\n- **31-headless-cli-mcp**: the CLI/MCP reuses `CATALOGUE`.\n- **34-electron-desktop**: PDF rendering in a locked-down window.\n- **24-drawings-sld-sheets**: the issue package includes the drawing set and uses the shared `mergePdfs`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"26-revisions-changes","name":"Revisions & changes","full":"Revisions & changes","group":"Documents & workflow","summary":"Issues design revisions (Rev A, B, C...) as full snapshots inside the project file and compares any two field by field, with every field cla
