 duration, circuit, result, Place |\n| `src/components/cad/CadPage.tsx` | screen / state | `luxRoom`, `luxSet` (:313–314), `em`, `emSet` (:316–317), `lit` (:588), `emLayout` (:591), `placeLux` (:1023), `finishRoute`, `placeEm` (:1042), click handlers (:2092–2107) | Wires the two panels to the canvas; all lighting/emergency inputs are component state only |\n| `src/model/emergency.ts` | model (power, not lighting) | `PanelRole`, `PANEL_ROLES`, `prefixOf`, `roleOf`, `planEmergency` | EMDB/ESMDB/EDB board planner (see §1) |\n| `src/calc/bom.ts` (:287–292) | calc (20) | `luminaireSchedule` loop | One BOM line \"Luminaire type Lx …\" per type per board |\n| `src/docs/boqWorkbook.ts` (:251–271) | report (20/25) | \"Luminaire schedule\" worksheet | Type, description, manufacturer, W, lm, qty, boards, levels, total W |\n| `src/docs/planLayout.ts` (:124–126) | report (23/24) | plan marks | Draws emergency symbols (E, EX, DS) on plan sheets |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Room outline (metres on the level's plan), area, room type, level | 22-cad-electrical / 04-building-load-assessment | `src/calc/building.ts` `buildingInfoOf`; `src/components/cad/CadPage.tsx` `roomAtPointOf` |\n| Floor-to-floor height (for default ceiling) | 04-building-load-assessment | `roomLightingDefaults` → `info.buildings[].levels[].heightM` |\n| Luminaire lumens, watts, SHR max, manufacturer | 32-component-database | `src/database/catalog.ts` `catalog().luminaires` (Luminaires.xlsx, parsed in `src/database/database.ts` :235–239); fallback `LUMINAIRES` |\n| MF, UF, reflectances, ceiling, working plane, target override | user (panel state) | `RoomLightingPanel.tsx` `LuxSettings`, `lightingOf` |\n| Escape routes, points of emphasis, open-area rooms | user clicks on the CAD canvas (state) | `CadPage.tsx` `em` state, `finishRoute`, click handler :2099–2107 |\n| Emergency fitting spacing table (route spacing, end, open spacing, wall) | user (panel state); default `TYPICAL_FITTING` | `EmergencyPanel.tsx` `emFitting` |\n| Final circuits to place on | 07-load-schedule-panels | `src/model/cadDevices.ts` `finalCircuits` (CadPage :540) |\n| Quick-calc inputs | user (saved in quick-calc inputs) | `QuickCalcs.tsx` `useInputs('lux', …)` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Light points (`LvPoint` with `luminaire`) and emergency points (`LvPoint` with `emergency`) saved in `project.lvPoints` | 02-project-storage, 22-cad-electrical | `placeLvPoint` (`src/model/cadDevices.ts` :94) |\n| Circuit `points.ltg` count +1 per point → circuit load = count × DB WATT/UNIT for `ltg`, then MCB / cable re-sizing | 07-load-schedule-panels, 11-breaker-cable-selection | `withCount` → `src/model/schedule.ts` `updateCircuit` → `refresh` → `circuitWatts` |\n| Luminaire schedule types and counts | 20-equipment-boq-pricing | `src/calc/bom.ts` :289; `src/docs/boqWorkbook.ts` :252 |\n| Emergency symbols on plan sheets | 23-cad-sheets-plot-titleblock / 24-drawings-sld-sheets | `src/docs/planLayout.ts` :124 |\n| Plan points wired into circuits (home runs) | 22-cad-electrical | `wireLevel` (CadPage `wireAll`) uses `lvPoints` |\n| Quick-calc result and SVG plan | screen only | `QuickCalcs.tsx`, `LuxLayoutPlan` |\n\n## 5. User flow — from button click to result\n\n**Light room (LUX)**\n1. Design CAD → Light room tool (`tool === 'lux'` in `CadPage.tsx`). Hovering a room computes a preview with `lightingOf(project, room, luxSet)` (:588).\n2. Click a room → `roomAtPointOf` finds it; `setLuxRoom(room.id)` keeps it; target/ceiling/working-plane overrides are cleared (:2092–2098).\n3. `RoomLightingPanel` shows defaults from `roomLightingDefaults`; the engineer changes luminaire, MF, UF, reflectances, picks a circuit. Each change re-runs `lightingOf` → `roomLighting` → `gridInOutline`.\n4. Place → `placeLux` (:1023) → `placeRoomLights(project, level, roomId, feederId, points, replace, luminaire)`. With Replace (default on) every `ltg` point inside the room outline is removed first (`removeLvPoint`), then each point is placed by `placeLvPoint`, which adds `points.ltg + 1` to the circuit via `updateCircuit`.\n5. `change(...)` stores the new project (undoable); the message reports lights placed and achieved lux.\n\n**Emergency (EM)**\n1. Design CAD → Emergency tool (`tool === 'em'`). Mode buttons in `EmergencyPanel` choose Escape route / Open area / Point of emphasis.\n2. Route mode: clicks add vertices; Enter → `finishRoute` converts to metres and appends to `em.routes`. Point mode: click adds `{ at, kind }` to `em.points`. Open-area mode: click toggles a room in `em.rooms`.\n3. Every change re-runs `emergencyLayout(routes, points, openRooms, fitting, signViewM)` (:591) → `escapeRoute` per route and `openArea` per room; ghosts are drawn on the canvas.\n4. Place → `placeEm` (:1042) → `placeEmergency` → `placeLvPoint(…, 'ltg', feederId, x, y, 'fitting' | 'exit-sign' | 'direction-sign')` for each item. Routes, points of emphasis and settings are then cleared.\n\n**Luminaire schedule / BOQ**\n1. BOQ screen or BOQ Excel export → `buildBom` (`src/calc/bom.ts`) / BOQ workbook → `luminaireSchedule(project)` groups the typed points.\n\n**Quick lux calculator**\n1. Quick calculators → Lighting card → inputs validated by `quickInputErrors('lux')` (UF and MF in (0, 1]) → `lumenMethod` → outputs and `LuxLayoutPlan`.\n\n## 6. Linked to (working connections)\n\n- **22-cad-electrical** — room outlines and plan points: rooms picked with `roomAtPointOf`; placed points are ordinary `LvPoint`s, so move / delete / wire / circuit-change tools work on them (`src/model/deviceEdit.ts`).\n- **04-building-load-assessment** — room type target lux and level height feed `roomLightingDefaults`.\n- **07-load-schedule-panels** — each placed point adds 1 to the circuit's LTG count (`withCount`), so the schedule's point columns follow the plans.\n- **20-equipment-boq-pricing** — typed luminaires and emergency items become BOQ lines and a Luminaire schedule sheet (`bom.ts` :289, `boqWorkbook.ts` :252).\n- **23-cad-sheets-plot-titleblock / 24-drawings-sld-sheets** — emergency symbols drawn on plan sheets (`planLayout.ts` :124).\n- **02-project-storage** — `lvPoints` with `luminaire` / `emergency` are saved in the project; undo through `change`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"19-cable-tray-containment","name":"Cable schedule, tray & containment","full":"Cable schedule, tray & containment","group":"Equipment & containment","summary":"The cable schedule lists every SLD cable with its reference, length, tray route, Ib, In, Iz, voltage drop and status. The cable tray schedule sizes each tray route from the cable diameters (spacing or fill %), gives tiers, spare, weight, bend radius, a cross-section, a tray BOQ and an IEC grouping factor that goes back into the method-E cable ratings. The custom containment calculator sizes tray, ladder, basket, trunking, conduit, a trench or a duct bank on its own, without the design.","files":[{"path":"src/components/docs/Documents.tsx","kind":"screen","symbols":["CableScheduleView","ScheduleTable","ExportCsvButton"]},{"path":"src/docs/schedules.ts","kind":"report","symbols":["cableSchedule","csvRows"]},{"path":"src/model/cableRefs.ts","kind":"model","symbols":["BUILT_IN_CABLES","standardCables","feederBuild","withCableRefs","cableRefOf","cableRefsUsed","FIRE_NOTE"]},{"path":"src/components/docs/TrayScheduleView.tsx","kind":"screen","symbols":["TrayScheduleView","TrayDesignView","RouteCard"]},{"path":"src/calc/cableTray.ts","kind":"calc","symbols":["TRAY_DEFAULTS","trayPlanOf","lookupOd","trayLines","routeSettings","groupingFactor","bunchedFactor","pickTray","sizeRoute","sizeAll","trayGrouping","trayQuantities","ensureRoutes","unroutedFeeders"]},{"path":"src/docs/traySection.ts","kind":"report","symbols":["traySectionSvg","lineNumbers"]},{"path":"src/docs/traySheet.ts","kind":"model","symbols":["buildOdSheet","applyOdEdits","buildRoutingSheet","applyRoutingEdits"]},{"path":"src/docs/trayReport.ts","kind":"report","symbols":["buildTrayReportHtml"]},{"path":"src/docs/trayWorkbook.ts","kind":"report","symbols":["buildTrayWorkbook"]},{"path":"src/components/docs/ContainmentCalculator.tsx","kind":"screen","symbols":["ContainmentCalculator"]},{"path":"src/calc/containment.ts","kind":"calc","symbols":["calcContainment","containmentSvg","groundTempFactor","soilFactor","buriedGroupFactor","TRUNKING_SIZES","CONDUIT_SIZES"]},{"path":"src/docs/containmentReport.ts","kind":"report","symbols":["containmentReportHtml"]},{"path":"src/model/cadTrays.ts","kind":"model","symbols":["pullCadTrays","applyCadTrays","chain","traysAlong"]},{"path":"src/model/cadTrayFittings.ts","kind":"model","symbols":["trayFittings","fittingLabel","fittingCounts"]},{"path":"src/App.tsx","kind":"screen","symbols":["view === 'cable-tray'","view === 'cable-schedule'"]}],"links":[{"to":"06-network-sld-editor","dir":"in","status":"working","what":"feeders: size, cores, parallel runs, board, trayRoute, length","ref":"src/calc/cableTray.ts:trayLines"},{"to":"07-load-schedule-panels","dir":"in","status":"working","what":"final circuits optionally put on trays","ref":"src/calc/cableTray.ts:trayFeeders"},{"to":"22-cad-electrical","dir":"in","status":"working","what":"tray route paths, route lengths, bends/tees/reducers and feeder lengths from CAD plans","ref":"src/model/cadPlanSchedules.ts:updateSchedules"},{"to":"11-breaker-cable-selection","dir":"out","status":"working","what":"burial derating tables shared with the cable rating","ref":"src/calc/installation.ts:ratingBasis"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"tray metres, fittings, supports, couplers, covers (BOQ section H)","ref":"src/calc/bom.ts:336"},{"to":"25-reports-exports","dir":"out","status":"working","what":"cable schedule, tray schedule and containment exports in the export centre and study report","ref":"src/components/docs/exportCatalogue.ts:122"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"same exports through CATALOGUE","ref":"src/headless/exportTools.ts:8"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"cable reference numbers and fire-rated note on SLD sheets","ref":"src/model/cableRefs.ts:cableRefsUsed"},{"to":"21-cad-core","dir":"out","status":"working","what":"tray fitting labels on the CAD canvas and CAD export","ref":"src/model/cadTrayFittings.ts:trayFittings"},{"to":"23-cad-sheets-plot-titleblock","dir":"out","status":"working","what":"tray fitting counts on plan sheets","ref":"src/docs/planLayout.ts:485"},{"to":"32-component-database","dir":"in","status":"working","what":"standard cable reference list (CableSchedule.xlsx)","ref":"src/model/cableRefs.ts:standardCables"},{"to":"02-project-storage","dir":"both","status":"working","what":"data link","ref":"src/calc/runs.ts:91"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"tray route / length / size changes listed in design impact","ref":"src/model/designImpact.ts:104"}],"gaps":[],"md":"# 19 — Cable schedule, cable tray schedule and containment\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module covers three screens and their calculations:\n\n- **Cable schedule**: a read-only table of every SLD cable (feeder). It shows the tag, from and to, cable reference number, type, cores × size, CPC (protective conductor), length, tray route, Ib, In, Iz, voltage drop and status. Export is CSV or PDF.\n- **Cable tray schedule** (\"From the design\" mode of the *Cable trays* page). You give each SLD cable a route path once, for example `A-B-C`. The cable then appears on every route along that path. Each route is sized from the cable outer diameters (OD), either side by side with a spacing (single layer) or by fill % (bunched). The page then gives:\n  - the next standard width and the number of tiers;\n  - the spare %, the cable weight and the largest bending radius;\n  - an IEC 60364-5-52 grouping factor (Table B.52.20 or B.52.17), which goes back into the cable current rating Iz;\n  - a cross-section drawing and a tray BOQ (metres, bends, tees, reducers, risers, supports, couplers, covers).\n\n  Export is PDF or Excel. Route paths, route lengths and fittings can also be filled from the Design CAD plans.\n- **Containment calculator** (\"Custom calculation\" mode). This is a standalone calculation that needs no design. You list cables and choose a containment: tray, ladder, basket, trunking, conduit, a trench (direct buried) or a duct bank. It gives the size, the fill, a to-scale cross-section and, for buried cables, the ground-temperature × soil × grouping derating. Export is a PDF.\n\nTerms used below: a *store* is the place the app keeps the project in memory. A *project object* is the in-memory project. A *pure function* is a calculation that only reads its inputs and returns a result.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/components/docs/Documents.tsx` | screen | `CableScheduleView` (:50), `ScheduleTable`, `ExportCsvButton` | Cable schedule page; optional focus on a board subtree (`subtree` from `src/calc/pfc`) |\n| `src/docs/schedules.ts` | report | `cableSchedule` (:23), `csvRows`, `equipmentSchedule` | Builds the cable schedule rows from `evaluateFeeder` results |\n| `src/model/cableRefs.ts` | model | `BUILT_IN_CABLES`, `standardCables`, `feederBuild`, `withCableRefs`, `cableRefOf`, `cableRefsUsed`, `FIRE_NOTE` | Fixed cable reference numbers (\"34\" = the same build-up on every project), with project-own numbers added after them |\n| `src/components/docs/TrayScheduleView.tsx` | screen | `TrayScheduleView` (:59), `TrayDesignView` (:72), `RouteCard` (:330), `Num` | Cable trays page: switches between design and custom mode; plan settings, routing grid, route cards, summary, BOQ, exports |\n| `src/calc/cableTray.ts` | calc | `TRAY_DEFAULTS`, `trayPlanOf`, `lookupOd` (:81), `routeNames`, `onRoute`, `trayLines` (:214), `routeSettings`, `groupingFactor` (:297), `bunchedFactor`, `pickTray` (:345), `sizeRoute` (:357), `sizeAll` (:423), `trayGrouping` (:445), `trayQuantities` (:484), route edit helpers (`addFeedersToRoute`, `renameRoute`, `deleteRoute`, `ensureRoutes`, `unroutedFeeders`) | Route membership, tray sizing, grouping factors, the per-feeder worst grouping factor, tray quantities |\n| `src/docs/traySection.ts` | report | `traySectionSvg` (:27), `lineNumbers` | To-scale cross-section as SVG (black and white when `mono`) |\n| `src/docs/traySheet.ts` | model/screen helper | `buildOdSheet`, `applyOdEdits`, `buildRoutingSheet` (:107), `applyRoutingEdits` (:145) | Excel-style grids for the OD/weight/bend table and for the route path of each cable |\n| `src/docs/trayReport.ts` | report | `buildTrayReportHtml` (:18) | Tray schedule PDF (A4 landscape) |\n| `src/docs/trayWorkbook.ts` | report | `buildTrayWorkbook` (:48) | Tray schedule Excel workbook (schedule and summary sheets) |\n| `src/components/docs/ContainmentCalculator.tsx` | screen | `ContainmentCalculator` (:24) | Custom containment inputs, results and PDF |\n| `src/calc/containment.ts` | calc | `calcContainment` (:109), `containmentSvg`, `allocate`, `groundTempFactor`, `soilFactor`, `buriedGroupFactor`, `TRUNKING_SIZES`, `CONDUIT_SIZES` | Containment sizing; burial derating tables (also used by the cable rating) |\n| `src/docs/containmentReport.ts` | report | `containmentReportHtml` (:9) | Containment PDF (A4) |\n| `src/model/cadTrays.ts` | model | `pullCadTrays` (:86), `applyCadTrays` (:124), `chain`, `traysAlong`, `TRAY_TOLERANCE_M`, `TRAY_MIN_RUN_M` | Proposes each feeder's tray path, and each route's length, from CAD tray runs and cable routes |\n| `src/model/cadTrayFittings.ts` | model | `trayFittings` (:41), `fittingLabel`, `fittingCounts` | Finds bends, tees, crosses and reducers from the drawn tray runs |\n| `src/types.ts` | model | `TrayPlan`, `TrayRoute`, `TrayCable`, `TraySettings`, `CableOd` (:895–971), `Feeder.trayRoute` (:252), `Project.containmentCalc` (:657), `Project.cableRefs` (:648) | Saved data shapes |\n\n## 3. Inputs: where the data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Feeders: size, cores, parallel runs, board, `feedsBoardId`, `trayRoute`, `lengthM`, `cableType` | 06-network-sld-editor | `src/types.ts:Feeder`; read in `src/calc/cableTray.ts:trayLines` |\n| Final circuits (optional, \"incl. final circuits\") | 07-load-schedule-panels | `src/calc/cableTray.ts:trayFeeders` (feeders with `phase`) |\n| Cable OD, weight and bending radius by brand (DUCAB default) | 32-component-database (data file, not the database) | `src/data/cableBrands.ts:brandOf`, `typicalKgPerM`; `src/calc/cableTray.ts:odsOf` |\n| Cable types (code, fire-rated, armoured) | 11-breaker-cable-selection | `src/model/cableTypes.ts:cableTypeOf` (used in `trayLines`, `feederBuild`) |\n| CPC/ECC size | 09-earthing / 11 | `src/calc/cableTable.ts:cpcOf` (re-exported by `src/calc/earthing.ts`) |\n| Standard cable reference list (CableSchedule.xlsx) | 32-component-database | `src/database/catalog.ts:catalog().cableRefs`; `src/model/cableRefs.ts:standardCables` |\n| Ib, Iz, VD, status per feeder | 06 / 08 / 11 | `src/calc/electrical.ts:evaluateFeeder` in `src/docs/schedules.ts:cableSchedule` |\n| Tray route paths, route lengths, fittings, and feeder lengths measured on plans | 22-cad-electrical | `src/model/cadPlanSchedules.ts:updateSchedules` (called from `src/components/cad/CadPage.tsx:2156`); `src/model/floorPlanActions.ts:92` (`pullCadTrays`/`applyCadTrays`); `src/model/cadLengths.ts:pullCadLengths` |\n| Drawing units to metres | 21-cad-core | `src/model/cadLengths.ts:metresPerUnit`, `src/model/cadUnits.ts:planScale` |\n| Revision stamp on exports | 26-revisions-changes | `src/model/revisions.ts:revisionStamp` |\n| Containment inputs (typed) | — (saved in project) | `Project.containmentCalc`, `ContainmentCalculator.set` |\n\n## 4. Outputs: where the results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Worst tray grouping factor per feeder | 11-breaker-cable-selection, 06 | `src/calc/cableTray.ts:trayGrouping` → `src/calc/electrical.ts:trayFactorOf` (:150) → `feederRating` (:141) → `src/calc/installation.ts:feederRatingBasis` (:57, method E only) |\n| Same factor fixed in the cable-size search | 11-breaker-cable-selection | `src/calc/sizing.ts:290` (`selectCableRuns(..., trayFactorOf(...))`, `izEvaluator`) |\n| Grouping shown in the properties panel | 06-network-sld-editor | `src/components/SidePanel.tsx:54–58` |\n| Tray metres and fittings for the BOQ (section H) | 20-equipment-boq-pricing | `src/calc/bom.ts:336–350` (`trayQuantities(sizeRoute…)`) |\n| Burial derating factors (shared tables) | 11-breaker-cable-selection | `src/calc/installation.ts:ratingBasis` uses `groundTempFactor`, `soilFactor`, `buriedGroupFactor`; `bunchedFactor` from `cableTray.ts` |\n| Cable schedule PDF/CSV, tray schedule PDF, containment PDF in the export centre | 25-reports-exports | `src/components/docs/exportCatalogue.ts:122–142` |\n| Cable schedule inside the study report | 25-reports-exports | `src/docs/studyReport.ts:451` |\n| Same exports from the CLI/MCP | 31-headless-cli-mcp | `src/headless/exportTools.ts:8`, `src/headless/rendererExport.ts:2` (`CATALOGUE`) |\n| Cable reference numbers on SLDs and sheets | 24-drawings-sld-sheets | `src/components/SystemDiagram.tsx:1280` (`cableRefOf`), `src/components/docs/sheetRender.tsx:256`, `src/components/SldExportDialog.tsx:52` (`cableRefsUsed`) |\n| Tray fitting labels on CAD canvas, CAD export, plan sheets | 21-cad-core, 23-cad-sheets-plot-titleblock | `src/components/cad/CadCanvas.tsx:406`, `src/model/cadSketch.ts:551`, `src/docs/planLayout.ts:485/551` |\n| Design-change impact: \"Cable tray schedule\" listed when tray route, length or size changes | 26-revisions-changes | `src/model/designImpact.ts:104`, `src/model/designChanges.ts:67` |\n\n## 5. User flow: from button click to result\n\n**Cable schedule**\n1. Ribbon → Reports → *Cable schedule* (`src/components/Ribbon.tsx:280`) sets `view = 'cable-schedule'`. `App.tsx:1626` renders `CableScheduleView` with `calcProject`.\n2. `cableSchedule(project)` walks `boardsInSupplyOrder` → `feedersOn`, calls `evaluateFeeder` for each feeder and `cableRefOf` for the reference.\n3. *Export CSV* → `saveCsv(csvRows)`. *Export PDF* → `scheduleHtml` → `savePdf` (A4 landscape).\n\n**Cable tray schedule**\n1. Ribbon → *Cable trays* (`Ribbon.tsx:770`) opens `TrayScheduleView`. It is in design mode if the project has feeders.\n4. In a `RouteCard` you can add cables from a panel (`addFeedersToRoute`), add manual cables, override qty or OD, set a route method, spacing, fill or depth, choose the width and tiers, and type the length and fittings.\n5. *Apply grouping to cable ratings* (`settings.applyGrouping`). On the next Run (F5), `trayGrouping` → `trayFactorOf` → `feederRating` derate method-E feeders.\n6. *Export PDF* → `buildTrayReportHtml` → `savePdf`. *Export Excel* → `buildTrayWorkbook` → `workbookBytes` → `saveBinary`.\n7. In Design CAD, the schedule update (`CadPage.tsx:2156` → `updateSchedules`) writes route lengths, bends, tees and reducers, the feeder tray paths and the feeder lengths in one undo step.\n\n**Containment calculator**\n1. Cable trays page → *Custom calculation* → `ContainmentCalculator`.\n2. Every edit calls `set()`, which saves `project.containmentCalc`. `calcContainment(input)` and `containmentSvg` re-run.\n3. *Report (PDF)* → `containmentReportHtml` → `savePdf`.\n\n## 6. Linked to (working connections)\n\n- **06-network-sld-editor → 19**: the feeders are the cables. Size, cores, parallel runs and fire rating come straight from the SLD (`trayLines`).\n- **22-cad-electrical → 19**: CAD tray runs give route lengths and fittings. CAD cable routes give the tray path of each feeder (`pullCadTrays`, 0.5 m tolerance, 2 m minimum run) and the feeder length (`pullCadLengths`). So **cable lengths come from CAD routes when a cable route is drawn and the schedule update is run; otherwise they are the typed `Feeder.lengthM`.**\n- **19 → 20-equipment-boq-pricing**: tray metres and fittings go into the BOQ section H (`bom.ts:336`).\n- **19 → 25-reports-exports / 31-headless-cli-mcp**: cable, tray and containment exports are in `CATALOGUE`.\n- **19 → 24-drawings-sld-sheets**: cable reference numbers and the fire note.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"20-equipment-boq-pricing","name":"Equipment, BOQ & pricing","full":"Equipment, BOQ & pricing","group":"Equipment & containment","summary":"Rolls every design item (boards, breakers, cables, glands, busway, trays, earthing, transformers, generators, PFC banks, PV, EV chargers, CAD luminaires, ELV lines) into a tender BOQ by section A-J/P with stable item keys. wastage, overrides, scope, packages, markup, discount, VAT and issued BOQ revisions are applied before Excel/PDF output. A separate equipment schedule lists transformers and boards.","files":[{"path":"src/calc/bom.ts","kind":"calc","symbols":["buildBom","breakerItem","polesOf","brandRef","BOM_SECTIONS"]},{"path":"src/model/priceList.ts","kind":"model","symbols":["priceBom","fallbackPriceEntry","typicalRate","designQty","pricingBasis","compareBom","loadPriceLists","savePriceLists","EXTRAS"]},{"path":"src/model/boqScope.ts","kind":"model","symbols":["boqReview","packageTarget","coversScope","SCOPE_CHECKS"]},{"path":"src/model/boqRevisions.ts","kind":"model","symbols":["numberBom","issueBoqRevision","compareLines","boqRevisionState"]},{"path":"src/data/rates.ts","kind":"model","symbols":["CABLE_RATE_PER_M","cableRatePerM","breakerRateAed","setBreakerPrices","CURRENCY"]},{"path":"src/data/brandDevices.ts","kind":"model","symbols":["BRAND_DEVICES"]},{"path":"src/data/cableBrands.ts","kind":"model","symbols":["CABLE_BRANDS","brandOf","typicalKgPerM"]},{"path":"src/docs/boqWorkbook.ts","kind":"report","symbols":["buildBoqWorkbook","buildBoqHtml","buildPriceTemplate","readPriceWorkbook","amountInWords"]},{"path":"src/components/docs/BomView.tsx","kind":"screen","symbols":["BomView","ScopePage","RevisionsPage","DesignForm","WastageForm","IssueForm"]},{"path":"src/components/BoqTable.tsx","kind":"screen","symbols":["BoqTable","buildRows"]},{"path":"src/components/docs/Documents.tsx","kind":"screen","symbols":["EquipmentScheduleView"]},{"path":"src/docs/schedules.ts","kind":"report","symbols":["equipmentSchedule"]},{"path":"src/components/CatalogueManager.tsx","kind":"screen","symbols":["CatalogueManager"]},{"path":"src/components/ComponentEditor.tsx","kind":"screen","symbols":["ComponentEditor"]},{"path":"src/model/components.ts","kind":"model","symbols":["UserComponent","componentPreset","syncComponent","loadComponentLibrary"]},{"path":"src/database/catalog.ts","kind":"model","symbols":["catalogRate"]},{"path":"src/App.tsx","kind":"screen","symbols":["view 'boq'","view 'equipment'"]}],"links":[{"to":"06-network-sld-editor","dir":"in","status":"working","what":"boards, feeders, sizes, lengths, parallel runs, devices","ref":"src/calc/bom.ts:buildBom"},{"to":"07-load-schedule-panels","dir":"in","status":"working","what":"final circuits, ELCB groups, spare ways, optional point counts","ref":"src/calc/bom.ts:buildBom"},{"to":"09-earthing","dir":"in","status":"working","what":"earth pits, links, body bonds, CPC sizes","ref":"src/calc/bom.ts:buildBom:181"},{"to":"12-transformer-generator","dir":"in","status":"working","what":"transformer kVA and units, generator kVA, changeover/ATS","ref":"src/calc/bom.ts:buildBom:176"},{"to":"13-power-factor-correction","dir":"in","status":"working","what":"capacitor feeders added by addPfcBanks","ref":"src/calc/bom.ts:buildBom:228"},{"to":"14-busbar","dir":"in","status":"working","what":"busway risers from sizeRiser","ref":"src/calc/bom.ts:buildBom:322"},{"to":"15-ups-solar","dir":"in","status":"working","what":"PV modules, inverters, strings from sizePv","ref":"src/calc/bom.ts:buildBom:263"},{"to":"17-enclosure-form4","dir":"in","status":"working","what":"enclosure / Form-4 text in the panel line; brand refs from BRAND_DEVICES","ref":"src/calc/bom.ts:buildBom:110"},{"to":"18-lighting-emergency","dir":"in","status":"working","what":"luminaires and emergency fittings by type","ref":"src/model/luminaireSchedule.ts:luminaireSchedule"},{"to":"19-cable-tray-containment","dir":"in","status":"working","what":"tray lengths and fittings","ref":"src/calc/bom.ts:buildBom:336"},{"to":"32-component-database","dir":"in","status":"working","what":"catalogue, cable and breaker prices (desktop app)","ref":"src/database/catalog.ts:catalogRate"},{"to":"25-reports-exports","dir":"out","status":"working","what":"BOQ Excel/PDF and equipment schedule in the export centre","ref":"src/components/docs/exportCatalogue.ts:166"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"design impact quantities, contract BOQ, variations","ref":"src/model/designImpact.ts:109"},{"to":"27-review-submissions-authority","dir":"out","status":"working","what":"submission offer after PDF export; proposal preview quantities","ref":"src/components/docs/BomView.tsx:exportPdf"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"BOQ revision issued readiness item","ref":"src/calc/projectReadiness.ts:77"}],"gaps":[],"md":"# 20 — Equipment schedule, bill of materials, BOQ and pricing\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module turns the design into a priced tender bill of quantities (BOQ). It has four parts.\n\n1. **Bill of materials (BOM)**: `src/calc/bom.ts` `buildBom`. It reads the project (boards, feeders, final circuits, spare ways, earthing schematic, RMUs, bus couplers, PV, EV chargers, CAD luminaires, busbar risers, cable trays and ELV lines) and adds every item to one list. Each item has a stable **key**: a text ID such as `cable:XLPE/PVC/SWA:4C:95` that also carries the specification. Items with the same key are added together. Each item is filed in a tender section, A–J (plus P for ELV).\n2. **Pricing**: `src/model/priceList.ts` `priceBom`. Each BOM line gets a supply rate and an installation rate. The app takes the first rate it finds in this order: the project's price list, then the component database (Excel catalogue), then the built-in illustrative rates (`src/data/rates.ts`, `typicalRate`). On top of that it applies the per-section wastage %, quantity overrides, manual lines, scope (new / retain / relocate / remove / replace, and who supplies and who installs), packages, markup, discount and VAT.\n3. **Scope review and revisions**:\n   - `src/model/boqScope.ts` `boqReview` runs the pre-issue checks.\n   - `src/model/boqRevisions.ts` records issued BOQ revisions (Rev 0, 1, 2…). Item numbers stay fixed once issued, and the \"what changed\" list is worked out by comparing lines.\n4. **Outputs**:\n   - the screen `src/components/docs/BomView.tsx`;\n   - an Excel BOQ, a PDF BOQ and a price template, plus price import (`src/docs/boqWorkbook.ts`);\n   - a \"Per circuit\" quick-cost table (`src/components/BoqTable.tsx`);\n   - the separate **Equipment schedule** (`src/components/docs/Documents.tsx` `EquipmentScheduleView` → `src/docs/schedules.ts` `equipmentSchedule`), which lists transformers and boards only.\n\n### What the BOQ counts (from `buildBom`)\n\n| Section | Item (key prefix) | Quantity source | File + line |\n|---|---|---|---|\n| A | Panel / switchboard per new board (`panel:`), enclosure extra (`enc-extra:`) | 1 per board; enclosure / Form-4 data from the board | `src/calc/bom.ts:105-121` |\n| B | Main-board incomer ACB/MCCB (`incomer:`), main boards only | `b.supply.device`, else ACB above 630 A | `bom.ts:123-127` |\n| B | RCCB/ELCB groups (`rccb:`), SPD (`spd:`), relays (`relay:`) | load-schedule ELCB groups; SPD per incomer | `bom.ts:135-148` |\n| B | Changeover ACB pair (`acb-il:`) or ATS (`ats:`) | board standby / changeover data | `bom.ts:150-160` |\n| B | Bus couplers (`tie:`) | `project.ties` | `bom.ts:204-207` |\n| B | Spare-way breakers; outgoing breakers (`mcb:`/`mccb:`/`acb:`/`switch-isol:`); RCDs (`rcd:`); local isolators (`iso:`) | `spareWaysOf`, every new feeder | `bom.ts:210-227` |\n| C | kWh meters, PMU, CT sets, APFC relay, ammeter / voltmeter / lamps | board / feeder flags, × incomers | `bom.ts:128-166`, `226` |\n| D | Generator (`gen:`), transformer (`tx:`, × `txUnits`), UPS (`ups:`, only a board of kind UPS with `upsKva`), RMU (`rmu:`, supply / install by others) | board fields | `bom.ts:161`, `176-177`, `193-202` |\n| D | Capacitor banks (`cap:`) | feeders with `kvar` (added by the PFC study's `addPfcBanks`) | `bom.ts:228` |\n| D | EV charger (`ev-charger:`) | load type EV, kW | `bom.ts:254-260` |\n| D | Solar PV modules, mounting, inverters, DC cable sets, connectors, DC isolators, DC SPD, AC isolator | `sizePv(p.pv)` | `bom.ts:263-285` |\n| E | Sub-main cable (`cable:\u003ctype>:\u003ccores>C:\u003ccsa>`), metres = `lengthM × parallel runs` | `f.lengthM` | `bom.ts:231-243` |\n| E | Final-circuit wiring (`wire-conductor:\u003ccsa>`), conductor metres = length × runs × cores | `f.lengthM` | `bom.ts:234-238` |\n| F | Glands (2 per run) and lugs (2 × runs × cores) | per sub-main | `bom.ts:247-250` |\n| G | Busbar trunking lengths, elbows, feed unit, end cap, tap-offs, hangers | `sizeRiser` | `bom.ts:322-333` |\n| H | Tray / ladder lengths, bends, tees, reducers, risers, supports, couplers, covers | `trayQuantities(sizeRoute…)` | `bom.ts:336-351` |\n| I | Earth pits (default 2 per main board, or from the earthing schematic), MET, pit links, body bonds; final-circuit CPC; ECC only on **armoured** sub-mains | `earthingLayout`, `cpcOf` | `bom.ts:168-190`, `239`, `245` |\n| J | Luminaires and emergency fittings placed on the CAD plans, by type | `luminaireSchedule` (from `lvPoints`) | `bom.ts:289-292` |\n| J | Load-schedule point counts (sockets, switches, spurs…), **opt-in** with `boq.includeSchedulePoints` | `scheduleCircuits` points / load items | `bom.ts:295-319` |\n| P | ELV lines the engineer pushed from the ELV module | `p.elvBoq.lines` (stored copy) | `bom.ts:354` |\n\n### Where prices come from (order used by `priceBom` → `fallbackPriceEntry`)\n\n| Order | Source | Covers | File + function |\n|---|---|---|---|\n| 1 | Project price list `project.priceList.rates[key]` (typed in, imported from Excel, or a copied saved list) | any key | `priceList.ts:220` `priceBom` |\n| 2 | Component database: Equipment.xlsx row with `boqKey`; Transformers / Generators.xlsx `price` (exact kVA); Busbar.xlsx `ratePerM` | exact key, `tx:`, `gen:`, `busway:` | `src/database/catalog.ts:56` `catalogRate` |\n| — | No rate: panels, final-circuit wiring, busway accessories, trays, ELV, switch-isolators, body-bond conductors | — | `typicalRate` `default` |\n\nAll built-in rates are in AED (`rates.ts:36` `CURRENCY`). New database workbooks are seeded with the same illustrative prices (`src/database/database.ts:315-316` `databaseSeeds`).\n\n### Lengths, wastage and rounding\n\n| Topic | How it works | File + function |\n|---|---|---|\n| Cable length | `Feeder.lengthM`, typed by hand or accepted from CAD routes. A CAD length is already (route + vertical + termination) × (1 + `wastePct`, default 5 %), rounded up to whole metres | `src/model/cadLengths.ts:45` `pullCadLengths` |\n| Parallel runs | `runsOf(f)` multiplies cable metres, glands, lugs and ECC | `bom.ts:231`, `src/calc/electrical.ts:41` |\n| Rounding of metres | lines with unit `m` are rounded up (`Math.ceil`) **after** all circuits are added together | `bom.ts:356-358` |\n| Wastage | a % per section A–J (not custom sections), applied to design quantities of **every unit** (m and no), then rounded up | `priceList.ts:177` `designQty`; `BomView.tsx:507` `WastageForm` |\n\n## 2. Files, components, functions and stores\n\n\"Store\" = the place the app keeps data: the project file (`Project` fields) or the browser `localStorage` of this computer.\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/bom.ts` | calc | `buildBom`, `breakerItem`, `polesOf`, `brandRef`, `BOM_SECTIONS` | Design → BOM lines with keys, sections, units, quantities, \"where\" |\n| `src/model/priceList.ts` | model | `priceBom`, `fallbackPriceEntry`, `typicalRate`, `designQty`, `pricingBasis`, `compareBom`, `loadPriceLists`, `savePriceLists`, `EXTRAS` | Pricing, wastage, overrides, manual lines, totals; saved price-list library |\n| `src/model/boqScope.ts` | model | `boqReview`, `packageTarget`, `coversScope`, `SCOPE_CHECKS`, `scopeSummary` | Pre-issue checks, package (included-in) logic, scope checklist |\n| `src/model/boqRevisions.ts` | model | `numberBom`, `issueBoqRevision`, `compareLines`, `boqRevisionState`, `lineOf` | Issued revisions, fixed item numbers, change marks |\n| `src/data/brandDevices.ts` | data | `BRAND_DEVICES` | 16 built-in manufacturer device dimensions; used for enclosure sizing and the BOQ \"ref.\" text |\n| `src/data/cableBrands.ts` | data | `CABLE_BRANDS`, `brandOf`, `typicalKgPerM` | Cable outer diameters / bend radii for tray sizing (no prices) |\n| `src/docs/boqWorkbook.ts` | report | `buildBoqWorkbook`, `buildBoqHtml`, `buildPriceTemplate`, `readPriceWorkbook`, `amountInWords`, `boqBookmarks` | Excel and PDF BOQ, rates template and rate import |\n| `src/components/docs/BomView.tsx` | screen | `BomView`, `ScopePage`, `RevisionsPage`, `ItemForm`, `DesignForm`, `WastageForm`, `IssueForm` | BOQ screen: tabs BOQ / Scope & review / Revisions / Variations / Per circuit |\n| `src/components/BoqTable.tsx` | screen | `BoqTable`, `buildRows` | \"Per circuit\" quick cost: cable + breaker at the built-in rates only |\n| `src/components/docs/Documents.tsx` | screen | `EquipmentScheduleView` (line 64) | Equipment schedule page and CSV / PDF export |\n| `src/docs/schedules.ts` | report | `equipmentSchedule` (line 43) | Rows: transformer (`TX-\u003cboard id>`) + each board |\n| `src/components/CatalogueManager.tsx` | screen | `CatalogueManager` | Enclosure catalogues + device dimension library (opened from Enclosure sizing) |\n| `src/components/ComponentEditor.tsx`, `src/model/components.ts` | screen / model | `ComponentEditor`, `componentPreset`, `syncComponent`, `loadComponentLibrary` | User load templates with formulas; library in `localStorage` `lvds.components` |\n| `src/database/catalog.ts` | model | `catalogRate`, `catalog` | Catalogue prices by BOQ key (store: Excel database, in memory) |\n| `src/App.tsx` | screen | view `'boq'` (lines 1692-1695), `'equipment'` (line 1627) | Mounts `BomView` with the **live** `project`, and the equipment schedule with `calcProject` |\n\nStores in the project file: `project.priceList`, `project.boq` (`BoqCustom`: overrides, manual, sections, wastage, discount, VAT, document, scopeReview, projectType, includeSchedulePoints), `project.boqRevisions`, `project.elvBoq`, `project.components`. Stores on this computer: `localStorage` `lvds.priceLists` (synced by `pushLibrary`) and Prices.xlsx lists (`catalog().priceLists`, ids `xl-…`).\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Boards, feeders, sizes, lengths, parallel runs, devices, RCD, meters | 06-network-sld-editor | `src/types.ts` `Board`, `Feeder`; `src/calc/electrical.ts` `runsOf` |\n| Final circuits, points, load items, ELCB groups, spare ways | 07-load-schedule-panels | `src/calc/loadSchedule.ts` `scheduleCircuits`, `elcbGroups`; `src/model/spareWays.ts` `spareWaysOf` |\n| Cable construction (FR / LSZH / armoured) | 11-breaker-cable-selection | `src/model/cableTypes.ts` `cableTypeOf` |\n| CPC size | 09-earthing | `src/calc/earthing.ts` `cpcOf` |\n| Earth pits, links, body bonds | 09-earthing | `src/model/earthingPlan.ts` `earthingLayout` |\n| Transformer count (N+1 / split), tags | 12-transformer-generator | `earthingPlan.ts` `txUnits`; `src/model/transformers.ts` `txTag` |\n| Generator kVA, changeover / ATS | 12-transformer-generator | `Board.standby`; `src/model/changeover.ts` `changeoverBreakers`, `atsOf`, `incomersOf` |\n| Capacitor banks | 13-power-factor-correction | `Feeder.kvar` (written by `src/calc/pfc.ts` `addPfcBanks`) |\n| Busbar risers | 14-busbar | `src/calc/busbar.ts` `sizeRiser` |\n| PV system | 15-ups-solar | `src/calc/solar.ts` `sizePv` |\n| Enclosure / Form-4 data | 17-enclosure-form4 | `Board.enclosure`, `Board.form4`, `src/calc/form4.ts` `form4SizeText`; `src/model/enclosureLibrary.ts` `matchDevice` |\n| Luminaires and emergency fittings on plans | 18-lighting-emergency, 22-cad-electrical | `src/model/luminaireSchedule.ts` `luminaireSchedule` |\n| Tray quantities | 19-cable-tray-containment | `src/calc/cableTray.ts` `trayPlanOf`, `sizeRoute`, `trayQuantities` |\n| Cable lengths from CAD | 22-cad-electrical | `src/model/cadLengths.ts` `pullCadLengths` / `applyCadLengths` → `Feeder.lengthM` |\n| ELV BOQ lines | 29-elv | `src/elv/outputs.ts` `withProjectBoq` → `project.elvBoq` |\n| Catalogue prices (Equipment, Transformers, Generators, Busbar, Cables, Breakers, Prices.xlsx) | 32-component-database | `src/database/catalog.ts` `catalogRate`; `src/database/database.ts` `applyDatabase` |\n| Design revision id for the BOQ revision | 26-revisions-changes | `src/model/revisions.ts` `currentRevision` |\n| Prepared / checked / approved defaults | 03-parameters-rules | `project.params` in `BomView` `DocumentForm` fallback |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| BOQ Excel / PDF / summary PDF | 25-reports-exports | `src/components/docs/exportCatalogue.ts:166-174`; `BomView.tsx` `exportBoq`, `exportPdf` |\n| BOQ Excel through the CLI / MCP | 31-headless-cli-mcp | `src/headless/exportTools.ts:245` `export_boq_xlsx` |\n| Submission offer after a PDF export | 27-review-submissions-authority | `BomView.tsx` `exportPdf` → `offerSubmission` |\n| Design-quantity change between two projects | 26-revisions-changes | `src/model/designImpact.ts:109` `buildBom` |\n| Proposal preview quantity change | 27-review-submissions-authority | `src/model/proposalPreview.ts:102` `buildBom` |\n| Contract BOQ revision, variations | 26-revisions-changes | `src/model/variations.ts` `contractRevision`; `VariationsView` |\n| \"BOQ revision issued\" readiness item | 28-dashboard-readiness | `src/calc/projectReadiness.ts:77` |\n| Equipment schedule CSV / PDF | 25-reports-exports | `exportCatalogue.ts:138` `equipmentSchedule` |\n\n## 5. User flow — from button click to result\n\n1. The user opens **BOM / Cost → Bill of quantities**. The ribbon calls `onBom` (`App.tsx:1249`), which sets `view = 'boq'`, and `App` renders `BomView` with the live `project` (`App.tsx:1695`).\n2. `BomView` runs `buildBom(project)` (line 51), which gives the raw BOM lines.\n3. `priceBom(items, project.priceList, project.boq)` applies `designQty` (wastage), overrides, scope, the rate lookup (`list` → `catalogRate` → `rates.ts` → `typicalRate`), manual lines, packages, markup, discount and VAT. `numberBom` then fixes the item numbers against `project.boqRevisions`.\n4. `boqReview` builds the \"Scope & review\" list. `compareLines` against the latest revision gives the △ change marks.\n5. The user types rates in a row (`setRate` → `project.priceList`), adjusts quantities or scope with the pencil (`DesignForm` → `setOverride`), adds items or Extras (`ItemForm`, `ExtrasForm`), and sets wastage, markup and VAT (`WastageForm`, `MarkupForm`). Each change calls `onChange` → `setProject` (undo step).\n6. Optional: **Rates sheet** → `buildPriceTemplate` (Excel). The user fills it in, then **Import rates** → `readPriceWorkbook` merges the rates into the project price list.\n7. Optional: **Save list** → `saveToLibrary` → `savePriceLists` (`localStorage`). **Use a saved price list** → `applySavedList` copies a list into the project.\n8. **Issue Rev N** → `IssueForm` → `issueBoqRevision` stores the lines, totals and design revision in `project.boqRevisions`.\n9. **Excel BOQ** → `buildBoqWorkbook`; **PDF** → `buildBoqHtml` → `savePdf`, then `offerSubmission`.\n10. **Equipment schedule** (separate view `equipment`) → `EquipmentScheduleView` → `equipmentSchedule(calcProject)` → table plus CSV / PDF.\n\n## 6. Linked to (working connections)\n\n- 06-network-sld-editor / 07-load-schedule-panels: every new board, feeder, spare way, ELCB group and (optionally) point count, read live by `buildBom`.\n- 09-earthing: earth pits, links and body bonds from `earthingLayout`; CPC sizes from `cpcOf`.\n- 12-transformer-generator: transformer kVA and unit count (`txUnits`), generator kVA (written to `Board.standby` by `SizingStudy`), changeover / ATS.\n- 13-power-factor-correction: capacitor feeders added by `addPfcBanks` are counted as `cap:` lines.\n- 14-busbar: riser lengths, elbows and tap-offs from `sizeRiser`; busway price from Busbar.xlsx.\n- 15-ups-solar (PV part): `sizePv` modules, inverters, strings.\n- 17-enclosure-form4: enclosure / Form-4 text and key in the panel line.\n- 18-lighting-emergency / 22-cad-electrical: luminaires and emergency fittings by type from the plans.\n- 19-cable-tray-containment: tray quantities.\n- 29-elv: `project.elvBoq` lines in section P.\n- 32-component-database: `catalogRate` and Cables / Breakers prices (desktop app only).\n- 25 / 26 / 27 / 28 / 31: see §4.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"29-elv","name":"ELV systems","full":"ELV systems","group":"Equipment & containment","summary":"Estimates fire alarm, CCTV, access control, ICT and PA devices from room type and area, or counts devices placed on the floor plan, and sizes the panels, PoE switches, controllers and amplifiers with their upstream kW. Checks detector, Wi-Fi and speaker coverage per room, builds loop, zone, port and BOQ schedules (PDF, Excel, A3 plan sheets, DXF), and sends the ELV supplies to LV as an exchange package that becomes linked, sized circuits on LV boards.","files":[{"path":"src/elv/defaults.ts","kind":"model","symbols":["ELV_SYSTEMS","RoomRule","Density","DEFAULT_RULES","Catalogue","DEFAULT_CATALOGUE","DEFAULT_ASSUMPTIONS"]},{"path":"src/elv/devices.ts","kind":"model","symbols":["ELV_DEVICE_TYPES","ELV_DEVICES","DeviceLoad","Coverage","DORI_PX_PER_M","reachM","cameraRangeM","devicesOf"]},{"path":"src/elv/estimate.ts","kind":"calc","symbols":["elvSettings","elvBasis","estimateElv","loopAlarmMa","loopDevices","loopMa","loopsForFloors","floorSupplies","buildingSupplies","withPlaced"]},{"path":"src/elv/placed.ts","kind":"model","symbols":["ElvDevice","newElvDevice","devicesOn","inside","roomAt","placeDevices","moveDevice","removeDevices","placedOnLevel","fillPoints","copyDevices"]},{"path":"src/elv/coverage.ts","kind":"calc","symbols":["COVERED_SYSTEMS","RoomCoverage","levelCoverage"]},{"path":"src/elv/schedules.ts","kind":"calc","symbols":["elvSchedules","routeOrder","fireAlarm","switches","controllers","publicAddress"]},{"path":"src/elv/outputs.ts","kind":"report","symbols":["elvTables","elvBoq","projectBoqLines","withProjectBoq","projectBoqCurrent","remarkOf","withRemark","floorRef"]},{"path":"src/elv/pdf.ts","kind":"report","symbols":["elvSchedulesHtml"]},{"path":"src/elv/workbook.ts","kind":"report","symbols":["elvWorkbook"]},{"path":"src/elv/planSheets.ts","kind":"report","symbols":["planLevels","planSvg","legendSvg","symbolSvg","sheetInfo","planSheetHtml","levelUnits","planDxf"] ement, Fill room, Copy to level, coverage overlay; unit rescale of devices","ref":"src/components/cad/CadPage.tsx:elvLayer"},{"to":"30-exchange-inbox","dir":"out","status":"working","what":"ELV loads package (one load per supply) for review and acceptance","ref":"src/elv/package.ts:elvLoadsPackage"},{"to":"30-exchange-inbox","dir":"in","status":"working","what":"accepted ELV loads for placement","ref":"src/exchange/inbox.ts:acceptedElvLoads"},{"to":"30-exchange-inbox","dir":"out","status":"working","what":"elvDevices in the design export","ref":"src/exchange/designExport.ts:63"},{"to":"07-load-schedule-panels","dir":"out","status":"working","what":"ELV supplies become linked circuits (Feeder.elvLoad) on floor DB / main / essential board","ref":"src/calc/elvPlacement.ts:addElvCircuits"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"boards, board levels, standby/essential side, phase loading","ref":"src/calc/elvPlacement.ts:chooseBoard"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"kW changes become a proposed modification record; checkpoint before placing","ref":"src/calc/elvPlace.ts:placeElvLoads"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"data link","ref":"src/calc/bom.ts:354"},{"to":"23-cad-sheets-plot-titleblock","dir":"in","status":"working","what":"sheet frame and title block for ELV plan sheets","ref":"src/docs/sldSheet.ts:buildSldSheetHtml"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"elv_devices, elv_schedules, elv_place_devices, elv_estimate, elv_place_loads","ref":"src/headless/elvTools.ts:ELV_TOOLS"},{"to":"34-electron-desktop","dir":"out","status":"working","what":"PDF render of schedules and A3 plan sheets","ref":"src/util/files.ts:renderPdf"}],"gaps":[],"md":"# 29 — ELV (extra-low voltage): devices, coverage, estimate, schedules, placement, outputs\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nELV covers five systems (`src/elv/defaults.ts` `ELV_SYSTEMS`): **fire alarm**, **CCTV**, **access control**, **ICT (data and Wi-Fi)** and **public address (PA / voice alarm)**. The module has five parts:\n\n1. **Room-area estimate** (`src/elv/estimate.ts` `estimateElv`). For every room in Building information: room type × floor area → field devices per room (detectors, sounders, cameras, doors, data outlets, access points, speakers) by a density rule \"one per X m², at least N per room\" (`DEFAULT_RULES`, `Density`). The devices are then grouped into the equipment that powers them, sized by capacity:\n   - fire alarm: addressable loops (125 devices, 500 mA, 20 % spare), panels of 4 loops, one panel group per building; battery Ah = 1.25 × (Iq × 24 h + Ia × 0.5 h); panel AC input = (alarm current × 24 V + charging current × 27.6 V) ÷ 0.8;\n   - CCTV: PoE switches per floor (20 ports used, 370 W PoE budget), NVR per 64 cameras per building, via UPS (90 %), 25 % spare;\n   - access control: door controller + PSU per 4 doors per floor (reader 1.8 W, maglock 6 W at 12 V);\n   - ICT: access switches per floor (40 ports, 740 W PoE), floor rack 100 W, core rack 600 W per building, via UPS;\n   - PA: 480 W amplifiers sized for taps × 1.25 headroom, input at full output (evacuation).\n   Each group of equipment becomes an **ELV supply** (`ElvSupply`) with its upstream AC kW, pf, normal/essential supply and a written demand basis. The result is the LV load each ELV system puts on the boards.\n2. **Device placement on the floor plan** (`src/elv/placed.ts`). The engineer places devices on a level's plan in Design CAD (15 device types, `src/elv/devices.ts` `ELV_DEVICES`). Each device stores its position in metres and the room it falls in (smallest room outline around it, `roomAt`). **Once any device of a system is placed on a level, the estimate counts the placed devices there instead of the area rule** (`withPlaced`). \"Fill room\" lays a grid of devices at the coverage spacing (`fillPoints`); \"Copy to level\" copies the devices to another level at the same plan positions (`copyDevices`).\n4. **Wiring schedules from placed devices** (`src/elv/schedules.ts` `elvSchedules`). These are worked out again on every change: fire detection zones (one floor, at most 2,000 m²), fire alarm loops with addresses in route order (nearest-neighbour from the plan corner), loop quiescent and alarm current, short-circuit isolators (≤ 32 devices between two); CCTV/ICT switch ports and PoE budget; door controllers; PA zones (one per floor) and amplifiers (first-fit).\n5. **Outputs** (`src/elv/outputs.ts`, `pdf.ts`, `workbook.ts`, `planSheets.ts`, `package.ts`): five tables (device schedule, loop schedule, zones, ports/doors/PA zones, ELV BOQ) on screen, in a black-and-white A4 PDF and in an Excel workbook. Each row has an engineer's \"Remarks\" field that is saved with the project. Also: A3 ELV plan sheets (PDF), DXF of each level's devices, an **ELV loads package** (exchange contract) for the LV side, and ELV lines in the project BOQ.\n\n**Module boundary** (`eslint.config.js:24-46`, decision note `docs/notes/Future development/ELV module boundary - decision - 2026-10-28.md`): ELV files (`src/elv/**`, `src/components/elv/{Elv,elv}*`) may import only the shared core (`types`, `calc/building`, `exchange`, `util`, `components/ui`). LV files may not import `src/elv/*`. ELV loads reach LV only through the exchange package (`src/exchange/inbox.ts` `acceptedElvLoads`).\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/elv/defaults.ts` | model (data) | `ELV_SYSTEMS`, `RoomRule`, `Density`, `DEFAULT_RULES`, `Catalogue`, `DEFAULT_CATALOGUE`, `DEFAULT_ASSUMPTIONS` | Typed-in room-type rules (devices per m² and per room for 16 room types + `default`), product data (mA at 24 V for fire alarm, W for others, capacities, efficiencies, battery hours) and the plain-text assumptions printed with every estimate. Header says \"TYPICAL VALUES — VERIFY\" against UAE Fire and Life Safety Code, SIRA, TDRA. |\n| `src/elv/devices.ts` | model (data) + calc | `ELV_DEVICE_TYPES`, `ELV_DEVICES`, `DeviceLoad`, `Coverage`, `DORI_PX_PER_M`, `reachM`, `cameraRangeM`, `devicesOf` | The device library: 15 types, each with system, label, plan symbol (shape + letter code), load (from the catalogue) and coverage (radius / travel / spacing / camera cone). `reachM` turns coverage into a reach radius; `cameraRangeM` = pixelsH ÷ (px/m × 2 tan(FOV/2)). |\n| `src/elv/estimate.ts` | calc | `elvSettings` (zod schema), `elvBasis`, `estimateElv`, `loopAlarmMa`, `loopDevices`, `loopMa`, `loopsForFloors`, `floorSupplies`, `buildingSupplies`, `withPlaced`, `countsOf` | Merges project overrides with the defaults, counts devices per room (area rule or placed), sizes equipment and works out upstream kW per supply, with totals, assumptions and warnings. |\n| `src/elv/placed.ts` | model | `ElvDevice`, `newElvDevice`, `devicesOn`, `inside`, `roomAt`, `placeDevices`, `moveDevice`, `removeDevices`, `placedOnLevel`, `fillPoints`, `copyDevices` | Placed devices in `project.elvDevices`, with permanent IDs `E1, E2…` (`elvDeviceSeq`). Finds the room under a point (point-in-polygon), groups placed devices per room and level, makes the Fill-room grid and copies devices between levels. |\n| `src/elv/coverage.ts` | calc | `COVERED_SYSTEMS`, `RoomCoverage`, `levelCoverage` | Grid-sample coverage check per room for fire alarm, ICT, PA. |\n| `src/elv/schedules.ts` | calc | `elvSchedules`, `routeOrder`, `fireAlarm`, `switches`, `controllers`, `publicAddress` | Zones, loops/addresses/isolators, switch groups, door controllers, PA zones and amplifiers from the placed devices (typical levels repeated per floor). |\n| `src/elv/pdf.ts` | report | `elvSchedulesHtml` | A4 landscape, black-and-white HTML of the schedules for the PDF renderer. |\n| `src/elv/workbook.ts` | report | `elvWorkbook` | Excel workbook, one sheet per schedule, Arial 9, black borders. |\n| `src/elv/planSheets.ts` | report | `planLevels`, `planSvg`, `legendSvg`, `symbolSvg`, `sheetInfo`, `planSheetHtml`, `levelUnits`, `planDxf` | One A3 sheet per level with devices (sheet numbers ELV-101…, scale NTS) in the project's title block (`src/docs/sldSheet.ts` `buildSldSheetHtml`). DXF R12 of each level's devices on layers `E-ELV-FA/CCTV/ACS/ICT/PA`, in the plan's own units. |\n| `src/elv/package.ts` | report (exchange) | `elvLoadsPackage`, `ELV_CATALOGUE_REVISION` | Turns the estimate's supplies into an exchange \"loads\" package (`LoadItem` per supply) with SHA-256. |\n| `src/components/elv/ElvView.tsx` | screen | `ElvView`, `RULE_COLUMNS`, `SYSTEM_LABEL` | The \"ELV systems\" page: system on/off, kW per system, total and essential kW, the supplies table, devices per room, the Assumptions editor (5 rule fields per room type), Export package…, Send to LV, Place on boards…. |\n| `src/components/elv/ElvSchedules.tsx` | screen | `ElvSchedules`, `ProjectBoqDialog` | Tabs for the five tables with Remarks inputs; exports: Schedules PDF, Excel, Plan sheets PDF, DXF for CAD; Add to project BOQ (section P). |\n| `src/components/elv/PlaceElvDialog.tsx` | screen (LV side) | `PlaceElvDialog` | Preview of board chosen per accepted ELV load, why, the circuit it would get; engineer can change the board; Apply adds circuits and the kW-change proposal. |\n| `src/components/elv/elvPlan.ts` | screen helper | `elvLayer`, `coverageNote`, `deviceNear`, `placeAt`, `fillAt`, `moveTo`, `rotate`, `remove`, `copyTo` | What the ELV layer draws over the plan in Design CAD (symbols, coverage circles/cones, uncovered squares, Fill-room preview) and the tool actions. Coverage is cached per project version. |\n| `src/components/elv/elvCadDevices.ts` | screen helper | `ELV_PALETTE`, `placeElv`, `moveElv`, `removeElv`, `elvPlacedOn`, `isElvType`, `elvAlike`, `replaceElv`, `copyElv`, `placeElvAt` | The CAD palette (9 of the 15 types) and edit-tool hooks used by `src/components/cad/CadPage.tsx` and `src/model/deviceEdit.ts`. |\n| `src/components/elv/elvOverlay.ts` | type | `PlanSymbol`, `PlanCover`, `PlanCells` | Shapes passed to `CadCanvas`. |\n| `src/components/elv/elvPlanSymbols.ts` | report helper | `elvPlanSymbols` | ELV symbols for the LV drawing-set plan sheets (`src/docs/planLayout.ts`). |\n| `src/calc/elvPlacement.ts` | calc (LV side) | `planElvPlacement`, `chooseBoard`, `locate`, `onEssentialSide`, `addElvCircuits`, `lightestPhase` | Picks a board per accepted ELV load and adds a circuit: ≤ 3 kW single-phase on the lightest phase, else 3-phase. The circuit gets length 40 m and `loadType: 'it'`, and is then sized with `recommend(…, 'optimise')`. |\n| `src/calc/elvPlace.ts` | calc (LV side) | `placeElvLoads` | Runs the plan, adds circuits, makes a modification record (\"ELV load changes\") for changed kW, and lists warnings. Shared by the app and the headless tool. |\n| `src/headless/elvTools.ts` | CLI/MCP | `ELV_TOOLS` (`elv_devices`, `elv_schedules`, `elv_place_devices`, `elv_estimate`, `elv_place_loads`), `elvSettingsFor` | Headless access; the only place `project.elv` is validated with the zod schema. |\n| Project fields (`src/types.ts:520-530`) | store | `elv`, `elvDevices`, `elvDeviceSeq`, `elvRemarks`, `elvBoq`; `Feeder.elvLoad` | All saved in the project file. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Buildings, levels (`count` = identical floors), rooms (type, area, outline, count, boardId) | 04-building-load-assessment | `src/calc/building.ts` `buildingInfoOf`, `floorsOf`, `roomTypesOf` |\n| Room outlines read from the architect's CAD plan | 22-cad-electrical | rooms in `project.building.rooms[].outline` (used by `roomAt`, `levelCoverage`, `planSvg`) |\n| Device positions, moves, rotations, Fill room, Copy to level | 21-cad-core (Design CAD canvas) | `src/components/cad/CadPage.tsx:573` (`elvLayer`), `:2080` (`placeElv`), `:2089` (`fillAt`), `:1074` (`copyTo`), `:1842` (`rotateElv`) |\n| Edit tools (replace, move, copy, delete) on ELV devices | 22-cad-electrical | `src/model/deviceEdit.ts` → `elvCadDevices.ts` `replaceElv`, `moveElv`, `copyElv`, `removeElvs` |\n| Plan units per drawing (for DXF) | 21-cad-core | `project.cadPlanUnits` read in `src/elv/planSheets.ts` `levelUnits` |\n| Plan rescale when units change | 21-cad-core | `src/model/cadUnits.ts:64` rescales `elvDevices` |\n| Sheet frame and title block | 23-cad-sheets-plot-titleblock / 24-drawings-sld-sheets | `src/docs/sldSheet.ts` `buildSldSheetHtml` |\n| Print CSS, PDF render, file save | 25-reports-exports / 34-electron-desktop | `src/docs/printStyles.ts` `PRINT_BASE_CSS`; `src/util/files.ts` `savePdf`, `renderPdf`, `saveBinary` |\n| Revision stamp on exports | 26-revisions-changes | `src/App.tsx:1655` `revisionStamp(project)` |\n| Exchange schema, `LoadItem`, hash | 30-exchange-inbox | `src/exchange/contracts.ts` `EXCHANGE_SCHEMA`, `hashedText` |\n| Accepted ELV loads (LV side) | 30-exchange-inbox | `src/exchange/inbox.ts:365` `acceptedElvLoads` |\n| Boards, levels of boards, standby, existing feeders | 06-network-sld-editor / 07-load-schedule-panels | `src/calc/elvPlacement.ts` `chooseBoard`, `onEssentialSide`, `lightestPhase` (`src/model/phases.ts` `feederPhaseKw`) |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| ELV loads package (one load per supply: kW, pf, essential/normal, rooms, basis) | 30-exchange-inbox | `src/elv/package.ts` `elvLoadsPackage` → `ElvView.send` → `App.tsx:1656` inbox |\n| ELV circuits on LV boards (`Feeder.elvLoad`), sized | 07-load-schedule-panels, 06-network-sld-editor, 11-breaker-cable-selection | `src/calc/elvPlacement.ts` `addElvCircuits` (uses `src/calc/sizing.ts` `recommend`, `applyRecommendation`) |\n| kW-change proposal (\"ELV load changes\") | 26-revisions-changes | `src/calc/elvPlace.ts` `placeElvLoads` → `src/model/designChanges.ts` `newModification`, `addOp`, `transition` |\n| ELV lines in project BOQ, section P | 20-equipment-boq-pricing | `src/elv/outputs.ts` `withProjectBoq` → `project.elvBoq` → `src/calc/bom.ts:354` |\n| BOQ scope filter \"ELV\" | 20-equipment-boq-pricing | `src/model/boqScope.ts:24` |\n| ELV symbols on drawing-set plan sheets (plan type `elv`) | 23-cad-sheets-plot-titleblock / 24-drawings-sld-sheets | `src/docs/planLayout.ts:119` → `elvPlanSymbols`; sheet hash `src/model/drawingSet.ts:516` |\n| ELV schedules PDF / Excel, ELV plan sheets PDF, DXF | user files (25-reports-exports style) | `ElvSchedules.exportPdf`, `exportExcel`, `exportSheets`, `exportDxf` |\n| `elvDevices` in the design export | 30-exchange-inbox | `src/exchange/designExport.ts:63`, `src/exchange/designContract.ts:69` |\n| Headless estimate, schedules, device placement, load placement | 31-headless-cli-mcp | `src/headless/elvTools.ts` `ELV_TOOLS`; `src/headless/exportTools.ts:307` |\n| Change class and revision labels for ELV fields | 26-revisions-changes | `src/model/changeClass.ts:24,34`, `src/model/revisions.ts:152` |\n\n## 5. User flow — from button click to result\n\n**A. Estimate and send loads**\n1. The user adds buildings, levels and rooms with room types (04), or reads them from CAD (22).\n2. The user opens **ELV systems** in the menu. `App.tsx:1655` renders `ElvView`, which runs `estimateElv(project)` (memoised per project version).\n3. Optional: **Assumptions…** opens a table of 5 rule fields per room type (detector per m², camera per m², doors, data per m², speaker per m²). `setRule` saves a changed value in `project.elv.rules`. Unchanged values are dropped, so the project keeps only differences from the defaults.\n4. The system tick boxes (`toggle`) set `project.elv.systems`.\n5. **Send to LV**: `elvLoadsPackage` builds the package; `onSend` puts it in the Inbox (`App.tsx:1656`) and switches to the Inbox view (30). **Export package…** saves the same JSON to a file.\n6. In the Inbox the user reviews and accepts the package (30: `src/exchange/inbox.ts` `decide`). Accepted loads are stored in `project.exchange.packages`.\n\n**B. Design on the plan**\n1. In Design CAD, the user picks an ELV device from the palette (`ELV_PALETTE`) and clicks the plan: `placeElv` → `placeDevices` stores the device with the room under it.\n2. Fill room: `fillAt` → `fillPoints` lays a grid at √2 × radius (or speaker spacing).\n3. With coverage on, `elvLayer` → `levelCoverage` draws reach circles, camera cones and uncovered squares. The status line shows \"N rooms not fully covered\" (`CadPage.tsx:3150`).\n4. Copy to level (`copyTo` → `copyDevices`), rotate (`rotate`), replace/move/copy/delete through `src/model/deviceEdit.ts`.\n5. Back on the ELV page, `withPlaced` makes the estimate count placed devices for each designed system. The schedules (`elvSchedules`) list loops, zones, ports, controllers and PA zones.\n\n## 6. Linked to (working connections)\n\n- **30-exchange-inbox**: the loads package (contract version 1, SHA-256), review and acceptance, and `acceptedElvLoads` for the LV side. The design export carries `elvDevices`.\n- **11-breaker-cable-selection**: every new ELV circuit is sized by `recommend(..., 'optimise')`.\n- **26-revisions-changes**: kW changes on circuits that are already placed become a \"proposed\" modification record. Checkpoint before placing (`App.tsx:1782`).\n- **21-cad-core / 22-cad-electrical**: palette, placement, coverage overlay, edit tools, unit rescale of devices.\n- **23/24 sheets**: ELV plan type in the drawing set uses the same symbols (`elvPlanSymbols` → `symbolSvg`).\n- **31-headless-cli-mcp**: five ELV tools; the headless loads export.\n- **02-project-storage**: all ELV data (`elv`, `elvDevices`, `elvDeviceSeq`, `elvRemarks`, `elvBoq`) is saved in the project file. Remarks and rule overrides persist.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"21-cad-core","name":"Design CAD core","full":"Design CAD core","group":"CAD & drawings","summary":"The app's own 2D drafting screen: a Rust/WebAssembly engine reads DWG/DXF plans, and the engineer draws, edits, dimensions, hatches, blocks and annotates over them. All drawn work, erased handles, blocks, layers, styles and references are saved in the project file keyed by the drawing's file name; the DWG stays outside the project and is written only as a separate copy on SAVE/SAVEAS.","files":[{"path":"src/components/cad/CadPage.tsx","kind":"screen","symbols":["CadPage","change","run","act","writeCopy","removeSelected","copyClip","pasteClip","exportAs","layoutCmd","HELP"]},{"path":"src/components/cad/CadCanvas.tsx","kind":"screen","symbols":["CadCanvas"]},{"path":"src/components/cad/cadCommands.ts","kind":"model","symbols":["CAD_COMMANDS","CadAction","cadCommand","toolAlias"]},{"path":"src/components/cad/cadState.ts","kind":"store","symbols":["useCad","CadTool","SavedCopy","rememberPath","pathOfPlan","rememberedDrawing","markDirty"]},{"path":"src/components/cad/cadFileMenu.ts","kind":"screen","symbols":["cadFileMenu","planLevel","setPlanLevel"]},{"path":"src/components/cad/CadDialogs.tsx","kind":"screen","symbols":["DIMSTYLE import"]},{"path":"src/components/cad/CadRefs.tsx","kind":"screen","symbols":["useCadRefs","bound"]},{"path":"src/components/cad/refFiles.ts","kind":"screen","symbols":["readRefFile","readSheetRefs"]},{"path":"src/components/cad/cadClipboardStore.ts","kind":"store","symbols":["putClip","getClip"]},{"path":"src/components/cad/cadViewHistory.ts","kind":"store","symbols":["rememberView","previousView"]},{"path":"src/components/cad/CadLayerManager.tsx","kind":"screen","symbols":["CadLayerManager"]},{"path":"src/components/cad/CadProperties.tsx","kind":"screen","symbols":["CadProperties"]},{"path":"src/components/cad/BlocksPalette.tsx","kind":"screen","symbols":["BlocksPalette"]},{"path":"src/model/cadSketch.ts","kind":"model","symbols":["
