<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LV Design Studio — how it is built</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1d2330; --muted:#5d6675; --line:#d9dde3; --accent:#2457a6; --ok:#2e8b57; --bad:#d03030; --hi:#fff4c2; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; overflow:hidden; }
  aside { width:280px; min-width:280px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside header { padding:14px 14px 10px; border-bottom:1px solid var(--line); }
  aside header h1 { font-size:15px; margin:0 0 4px; }
  aside header .sub { color:var(--muted); font-size:12px; }
  #modfilter { width:100%; margin-top:8px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  #modlist { overflow:auto; flex:1; padding:6px 0 20px; }
  .grp { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:10px 14px 4px; }
  .mod { display:flex; gap:8px; align-items:center; padding:5px 14px; cursor:pointer; border-left:3px solid transparent; }
  .mod:hover { background:#f0f3f8; }
  .mod.sel { background:#e8eef9; border-left-color:var(--accent); }
  .mod .n { color:var(--muted); font-variant-numeric:tabular-nums; width:20px; }
  .mod .t { flex:1; }
  .pill { font-size:11px; padding:0 6px; border-radius:9px; background:#eceff3; color:var(--muted); white-space:nowrap; }
  .pill.h { background:#fbe3e3; color:#9b1c1c; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  nav.tabs { display:flex; gap:2px; padding:8px 12px 0; background:var(--panel); border-bottom:1px solid var(--line); }
  nav.tabs button { border:1px solid transparent; border-bottom:none; background:none; padding:8px 14px; font:inherit; cursor:pointer; color:var(--muted); border-radius:6px 6px 0 0; }
  nav.tabs button.on { background:var(--bg); border-color:var(--line); color:var(--ink); font-weight:600; margin-bottom:-1px; }
  .view { display:none; flex:1; overflow:auto; }
  .view.on { display:flex; }
  #v-map { flex-direction:row; }
  #mapwrap { flex:1; overflow:auto; position:relative; }
  #map { display:block; }
  #map .node rect { fill:#fff; stroke:#9aa3b0; stroke-width:1; rx:6; }
  #map .node text { font-size:11.5px; fill:var(--ink); pointer-events:none; }
  #map .node { cursor:pointer; }
  #map .node.sel rect { stroke:var(--accent); stroke-width:2.5; fill:#e8eef9; }
  #map .node.nb rect { stroke:var(--accent); fill:var(--hi); }
  #map .edge { fill:none; stroke-width:1.4; opacity:.75; }
  #map .edge.ok { stroke:var(--ok); }
  #map .edge.bad { stroke:var(--bad); stroke-dasharray:6 4; }
  #map .edge.hl { stroke-width:2.6; opacity:1; }
  #map.focus .node:not(.sel):not(.nb) { opacity:.2; }
  #map.focus .edge:not(.hl) { opacity:.06; }
  #map .gtitle { font-size:12px; font-weight:600; fill:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #map .gbox { fill:#eef1f5; stroke:none; rx:10; }
  #card { width:360px; min-width:360px; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 16px; }
  #card h2 { font-size:16px; margin:0 0 6px; }
  #card .muted, .muted { color:var(--muted); }
  #card ul { padding-left:18px; margin:6px 0 12px; }
  #card li { margin:3px 0; }
  .legend { display:flex; gap:16px; align-items:center; padding:8px 12px; font-size:12px; color:var(--muted); }
  .legend svg { vertical-align:middle; }
  .linkok { color:var(--ok); font-weight:600; } .linkbad { color:var(--bad); font-weight:600; }
  code { font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#eef1f5; padding:0 3px; border-radius:3px; word-break:break-word; }
  button.btn { border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  button.btn:hover { border-color:var(--accent); }
  #v-mod, #v-doc { display:none; justify-content:center; }
  #v-mod.on, #v-doc.on { display:flex; }
  .md { max-width:1100px; width:100%; padding:20px 28px 60px; background:var(--panel); }
  .md h1 { font-size:22px; } .md h2 { font-size:17px; margin-top:26px; border-bottom:1px solid var(--line); padding-bottom:4px; } .md h3 { font-size:15px; }
  .md table { border-collapse:collapse; width:100%; margin:8px 0 14px; font-size:13px; }
  .md th, .md td { border:1px solid var(--line); padding:5px 7px; text-align:left; vertical-align:top; }
  .md th { background:#f0f3f7; }
  .md pre { background:#f3f5f8; padding:10px; overflow:auto; border-radius:6px; }
  .md pre code { background:none; padding:0; }
  .md a { color:var(--accent); }
  #v-gaps { flex-direction:column; }
  .filters { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  .filters fieldset { border:1px solid var(--line); border-radius:6px; padding:3px 8px 5px; margin:0; }
  .filters legend { font-size:11px; color:var(--muted); padding:0 4px; }
  .filters label { margin-right:8px; white-space:nowrap; font-size:13px; }
  .filters input[type=search] { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; width:260px; }
  .filters select { padding:5px; border:1px solid var(--line); border-radius:6px; font:inherit; max-width:240px; }
  #gapcount { color:var(--muted); font-size:13px; }
  table.gaps { border-collapse:collapse; width:100%; background:var(--panel); font-size:13px; }
  table.gaps th { position:sticky; top:0; background:#f0f3f7; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  table.gaps td { padding:6px 8px; border-bottom:1px solid #eceff3; vertical-align:top; }
  table.gaps tr:hover td { background:#fafbfd; }
  .sev { font-weight:600; font-size:12px; text-transform:uppercase; }
  .sev.high { color:#9b1c1c; } .sev.medium { color:#8a5a00; } .sev.low { color:var(--muted); }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; border:1px solid var(--line); }
  a.modlink { color:var(--accent); cursor:pointer; text-decoration:none; }
  a.modlink:hover { text-decoration:underline; }
  #tip { position:fixed; pointer-events:none; background:#1d2330; color:#fff; font-size:12px; padding:6px 8px; border-radius:6px; max-width:380px; display:none; z-index:10; }
</style>
</head>

tions or components | What they do |\n|---|---|---|---|\n| `src/main.tsx` | screen (entry) | top-level script | `?lvds-export` → headless renderer (`src/headless/rendererExport`); otherwise `watchForErrors`, `loadPrefs` → `applyTheme` / `applyPalette`, renders `\u003cErrorBoundary level=\"app\">\u003cApp/>` |\n| `src/App.tsx` | screen + store | `App`, `normalised`, `setView`, `commands`, `runNow`, `loadIntoApp`, `saveProject`, `guard`, `pickBoard`, keyboard `onKey` effect (`:1081`) | The whole shell: ~100 `useState` values, the routing chain (`:1350`–`:1697`), all dialogs, the ribbon wiring (`:1243`–`:1335`) |\n| `src/components/Ribbon.tsx` | screen | `Ribbon`, `RibbonActions`, `TAB_VIEWS`, `TAB_PAGE`, `HOME_TAB`, `tabForView`, `viewForTab`, `tabForStage`, `CAD_TABS`, `STAGE_TABS` | Ribbon tabs (Project, Load schedule, SLD, Design CAD, Stages 1–4, Documents, BOM / Cost, Standards) and which screens belong to which tab |\n| `src/components/CommandPalette.tsx` | screen | `CommandPalette`, `filterCommands`, `SHORTCUTS`, `ShortcutHelp` | ⌘K search over boards, sheets, pages, commands; the shortcut list (also shown in Help) |\n| `src/components/MenuButton.tsx` | screen | `MenuButton` | Drop-down button used on the SLD command bar (+ Add, feeder menu) |\n| `src/components/PreferencesDialog.tsx` | screen | `PreferencesDialog` | My details, New project defaults, Appearance & saving (theme, palette, CAD labels, recovery interval) |\n| `src/model/profile.ts` (shell use only) | store | `loadPrefs`, `savePrefs` (`localStorage['lvds.preferences']`), `applyDefaults`, `applyProfile` | Where preferences live; owned by 03 |\n| `src/components/WhatsNewDialog.tsx` | screen | `WhatsNewDialog` | What's new window with \"Open …\" buttons |\n| `src/model/whatsNew.ts` | model + store | `RELEASES`, `compareVersions`, `unseenReleases`, `pendingReleases`, `markSeen` (`localStorage['lvds.whatsNewSeen']`) | Release notes and \"seen\" bookkeeping |\n| `src/model/appVersion.ts` | model | `display defaults | 03-parameters-rules | `src/model/profile.ts` `loadPrefs` (`App.tsx` `useState(loadPrefs)`), `applyDefaults` in `App.createProject` |\n| Design stage, tender route | 03-parameters-rules | `src/model/designStage.ts` `stageOf`, `nextStage`, `advanceStage`, `stepBackStage` (`App.issueStage`, `App.stepBack`) |\n| Feeder results, earthing, selectivity of a run | 06-network-sld-editor (with 09, 10) | `src/calc/runs.ts` `runCalculations` → `evaluateProject` (`src/calc/electrical.ts`), `evaluateEarthingAll`, `evaluateSelectivity` |\n| Generator / transformer-outage scenario | 12-transformer-generator | `src/calc/scenario.ts` `generatorScenario`, `transformerOutage` → `evaluateProject` (`App.tsx:481`, live, not on demand) |\n| External engine results | 16-load-flow-engines | `src/engines` `EXTERNAL_ENGINES[].run` (`App.runSimulation`) |\n| Database (Excel workbooks) | 32-component-database | `window.lvds.database.init/read/onChange` → `App.receiveDatabase` → `parseDatabase`, `applyDatabase`, `syncLibrary` |\n| CAD drawing state | 21-cad-core | `src/components/cad/cadState.ts` `useCad` (`cadS`), `rememberedDrawing`; `src/engines/cad/cadEngine.ts` `chooseDrawing`, `openDrawing` |\n| Sheet set, sheet markup UI | 23-cad-sheets-plot-titleblock / 24-drawings-sld-sheets | `src/model/drawingSet.ts` `setOf`, `publishState`, `earthSheetFor`; `src/components/sld/sheetUi.ts` `useSheetUi` |\n| \"Record as submission\" offer | 27-review-submissions-authority | `src/model/submissions.ts` `onSubmissionOffer`, `draftFromOffer` |\n| ELV packages for the inbox | 29-elv / 30-exchange-inbox | `ElvView onSend`, `InboxView onOpen` → `App` `inbox` state (`App.tsx:338`) |\n| Desktop bridge (files, settings, logs, pending CAD file) | 34-electron-desktop | `window.lvds` (`electron/preload.cjs`); `hasBridge`, `hasDatabase` (`App.tsx`) |\n| Headless export window | 31-headless-cli-mcp | `src/main.tsx` `?lvds-export` → `src/headless/rendererExport.install` |\n\n## 4. Outputs — where its results oard` | 28 | home, concept | yes | Every project opens here (`loadIntoApp`) |\n| building | `BuildingView` | 04 | home, concept | yes | |\n| load-assessment | `LoadAssessmentView` | 04 | concept | yes | |\n| design | SLD workspace (`SystemDiagram`, `BoardSheetView`, `RiserView`, `EarthingView embedded`) | 06 | sld, home, schematic | yes | Renders only when a board exists |\n| cad | `CadPage` | 21 | cad | yes | |\n| space-planning | `SpacePlanView` | 05 | concept | yes | |\n| substation-area | `SubstationAreaView` | 05 | concept | yes | |\n| enclosure | `EnclosureSizing` | 17 | schedule, sld | yes | |\n| earth-schematic | `EarthingView` | 09 | schematic | yes | |\n| panels | `PanelsPage` | 07 | sld, schematic | yes | |\n| load-schedule | `LoadScheduleView` | 07 | schedule, reports | yes | Renders only when a board exists |\n| calculators | `QuickCalcs` | 33 | sld (More) | yes | |\n| pfc | `PfcStudy` | 13 | schematic | yes | |\n| busbar | `BusbarStudy` | 14 | schematic | yes | |\n| ups | `UpsStudy` | 15 | schematic | yes | |\n| solar | `SolarStudy` | 15 | schematic | yes | |\n| engines | `EngineCompare` | 16 | sld (More) | yes | |\n| drawings | `CadSheets` | 24 / 23 | cad | yes | |\n| cable-tray | `TrayScheduleView` | 19 | reports | yes | |\n| study-reports | `StudyReportsView` | 25 | reports | yes | |\n| boq | `BomView` | 20 | cost | yes | Reached through `onBom` commands |\n| export-centre | `ExportCentre` | 25 | reports | no | |\n| revisions | `RevisionsView` + `CheckpointsPanel` | 26 | issue | yes | |\n| modifications | `ChangesView` | 26 | issue | yes | |\n| review | `ReviewView` | 27 | issue | yes | |\n| received-docs | `ReceivedDocsView` | 27 | issue | yes | |\n| submissions | `SubmissionsView` | 27 | issue | yes | |\n| database | `DatabaseView` | 32 | standards | yes | |\n| design-references | `DesignReferencesView` | 27 | standards | yes | |\n| elv | `ElvView` | 29 | schematic | yes | |\n| inbox | `InboxView` | 30 | schematic | yes | |\n\n## 5. User flow — from button click to result\n\n**Start-up**\n1. `src/main.tsx` checks `?lvds-export`; otherwise `watchForErrors()`, `loadPrefs()` → `applyTheme` / `applyPalette`, renders `App` inside `ErrorBoundary level=\"app\"`.\n2. `App` loads `normalised(sampleProject)` into `useHistory`, runs `runCalculations` on it, reads `pendingReleases(__APP_VERSION__)` (What's new) and starts on `view = 'projects'`.\n3. Effects: `refreshList`, `readRecoveries` (recovery bar), `window.lvds.settings.get` (projects folder), `initDatabase` → `receiveDatabase`, `cadFile.takePending` (a drawing opened from Finder / Explorer).\n\n**Open a project**\n1. Projects page `onOpen` → `App.openProject` → `guard` (asks about unsaved changes via `UnsavedDialog`).\n2. `loadProjectStamped` → `App.loadIntoApp`: `checkProjectShape`, `normalised`, `history.load`, `cadS.projectOpened`, `setRun(runCalculations(opened))`, merge presets, `setView('dashboard')`.\n3. `useEffect([project.id])` sets the ribbon tab of the design stage (`tabForStage`).\n\n**Navigate**\n1. A ribbon button calls `a.onView(v)` → `App.setView` → `setViewState(v)` and `setRibbonTab(tabForView(v, tab))`.\n2. A ribbon tab click → `onTab` → `viewForTab(t, view)` (stays on the page if it belongs to the tab, else `TAB_PAGE[t]`).\n3. The routing chain renders the matching screen inside `ErrorBoundary level=\"page\"` and `Suspense` (page code loads on first use, `lazyPage`).\n\n**Run the studies**\n\n**⌘K palette**\n1. `onKey` (⌘K, not on Projects) → `setPaletteOpen`.\n2. `CommandPalette commands={commands()}` → `filterCommands` → `run()`.\n\n## 6. Linked to (working connections)\n\n- 03-parameters-rules: preferences and defaults (`PreferencesDialog`, `applyDefaults`, `applyProfile`), stage gate (`issueStage`, `stepBack`), project settings dialog (`ProjectSettings onSave` re-sizes schedule circuits with `refreshBoard`).\n- 06-network-sld-editor: SLD workspace, panel tree, board / feeder forms, drag-and-drop (`dropItem`, `moveItem`), copy / paste board, delete.\n- 16-load-flow-engines: external engine run and comparison (`runSimulation`, `resultsNote`).\n- 21-cad-core: `useCad` state survives page changes; ribbon CAD tools run on the CAD page through `cadDo`.\n- 23 / 24: sheet tabs and markup tools on the ribbon (`sheetRibbon`), Output dialogs (`OutputDialogs`).\n- 27: submission offer bar after a PDF (`onSubmissionOffer`).\n- 28: dashboard to-do items navigate with `onGo` (board, feeder, view).\n- 32: database sync on start and on every Excel save (`receiveDatabase`).\n- 34: desktop bridge; `will-prevent-unload` in `electron/main.cjs` shows the unsaved-changes question raised by `App`'s `beforeunload`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"02-project-storage","name":"Project data & storage","full":"Project data & storage","group":"Core platform","summary":" This module is the \"filing cabinet\" of the app.","files":[{"path":"src/types.ts","kind":"model","symbols":["Project","ProjectStatus","Board","Feeder"]},{"path":"src/model/projectStore.ts","kind":"store","symbols":["listProjects","loadProjectStamped","saveProjectFile","deleteProjectFile","listTrash","restoreProject","emptyTrash","writeRecovery","readRecoveries","clearRecovery","keepUnsavedWork","touchRecent","pickProject","metaOf"]},{"path":"src/model/projectMigrate.ts","kind":"model","symbols":["CURRENT_SCHEMA","migrateProject","isFutureSchema","legacyIdFor","newProjectId","copyProject","withFolder","withItemCounts"]},{"path":"src/model/projectValidate.ts","kind":"model","symbols":["checkProjectShape","ProjectFileError","projectInputIssues"]},{"path":"src/model/projectSafety.ts","kind":"model","symbols":["unsafeReason","LIMITS"]},{"path":"src/model/saveSafety.ts","kind":"model","symbols":["FileStamp","SaveOutcome","projectFingerprint","diffSections"]},{"path":"src/model/unsaved.ts","kind":"store","symbols":["useUnsaved"]},{"path":"src/model/hi c/model/projectMigrate.ts:withItemCounts"},{"to":"09-earthing","dir":"both","status":"working","what":"persistent earth pit IDs added on open and edit; earthing plan type checks","ref":"src/App.tsx:normalised"},{"to":"19-cable-tray-containment","dir":"in","status":"working","what":"cable reference numbers added on open and as a no-undo patch","ref":"src/App.tsx:normalised"},{"to":"23-cad-sheets-plot-titleblock","dir":"in","status":"working","what":"markups, title-block templates and logo checked before a file opens","ref":""},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"data link","ref":"src/calc/dashboard.ts:204"},{"to":"25-reports-exports","dir":"out","status":"working","what":"calculation record uses input issues; anonymized calc report","ref":"src/docs/calcRecord.ts:49"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"same shape check and migration; refuses newer-version files","ref":"src/headless/project.ts:56"},{"to":"20-equipment-boq-pricing","dir":"both","status":"working","what":"price list copy in the project; BOQ revisions hashed for unsaved/changed checks","ref":"src/model/saveSafety.ts:projectFingerprint"},{"to":"32-component-database","dir":"both","status":"working","what":"user libraries synced to the database folder, not to the project","ref":"src/database/librarySync.ts:LIBRARY_KEYS"}],"gaps":[],"md":"# 02 — Project storage (data model, open/save, autosave, backups, migration, validation, undo, project folders)\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module is the \"filing cabinet\" of the app. It defines what a project *is* (the `Project` type in `src/types.ts`:\npanels, circuits and about 100 optional sections) and keeps that project safe:\n\n- **Store** = the place the app keeps the open project in memory. Here it is a React state with undo/redo\n  (`useHistory` in `src/model/history.ts`), created in `App` (`src/App.tsx:208`).\n- **Open / save**: one JSON file per project in the projects folder (desktop, via the Electron main process,\n  `electron/main.cjs` + `electron/projectFiles.cjs`), or the browser's own storage (`localStorage`) in the web version\n  (`src/model/projectStore.ts`).\n- **Migration** = bringing an older file up to the current file format (`migrateProject`, `CURRENT_SCHEMA = 3`).\n  A file from a *newer* app opens read-only.\n- **Trash** (30 days), **portable backup** (`.lvds-backup` zip with checkpoints and SHA-256 checks), **project list**\n  (search, filter, archive, details), **anonymized sample** export, and **project folder templates** (model only so far).\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/types.ts:503` | model | `Project`, `ProjectStatus`, `Board`, `Feeder` | The project data model. Only `name`, `voltageV`, `frequencyHz`, `ambientC`, `vdLimitPct`, `boards`, `feeders`, `updatedAt` are required; everything else is optional. |\n| `src/model/projectStore.ts` | store | `listProjects`, `loadProjectStamped`, `saveProjectFile`, `deleteProjectFile`, `listTrash`, `restoreProject`, `emptyTrash`, `writeRecovery`, `readRecoveries`, `clearRecovery`, `keepUnsavedWork`, `touchRecent`, `pickProject`, `metaOf` | One API for desktop (calls `window.lvds.projects.*`) and browser (`localStorage` keys `lvds.projects`, `lvds.project.\u003cfile>`, `lvds.trash`, `lvds.recovery.\u003cid>`, `lvds.recent`). |\n| `src/model/projectValidate.ts` | model | `checkProjectShape`, `ProjectFileError`, `projectInputIssues` | Refuses a file without boards/feeders/ids; lists impossible engineering inputs (V, Hz, VD %, kW, pf, mm², A, kA, cores, load items). |\n| `src/model/saveSafety.ts` | model | `FileStamp`, `SaveOutcome`, `projectFingerprint`, `diffSections` | Content hash for \"unsaved?\" and the section-by-section diff shown in a conflict. |\n| `src/model/unsaved.ts` | store | `useUnsaved` | \"Unsaved\" = content differs from last saved (fingerprint, 300 ms after the last edit). |\n| `src/model/history.ts` | store | `useHistory`, `record`, `undo`, `redo`, `reset`, `MAX_STEPS = 100` | Undo/redo of whole-project snapshots; edits within 600 ms merge into one step; `patch` changes without an undo step. |\n| `src/model/stableIds.ts` | model | `withUids` | Permanent `uid` on every board and circuit (survives rename); derived (deterministic) on open, random on copy. |\n| `src/model/edit.ts` | model | `boardAndDescendants`, `deleteBoard` | Deletes a panel, everything below it and its incomer, then `removeDanglingReferences`. |\n| `src/model/projectBackup.ts` | model | `buildBackup`, `readBackup`, `readBackupFile`, `checkpointsFor` | `.lvds-backup` zip: project + checkpoints + manifest with SHA-256; zip-bomb limits (200 MB zip, 512 MB unpacked, 500 files, ratio 100). |\n| `src/model/checkpoints.ts` | store | `newCheckpoint`, `saveCheckpoint`, `restoredFrom`, `autoCheckpoint`, `idbStore` | Named safety copies in IndexedDB `lvds-checkpoints` (this computer only). Owned by 26-revisions-changes; used here by backups. |\n| `src/model/projectList.ts` | model | `filterProjects`, `sortProjects`, `facets`, `detailsOf`, `applyDetails`, `parseTags`, `withArchived` | Projects list search/filter/sort and the details dialog. |\n| `src/model/anonymize.ts` | model | `anonymizeProject`, `ANONYMIZED_NAME`, `anonymizedFileName` | Allowlist copy of the electrical model with ids replaced (P01…, C001…). |\n| `src/model/folderRoles.ts` | model | `ROLE_CATALOGUE`, `isRole`, `roleById`, `DOC_TYPES` | What each project folder is for (calcVd, drawingsIssued, boq…). |\n| `src/model/folderTemplates.ts` | model | `ProjectFolder`, `FolderTemplate`, `validateTemplate`, `applyOverrides`, `expandTemplate`, `resolveRole`, `readProjectFolder`, `diffTemplates` | Folder-template tree, naming rule, project overrides. Pure functions. |\n| `src/model/folderTemplateBuiltins.ts` | model | `BUILT_IN_TEMPLATES`, `DEFAULT_TEMPLATE_ID`, `builtInTemplate`, `fromOutline` | Five built-in templates (consultant, villa, contractor, ISO 19650, multi-building). |\n| `src/components/SaveDialogs.tsx` | screen | `ConflictDialog`, `CompareDialog`, `ExternalChangeBar` | Conflict choices (overwrite / save copy / use disk), compare two files, \"file changed on disk\" bar. |\n| `src/components/ProjectSettings.tsx` | screen | `ProjectSettings` | Design-basis modal (V, Hz, ambient, VD limit, study targets, form header data, design rules). Mainly 03-parameters-rules. |\n| `src/components/ProjectDetailsDialog.tsx` | screen | `ProjectDetailsDialog` | Name, status, parties, tags, notes from the Projects list. |\n| `src/components/AnonymizedSampleDialog.tsx` | screen | `AnonymizedSampleDialog` | Saves the anonymized JSON or its calculation-report PDF. |\n| `src/data/sampleProject.ts` | model | `sampleProject` | Demonstration project opened at start-up. |\n| `src/util/files.ts` | report | `saveText`, `saveBinary`, `saveBinaryAt`, `toCsv`, `savePdf`, `renderPdf`, `pdfAuthor` | Save dialogs / downloads used by backup and anonymized export (mostly 25-reports-exports). |\n| `src/util/webApp.ts:92` | store | `chooseProjectFile`, `downloadProjectFile`, `backupContents` | Browser open / download of a project JSON. |\n| `src/util/sanitize.ts` | model | `sanitizeSvg`, `sanitizedSvgFragment` | DOMPurify \"second line\" before project text reaches the page. |\n| `electron/projectFiles.cjs` | store | `writeFileSafe`, `stampOf`, `decideSave`, `uniqueFileName`, `conflictSiblings`, `writeRecovery`, `readRecoveries`, `listProjectsMeta`, `metaFromProject`, `moveToTrash`, `listTrash`, `restoreFromTrash`, `purgeTrash` | Disk side of projects, recovery copies, list cache and trash (plain Node, unit-tested). |\n| `electron/main.cjs:189-286` | store | IPC `projects:list/read/load/stat/save/pick/delete/trashList/restore/emptyTrash`, `recovery:*`, `readProject`, `projectPath` | The IPC handlers (IPC = messages between the window and the desktop main process). `.bak` fallback for a damaged file. |\n| `electron/folderTemplates.cjs` | store | `read`, `save`, `remove`, `setDefault`, `importText`, `exportText` | User folder templates in `folder-templates.json` (app settings folder). |\n| `electron/limits.cjs`, `electron/ipcValidate.cjs:67` | store | `LIMITS.projectBytes = 50 MB`, `assertJsonWithin`, `projectSaveArgs`, `recoveryArgs` | Size limits on save, open and recovery. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Every edit to the project (boards, feeders, studies, CAD, sheets…) | all editing modules, e.g. 06-network-sld-editor, 07-load-schedule-panels, 21-cad-core | `src/App.tsx:setProject` → `useHistory.set` |\n| User name for `createdBy` / `updatedBy`, autosave interval | 01-app-shell (preferences) | `src/model/profile.ts:DEFAULT_PREFS`, `App.saveProject` |\n| Point counts from load items (used by migration) | 07-load-schedule-panels | `src/calc/loadSchedule.ts:pointsWithItems` via `projectMigrate.ts:withItemCounts` |\n| Persistent earth pit IDs (added on open and every edit) | 09-earthing | `src/model/earthingPlan.ts:withEarthPitIds` in `App.normalised` / `setProject` |\n| Cable reference numbers (added on open and every feeder change) | 19-cable-tray-containment | `src/model/cableRefs.ts:withCableRefs` in `App.normalised` and the `patchHistory(withCableRefs)` effect (`App.tsx:242`) |\n| Current revision id for the project list | 26-revisions-changes | `src/model/revisions.ts:currentRevision` in `metaOf` |\n| Checkpoints for a backup | 26-revisions-changes | `src/model/checkpoints.ts:idbStore` in `CheckpointsPanel.exportBackup` |\n| File bytes, stamps, trash, recovery folder | 34-electron-desktop | `electron/main.cjs` IPC handlers, `electron/projectFiles.cjs` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| The open `Project` (whole app reads it) | every module | `App.tsx: history.value` |\n| Input issues / references in the calculation record | 25-reports-exports | `src/docs/calcRecord.ts:49-50` |\n| Project list rows (`ProjectMeta`) | 28-dashboard-readiness (projects dashboard) | `projectStore.ts:listProjects`, `projectFiles.cjs:listProjectsMeta` |\n| Shape check, migration, future-version refusal for the CLI/MCP | 31-headless-cli-mcp | `src/headless/project.ts:56-58` |\n| `deleteBoard`, `removeDanglingReferences` | 06-network-sld-editor, 12-transformer-generator, 31-headless-cli-mcp | `App.tsx:939`, `TxSummaryView.tsx:26`, `headless/editTools.ts:320,342`, `model/mdFeeders.ts:43` |\n| Anonymized calculation-report PDF | 25-reports-exports | `AnonymizedSampleDialog.tsx` → `docs/calcReport.ts:buildReportHtml` |\n| Fingerprint for \"changed since revision\" | 26-revisions-changes | `saveSafety.ts:projectFingerprint` (also `unsaved.ts`) |\n\n## 5. User flow — from button click to result\n\n**Open (desktop)**\n1. Projects list → click a project → `App.openProject(file)`; `guard()` asks `UnsavedDialog` if `dirty`.\n2. `projectStore.loadProjectStamped` → IPC `projects:read` → `main.cjs:readProject` reads ≤ 50 MB (`readTextFileLimited`), hashes it (`stampOf`), parses. Parse error → opens `\u003cfile>.bak` and flags `_restoredFromBackup` (renderer shows an alert).\n5. `isFutureSchema` → read-only banner; `runCalculations(opened)`; feeder presets in the file join this computer's presets (`mergePresets`).\n\n**Save (Ctrl+S)**\n1. `App.saveProject()` → blocked if read-only (unless Save as).\n2. Adds `updatedAt`, `updatedBy`; `saveProjectFile(file, p, {expected: fileStamp})` → IPC `projects:save`.\n3. `ipcValidate.projectSaveArgs` (compact JSON ≤ 50 MB) → `decideSave(expected, disk)`; different hash → `{conflict}` → `ConflictDialog`.\n4. `writeFileSafe`: temp file → old file copied to `.bak` → rename → read back + SHA compare + `JSON.parse` → new stamp.\n5. `setSaved`, `clearRecovery(id)`, recent list, status \"Saved …\".\n\n## 6. Linked to (working connections)\n\n- **34-electron-desktop**: all disk work goes through IPC handlers that validate names (`projectPath`), refuse links, limit sizes and write atomically (`writeFileSafe`).\n- **28-dashboard-readiness**: `projectInputIssues` + `checkReferences` feed the To do list; `listProjectsMeta` with a cache (`projects-index.json`) feeds the Projects list; sync-tool conflicted copies are tagged (`conflictSiblings`).\n- **31-headless-cli-mcp**: uses the same `checkProjectShape` + `migrateProject`, and refuses newer-version files.\n- **06-network-sld-editor**: `withUids` gives every board/circuit a permanent uid on every edit (`App.setProject`).\n- **25-reports-exports**: anonymized sample and its calculation report.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"03-parameters-rules","name":"Parameters & design rules","full":"Parameters & design rules","group":"Core platform","summary":"Holds the design basis (voltage, frequency, ambient, VD limit, VD temperature, ground/soil, study settings, design rule rows) and the sources that fill it: app defaults, Parameters.xlsx, profile defaults, setup templates and design references. It also covers {Name} text parameters, feeder presets and design stages. Many calculations still use fixed numbers (TN-S, k = 143, XLPE ambient table, method E, 1 % sub-main VD budget, 0.85 margins, 50 Hz reactance) instead of project parameters.","files":[{"path":"src/types.ts","kind":"model","symbols":["Project","StudySettings","STUDY_DEFAULTS","settingsOf","newProject","ProjectParams"]},{"path":"src/components/ProjectSettings.tsx","kind":"screen","symbols":["ProjectSettings"]},{"path":"src/model/designRules.ts","kind":"model","symbols":["RULE_KINDS","resolveRule","matches","hasRules","ruleKey","normaliseRules","ruleIssues"]},{"path":"src/components/docs/RuleRows.tsx","kind":"screen","symbols":["RuleRows","appliesText","newRule"]},{"path":"src/model/params.ts","kind":"model","symbols":["paramList","PEOPLE","fillParams","boardValue","boardParamNames","evaluate"]},{"path":"src/components/docs/ParametersView.tsx","kind":"screen","symbols":["ParametersView"]},{"path":"src/model/presets.ts","kind":"model","symbols":["BUILT_IN_PRESETS","loadUserPresets","saveUserPresets","mergePresets","presetFromFeeder","applyPreset","canDropPreset","presetCard","presetParts"]},{"path":"src/components/PresetEditor.tsx","kind":"screen","symbols":["PresetEditor"]},{"path":"src/model/profile.ts","kind":"model","symbols":["UserProfile","DesignDefaults","loadPrefs","savePrefs","applyDefaults","applyProfile","defaultsFromProject"]},{"path":"src/model/setupTemplate.ts","kind":"model","symbols":["SetupTemplate","templateFrom","briefFromTemplate","applyTemplateSystem","templateOverrides","loadTemplates","saveTemplates"]},{"path":"src/model/setupPreview.ts","kind":"model","symbols":["defaultsPreview","withTemplate"]},{"path":"src/model/designStage.ts","kind":"model","symbols":["STAGE_INFO","stageOf","stagesOf","nextStage","setStage","advanceStage","stepBackStage","splitByStage","viewStage"]},{"path":"src/database/database.ts","kind":"model","symbols":["PARAMETERS","projectDefaults","applyParameters"]},{"path":"src/database/catalog.ts","kind":"model","symbols":["RULES","rule"]}],"links":[{"to":"02-project-storage","dir":"both","status":"working","what":"parameters stored on Project; newProject defaults","ref":"src/types.ts:newProject"},{"to":"27-review-submissions-authority","dir":"in","status":"working","what":"design reference values and rule rows written into the project","ref":"src/model/designReference.ts:applyReference"},{"to":"06-network-sld-editor","dir":"out","status":"working","what":"voltage, ambient, VD limit and VD temperature used by the feeder evaluation; presets dropped on the SLD","ref":"src/calc/electrical.ts:evaluateFeeder"},{"to":"07-load-schedule-panels","dir":"out","status":"working","what":"min wire and ELCB from study settings and design rules","ref":"src/calc/loadSchedule.ts:minWireMm2"},{"to":"12-transformer-generator","dir":"out","status":"working","what":"growth, transformer and generator loading limits","ref":"src/calc/txGen.ts"},{"to":"16-load-flow-engines","dir":"out","status":"working","what":"voltage, frequency and VD temperature sent to OpenDSS / Python; MV 11 kV fixed","ref":"src/engines/opendss/exportDss.ts"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"{Name} text filled into SLD notes / title blocks; stage sheet status","ref":"src/model/params.ts:fillParams"},{"to":"23-cad-sheets-plot-titleblock","dir":"out","status":"working","what":"{Name} text in title blocks and plan layouts","ref":"src/model/titleBlock.ts"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"stage gate issues a revision and baseline; parameter changes in revision diffs","ref":"src/model/designStage.ts:advanceStage"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"to-do split by design stage","ref":"src/model/designStage.ts:splitByStage"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"read-only project settings","ref":"src/headless/tools.ts:103"}],"gaps":[],"md":"# 03 — Project parameters, design rules, presets, user profile, design stage\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module holds the **design basis values** a project is calculated with, and the places they come from:\n\n- **Project design values.** System voltage, frequency, design ambient, voltage-drop (VD) limit, VD conductor temperature, ground temperature and soil resistivity for buried cables, two strict-mode switches, and the **study settings**: PF target, future growth, transformer and generator maximum loading, minimum wire size and ELCB sensitivity for lighting and power circuits. These are fields on the `Project` object in `src/types.ts`. \"Object\" means one record in memory that is saved to the project file. The **Project settings** dialog (`src/components/ProjectSettings.tsx`) edits them.\n- **Design rules.** Rows such as \"power circuits, HVAC, from 5 kW → min wire 6 mm²\" that override the minimum-wire and ELCB settings for particular circuits (`src/model/designRules.ts`, editor `src/components/docs/RuleRows.tsx`).\n- **Text parameters** `{Name}`. Named values that are filled into title blocks, SLD notes and labels (`src/model/params.ts`, page `src/components/docs/ParametersView.tsx`). This is a text substitution system, **not** a calculation-parameter system.\n- **Feeder presets.** A whole outgoing way in one drag: breaker, RCD, meter, isolator, and the load or sub-board (`src/model/presets.ts`, editor `src/components/PresetEditor.tsx`).\n- **User profile and design defaults.** Kept on this computer and applied to every new project (`src/model/profile.ts`).\n- **Setup templates.** A saved \"kind of job\" (role, authority, scope, deliverables and four system values) applied once at project creation (`src/model/setupTemplate.ts`). There is also the preview of where each starting value comes from (`src/model/setupPreview.ts`).\n- **Design stage.** Concept → Schematic → Detailed → (Tender) → IFC, with stage gates that issue a revision and set a baseline. The stage also decides which to-do findings count (`src/model/designStage.ts`).\n\nThere are **five other sources** for the same values, owned by other modules: Parameters.xlsx (`src/database/database.ts`, module 32), Rules.xlsx (`src/database/catalog.ts`, module 32), design references and authority rule sets (`src/model/designReference.ts`, module 27), the profile defaults, and setup templates. Which one wins depends on the order in `App.tsx createProject` (§5).\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/types.ts:553-566, 1061-1085` | model | `Project.voltageV/frequencyHz/ambientC/vdLimitPct/vdTempC/groundTempC/soilResistivityKmW/strictFinalDisconnection/strictCableData`, `StudySettings`, `STUDY_DEFAULTS`, `settingsOf`, `newProject` | The parameter fields and app defaults: 415 V, 50 Hz, 45 °C, 4 %, PF target 0.95, 20 % growth, 80 % transformer and generator loading, 2.5 / 4 mm², 100 / 30 mA. Stored in the project file. |\n| `src/components/ProjectSettings.tsx` | screen | `ProjectSettings` (tabs `system`, `targets`, `forms`, `schedule`) | Edits every parameter above except `strictFinalDisconnection`. Embeds `RuleRows`. Blocks Save while `ruleIssues` reports problems. |\n| `src/model/designRules.ts` | model | `RULE_KINDS`, `resolveRule`, `matches`, `hasRules`, `ruleKey`, `normaliseRules`, `ruleIssues` | Rule rows for `minWireMm2` and `elcbMa`. The most specific matching row wins; a later row wins a tie. Stored in `Project.designRules`. |\n| `src/components/docs/RuleRows.tsx` | screen | `RuleRows`, `appliesText`, `newRule` | Table editor for rule rows. Rows from a design reference are shown greyed and read-only. |\n| `src/model/params.ts` | model | `paramList`, `PEOPLE`, `fillParams`, `boardValue`, `boardParamNames`, `evaluate` | `{Name}` and `{BOARD.Prop}` substitution in text. `evaluate` is a safe formula evaluator for user components. Values are stored in `Project.params`. |\n| `src/components/docs/ParametersView.tsx` | screen | `ParametersView` | Home → Parameters. Edits people, dates and custom values, and the SLD notes (`drawing.notes`). \"Save as\" writes notes to localStorage `lvds.sldNotes`. |\n| `src/model/presets.ts` | model | `BUILT_IN_PRESETS`, `loadUserPresets`, `saveUserPresets`, `mergePresets`, `presetFromFeeder`, `applyPreset`, `canDropPreset`, `presetCard`, `presetsFile`, `readPresetsFile` | Feeder presets. User presets are in localStorage `lvds.feederPresets`, with a copy in `Project.feederPresets`. `applyPreset` adds the board or load to the SLD and sizes it. |\n| `src/components/PresetEditor.tsx` | screen | `PresetEditor` | Modal that edits one preset. |\n| `src/model/profile.ts` | model | `UserProfile`, `DesignDefaults`, `AppPrefs`, `loadPrefs`, `savePrefs`, `applyDefaults`, `applyProfile`, `defaultsFromProject`, `readLogo` | The user's details and design defaults, in localStorage `lvds.preferences`. `applyDefaults` puts them into a new project. |\n| `src/model/setupTemplate.ts` | model | `SetupTemplate`, `templateFrom`, `briefFromTemplate`, `applyTemplateSystem`, `templateOverrides`, `loadTemplates`, `saveTemplates` | Job setup templates, in localStorage `lvds.setupTemplates`. The `system` part holds only voltage, frequency, ambient and VD limit. |\n| `src/model/setupPreview.ts` | model | `defaultsPreview`, `withTemplate` | Rows for the New project wizard: \"value, and where it came from\" (built-in / company database / your profile / setup template). |\n| `src/model/designStage.ts` | model | `STAGE_INFO`, `stageOf`, `stagesOf`, `nextStage`, `prevStage`, `setStage`, `advanceStage`, `stepBackStage`, `splitByStage`, `viewStage` | Stage and stage gates in `Project.stage`. `advanceStage` issues a revision (`issueRevision`) and sets a baseline (`setBaseline`). `splitByStage` decides which to-do items count at this stage. |\n| `src/database/database.ts:58-70, 337-353` | model (module 32) | `PARAMETERS`, `projectDefaults`, `applyParameters` | Parameters.xlsx: company defaults for 11 of the values. |\n| `src/model/designReference.ts` | model (module 27) | `REF_FIELDS`, `applyReference`, `referenceSourceOf`, `settingSource`, `changedSinceApplied` | Authority / standard / company value sets. When applied, they write into the parameter fields and `designRules`. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| App defaults for a new project | 02-project-storage | `src/types.ts newProject`, `STUDY_DEFAULTS` |\n| Company defaults (Parameters.xlsx) | 32-component-database | `src/database/database.ts projectDefaults` / `applyParameters` |\n| Global rules (Rules.xlsx) | 32-component-database | `src/database/catalog.ts rule` |\n| Authority / standard values and rule rows | 27-review-submissions-authority | `src/model/designReference.ts applyReference`, `resolveReference` |\n| Project brief (role, authority, scope) for templates | 04-building-load-assessment / 02-project-storage | `src/model/brief.ts deliverableCatalog`; `setupTemplate.ts templateFrom` |\n| System totals for `{TCL}`, `{MaxDemand}`, `{PF}`, `{TransformerKVA}`, board values | 06-network-sld-editor | `src/calc/summary.ts systemSummary`, `boardTotals`, `boardSummary` (called in `params.ts paramList` / `boardValue`) |\n| GFA for `{GFA}` | 04-building-load-assessment | `src/calc/building.ts builtUpAreaOf` |\n| Revision for `{Rev}` | 26-revisions-changes | `src/model/revisions.ts currentRevision` |\n| Feeder sizing when a preset is dropped | 11-breaker-cable-selection, 06-network-sld-editor | `src/calc/sizing.ts recommend`, `applyRecommendation`; `src/calc/electrical.ts selectCable`, `upstreamVoltageDropPct` |\n| To-do findings to split by stage | 28-dashboard-readiness | `src/calc/dashboard.ts TodoItem` → `designStage.ts splitByStage` |\n\n## 4. Outputs — where its results go\n\n### 4a. Which calc modules read each parameter (working links)\n\n| Parameter (field) | Read by (module ID) | File + function |\n|---|---|---|\n| `voltageV` | 06, 08, 09, 11, 12, 13, 15, 16, 07 | `electrical.ts designCurrentA:77-82`, `faultCurrentKA`, `supplyImpedance`; `voltageDrop.ts vdRow:85`; `earthing.ts disconnectionBasis:68`; `loadSchedule.ts elcbGroups:309`; `pfc.ts`; `SolarStudy.tsx sizePv(s, project.voltageV)`; `exportDss.ts`; `lvds_engine.py:140,346` |\n| `ambientC` | 06, 11, 14, 28 | `electrical.ts deratedAmpacityA:134`, `selectCableRuns:243`; `installation.ts ratingBasis:47`; `busbar.ts sizeRiser:161`; `dashboard.ts:205 ambientCheck` |\n| `vdLimitPct` | 06, 08, 11, 14, 16, 25 | `electrical.ts evaluateFeeder:412`; `voltageDrop.ts vdRow:89`; `sizing.ts recommend:286`; `busbar.ts:325`; `unbalancedFlow.ts:139`; `quickFix.ts:20`; `compliance.ts:94` |\n| `vdTempC` | 06, 08, 09, 16 | `electrical.ts:104,127`; `voltageDrop.ts:80`; `unbalancedFlow.ts:78`; `external.ts:12 rFactor`; `exportDss.ts:120` |\n| `groundTempC`, `soilResistivityKmW` | 11 | `installation.ts ratingBasis:43`, `groundChecks:75-76` |\n| `strictFinalDisconnection` | 09 | `earthing.ts disconnectionBasis:72` |\n| `strictCableData` | 11, 28 | `cableTable.ts cableDataFindings:210` |\n| `studySettings.pfTarget` | 13, 12, 06, 07 | `pfc.ts:151`; `txGen.ts:138`; `summary.ts:62`; `loadSchedule.ts:213` (`switchedOnBoard`) |\n| `futureGrowthPct`, `transformerMaxLoadingPct` | 12, 28, 33 | `sizing.ts:49`; `txGen.ts:116`; `parallelTx.ts:45`; `dashboard.ts:79`; `existing.ts:40` |\n| `generatorMaxLoadingPct` | 12 | `sizing.ts:128,175`; `txGen.ts:244` |\n| `minWire*`, `elcb*` + `designRules` | 07, 09, 20, 17 | `loadSchedule.ts minWireMm2:137`, `elcbGroups:330-335`; `schedule.ts refresh:21`; `earthing.ts rcdOf:240`; `bom.ts:135`; `enclosureLibrary.ts:136` |\n| `info.mdDemandFactor` | 07, 24 (forms only) | `docs/mdSheet.ts:110`, `docs/riserForm.ts:48` |\n| Rules.xlsx `motorStartVdLimitPct` | 08 | `voltageDrop.ts motorStartVdLimit:52`, `vdRow:110` |\n| Rules.xlsx `pfMinimum` | 13 | `pfcCalc.ts:152`, `docs/pfcReport.ts:60` |\n\n### 4b. Other outputs\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Design criteria table in the design basis report | 25-reports-exports | `src/docs/designBasis.ts:180-200` (`settingsOf`, `referenceSourceOf`) |\n| Calc report criteria | 25-reports-exports | `src/docs/calcReport.ts:88`, `calcSections.ts:62,76,95` |\n| `{Name}` text | 23-cad-sheets-plot-titleblock, 24-drawings-sld-sheets | `docs/sldSheet.ts`, `sheetDxf.ts`, `titleBlockDxf.ts`, `planLayout.ts:632`, `model/titleBlock.ts:191`, `model/components.ts:61` (`fillParams`) |\n| Preset placed on the SLD | 06-network-sld-editor | `src/model/sldEdit.ts:414 → applyPreset`; `EquipmentPalette.tsx` (`presetCard`) |\n| Stage status on sheets | 24-drawings-sld-sheets | `designStage.ts stampSheets` → `drawingSet.status` |\n| Stage gate revision and baseline | 26-revisions-changes | `advanceStage` → `issueRevision`, `setBaseline` |\n| Counted / later to-do items, readiness | 28-dashboard-readiness | `ProjectDashboard.tsx`, `calc/projectReadiness.ts` (`splitByStage`, `stageIndex`, `gateOf`) |\n| Parameter change tracking | 26-revisions-changes | `model/revisions.ts:141-143`, `model/designChanges.ts:73`, `model/changeClass.ts:34-35` |\n| Settings exposed to the CLI | 31-headless-cli-mcp | `src/headless/tools.ts:103` (read-only: voltage, frequency, ambient, VD limit) |\n| Design export contract | 30-exchange-inbox | `exchange/designExport.ts:69` (voltage, frequency and VD limit only) |\n\n## 5. User flow — from button click to result\n\n**New project**\n1. The wizard (`BriefEditor.tsx NewProjectWizard`) shows \"The project will start with\": `withTemplate(defaultsPreview(db, prefs), tpl)` (`BriefEditor.tsx:242`, `setupPreview.ts`).\n\n**Edit the design basis**\n1. Ribbon / Home → Project settings opens `ProjectSettings`. Edits go into a local copy `p`.\n2. On the Load schedule tab, `RuleRows` edits the project's own rule rows. `ruleIssues` blocks Save.\n4. The studies read the values through the functions in §4a.\n\n**Feeder preset**\n1. Drag a palette card (`EquipmentPalette.tsx presetCard`) onto a busbar → `sldEdit.ts:414` → `presets.ts applyPreset`.\n2. For a load preset, the draft feeder goes through `recommend(..., 'optimise')` + `applyRecommendation`. If the preset fixes the breaker rating, the cable is reselected with `selectCable` against `vdLimitPct × 0.85 − upstream`.\n4. Save as preset: `presetFromFeeder` → `saveUserPresets` (localStorage) and a copy in `Project.feederPresets` (`App.tsx:967`).\n\n**Stage gate**\n1. Dashboard / ribbon → `App.tsx:413 advanceStage` → `issueRevision` + `setBaseline` + gate record → the next stage's sheet status is stamped on the drawings.\n\n## 6. Linked to (working connections)\n\n- 06, 08, 09, 11, 12, 13, 14, 16 read voltage, ambient, VD limit, VD temperature and study settings through `settingsOf` and the `Project` fields (§4a).\n- 07-load-schedule-panels: design rules and study settings set the minimum wire and ELCB sensitivity (`loadSchedule.ts minWireMm2`, `elcbGroups`). `schedule.ts refresh` enforces the minimum wire on auto-sized circuits.\n- 27-review-submissions-authority: `applyReference` writes values and rules. `settingSource` shows \"From DEWA v2 · clause\" under the fields.\n- 32-component-database: Parameters.xlsx (`applyParameters`, also applied from the Database page, `App.tsx:1560`) and Rules.xlsx (`rule`).\n- 25-reports-exports: the design basis criteria table shows each value's source and flags app defaults (`designBasis.ts fromSettings`).\n- 26-revisions-changes: parameter edits appear in revision diffs (`revisions.ts:141-143`). Stage gates issue revisions.\n- 28-dashboard-readiness: `splitByStage` and `ambientCheck`.\n- 23 / 24: `fillParams` in title blocks, notes and DXF.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"32-component-database","name":"Component database & library","full":"Component database & library","group":"Core platform","summary":"The LV Database is a folder of 14 Excel workbooks (loads, cables, breakers, parameters, transformers, generators, busbar, equipment, room types, luminaires, unit types, prices, rules, cable schedule) plus Library.json, read by the desktop app and pushed into the calculation modules, with built-in fallbacks.","files":[{"path":"electron/databaseSpec.json","kind":"model","symbols":["folderName","books"]},{"path":"electron/database.cjs","kind":"store","symbols":["ensureDatabase","createWorkbook","readDatabase","readBook","watchDatabase","writeBook","backup","readLibrary","writeLibrary","folde ,{"to":"13-power-factor-correction","dir":"out","status":"working","what":"data link","ref":"src/calc/pfcCalc.ts:rule"},{"to":"18-lighting-emergency","dir":"out","status":"working","what":"Luminaires.xlsx for room lighting","ref":"src/calc/roomLighting.ts:luminairesOf"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"breaker/cable/equipment/tx/gen/busway prices and price lists","ref":"src/database/catalog.ts:catalogRate"},{"to":"22-cad-electrical","dir":"out","status":"working","what":"library loads for CAD block loads, luminaires","ref":"src/model/cadLoads.ts:pullCadLoads"},{"to":"03-parameters-rules","dir":"out","status":"working","what":"Parameters.xlsx defaults for new projects and Apply to this project","ref":"src/database/database.ts:applyParameters"},{"to":"17-enclosure-form4","dir":"out","status":"working","what":"BRAND_DEVICES, device dims and enclosure catalogues synced via Library.json; board keeps frozen enclosure","ref":"src/model/enclosureLibrary.ts:write"},{"to":"16-load-flow-engines","dir":"out","status":"working","what":"external engine request includes the active cable table","ref":"src/engines/external.ts:cables"},{"to":"25-reports-exports","dir":"out","status":"working","what":"cable data source notice on reports","ref":"src/calc/cableTable.ts:cableDataNotice"},{"to":"01-app-shell","dir":"in","status":"working","what":"Database view in the left menu","ref":"src/App.tsx:DatabaseView"}],"gaps":[],"md":"# 32 — Component database, catalogue, library sync, standard loads\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThe \"LV Database\" is a folder of 14 Excel workbooks (default `LV Database` inside the projects folder, or a folder the user picks, e.g. on Google Drive) plus one `Library.json` file. It is the app's shared equipment and rules library: a team edits it in Excel (or on the Database screen) and every computer that opens the same folder picks up the changes.\n\n| Workbook (`electron/databaseSpec.json` `books[].id`) | What the app does with it |\n|---|---|\n| `Loads.xlsx` (`loads`) | Equipment library: rows offered as \"From library\" on load schedules, circuit items, SLD palette and CAD block loads. Watts linked to a project follow later edits (`syncLibrary`). |\n| `Cables.xlsx` (`cables`) | R (20 °C), X, method-E current rating and method A1…D2 ratings per conductor size; rate per m for the BOQ. Replaces the built-in reference cable table for every calculation (`setCables`). |\n| `Breakers.xlsx` (`breakers`) | Breaker ratings the sizing may choose, Icu steps, breaker prices (`setBreakerLists`, `setBreakerPrices`). |\n| `Parameters.xlsx` (`parameters`) | Defaults for new projects (voltage, ambient, VD limit, study settings) — \"Apply to this project\" button. |\n| `Transformers.xlsx`, `Generators.xlsx` | Standard kVA lists for sizing, transformer %Z, generator kW, BOQ prices. |\n| `Busbar.xlsx` | Busway catalogue for the riser study (replaces `TYPICAL_BUSBAR_DATA`). |\n| `Equipment.xlsx`, `Prices.xlsx` | BOQ prices (by BOQ key) and price lists. |\n| `RoomTypes.xlsx`, `UnitTypes.xlsx` | Room types (W/m², generation rules) and flat layouts for Building information. |\n| `Luminaires.xlsx` | Luminaire list for \"Light room\" (lux). |\n| `Rules.xlsx` | Authority/company rules: minimum PF, motor-start VD limit, points per circuit, kWh meter limits, watts per point on generated DBs. |\n| `CableSchedule.xlsx` | Cable reference numbers on SLD sheets and the cable schedule. |\n\n\"Standard loads\" is a 21-item starter set (LED downlight 12 W, 13 A socket 200 W, water heater 3000 W …) that the user can review and append to `Loads.xlsx` from the Database screen.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `electron/databaseSpec.json` | model | `folderName`, `books[]` (id, file, sheet, about, columns with key/header/required/number/list/help) | One definition of every workbook, its columns and \"Read me\" text; shared by the Electron side and the screen. |\n| `electron/main.cjs` | store (IPC) | `initDatabase` (:375), handlers `database:init`, `database:read`, `database:write`, `database:library:read`, `database:library:write` (:388–392) | Bridges the window to `database.cjs` (\"IPC\" = messages between the window and the desktop process). |\n| `src/database/database.ts` | model / calc glue | `parseDatabase` (:96), `parseCatalog` (:197), `applyDatabase` (:291), `databaseSeeds` (:312), `projectDefaults` (:337), `applyParameters` (:350), `loadsForColumn` (:357), `findLibraryLoad` (:363), `loadItemFromLibrary` (:371), `syncLibrary` (:383), `PARAMETERS` (:59), types `Database`, `LibraryLoad`, `BreakerRow`, `RawDatabase` | Validates workbook rows (bad rows skipped and listed with Excel row number), pushes the data into the calculation modules, builds seed rows for new workbooks, and re-syncs library-linked watts in the open project. |\n| `src/database/catalog.ts` | store | `catalog()`, `setCatalog` (:34), `RULES` (:37), `rule` (:50), `transformerFor`, `generatorFor` (:52–53), `catalogRate` (:56), `EMPTY_CATALOG` | In-memory catalogue (transformers, generators, busbar, equipment, room types, luminaires, unit types, price lists, rules, cable refs) read by calc modules. |\n| `src/database/librarySync.ts` | store | `LIBRARY_KEYS` (:6), `pullLibrary` (:12), `pushLibrary` (:27) | Copies the 12 library keys between localStorage and `Library.json`. |\n| `src/data/brandDevices.ts` | model (data) | `BRAND_DEVICES` (:28) | 16 built-in manufacturer device dimensions (MCB…ACB, SPD, meter) for enclosure sizing and BOQ \"ref. … or approved equal\". |\n| `src/components/docs/DatabaseView.tsx` | screen | `DatabaseView` (:39), `save` (:88), `changes` memo (:69), `markSeen` (:82), `USED_FOR` (:14) | Database page: one tab per workbook, problems list, \"changed since you last looked\" (stored in `lvds.dbSeen`), Edit here / Save to Excel, Open in Excel, Database folder…, Apply to this project, Add standard loads… |\n| `src/components/docs/StandardLoadsDialog.tsx` | screen | `StandardLoadsDialog` (:13), `add` (:27) | Lets the user edit watts and untick items, then writes `Loads.xlsx` via `database.write('loads', …)`. |\n| `src/App.tsx` | store / shell | `receiveDatabase` (:355), `initDatabase` (:370), `db` state (:304), `hasDatabase` (:75), `'database'` view (:201, :1554) | Loads the database at start, re-applies it on every Excel save, syncs library watts in the open project, renders `DatabaseView`. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Workbook rows, folder path | 34-electron-desktop | `electron/database.cjs` `readDatabase`, `electron/main.cjs` `initDatabase` |\n| Database folder setting (own folder vs projects folder) | 34-electron-desktop | `electron/main.cjs` `settings:chooseDatabaseFolder` (:177), `database.setFolder` (:57) |\n| Built-in seed values (reference cables, breaker list, typical tx/gen, busbar, room types, luminaires, rules, cable refs) | 11-breaker-cable-selection, 12-transformer-generator, 14-busbar, 04-building-load-assessment, 18-lighting-emergency, 24-drawings-sld-sheets | `src/database/database.ts` `databaseSeeds` reads `REFERENCE_CABLE_TABLE`, `STANDARD_BREAKER_A`, `STANDARD_TRANSFORMER_KVA`, `typicalImpedancePct`, `TYPICAL_BUSBAR_DATA`, `DEFAULT_ROOM_TYPES`, `DEFAULT_RULES`, `LUMINAIRES`, `BUILT_IN_CABLES` |\n| Library items saved by other screens (title blocks, components, presets, price lists, enclosure catalogues, device dims, building presets, CAD layer templates…) | 23-cad-sheets-plot-titleblock, 20-equipment-boq-pricing, 17-enclosure-form4, 03-parameters-rules, 27-review-submissions-authority, 04-building-load-assessment, 21-cad-core | each module writes localStorage then calls `pushLibrary` (e.g. `src/model/titleBlock.ts:320`, `src/model/components.ts:94`, `src/model/enclosureLibrary.ts:21`, `src/model/presets.ts:72`) |\n| The open project (for `syncLibrary`, `applyParameters`) | 02-project-storage | `src/App.tsx` `receiveDatabase`, `onApplyParameters` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Cable R, X, ratings (`setCables` → `cables()`, `getCable`, `resolveCable`, `methodRating`) | 06-network-sld-editor, 08-voltage-drop, 09-earthing, 11-breaker-cable-selection, 16-load-flow-engines | `src/calc/cableTable.ts` `cables` (:124), `src/engines/external.ts:11` sends `cables()` to the external/Python engine |\n| Source of cable data notice | 25-reports-exports, 24-drawings-sld-sheets | `src/calc/cableTable.ts` `cableDataNotice`, used in `src/docs/calcReport.ts`, `studyReport.ts`, `studyWord.ts`, `sldSheet.ts` |\n| Breaker ratings and Icu steps (`breakerRatings()`, `icuSteps()`) | 06, 07-load-schedule-panels, 10, 11, 13, 33-quick-calcs-existing | `src/calc/sizing.ts` `setBreakerLists` (:23); readers: `quickFix.ts`, `pfc.ts`, `pfcCalc.ts`, `quick.ts`, `changeover.ts`, `dbSheet.ts`, `mdSheet.ts`, `CircuitEditDialog.tsx`, `LoadScheduleView.tsx` |\n| Breaker and cable prices | 20-equipment-boq-pricing | `src/data/rates.ts` `setBreakerPrices` (:16), `cableRatePerM` (:21), `breakerRateAed` (:25) |\n| Transformer / generator kVA lists (arrays changed in place) | 12-transformer-generator | `src/database/database.ts` `applyDatabase` (:300–301) → `STANDARD_TRANSFORMER_KVA`, `STANDARD_GENERATOR_KVA` |\n| Transformer %Z | 12-transformer-generator, 06 | `src/calc/txGen.ts` `typicalImpedancePct` (:43) via `transformerFor`; `src/model/transformers.ts:50` copies it into `Board.sourceImpedancePct` |\n| Generator kW | 12-transformer-generator | `src/calc/sizing.ts` `generatorRatedKw` (:95) via `generatorFor` |\n| tx/gen kVA for the MDB load assessment | 04-building-load-assessment | `src/calc/loadAssessment.ts` `txSizesOf` (:309), `genSizes` (:314) read `catalog()` |\n| Busway catalogue | 14-busbar | `applyDatabase` (:303–304) → `TYPICAL_BUSBAR_DATA` |\n| Room types, unit types | 04-building-load-assessment | `src/calc/building.ts` `roomTypesOf` (:44), `src/model/buildingPreset.ts` `unitTypeLibrary` (:240), `src/calc/loadAssessment.ts` `rowsFromRooms` (:250) |\n| Luminaires | 18-lighting-emergency, 22-cad-electrical | `src/calc/roomLighting.ts` `luminairesOf` (:22), `src/components/cad/RoomLightingPanel.tsx` |\n| Rules (`rule()`) | 13-power-factor-correction, 08-voltage-drop, 04-building-load-assessment, 07-load-schedule-panels | `pfcCalc.ts:152`, `pfcReport.ts:60`, `voltageDrop.ts:52` `motorStartVdLimit`, `buildingDesign.ts:40–45` `genPointWatts`/`meterFor`, `deviceEdit.ts:159` |\n| Equipment/tx/gen/busway prices, price lists | 20-equipment-boq-pricing | `src/model/priceList.ts` via `catalogRate`, `catalog().priceLists` (:31) |\n| Cable reference numbers | 24-drawings-sld-sheets, 19-cable-tray-containment | `src/model/cableRefs.ts` `standardCables` (:48), `allCableRefs` (:61) |\n| Library loads (`db.loads`) | 07-load-schedule-panels, 06-network-sld-editor, 22-cad-electrical | `LoadScheduleView.tsx:299`, `CircuitEditDialog.tsx:180–207`, `sldEdit.ts` `libraryEntries` (:144) / `applyDrop` (:350), `cadLoads.ts` `pullCadLoads` (:71), `App.tsx:1033, 1181, 1730, 1796` |\n| Project defaults from Parameters.xlsx | 03-parameters-rules, 02-project-storage | `applyParameters` used in `App.tsx:889` (new project), `App.tsx:1560`, `src/model/setupPreview.ts:15` |\n| Updated project (synced watts) | 07-load-schedule-panels, 02-project-storage | `syncLibrary` → `App.tsx` `receiveDatabase` (:361) |\n\n## 5. User flow — from button click to result\n\n**App start (desktop)**\n1. `App` mounts; `useEffect` (App.tsx:377) calls `initDatabase` (:370) when `hasDatabase` is true.\n3. `receiveDatabase` (App.tsx:355): `parseDatabase` validates rows → `applyDatabase` pushes cables, breaker lists, prices, catalogue and kVA/busway lists into the calc modules and clears the network cache (`forgetNetworks`) → `setDb`.\n4. Same function runs `syncLibrary` on the open project and `refreshBoard` on changed boards; status bar shows \"Database synced hh:mm\".\n5. `pullLibrary` copies `Library.json` keys into localStorage (or, if the file is empty, `pushLibrary` writes this computer's copy).\n\n**Editing in Excel**\n6. User saves a workbook in Excel → `fs.watch` in `watchDatabase` fires → `database:changed` message → `receiveDatabase` again (steps 3–4).\n\n**Database screen** (left menu \"Database\", view `'database'`)\n7. `DatabaseView` shows the tab's rows from `db.raw`; \"Edit here\" copies them into `draft`; \"Save to Excel\" → `save` (:88) checks required/number columns → `window.lvds.database.write` → `writeBook` (backup, then replace known-column cells) → `onRefresh` → `database.read()` → `receiveDatabase`.\n8. \"Apply to this project\" (Parameters tab) → `applyParameters` + `refreshBoard` for every board.\n9. \"Add standard loads…\" (Loads tab) → `StandardLoadsDialog` → `withStandardLoads` → `database.write('loads', rows)` → `onRefresh`.\n10. \"Database folder…\" → `settings.chooseDatabaseFolder` then `location.reload()`.\n\n**Using the library on a design**\n11. Load schedule WATT/UNIT \"From library\" (`LoadScheduleView.tsx:302`) stores the watts in `Board.pointWatts` and the item name in `Board.pointItems`; circuit items (`CircuitEditDialog`) store `reference`, `name`, `unitWatts` via `loadItemFromLibrary`. Those stored watts are what the calculations use, and `syncLibrary` overwrites them on the next database event.\n\n## 6. Linked to (working connections)\n\n- **11-breaker-cable-selection / 08 / 09 / 06**: Cables.xlsx → `setCables` → `cables()` / `getCable` / `methodRating`; unknown sizes fall back to reference values and are reported (`resolveCable` `'fallback'`, `cableDataNotice`).\n- **16-load-flow-engines**: external engine request includes `cables()` (`src/engines/external.ts:11`).\n- **11 / 07 / 10 / 13 / 33**: Breakers.xlsx → `breakerRatings()`, `icuSteps()` (list above).\n- **20-equipment-boq-pricing**: breaker prices, cable rate per m, Equipment/Prices/tx/gen/busway prices (`catalogRate`, `catalog().priceLists`).\n- **12-transformer-generator**: kVA lists replaced in place, %Z (`typicalImpedancePct`), generator kW (`generatorRatedKw`).\n- **14-busbar**: Busbar.xlsx replaces `TYPICAL_BUSBAR_DATA` in place.\n- **04-building-load-assessment**: room types, unit types, tx/gen kVA for the assessment, rules for generated DBs (`genPointWatts`, `meterFor`).\n- **18-lighting-emergency**: Luminaires.xlsx via `luminairesOf`.\n- **13-power-factor-correction / 08**: `rule('pfMinimum')`, `rule('motorStartVdLimitPct')`.\n- **24-drawings-sld-sheets**: CableSchedule.xlsx via `standardCables`.\n- **07-load-schedule-panels / 06 / 22**: library loads in schedules, circuit items, SLD palette, CAD block loads.\n- **03-parameters-rules / 02**: Parameters.xlsx defaults for new projects and \"Apply to this project\".\n- **17-enclosure-form4**: `BRAND_DEVICES` and synced `lvds.deviceDims` / `lvds.enclosureCatalogues`; the board keeps a frozen copy of the enclosure chosen (`Board.enclosure`, `src/types.ts:383`).\n- **34-electron-desktop**: IPC handlers, size limits (`LIMITS.workbookBytes` 20 MB, `workbookRows` 2000, `libraryBytes` 20 MB), safe file writes (`replaceFile`, `copyFileNoFollow`).\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"34-electron-desktop","name":"Desktop wrapper (Electron)","full":"Desktop wrapper (Electron)","group":"Core platform","summary":"The desktop wrapper: the Electron main process opens the window and does all disk, dialog, printer and Python work for the screens through 48 IPC channels exposed by the preload bridge, each checked for sender (trust.cjs) and payload (ipcValidate.cjs, limits.cjs). Project and database files are written atomically with backups and conflict checks; CI scripts guard dependencies, pr
