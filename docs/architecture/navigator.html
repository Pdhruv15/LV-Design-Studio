ing.ts:rcdOf"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"ELCBs and spare breakers in the BOQ","ref":"src/calc/bom.ts:135"},{"to":"17-enclosure-form4","dir":"out","status":"working","what":"ELCB groups in enclosure device lists","ref":"src/model/enclosureLibrary.ts:136"},{"to":"14-busbar","dir":"out","status":"working","what":"riser form TCL / DF","ref":"src/docs/riserForm.ts:58"},{"to":"04-building-load-assessment","dir":"both","status":"working","what":"Generate DBs creates circuits; rooms served check; building summary TCL","ref":"src/calc/buildingDesign.ts:139"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"board-wise SLD sheets with phase balance and panel summary","ref":"src/docs/boardSheets.ts:boardSheetPages"},{"to":"23-cad-sheets-plot-titleblock","dir":"out","status":"working","what":"DB schedule table on CAD sheets","ref":"src/components/docs/sheetRender.tsx:scheduleTable"},{"to":"25-reports-exports","dir":"out","status":"working","what":"schedule PDF/CSV, submission workbook, issue package, phase balance in study report","ref":"src/docs/panelScheduleDocs.ts:panelScheduleDocs"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"form workbook export and delete circuit","ref":"src/headless/exportTools.ts:214"},{"to":"32-component-database","dir":"in","status":"working","what":"WATT/UNIT from Loads.xlsx; standard loads dialog writes the library","ref":"src/database/database.ts:412"},{"to":"13-power-factor-correction","dir":"in","status":"working","what":"switched capacitor steps in board P/Q","ref":"src/calc/loadSchedule.ts:boardPhasePQ"},{"to":"33-quick-calcs-existing","dir":"in","status":"working","what":"recorded maximum demand of existing boards","ref":"src/calc/loadSchedule.ts:boardPhasePQ"}],"gaps":[],"md":"# 07 — Load schedule, panels and MD forms\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module is where the engineer fills and prints the panel schedules:\n\n- **DB load distribution schedule** (DEWA style): final circuits with phase + way references (R1, Y1, B1 … RYB4),\n  point counts per column (LTG, 13 A S/O, AC …), WATT / UNIT per column, MCB, wire, ECC, ELCB (RCCB) groups,\n  spares and spaces, connected load per phase and maximum demand per phase.\n- **Connected load / maximum demand (MD) form** for MDB, SMDB, MCC, meter cabinet: incomer, every outgoing feeder\n  with its cable, connected load per phase, TCL (total connected load), MDL (maximum demand load) = TCL × DF, and kWh meters.\n- **Circuit editing**: in-place grid with Excel keys (paste, fill down), a double-click edit dialog (points, mixed\n  load items, sizes, length), add / delete circuit, spares and spaces, **Balance phases**.\n- **Phase balance** of each board (per-phase current, neutral current, unbalance %) and phase moves from the board-wise SLD.\n- **Panels page**: list of panels, set level / fed-from / location in bulk, rename by level, quick-create hierarchy.\n- **Bulk edit**: search circuits or panels and set one field on many, as a modification record.\n- **Standard loads dialog**: adds typical loads to the component library file Loads.xlsx.\n\nTerms used below: *store* = the project object the app keeps in memory (with undo history, `src/model/history.ts`);\n*feeder* = any circuit in the project (`Feeder` in `src/types.ts`); a *schedule circuit* is a feeder that has `phase`\nand `way` set (`isScheduleCircuit`, `src/calc/loadSchedule.ts:14`).\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/loadSchedule.ts` | calc | `circuitWatts`, `circuitWattsByType`, `normalizeLoadItems`, `pointColumns`, `wattUnitText`, `circuitCategory`, `minWireMm2`, `missingWatts`, `dominantLoadType`, `boardPhasePQ`, `boardPhaseKw`, `imbalancePct`, `scheduleCircuits`, `nextFreeSlot`, `elcbGroups` | Points × WATT/UNIT → watts; lighting vs power category; minimum wire; per-phase demand P/Q and kW of a board incl. everything downstream; ELCB grouping, rating and sensitivity |\n| `src/calc/phaseBalance.ts` | calc | `phaseBalance`, `PHASE_UNBALANCE_CHECK_PCT` (10 %) | Per-phase current from `boardPhasePQ`, phasor neutral current, current unbalance %, list of 1-phase circuits with no phase |\n| `src/model/schedule.ts` | model | `addCircuit`, `updateCircuit`, `deleteCircuit`, `refreshBoard`, `balancePhases`, private `refresh` | Create / edit / delete schedule circuits; re-derive `loadKw` from points and auto-size MCB / wire (min wire enforced); balance and renumber ways |\n| `src/model/phases.ts` | model | `isSinglePhase`, `phaseTag`, `feederPhaseKw`, `setCircuitPhase`, `balanceBoardPhases` | Phase tags on the board-wise SLD, move one circuit to another phase, balance a whole board |\n| `src/model/spareWays.ts` | model | `addSpareWay`, `updateSpareWay`, `deleteSpareWay`, `reslotSpares`, `dbSpares`, `spareBreaker`, `isDbBoard` | Spares / spaces kept on the board (`Board.spareWays`), not as feeders |\n| `src/model/scheduleGroups.ts` | model | `scheduleGroupOf`, `scheduleGroups`, `incompleteSchedules` | Tabs MDB / SMDB / DB / Emergency / MCC / Others; which panels are still empty |\n| `src/model/circuitEdit.ts` | model | `tabOfField`, `fitColumns`, `roomPresets`, `sameAsOptions`, `previewCircuit` | Helpers of the edit dialog; live preview runs `updateCircuit` + `evaluateFeeder` + `evaluateEarthing` |\n| `src/model/mdFeeders.ts` | model | `addOutgoingFeeder`, `feederDeleteBlock`, `deleteOutgoingFeeder` | Add / delete outgoing feeders from the MD form |\n| `src/docs/loadScheduleDoc.ts` | report | `loadScheduleRows`, `scheduleTable`, `buildLoadScheduleHtml`, `loadScheduleCsv`, `incomerLabel`, `incomerCableText` | Row model of the DB schedule shared by screen, PDF, CSV and CAD sheet table; connected and MD totals |\n| `src/docs/dbSheet.ts` | report / model | `buildDbSheet`, `applySheetEdits`, `isEditable` | DB schedule as a | `src/components/docs/SheetGrid.tsx` | screen | `SheetGrid` | Not part of this module: drawing-set sheet grid used by `DrawingsView` (module 24-drawings-sld-sheets) |\n| `src/App.tsx:1552`, `:1645`, `:1482` | store wiring | `setProject` | Load schedule edits go through `setProject` (undo, merged within 600 ms); Panels page and board sheet use `{ step: true }` |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Boards, feeders, spares, point watts | 02-project-storage | `src/types.ts` `Board`, `Feeder`, `SpareWay`; store `src/App.tsx` `setProject` |\n| Minimum wire, ELCB mA, PF target, point template | 03-parameters-rules | `settingsOf`, `pointTemplateOf` (`src/types.ts`); `resolveRule` (`src/model/designRules.ts`) used in `minWireMm2`, `elcbGroups` |\n| Library loads (watts per column) | 32-component-database | `loadsForColumn` (`src/database/database.ts`), library sync of `Board.pointItems` (`database.ts:412`) |\n| Standard load set | 32-component-database | `STANDARD_LOADS` (`src/data/standardLoads.ts`), `withStandardLoads` (`src/database/standardLoads.ts`) |\n| Auto sizing of MCB / wire | 11-breaker-cable-selection | `recommend`, `applyRecommendation` (`src/calc/sizing.ts`) called in `schedule.ts` `refresh` and `mdSheet.ts` `applyMdEdits` |\n| Feeder check status | 06-network-sld-editor | `evaluateFeeder` (`src/calc/electrical.ts`) in `loadScheduleRowsOf` and `previewCircuit` |\n| Earth fault result for preview | 09-earthing | `evaluateEarthing`, `cpcOf`, `defaultCpcMm2` (`src/calc/earthing.ts`) |\n| Capacitor steps on a board | 13-power-factor-correction | `switchedOnBoard` (`src/calc/capSwitching.ts`) in `boardPhasePQ` |\n| Recorded maximum demand of existing boards | 33-quick-calcs-existing | `recordedPQ` (`src/model/existing.ts`) in `boardPhasePQ`, `boardPhaseKw` |\n| Board location / level | 04-building-load-assessment | `boardLocation` (`src/model/levels.ts`) |\n| Rooms served and expected W/m² | r out).\n10. Export PDF / CSV → `buildLoadScheduleHtml` / `loadScheduleCsv`; Export Excel → `buildFormWorkbook`.\n11. MD form tab → `MdSheetView` → `buildMdSheet`; typed cells → `applyMdEdits` (TCL of an equipment feeder sets `loadKw` and re-sizes).\n12. Board-wise SLD → `BoardSheetView`: click phase tag → `setCircuitPhase`; Balance → `balanceBoardPhases`; status shows `phaseBalance` before/after.\n13. Bulk edit → `BulkEditPanel` → `previewBulkEdit` → `introducedIssues` → `applyModification` (one undo step).\n\n## 6. Linked to (working connections)\n\n- 06-network-sld-editor: schedule circuits are ordinary feeders; the incomer of a DB uses `boardPhasePQ` from this module, so the per-phase **demand P** behind the incomer cable is the same figure as the load schedule MAXIMUM DEMAND row (`boardPhaseKw` gives the same P; both use `loadKw × demandFactor`, labelled 1-phase circuits on their phase, others spread evenly).\n- 11-breaker-cable-selection: `refresh` and `applyMdEdits` size via `recommend` / `applyRecommendation`.\n- 09-earthing: `elcbGroups` sensitivity is the RCD mA of each schedule circuit in `rcdOf` (`src/calc/earthing.ts:240`); preview shows earth fault result.\n- 20-equipment-boq-pricing: ELCBs and spares (`spareBreaker`) counted in `bom.ts`.\n- 17-enclosure-form4: ELCB groups and spares in enclosure device lists.\n- 12-transformer-generator / 14-busbar / 04-building-load-assessment: TCL / DF / MDL from `connectedPhaseKw` / `panelDf`.\n- 22-cad-electrical: plan devices update point counts through `updateCircuit`.\n- 26-revisions-changes: bulk edit is a modification record; `pointWatts`, `spareWays`, ELCB fields are tracked in `src/model/revisions.ts:136` and `src/model/changeClass.ts:30`.\n- 32-component-database: WATT / UNIT linked to library items, kept in sync (`database.ts:412`, `App.tsx:362`).\n- 25-reports-exports / 31-headless-cli-mcp: PDF, CSV, workbook, issue package, headless export.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"08-voltage-drop","name":"Voltage drop","full":"Voltage drop","group":"Studies","summary":"Works out the source-to-load voltage drop of every panel-to-panel and equipment cable (optionally each DB's worst final circuit) by the R + X method: k x I x L x (R cos phi + X sin phi) / runs, with k = sqrt3 (3-phase) or 2 (1-phase), R corrected for conductor temperature, incomer PF taken from downstream P and Q per phase, and the upstream drops added. Totals are checked against one project limit, and motors also against a starting-drop limit. Results go to the page, CSV and a black-and-white PDF. The core copy in evaluateFeeder feeds the cable schedule, the calc report and the SLD.","files":[{"path":"src/calc/voltageDrop.ts","kind":"calc","symbols":["VdRow","vdRow","vdCandidates","isVdCable","vdRows","vdPath","suggestCable","worstFinalCircuits","vdFormula","groupByPanel","editVdCable","addVdCable","motorStartVdLimit"]},{"path":"src/calc/electrical.ts","kind":"calc","symbols":["rOperatingOhmPerKm","resistanceFactor","COPPER_ALPHA","runsOf","designCurrentA","incomerBasis","feederVdPctAt","vdPctFor","voltageDropPct","upstreamVoltageDropPct","vdEvaluator","evaluateFeeder"]},{"path":"src/calc/cableTable.ts","kind":"calc","symbols":["CableSpec","REFERENCE_CABLE_TABLE","getCable","resolveCable","cables","setCables","cableDataNotice"]},{"path":"src/calc/motor.ts","kind":"calc","symbols":["STARTERS","starterInfo","starterOf","isMotor"]},{"path":"src/calc/busbar.ts","kind":"calc","symbols":["riserVd"]},{"path":"src/database/catalog.ts","kind":"model","symbols":["RULES","rule"]},{"path":"src/components/studies/VoltageDropStudy.tsx","kind":"screen","symbols":["VoltageDropStudy","VdProfile","RiserVdCard","TEMPS","PHASES"]},{"path":"src/docs/voltageDropReport.ts","kind":"report","symbols":["VD_HEADERS","vdCells","vdCsvCells","startText","scopeLabel","buildVdReportHtml"]},{"path":"src/components/docs/e l"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"vdPct / vdTotalPct in results; VD report via export tools","ref":"src/headless/tools.ts:299"},{"to":"02-project-storage","dir":"both","status":"working","what":"vdSelection, vdReportDocNo, vdFinalCircuits, vdTempC, vdLimitPct saved and validated","ref":"src/types.ts:555"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"VD parameters classed as engineering changes","ref":"src/model/changeClass.ts:34"}],"gaps":[],"md":"# 08 — Voltage drop study\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThe voltage drop study (left menu → Voltage drop, `view === 'voltage-drop'` in `src/App.tsx:1580`) works out the source-to-load voltage drop of every panel-to-panel cable (MDB → SMDB → DB) and every equipment cable (motor, AHU, isolator…). It can also add each DB's worst final circuit and shows busbar risers.\n\nHow each cable is calculated (`src/calc/voltageDrop.ts` `vdRow`):\n\n- **3-phase vs 1-phase** comes from the cable's core count: `cores >= 3` → 3-phase, `cores === 2` → single-phase (`vdRow` line 77; same rule in `src/calc/electrical.ts` `vdPctFor`).\n- **R** = R20 (IEC 60228 DC value from the cable table) × a temperature factor (`src/calc/electrical.ts` `rOperatingOhmPerKm`, `resistanceFactor`). Factor = 1 + 0.00393 × (θ − 20) for copper when the project's conductor temperature `vdTempC` is set, otherwise a flat 1.2 (≈ 71 °C).\n- **X** is one reactance per size for 4-core Cu/XLPE/SWA cable (`src/calc/cableTable.ts` `REFERENCE_CABLE_TABLE`, or Cables.xlsx).\n- **Power factor**: for an equipment cable, the feeder's stored PF. For an incomer (a cable that feeds a board), the PF comes from the P and Q of everything below it, per phase. The phase with the largest drop sets the drop (`src/calc/electrical.ts` `incomerBasis`, ENG-005).\n- **Parallel cables**: R and X are divided by the number of runs (`runsOf`).\n- **Motor starting**: starting drop = upstream drop + cable drop × the starter's current multiple (DOL 6, S/D 2, SS 3, VFD 1.2 — `src/calc/motor.ts` `STARTERS`). It is compared with the database rule `motorStartVdLimitPct` (default 10 %).\n- **Fix suggestion**: the smallest bigger size (same runs) that brings the total within the limit (`suggestCable`).\n- **Profile chart**: the cumulative drop along the supply path of the selected or worst cable (`vdPath`, `VdProfile`).\n- **Outputs**: on-screen table, CSV, and a black-and-white PDF report (`src/docs/voltageDropReport.ts` `buildVdReportHtml`), also offered in the Export centre.\n\nThe same drop (on the same basis) is also worked out for every circuit by the core feeder check (`src/calc/electrical.ts` `evaluateFeeder` → `FeederResult.vdPct / vdTotalPct / vdStatus`). The cable schedule, calculation report, compliance summary, SLD colouring and headless CLI use that copy (see §4).\n\n## 2. Files, components, functions and stores\n\n(\"Store\" = the place the app keeps the project in memory. Here it is the `project` object passed in and changed through `onChange`. \"Calc project\" = the copy of the project saved at the last Run (F5); results are shown from it.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/voltageDrop.ts` | calc | `VdRow`, `vdRow`, `vdCandidates`, `isVdCable`, `vdRows`, `vdPath`, `suggestCable`, `worstFinalCircuits`, `vdFormula`, `groupByPanel`, `editVdCable`, `addVdCable`, `motorStartVdLimit` | One row per cable: Ib, PF, mV/A/m, Vd (V, %), upstream %, total %, limit, motor-start %, status; supply path; fix size; the written-out formula; edits written back to the feeders |\n| `src/calc/electrical.ts` | calc | `rOperatingOhmPerKm`, `resistanceFactor`, `COPPER_ALPHA`, `runsOf`, `designCurrentA`, `incomerBasis`, `feederVdPctAt`, `vdPctFor` (private), `voltageDropPct`, `upstreamVoltageDropPct`, `upstreamVdOf` (private), `vdEvaluator`, `evaluateFeeder` | The core VD maths used by every other module; per-phase incomer basis; cumulative upstream drop; `FeederResult.vdStatus` |\n| `src/calc/cableTable.ts` | calc / data | `CableSpec`, `REFERENCE_CABLE_TABLE`, `getCable`, `resolveCable`, `cables`, `setCables`, `cableDataNotice` | R20 and X per size (copper only); Cables.xlsx replaces the built-in rows |\n| `src/calc/motor.ts` | calc | `STARTERS`, `starterInfo`, `starterOf`, `isMotor` | Starting-current multiple per starter type |\n| `src/calc/busbar.ts` | calc | `riserVd` | Busbar riser drop, section by section (shown on this page; owned by 14-busbar) |\n| `src/database/catalog.ts` | data | `RULES` (`motorStartVdLimitPct`), `rule` | Motor-start limit from Rules.xlsx (global, not per project) |\n| `src/components/studies/VoltageDropStudy.tsx` | screen | `VoltageDropStudy`, `VdProfile`, `RiserVdCard`, `TEMPS`, `PHASES` | The page: limit and conductor temperature settings, cable picker, result cards, editable table, fix button, ƒ formula row, profile chart, riser cards, CSV/PDF export |\n| `src/docs/voltageDropReport.ts` | report | `VD_HEADERS`, `vdCells`, `vdCsvCells`, `startText`, `scopeLabel`, `printedColumns` (private), `buildVdReportHtml` | Report table text, CSV cells, the plain PDF report |\n| `src/components/docs/exportCatalogue.ts` | report | entry `key: 'voltage-drop'` (line 102) | Export centre entry: whole-system VD report from the calc project |\n| `src/docs/studyReport.ts` | report | `lf` section (line 218–245) | Load-flow study section: feeders' ΔV and a motor-starting table (uses `vdRow`) |\n| `src/types.ts` | model | `Project.vdLimitPct`, `vdTempC`, `vdFinalCircuits`, `vdSelection`, `vdReportDocNo`; `Feeder.cores`, `parallel`, `powerFactor`, `lengthM`, `cableCsaMm2`, `starter` | Saved project fields used by the study |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Boards, supply tree (`upstreamId`), feeders, incomers (`feedsBoardId`) | 06-network-sld-editor | `src/calc/summary.ts rt | 25-reports-exports | `src/docs/studyReport.ts:221` (`vdRow(...).startPct`) |\n| `FeederResult.vdPct / vdTotalPct / vdStatus` (core copy) → cable schedule | 19-cable-tray-containment | `src/docs/schedules.ts` `cableSchedule` (columns \"Vd cable (%)\", \"Vd total (%)\") |\n| Same → calculation report, compliance summary | 25-reports-exports | `src/docs/calcSections.ts:62` ; `src/docs/compliance.ts:93` |\n| Same → SLD colour by VD, board voltage | 06-network-sld-editor, 24-drawings-sld-sheets | `src/components/SystemDiagram.tsx:457` `feederRatio`, `:463` `boardRatio` |\n| Same → quick fixes, sizing budget | 11-breaker-cable-selection | `src/calc/quickFix.ts:20`; `src/calc/sizing.ts:284` `recommend` |\n| Same → existing-installation check | 33-quick-calcs-existing | `src/calc/existing.ts:105` |\n| Same → headless CLI results / to-do | 31-headless-cli-mcp | `src/headless/tools.ts:292`, `:299`; VD report via `src/headless/exportTools.ts` (Export centre) |\n| Same → engine compare (built-in vs OpenDSS/pandapower) | 16-load-flow-engines | `src/engines/builtin.ts:14`, `src/components/EngineCompare.tsx` |\n| R factor for OpenDSS / external engines | 16-load-flow-engines | `src/engines/opendss/exportDss.ts:72,120`; `src/engines/external.ts:12` `resistanceFactor(project.vdTempC)` |\n\n## 5. User flow — from button click to result\n\n3. For each ticked cable, `vdRow(calcProject, feeder)` runs:\n   `designCurrentA` / `incomerBasis` → `rOperatingOhmPerKm(csa, vdTempC)` + `getCable(csa).xOhmPerKm` → mV/A/m → Vd → `upstreamVoltageDropPct` → total → status and motor `startPct`.\n4. If \"Worst final circuit of each DB\" is ticked (`project.vdFinalCircuits`), `worstFinalCircuits(calcProject)` adds one row per DB.\n5. Result cards show the worst total, the limit, counts, the longest cable, the worst motor start and the worst riser (`riserVd`).\n6. Clicking a row sets `focusId` → `vdPath` → `VdProfile` draws the cumulative chart. ƒ shows `vdFormula`.\n8. The fix button (`suggestCabl g","what":"earthing / earth riser / floor earthing sheets in Design CAD Sheets","ref":"src/components/docs/sheetRender.tsx"},{"to":"10-protection-coordination","dir":"out","status":"working","what":"breakerTypeOf / instantaneousTripA shared with selectivity","ref":"src/calc/protection.ts"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"earth fault failures in dashboard tallies and to-do","ref":"src/calc/dashboard.ts"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"earth fault issues in the to-do tool; earthing schematic DXF","ref":"src/headless/exportTools.ts:SHEET_TYPES"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"pit IDs frozen for revision compare","ref":"src/model/revisions.ts"},{"to":"33-quick-calcs-existing","dir":"out","status":"working","what":"txUnits used by existing-installation checks","ref":"src/calc/existing.ts"}],"gaps":[],"md":"# 09 — Earthing study, earth fault loop, earth schematic, earthing plan / earth riser\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nTwo separate parts share the name \"earthing\":\n\n1. **Earth fault loop study** (calculation). For every feeder and final circuit it works out the earth fault loop\n   impedance Zs = Ze + (R1 + R2), the minimum earth fault current If = 0.95 × U0 / Zs, compares If with the current\n   that trips the device instantly (Ia), decides the required disconnection time (0.4 s / 5 s, IEC 60364-4-41\n   Table 41.1, TN system, U0 in the 230 V band) and checks the protective conductor (CPC) with the adiabatic\n   equation S ≥ I·√t / k. It assumes a **TN-S** system only.\n2. **Earthing schematic and earth riser drawings** (layout and drawings). From the transformers, RMUs, main boards,\n   SMDBs and standby generators it lays out earth pits (RMU / transformer body, transformer neutral, LV MET,\n   generator), links pits of the same kind, records site test results per pit and checks them against DEWA limits\n   (2 Ω substation, 1 Ω LV). It also draws a building's earth riser (floor earth bars up the riser shaft) and floor\n   earthing sheets (each panel earth bar to its floor earth bar with its incoming CPC size).\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/cableTable.ts` | calc | `defaultCpcMm2` (:227), `cpcOf` (:233), `getCable` (:152) | CPC size per IEC 60364-5-54 Table 54.2 (S / 16 / S÷2) unless set on the feeder; cable R20 and X per km. Re-exported by `earthing.ts`. |\n| `src/calc/electrical.ts` | calc | `rOperatingOhmPerKm` (:31), `resistanceFactor` (:38), `runsOf` (:41), `transformerImpedance` (:253), `zMagnitude` (:25) | Conductor resistance at operating temperature (flat 1.2 × R20 when no temperature is passed), parallel runs, transformer impedance from kVA, Z %, X/R. |\n| `src/components/studies/EarthingStudy.tsx` | screen | `EarthingStudy` (:8) | Studies → Earthing page: summary cards and a table (Ze, Zs, max Zs, If, Ia, required time, disconnection, CPC min). Calls `evaluateEarthingAll` on the project it is given. |\n| `src/model/earthingPlan.ts` | model | `txUnits` (:9), `EARTHING_SYSTEMS` (:41), `EARTH_KINDS` (:48, limits 2 Ω / 1 Ω), `equipmentOf` (:73), `withEarthPitIds` (:140), `earthingLayout` (:165), `patchEarthing` (:230), `pitStatus` (:238), `setPitTest` (:241) | Earth pit layout from the boards: items, pit IDs (kept stable), links, pit groups (nets) with parallel resistance estimate, checks; edits to `Project.earthingPlan`. |\n| `src/model/earthRiser.ts` | model | `earthRiserLayout` (:78), `setRisers` (:150), `risersOf` (:174), `riserRows` (:228), `riserPages` (:234), `floorGroups` (:243), `earthSheetTitles` (:250), `DEFAULT_RISER_TAPE` / `DEFAULT_LV_ROOM_CABLE` (:16–17) | Building earth riser: floor earth bars per level and riser, each panel to its floor bar (or to the panel feeding it on the same floor) with the incoming CPC size (`cpcOf`). |\n| `src/model/boardEarth.ts` | model | `earthSheetNo` (:18), `boardEarth` (:39) | One board's earthing text for the board view / board sheet: pits it reaches and their group test result, plus the incomer CPC I²t verdict from `evaluateEarthing`. |\n| `src/diagram/earthingDrawing.ts` | report (drawing) | `earthingDrawing` (:126), `pitTags` (:115), `rmuSymbol` (:34) | Earthing schematic SVG (A3, black and white), legend, notes (DEWA, TN-S practice), pit schedule. |\n| `src/diagram/earthRiserDrawing.ts` | report (drawing) | `earthRiserDrawing` (:110), `earthFloorDrawing` (:281), `earthSheetRefs` (:375) | Earth riser sheets and floor earthing sheets SVG. |\n| `src/components/EarthingView.tsx` | screen | `EarthingView` (:75), `ShadowSvg` (:38) | Design → Earth pits (also embedded in the SLD workspace): Drawing / Earth riser / Floor earthing / Pits and tests / Checks tabs; settings drawer (pits per equipment, links, electrode, riser cable, LV room cable, riser name, link conductor, risers, bonding list). |\n| `src/types.ts` | model | `Feeder.cpcMm2` (:219), `Feeder.circuitPurpose` (:247), `Feeder.rcdMa` (:248), `Board.earthing` (:356), `Board.earthRiser` (:332), `Project.strictFinalDisconnection` (:558), `Project.earthingPlan` / `earthPitIds` (:575–576), `EarthingPlan` (:976), `EarthRiserDef` (:974) | Saved data for both parts. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Board tree, incomers, feeders (length, size, parallel runs, breaker, Im) | 06-network-sld-editor | `src/calc/network` `boardOf`, `feedersOn`, `withNetwork`; `src/types.ts` `Feeder` |\n| Transformer kVA, impedance %, X/R on root boards | 12-transformer-generator | `Board.sourceKva/sourceImpedancePct/sourceXr`, read in `earthing.ts` `earthLoopPath` :105 |\n| Transformer units per board (N+1 / split) for the schematic | 12-transformer-generator | `src/calc/txGen.ts` `sizeTransformers`, `txGenPlanOf`; used by `earthingPlan.ts` `txUnits` :9 |\n| Cable R20, X, CPC default size | 11-breaker-cable-selection | `src/calc/cableTable.ts` `getCable`, `cpcOf`, `defaultCpcMm2` |\n| RCD on a feeder, ELCB groups of a DB (IΔn) | 07-load-schedule-panels | `src/calc/loadSchedule.ts` `elcbGroups` :299, `isScheduleCircuit`; `earthing.ts` `rcdOf` :240 |\n| Circuit purpose (sockets / fixed), points | 07-load-schedule-panels | `Feeder.circuitPurpose`, `Feeder.points`; `earthing.ts` `circuitPurposeOf` :46; edited in `src/components/FeederForm.tsx` :254 |\n| Supply voltage, strict 0.4 s rule, ELCB defaults / design rules | 03-parameters-rules | `Project.voltageV`, `Project.strictFinalDisconnection`, `settingsOf`, `designRules` (via `elcbGroups`) |\n| Buildings and levels, panel level, chosen riser | 04-building-load-assessment | `src/model/levels.ts` `floorList`, `levelKey`; `Board.level`, `Board.earthRiser`; `earthRiser.ts` `earthRiserLayout` :78 |\n| RMU name, substation, standby generator | 12-transformer-generator / 06-network-sld-editor | `Board.rmu`, `Board.substation`, `Board.standby`; `earthingPlan.ts` `equipmentOf` :73 |\n| Earthing plan settings, pit IDs, pit tests | 02-project-storage | `Project.earthingPlan`, `Project.earthPitIds`; normalised on open/edit by `withEarthPitIds` in `src/App.tsx` :183, :212 |\n| Drawing set sheet numbers | 24-drawings-sld-sheets | `src/model/drawingSet.ts` `setOf`, `sheetNumber`; `boardEarth.ts` `earthSheetNo` :18 |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| `CalcRun.earthing` (stored run) | 25-reports-exports | `src/docs/studyReport.ts` `baseSection` 'earth' :272; `src/docs/calcSections.ts` `structureSection` 'earth' :93; `src/docs/compliance.ts` :105; `src/components/docs/StudyReportsView.tsx` :93; `src/components/docs/exportCatalogue.ts` :92 |\n| Fresh earthing results for the calculation report | 25-reports-exports | `src/docs/calcReport.ts` :34 (`evaluateEarthingAll`) |\n| Earth status colour on the SLD | 06-network-sld-editor | `src/components/SystemDiagram.tsx` :451 (`colorBy === 'earth'`) |\n| Circuit edit preview (earth fault result before save) | 07-load-schedule-panels | `src/model/circuitEdit.ts` `previewCircuit` :110 |\n| `breakerTypeOf`, `instantaneousTripA` | 10-protection-coordination, 11-breaker-cable-selection, 20-equipment-boq-pricing | `src/calc/protection.ts` :3; `src/calc/sizing.ts` :3; `src/calc/bom.ts` :5 |\n| Earth pits, links, MET conductor for BOQ | 20-equipment-boq-pricing | `src/calc/bom.ts` :168–189 (`earthingLayout`) |\n| Planned pit IDs and counts on the SLD main earthing detail | 06-network-sld-editor | `src/components/SystemDiagram.tsx` `plannedEarthPits` :80, `lvPitCount` :78 |\n| Board earth line + incomer CPC I²t on board sheets | 24-drawings-sld-sheets | `src/diagram/boardSheet.ts` :201, `src/components/BoardSheetView.tsx` :53, `src/model/drawingSet.ts` :542 (`boardEarth`) |\n| Earthing / earth riser / floor earthing sheets | 23-cad-sheets-plot-titleblock, 24-drawings-sld-sheets | `src/components/docs/sheetRender.tsx` :23–24; `src/model/drawingSet.ts` :3, :17 |\n| Earth failures in dashboard / to-do list | 28-dashboard-readiness | `src/calc/dashboard.ts` :121, :165 |\n| Earth failures and schematic DXF in the CLI / MCP | 31-headless-cli-mcp | `src/headless/tools.ts` :316–318; `src/headless/exportTools.ts` :131 |\n| Transformer unit count (side use of `txUnits`) | 12-transformer-generator, 33-quick-calcs-existing | `src/components/TransformersTab.tsx` :7; `src/calc/existing.ts` :5 |\n\n## 5. User flow — from button click to result\n\n**Earth fault loop study**\n1. User edits a feeder (cable, CPC, breaker type, Im, RCD, \"Circuit supplies\") in `FeederForm` (`src/components/FeederForm.tsx` :216–261).\n2. User presses Run calculations (F5): `runCalculations` (`src/calc/runs.ts` :76) calls `evaluateEarthingAll` inside one `withNetwork` index.\n3. For each feeder `evaluateEarthing` (`src/calc/earthing.ts` :156): `earthLoopPath` walks up to the root board (transformer impedance, then each incomer's phase + CPC loop via `cableLoop`); adds the circuit's own loop; If = 0.95 U0 / Zs.\n4. `rcdOf` finds an RCD / ELCB; `instantaneousTripA` gives Ia; `disconnectionBasis` gives 0.4 s or 5 s.\n5. Disconnection status and adiabatic check (t = 0.1 s when instantaneous, else the required time).\n7. Reports read `run.earthing` (`StudyReportsView` :93).\n\n**Earthing schematic / risers**\n1. Design → Earth pits opens `EarthingView` (`src/App.tsx` :1647, embedded at :1480).\n2. `earthingLayout` (`src/model/earthingPlan.ts` :165) builds items, pits, links, nets and checks; `earthingDrawing` draws the SVG.\n3. Settings drawer edits go through `patchEarthing` / `setRisers` → `onChange` → project store (undo step).\n4. Clicking a pit opens the test pop-up; `setPitTest` saves measured Ω, date, tester.\n5. Earth riser / Floor earthing tabs: `earthRiserLayout` → `earthRiserDrawing` / `earthFloorDrawing`.\n6. \"Sheets\" opens the sheet in Design CAD → Sheets (`onSheets`, drawing set).\n\n## 6. Linked to (working connections)\n\n- **06-network-sld-editor** — board tree and feeders feed the loop walk (`earthLoopPath`); SLD earth colouring uses the same `evaluateEarthingAll` (`SystemDiagram.tsx` :451); SLD pit counts follow the plan (`plannedEarthPits`).\n- **11-breaker-cable-selection** — same `cpcOf` / `getCable` as the cable checks; no copy of the CPC table.\n- **07-load-schedule-panels** — ELCB groups give RCD protection to schedule circuits (`rcdOf`); circuit edit preview uses `evaluateEarthing`.\n- **12-transformer-generator** — transformer impedance for Ze; transformer units for the schematic (`txUnits`).\n- **24-drawings-sld-sheets** — board sheets use `boardEarth`, which calls `evaluateEarthing` (same result as the study, not a copy); floor earthing sheets use `cpcOf` (same CPC as the study).\n- **25-reports-exports** — study report, calc sections, compliance table, calculation report.\n- **20-equipment-boq-pricing** — pits and pit links from `earthingLayout`.\n- **28-dashboard-readiness**, **31-headless-cli-mcp**, **26-revisions-changes** — see §4.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"10-protection-coordination","name":"Protection coordination","full":"Protection coordination","group":"Studies","summary":"Draws generic (non-manufacturer) log-log time-current curves. Results reach the discrimination report table, compliance summary, dashboard and MCP;","files":[{"path":"src/calc/protection.ts","kind":"calc","symbols":["instantaneousNoTripA","genericTripTimeS","selectivityPair","upstreamBreakers","discriminationChain","evaluateSelectivity","SelectivityResult"]},{"path":"src/calc/earthing.ts","kind":"calc","symbols":["breakerTypeOf","instantaneousTripA"]},{"path":"src/components/studies/CoordinationStudy.tsx","kind":"screen","symbols":["CoordinationStudy"]},{"path":"src/components/DiscriminationPanel.tsx","kind":"screen","symbols":["DiscriminationPanel"]},{"path":"src/components/TccChart.tsx","kind":"screen","symbols":["TccChart","curvePath"]},{"path":"src/calc/runs.ts","kind":"store","symbols":["runCalculations","fingerprint","staleStudies","CalcRun.selectivity"]},{"path":"src/types.ts","kind":"model","symbols":["Feeder.breakerRatingA","Feeder.breakerType","Feeder.breakerImMultiple","Feeder.breakerIcuKa","BreakerType"]},{"path":"src/docs/studyReport.ts","kind":"report","symbols":["buildSection('disc')"]},{"path":"src/docs/compliance.ts","kind":"report","symbols":["buildResults"]},{"path":"src/docs/calcSections.ts","kind":"report","symbols":["structureSection"]},{"path":"src/calc/protection.test.ts","kind":"calc","symbols":[]},{"path":"src/calc/discrimination.test.ts","kind":"calc","symbols":[]}],"links":[{"to":"06-network-sld-editor","dir":"in","status":"working","what":"maximum fault Ik'' at each board (impedanceToBoard, faultCurrentKA, evaluateFeeder.breakerFaultKA) and board topology","ref":"src/calc/protection.ts:selectivityPair"},{"to":"06-network-sld-editor","dir":"out","status":"working","what":"selected circuit's breaker chain coloured on the SLD","ref":"src/App.tsx:App (chain memo)"},{"to":"02-project-storage","dir":"in","status":"working","what":"breaker rating, type, Im multiple, Icu saved on Feeder","ref":"src/types.ts:Feeder"},{"to":"09-earthing","dir":"in","status":"working","what":"shared device-type default and sure-trip magnetic current","ref":"src/calc/earthing.ts:instantaneousTripA"},{"to":"25-reports-exports","dir":"out","status":"working","what":"discrimination section table, criteria, compliance row, limitation notes","ref":"src/docs/studyReport.ts:buildSection"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"to-do items for not / partly selective pairs","ref":"src/calc/dashboard.ts:buildDashboard"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"selectivity issues per circuit","ref":"src/headless/tools.ts:circuitIssues"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"data link","ref":"src/model/designImpact.ts:impactBetween"},{"to":"27-review-submissions-authority","dir":"out","status":"working","what":"selectivity status changes in proposal preview","ref":"src/model/proposalPreview.ts:circuitChanges"},{"to":"01-app-shell","dir":"both","status":"working","what":"ribbon/view routing; start checklist failing flag","ref":"src/App.tsx:App; src/help/guide.ts:startChecklist"}],"gaps":[],"md":"# 10 — Protection coordination, discrimination and TCC chart\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nChecks whether each protective device trips before the device above it (selectivity, also called discrimination), and draws time-current curves (TCC: trip time against fault current on log-log axes).\n\n- **Pairs checked.** Each sub-board's incoming breaker is checked against every outgoing breaker on that sub-board (`src/calc/protection.ts:evaluateSelectivity`). Per circuit, the chain from the circuit's breaker up to the last sub-board incomer is checked (`discriminationChain`).\n- **Method.** Selectivity is current-based only (`selectivityPair`):\n  - Short-circuit region: \"total\" when the upstream breaker's magnetic no-trip threshold (lower edge of its instantaneous band) is at or above the maximum fault at the downstream breaker. Otherwise it is \"partial up to\" that threshold.\n- **Curve models** (`genericTripTimeS`, `instantaneousNoTripA`, and `instantaneousTripA` in `src/calc/earthing.ts`):\n\n| Device (`BreakerType`, `src/types.ts:22`) | Magnetic no-trip edge (used for selectivity) | Magnetic sure-trip edge (used for chart and earthing) | Thermal curve |\n|---|---|---|---|\n| MCB B | 3 In | 5 In | generic t = 500 ÷ ((I/In)² − 1) s, no trip ≤ 1.05 In |\n| MCB C (default ≤ 63 A) | 5 In | 10 In | same generic curve |\n| MCB D | 10 In | 20 In | same generic curve |\n| MCCB (default > 63 A) | 0.8 × Im (Im = `breakerImMultiple`, default 10 In) | Im | same generic curve |\n| ACB | 0.8 × Im (same as MCCB) | Im | same generic curve |\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/protection.ts` | calc | `instantaneousNoTripA`, `genericTripTimeS`, `selectivityPair`, `upstreamBreakers`, `discriminationChain`, `evaluateSelectivity`, type `SelectivityResult` | Trip thresholds, generic curve, and the pair, chain and project-wide selectivity checks |\n| `src/calc/earthing.ts` | calc (shared with 09) | `breakerTypeOf`, `instantaneousTripA` | Default device type (C ≤ 63 A, MCCB above) and the sure-trip magnetic current |\n| `src/components/studies/CoordinationStudy.tsx` | screen | `CoordinationStudy` | \"Protection coordination\" study page: summary cards, board picker, TCC chart for one sub-board, table of all pairs |\n| `src/components/DiscriminationPanel.tsx` | screen | `DiscriminationPanel` | Inspector panel for the selected circuit on the SLD: chain up to the main board plus a compact TCC chart |\n| `src/components/TccChart.tsx` | screen | `TccChart`, `curvePath` | SVG log-log chart (10 A–100 kA, 10 ms–10 000 s), one line per breaker, Ik″ marker line |\n| `src/types.ts` | model | `Feeder.breakerRatingA`, `breakerType`, `breakerImMultiple`, `breakerIcuKa` (`:209-218`) | The only device data the module reads |\n| `src/components/FeederForm.tsx` | screen (06) | breaker type select (`:244`), \"Instantaneous Im (× In)\" (`:251`) | Where the user sets the device type and the MCCB/ACB Im multiple |\n| `src/calc/protection.test.ts`, `src/calc/discrimination.test.ts` | test | — | Thresholds, generic curve, total/partial/bad cases, chain order, and study-vs-panel equality |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Breaker rating In, type, Im multiple, Icu | 02-project-storage (entered in 06-network-sld-editor) | `src/types.ts:Feeder`; `src/components/FeederForm.tsx` |\n| Board hierarchy (which feeder feeds which board) | 06-network-sld-editor | `Feeder.feedsBoardId`, `Board.upstreamId`; `src/calc/network:networkOf/withNetwork` (`feedersByBoard`) |\n| Maximum fault at the downstream breaker (Ik″ at its supply busbar, c = 1.05) | 06-network-sld-editor | `src/calc/electrical.ts:evaluateFeeder` → `breakerFaultKA` (`:405`) → `impedanceToBoard` (`:281`), `faultCurrentKA` (`:343`) |\n| Bus fault for the chart marker | 06-network-sld-editor | `CoordinationStudy.tsx:19` and `DiscriminationPanel.tsx:23` call `faultCurrentKA(impedanceToBoard(...))` directly |\n| Device type defaults and sure-trip current | 09-earthing | `src/calc/earthing.ts:breakerTypeOf`, `instantaneousTripA` |\n\nThe fault current comes from the built-in network calculation (module 06), not from external load-flow engines (module 16). It uses transformer supply only.\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| `SelectivityResult[]` in each calc run | 25-reports-exports | `src/calc/runs.ts:runCalculations`; `src/docs/calcReport.ts:calcReportData` (`:34`) |\n| \"Protection discrimination study\" section: method text and a pairs table (no curves) | 25-reports-exports | `src/docs/studyReport.ts:buildSection` key `'disc'` (`:330-347`); section list `:69`; short-circuit report type `src/docs/reportTypes.ts:30` |\n| Criteria lines in the calculation report | 25-reports-exports | `src/docs/calcSections.ts:structureSection` case `'disc'` (`:108-109`) |\n| Compliance summary row \"Selectivity\" | 25-reports-exports | `src/docs/compliance.ts:buildResults` (`:48`, `:107-110`) |\n| Limitation text | 25-reports-exports | `src/docs/calcRecord.ts:buildCalcRecord` (`:79`); `src/docs/calcReport.ts:buildReportHtml` (`:111`) |\n| Snapshot reports | 25-reports-exports | `src/components/docs/StudyReportsView.tsx:93,205`; `src/components/docs/exportCatalogue.ts:92` |\n| To-do items \"not selective\" / \"only partly selective\" | 28-dashboard-readiness | `src/calc/dashboard.ts:buildDashboard` (`:167-173`) |\n| Start checklist \"failing\" flag | 01-app-shell | `src/help/guide.ts:startChecklist` (`:48`) |\n| Per-circuit issues list (MCP/CLI) | 31-headless-cli-mcp | `src/headless/tools.ts:circuitIssues` (`:320`) |\n| Chain colouring on the SLD | 06-network-sld-editor | `src/App.tsx:App` `chain` memo (`:485-495`) → `src/components/SystemDiagram.tsx` (`:311`, `:1248`) |\n| Selectivity status changes in a proposal preview | 27-review-submissions-authority | `src/model/proposalPreview.ts:circuitChanges` (`:71-73`) |\n| Change impact → opens the coordination view | 26-revisions-changes | `src/model/designImpact.ts:impactBetween` (`:81`) |\n\n## 5. User flow — from button click to result\n\n1. The user clicks the ribbon button \"Protection\" (`src/components/Ribbon.tsx:555`, `view('coordination', …)`). Or the user picks Studies → Protection coordination (`src/views.ts:11`).\n2. `App` renders `\u003cCoordinationStudy project={calcProject} board=… />` (`src/App.tsx:1585`). The component is loaded lazily (`:40`).\n3. `CoordinationStudy` calls `evaluateSelectivity(project)` once per project change (`useMemo`, `:15`). Inside `withNetwork`, for every feeder with `feedsBoardId` it runs `selectivityPair(up, down)` for each feeder on the fed board.\n4. `selectivityPair` computes the ratio. It reads `evaluateFeeder(down).breakerFaultKA` (memoised per run), compares it with `instantaneousNoTripA(up)/1000`, and sets the status:\n   - `bad` when the ratio is under 1.6 and In(up) ≤ In(down);\n   - `ok` when the ratio is ≥ 1.6 and the short-circuit result is total;\n   - `warn` otherwise.\n5. The user picks a sub-board in the select box, or clicks a table row. `TccChart` then draws the incomer plus that board's outgoing breakers (`curvePath` → `genericTripTimeS`) and a vertical Ik″ line at the busbar fault.\n6. SLD flow: the user selects a circuit. `DiscriminationPanel` (`src/App.tsx:1541`) calls `discriminationChain`, which runs `upstreamBreakers` and then `selectivityPair` up the chain, and shows each level plus a compact chart. In parallel, `App` colours those breakers on the SLD.\n7. When the user presses Run (F5), `runCalculations` stores `selectivity` in the run. Reports, dashboard, compliance and MCP read it from there.\n\n## 6. Linked to (working connections)\n\n- **06-network-sld-editor**:\n  - The fault level comes from the core impedance and fault-current calculation: `evaluateFeeder`, `impedanceToBoard`, `faultCurrentKA`. That includes parallel transformers joined by closed couplers (`parallelGroup`).\n  - Board topology comes from `networkOf`.\n  - The chain highlight goes back onto the SLD.\n- **09-earthing**: shares `breakerTypeOf` and `instantaneousTripA`, so the device-type defaults are the same in both studies.\n- **25-reports-exports**: the discrimination section, calculation-report criteria, compliance row and limitation notes all read `run.selectivity`.\n- **28-dashboard-readiness**: to-do counts for bad and partial pairs.\n- **31-headless-cli-mcp**: `circuitIssues` lists selectivity issues per circuit.\n- **26-revisions-changes** and **27-review-submissions-authority**: before/after status comparison.\n- **Tests**: `discrimination.test.ts` proves that the study and the SLD panel give identical results for the same pair.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"11-breaker-cable-selection","name":"Breaker & cable selection","full":"Breaker & cable selection","group":"Studies","summary":"Checks and recommends each circuit's breaker (In, type, Icu) and cable (size, parallel runs) using Ib \u003c= In \u003c= Iz, an 85 % loading margin, a voltage-drop budget and Icu >= busbar fault. Iz comes from the cable data (built-in reference or Cables.xlsx) for the IEC 60364-5-52 installation method with ambient / ground, soil and grouping factors. The same recommend() is reused by every auto-sizing path in the app.","files":[{"path":"src/components/studies/SelectionStudy.tsx","kind":"screen","symbols":["SelectionStudy"]},{"path":"src/calc/sizing.ts","kind":"calc","symbols":["STANDARD_BREAKER_A","STANDARD_ICU_KA","breakerRatings","icuSteps","setBreakerLists","recommend","applyRecommendation","applyAllRecommendations","passes","INCOMER_VD_BUDGET_PCT"]},{"path":"src/calc/electrical.ts","kind":"calc","symbols":["designCurrentA","incomerBasis","feederRating","izEvaluator","vdEvaluator","selectCable","selectCableRuns","PARALLEL_GROUP_FACTOR","groupFactor","deratedAmpacityA","impedanceToBoard","faultCurrentKA","evaluateFeeder"]},{"path":"src/calc/installation.ts","kind":"calc","symbols":["ratingBasis","feederRatingBasis","factorsText","groundChecks"]},{"path":"src/calc/cableTable.ts","kind":"calc","symbols":["REFERENCE_CABLE_TABLE","AMBIENT_POINTS","ambientCorrectionFactor", "incomer per-phase P/Q in; auto-sizing on schedule edits and MD sheet out","ref":"src/model/schedule.ts:20"},{"to":"09-earthing","dir":"in","status":"working","what":"breakerTypeOf default device type","ref":"src/calc/earthing.ts:breakerTypeOf"},{"to":"13-power-factor-correction","dir":"both","status":"working","what":"subtree for focus in; capacitor feeder sizing (1.43 x Ib) out","ref":"src/calc/pfc.ts:145"},{"to":"04-building-load-assessment","dir":"out","status":"working","what":"auto-sizing in building generation and MDB","ref":"src/calc/buildingDesign.ts:152"},{"to":"22-cad-electrical","dir":"out","status":"working","what":"plan-to-SLD sizing with applyAllRecommendations","ref":"src/model/planToSld.ts:93"},{"to":"29-elv","dir":"out","status":"working","what":"ELV power feeder sizing","ref":"src/calc/elvPlacement.ts:153"},{"to":"15-ups-solar","dir":"out","status":"working","what":"PV feeder sizing","ref":"src/model/pvFeeder.ts:32"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"size circuits / add circuit tools","ref":"src/headless/editTools.ts:160"},{"to":"25-reports-exports","dir":"out","status":"working","what":"rating basis table and cable data notice","ref":"src/docs/studyReport.ts:267"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"cable data notice and cable type on SLD sheets","ref":"src/docs/sldSheet.ts:222"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"ambient, cable data and ground to-do findings","ref":"src/calc/dashboard.ts:205"},{"to":"16-load-flow-engines","dir":"out","status":"working","what":"cable R/X/ampacity to external engine and OpenDSS","ref":"src/engines/external.ts:11"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"cable rate per metre and cable type","ref":"src/data/rates.ts:22"},{"to":"30-exchange-inbox","dir":"out","status":"working","what":"cable type and install method in design export","ref":"src/exchange/designExport.ts:53"},{"to":"01-app-shell","dir":"in","status":"working","what":"data link","ref":"src/App.tsx:958"}],"gaps":[],"md":"# 11 — Breaker & cable selection\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module chooses and checks the protective device and the cable of every circuit (\"feeder\" = one outgoing\ncircuit in the app's project data, from a board to a load or to another board).\n\n- **Check** (`evaluateFeeder`, `src/calc/electrical.ts:382`): design current Ib, cable rating Iz after derating,\n  overload rule Ib ≤ In ≤ Iz (IEC 60364-4-43), breaker loading (warn above 85 %), voltage drop source-to-load,\n  and breaking capacity Icu ≥ prospective fault at the breaker's board busbar.\n- **Rating Iz** (`ratingBasis`, `src/calc/installation.ts:38`): tabulated rating for the installation method ×\n  ambient (or ground temperature and soil) factor × grouping factor × number of parallel runs.\n- **Recommend** (`recommend`, `src/calc/sizing.ts:265`): smallest standard In ≥ Ib ÷ 0.85 (× 1.43 for capacitor\n  banks), smallest Icu step ≥ fault, device type by rating (MCB ≤ 63 A, MCCB, ACB > 1600 A), and the smallest cable\n  (1–4 runs, up to 8 above 1000 A) with Iz ≥ max(Ib, In) inside a voltage-drop budget.\n- **Breaker and cable selection screen** (`SelectionStudy`, `src/components/studies/SelectionStudy.tsx`): current vs\n  recommended breaker, Icu and cable per circuit, \"Fix only\" / \"Optimise\", Apply per row or Apply all.\n- **Quick fixes** (`quickFixes`, `src/calc/quickFix.ts:25`): up to four one-click patches (breaker up/down, bigger\n  cable, one more parallel run, higher Icu) offered on the system diagram for a failing circuit.\n- **Cable data** (`src/calc/cableTable.ts`): built-in reference table (Cu/XLPE/SWA 4-core, method E, 30 °C), replaced\n  machine-wide by `Cables.xlsx` from the LV Database; source tracking and \"DATA REQUIRED\" findings.\n\n`sizing.ts` also holds transformer, generator, UPS and PFC sizing (modules 12-transformer-generator, 15-ups-solar,\n13-power-factor-correction); only the \"breaker & cable selection\" part (lines 241–347) belongs here.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/components/studies/SelectionStudy.tsx` | screen | `SelectionStudy` | Table of now → recommended (In + type, Icu, cable); mode toggle; Apply / Apply all. Optional board focus via `subtree`. |\n| `src/calc/sizing.ts` | calc | `STANDARD_BREAKER_A`, `STANDARD_ICU_KA`, `breakerRatings`, `icuSteps`, `setBreakerLists`, `recommend`, `applyRecommendation`, `applyAllRecommendations`, `passes`, `INCOMER_VD_BUDGET_PCT` | Standard In / Icu lists (or Breakers.xlsx); the recommendation and applying it (top-down for Apply all). |\n| `src/calc/installation.ts` | calc | `ratingBasis`, `feederRatingBasis`, `factorsText`, `groundChecks`, `REFERENCE_GROUND_C`, `REFERENCE_SOIL_KMW` | Iz per IEC 60364-5-52 installation method with the correction factors listed. |\n| `src/calc/cableTable.ts` | calc / data | `REFERENCE_CABLE_TABLE`, `AMBIENT_POINTS`, `ambientCorrectionFactor`, `ambientCheck`, `INSTALL_METHODS`, `REFERENCE_METHOD_RATINGS` (empty), `cables`, `setCables`, `resolveCable`, `getCable`, `methodRating`, `cableDataStatus`, `cableDataNotice`, `cableDataFindings`, `defaultCpcMm2`, `cpcOf` | Cable data in use and where each value comes from; ambient factor table; CPC default per IEC 60364-5-54 Table 54.2. |\n| `src/calc/quickFix.ts` | calc | `failReasons`, `quickFixes`, `QuickFix` | Plain-words failure reasons and verified one-click patches. |\n| `src/calc/containment.ts` (lines 43–66) | calc / data | `groundTempFactor`, `soilFactor`, `buriedGroupFactor`, `GROUND_TEMP_RANGE_C`, `SOIL_RANGE_KMW` | Buried-cable factors (Tables B.52.15, B.52.16, B.52.18/19). Owned by 19-cable-tray-containment, used here. |\n| `src/calc/cableTray.ts` (lines 270–300) | calc / data | `bunchedFactor`, `groupingFactor`, `trayGrouping` (via `trayFactorOf`) | Bunched (B.52.17 item 1) and tray (B.52.20) grouping factors. Owned by 19, used here. |\n| `src/database/database.ts:145-161, 291-295` | store loader | `methodRatingsOf`, `applyDatabase` | Reads Cables.xlsx (`csaMm2, rOhmPerKm20C, xOhmPerKm, ampacityA, ratingC…ratingD2, manufacturer, referenceDoc`) and Breakers.xlsx; calls `setCables` / `setBreakerLists`. |\n| `src/types.ts:195-240, 554-567` | model | `Feeder` (`breakerRatingA`, `breakerIcuKa`, `breakerType`, `cableCsaMm2`, `parallel`, `cores`, `installMethod`, `cableType`, `cpcMm2`, `manualSize`), `Project` (`ambientC`, `vdLimitPct`, `vdTempC`, `groundTempC`, `soilResistivityKmW`, `strictCableData`), `BreakerType` | The saved fields this module reads and writes. |\n\n\"Store\" note: the cable table and breaker lists are **module-level variables** (`active` in `cableTable.ts:120`,\n`breakerList` / `icuList` in `sizing.ts:14`) — memory shared by the whole app, filled from the LV Database, not from\nthe project file.\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Feeders, boards, hierarchy, cable length, cores, parallel runs, install method | 02-project-storage / 06-network-sld-editor | `src/types.ts` `Feeder`; `src/calc/network` `boardOf`, `feedersOn` |\n| Ambient, VD limit, VD conductor temperature, ground temperature, soil resistivity, strict cable data | 03-parameters-rules | `Project.ambientC`, `vdLimitPct`, `vdTempC`, `groundTempC`, `soilResistivityKmW`, `strictCableData` |\n| Cable R, X, ampacity, method ratings (Cables.xlsx) | 32-component-database | `src/database/database.ts` `applyDatabase` → `setCables` |\n| Breaker ratings and Icu steps (Breakers.xlsx) | 32-component-database | `applyDatabase` → `setBreakerLists` |\n| Tray grouping factor per feeder (worst route) | 19-cable-tray-containment | `src/calc/cableTray.ts` `trayGrouping` via `trayFactorOf` (`electrical.ts:150`) |\n| Buried and bunched grouping, ground / soil factors "what":"load-schedule circuits are project.feeders summed by boardTotals; per-phase kW and D.F for the TCL form","ref":"src/docs/txSummary.ts:buildTxSummary"},{"to":"03-parameters-rules","dir":"in","status":"working","what":"future growth, transformer / generator max loading","ref":"src/types.ts:settingsOf"},{"to":"13-power-factor-correction","dir":"in","status":"working","what":"planned kvar taken off the transformer demand","ref":"src/calc/txGen.ts:sizeTransformers"},{"to":"09-earthing","dir":"out","status":"working","what":"transformer units per board (n1 / split)","ref":"src/model/earthingPlan.ts:txUnits"},{"to":"10-protection-coordination","dir":"out","status":"working","what":"applied transformer kVA / Z % set the fault levels","ref":"src/calc/electrical.ts:impedanceToBoard"},{"to":"11-breaker-cable-selection","dir":"out","status":"working","what":"applied transformer sets Icu requirement for feeders","ref":"src/calc/sizing.ts:recommend"},{"to":"16-load-flow-engines","dir":"out","status":"working","what":"standby kVA drives the generator supply scenario","ref":"src/calc/scenario.ts:generatorScenario"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"changeover breakers and ATS in the BOM","ref":"src/calc/bom.ts:151"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"changeover incomers and ATS labels on the SLD","ref":"src/diagram/ChangeoverSym.tsx:ChangeoverIncomers"},{"to":"25-reports-exports","dir":"out","status":"working","what":"study report, calc report, design basis, compliance, TCL summary in Excel","ref":"src/docs/studyReport.ts"},{"to":"33-quick-calcs-existing","dir":"in","status":"working","what":"existing-installation checks shown on the sizing page","ref":"src/components/studies/SizingStudy.tsx:ExistingChecksCard"}],"gaps":[],"md":"# 12 — Transformer & generator sizing, parallel transformers, changeover, transformer summary\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\n- **Transformer sizing, one per main board (MDB).** It takes the demand of everything below each main board, can subtract the planned power-factor correction, adds future growth and divides by the design loading limit. It then picks the next standard size from the DEWA list (500 / 1000 / 1500 kVA) or the IEC list (100 … 3150 kVA). For that size it works out the LV full-load current (FLC), the main ACB, the LV busbar fault level from the impedance (uk %), the voltage regulation, the busbar rating check and the lowest Icu on the MDB. With a bus coupler it checks the outage case (one transformer carries both boards). \"Apply to SLD\" writes the size back into the network model (`src/calc/txGen.ts` `sizeTransformers`, `transformerChecks`, `applyTransformer`).\n- **Standby generator sizing from whole boards.** The engineer ticks boards, or a % share of a board. EMDBs and boards with an ATS are added automatically, and so are circuits marked essential (fire pumps by default). The set must carry the running kVA and the running kW at the loading limit. It must also start the largest motor with a voltage dip of 15 % or less, using a transient reactance X′d of 25 % (`sizeGeneratorByBoards`, `chooseGenerator` in `src/calc/sizing.ts`).\n- **Transformers in parallel through closed bus couplers.** Load sharing in proportion to kVA ÷ uk %, the coupler current, and checks on vector group, impedance (±10 %) and rating ratio (2 : 1) (`src/calc/parallelTx.ts` `parallelOperation`).\n- **Transformer model helpers.** These create MDBs with transformers, number them TX-n, set RMU and substation, and move panels between transformers (`src/model/transformers.ts`).\n- **Emergency changeover.** Either an ATS (4P, switched neutral, open or closed transition, AC-31B / AC-33B) or two interlocked incomers (ACB from 630 A, draw-out). The results feed the SLD symbol and the BOQ (`src/model/changeover.ts`, `src/diagram/ChangeoverSym.tsx`).\n- **\"Summary of the TCL at transformer level\" (DEWA form).** One row per transformer, grouped by substation: main breaker and setting, fault duty, connected load per phase (TCL = total connected load), D.F (demand factor), MDL (maximum demand load), kWh meters and CT ratios (`src/docs/txSummary.ts` `buildTxSummary`, `src/components/docs/TxSummaryView.tsx`).\n\n**Answer to \"which demand source?\":** transformer and generator sizing both use the **network model**, i.e. boards and feeders. Load-schedule circuits are stored as the same `project.feeders`, so DB schedules count too. The figure comes from `boardTotals` in `src/calc/summary.ts`: Σ (loadKw × demandFactor) with kW and kvar kept separate, minus the capacitor steps that are switched in. No board-level diversity is applied. The **load assessment** (module 04) runs a separate sizing of its own (`assess` in `src/calc/loadAssessment.ts:372-380`) and writes its result into the MDBs through `withTransformer` / `planTransformers`. The TCL summary uses a third figure, TCL × D.F (`panelDf`).\n\n## 2. Files, components, functions and stores\n\n\"Store\" here means the project object in memory; this module has no store of its own. Its choices are saved in `project.txGen` (`src/types.ts:660`) and `project.studySettings`.\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/txGen.ts` | calc | `TxGenPlan`, `TXGEN_DEFAULTS`, `txGenPlanOf`, `DEWA_TRANSFORMER_KVA`, `sizesOf`, `typicalImpedancePct`, `transformerChecks`, `sizeTransformers`, `applyTransformer`, `sizeGeneratorByBoards` | Main sizing engine for transformers per MDB and the generator from boards |\n| `src/calc/sizing.ts` | calc | `STANDARD_TRANSFORMER_KVA`, `STANDARD_GENERATOR_KVA`, `chooseGenerator`, `generatorRatedKw`, `generatorForBoard`, `generatorChoiceForBoard`, `isEssential`, `standbyBoards`, `essentialFeeders`, legacy `sizeTransformer`, `sizeGenerator` | Standard size lists, generator selection rule (kVA, kW, motor start), and older whole-project sizing (used only by tests) |\n| `src/calc/parallelTx.ts` | calc | `parallelOperation` | Load sharing, coupler current and parallel-operation conditions (IEC 60076-8) |\n| `src/calc/motor.ts` | calc | `STARTERS`, `runningKva`, `startingKva`, `GENERATOR_XD_TRANSIENT_PCT` (25), `MOTOR_START_DIP_LIMIT_PCT` (15), `motorStartDipPct` | Motor starting kVA by starter type and the dip on a generator |\n| `src/calc/electrical.ts` | calc (shared, module 06) | `transformerImpedance`, `parallelGroup`, `parallelZ`, `impedanceToBoard`, `faultCurrentKA`, `DEFAULT_TRANSFORMER_XR` (5), `C_MAX` (1.05) | Transformer impedance referred to LV, parallel source impedance, Ik″ |\n| `src/calc/scenario.ts` | calc (shared) | `GENERATOR_XD_SUBTRANSIENT_PCT` (15), `generatorScenario` | Network on generator supply, using standby kVA and X″d 15 % |\n| `src/components/studies/SizingStudy.tsx` | screen | `TransformerGeneratorStudy` (`apply`, `applyGen`, `exportSheet`) | Studies → Transformer and generator sizing page; PDF / Excel sheet |\n| `src/components/TransformersTab.tsx` | screen | `TransformersTab` | Panels → Transformers: add DEWA transformers + MDBs, loading table, move panels |\n| `src/model/transformers.ts` | model | `mainBoards`, `txTag`, `mainOf`, `supplyChain`, `withTransformer`, `planTransformers`, `applyTransformers`, `setTransformer`, `setRmu`, `setSubstation`, `nextRmus`, `moveUnder` | Edits to the project for transformers / MDBs / RMUs / bus ties |\n| `src/model/changeover.ts` | model | `ACB_FROM_A`, `isInterlocked`, `incomersOf`, `boardRatingA`, `generatorFlcA`, `changeoverBreakers`, `atsOf`, `atsLines`, `breakerLines` | Changeover device data for SLD labels and BOQ |\n| `src/diagram/ChangeoverSym.tsx` | screen (SLD drawing) | `CO_ROWS`, `CO_GEN_REACH`, `ChangeoverIncomers` | Draws the mains + generator incomers with instruments, PMU and SPD |\n| `src/docs/txSummary.ts` | report | `CT_PRIMARIES`, `ctFor`, `breakerSetting`, `buildTxSummary`, `addTransformerRow`, `nextSubstationName`, `rowCtText` rBoard` |\n\n## 5. User flow — from button click to result\n\n**Transformer and generator sizing page (Studies → Sizing, `view === 'sizing'` in `src/App.tsx:1586`)**\n1. `TransformerGeneratorStudy` reads the plan with `txGenPlanOf(project)` and runs `sizeTransformers` and `sizeGeneratorByBoards` in `useMemo`.\n2. Settings inputs (Future growth, Max loading) call `setS`, which writes `project.studySettings`. Size list, \"After PF correction\", outage loading and board ticks call `setPlan`, which writes `project.txGen`.\n3. `sizeTransformers`: for each main board, `boardTotals` gives P and Q. Planned PFC from `planPfc` is subtracted. Design kVA = S × (1 + g) ÷ L, then the next standard size is chosen, or a split when the design kVA is above the largest size. Then `transformerChecks` runs and gives FLC, ACB, Ik″ (from `transformerImpedance` and `parallelZ`), regulation, busbar and Icu. Finally the outage case is checked over the first bus tie.\n4. \"Apply to SLD\" → `apply` → `applyTransformer`, which writes kVA, Z % and busbar. The status line asks the user to re-run the calculations (F5).\n5. Generator: board ticks or % shares → `setGenBoard`. `sizeGeneratorByBoards` adds up the picked boards, adds the essential circuits outside them, finds the largest motor start and calls `chooseGenerator`.\n6. \"Set N kVA on \u003cboard>\" (only when exactly one board has a standby set) → `applyGen`, which writes `board.standby = { kva }`.\n7. \"PDF sheet\" / \"Excel\" → `exportSheet` → `buildSection('sizing')`, then `buildStudyReportHtml` / `buildStudyWorkbook`.\n\n**Panels → Transformers tab (`src/components/PanelsPage.tsx:42`)**\n1. Number of transformers and DEWA sizes, substation, RMU option and ties → `planTransformers`. \"Create\" → `applyTransformers`.\n2. The kVA drop-down in the loading table → `setTransformer` → `withTransformer`.\n3. \"Move\" → `moveUnder`, which re-parents the panels and flags their incomer lengths to check.\n\n**TCL summary form (in `LoadScheduleView eTransformers"},{"to":"25-reports-exports","dir":"out","status":"working","what":"study report section, calc report, export catalogue PDF, design basis","ref":"src/docs/studyReport.ts:pfcSection"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"no-bank warnings, readiness scope","ref":"src/calc/dashboard.ts:181"},{"to":"27-review-submissions-authority","dir":"in","status":"working","what":"authority minimum PF from rules","ref":"src/calc/pfcCalc.ts:calcPfc"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"pfc and pfcCalc tracked in revisions","ref":"src/model/revisions.ts:149"},{"to":"02-project-storage","dir":"both","status":"working","what":"project.pfc and project.pfcCalc saved; plan boards integrity-checked","ref":"src/model/integrity.ts:55"}],"gaps":[],"md":"# 13 — Power factor correction\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThe module sizes capacitor banks that raise the power factor (PF) to the project target (default 0.95). It has two calculators and one shared switching rule.\n\n- **Design study (\"From the design\")**: reads the maximum demand (P kW, Q kvar) of each board from the network model. The user chooses where the banks go: central at the MDB, group at chosen boards, or individual fixed capacitors at motors and HVAC units. The study sizes the banks from the bottom up with Qc = P (tan φ1 − tan φ2). It also picks the step size, detuning reactor, capacitor voltage, breaker (≥ 1.43 × bank current) and cable. It can write the banks back onto the SLD as capacitor ways (a \"way\" = an outgoing feeder on a board).\n- **Custom calculator (\"Custom calculation\")**: a standalone calculation for an existing installation. Inputs can be measured kW, kVA or V·A with PF, a utility bill (kWh and kvarh), or a list of loads. It gives the bank, the steps switched in at that load, detuning, a breaker size, a power triangle, phasor diagrams and an A4 PDF report.\n- **Capacitor switching rule** (`src/calc/capSwitching.ts`): every capacitor bank on the SLD is treated as an automatic bank. An APFC relay (automatic power factor correction controller) switches whole steps, choosing the fewest that reach the target without going leading. All built-in network totals count this switched kvar, not the full nameplate kvar.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/pfc.ts` | calc | `PfcPlan`, `PFC_DEFAULTS`:35, `pfcPlanOf`:37, `planPfc`:150, `makeRow`:218, `addPfcBanks`:264, `capacitorFeeder`:138, `capVoltage`:134, `harmonicShare`:122, `subtree`:112 | Design study: places and sizes banks per strategy, computes before/after PF, kVA and current per board and per main board, and adds banks to the SLD |\n| `src/calc/pfcCalc.ts` | calc | `PfcCalcInput`:12, `PFC_CALC_DEFAULT`:32, `loadOf`:84, `calcPfc`:104, `operatingState`:43, `powerTriangleSvg`:187, `phasorSvg`:245, `stepsSvg`:266, `triangleFrom`:286, `pfText`:57 | Standalone calculator: P and Q from typed values, bank in standard sizes, switched steps, detuning from a harmonics choice or measured THD, breaker, SVG diagrams |\n| `src/calc/capSwitching.ts` | calc | `switchedKvar`:8, `switchedOnBoard`:22 | APFC switching rule used by the network totals (fixed banks always on, automatic banks switch steps) |\n| `src/components/studies/PfcStudy.tsx` | screen | `PfcStudy`:26 (`setPlan`:29, `addToSld`:47, `exportSheet`:54) | The \"Power factor correction\" page: strategy, boards, step, detuning, light-load check, results table, \"Add to SLD\", PDF/Excel sheet |\n| `src/components/studies/PfcCalculator.tsx` | screen | `PfcCalculator`:24 (`set`:26, `report`:31, `toDesign`:35) | The custom-calculation panel; saves inputs to `project.pfcCalc`; \"Add bank\" puts the result on a chosen board |\n| `src/docs/pfcReport.ts` | report | `pfcReportHtml`:19 | A4 black-and-white PDF of the custom calculation |\n| `src/docs/studyReport.ts` | report | `pfcSection`:466 | The design study as a section of the study/calculation report (PDF and Excel) |\n| `src/calc/sizing.ts` | calc | `sizePfc`:213, `recommend`:263 (capacitor rule at :270) | A third, simpler kvar sizing (fixed 25 kvar steps) used by the SLD palette; `recommend` sets breaker In ≥ 1.43 × Ib for any feeder with `kvar` |\n| `src/calc/quick.ts` | calc | `pfCorrection`:167, `pfcBank`:252 | Quick-calc kvar formula and step split (Quick calculators, CLI/MCP) |\n| `src/types.ts` | model | `Feeder.kvar`:239, `Feeder.capSteps`:250, `Feeder.detunedPct`:251, `Board.protection.apfc`:352, `Project.pfcCalc`:656, `Project.pfc`:661, `StudySettings.pfTarget`:1063 | Where PFC data lives in the project file (\"project file\" = the saved JSON of the whole design) |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Board maximum demand P, Q (demand factors applied; existing banks counted at switched kvar) | 06-network-sld-editor | `src/calc/summary.ts` `boardTotals`/`boardTotalsOf`:41–63 |\n| Board tree and supply order (child boards before parents) | 06-network-sld-editor | `src/calc/summary.ts` `boardsInSupplyOrder`:125; `src/calc/network` `feedersOn` |\n| Load type, starter (VFD, star-delta), kW, PF of each final circuit | 07-load-schedule-panels | `Feeder` in `src/types.ts`; `loadTypeOf` in `src/calc/summary.ts`:9 |\n| PF target | 03-parameters-rules | `settingsOf(project).pfTarget` (`src/types.ts`:1063/1075), edited on the PFC page (`PfcStudy.tsx`:85) |\n| Authority minimum PF (calculator warning, report footer) | 27-review-submissions-authority / 32-component-database | `rule('pfMinimum')` from `src/database/catalog` (Rules.xlsx), used in `pfcCalc.ts` `calcPfc`:152 and `pfcReport.ts`:60 |\n| Transformer kVA at each main board (loading before/after) | 12-transformer-generator | `Board.sourceKva`, read in `pfc.ts` `planPfc`:249 |\n| Breaker ratings, cable selection, fault level for the bank way | 11-breaker-cable-selection | `src/calc/sizing.ts` `recommend`, `applyRecommendation`, `breakerRatings` (called from `capacitorFeeder`:145) |\n| System voltage | 03-parameters-rules / 02-project-storage | `project.voltageV` |\n| Typed calculator inputs (kW/kVA/V·A/bill/loads, step, harmonics, THD, transformer kVA, losses) | user, saved in 02-project-storage | `project.pfcCalc` via `PfcCalculator.tsx` `set`:26 |\n| Study plan (strategy, boards, step, detuning, min kW, light-load %) | user, saved in 02-project-storage | `project.pfc` via `PfcStudy.tsx` `setPlan`:29; read by `pfcPlanOf`:37 |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Capacitor ways added to boards (kvar, capSteps, detunedPct, breaker, cable) | 06-network-sld-editor | `pfc.ts` `addPfcBanks`:264; `PfcCalculator.tsx` `toDesign`:35 |\n| Switched kvar of banks in board totals and per-phase totals | 06-network-sld-editor, 07-load-schedule-panels | `capSwitching.ts` `switchedOnBoard` called from `summary.ts`:62 and `loadSchedule.ts`:213 |\n| Planned kvar taken off transformer demand (\"include PFC\") | 12-transformer-generator | `src/calc/txGen.ts` `sizeTransformers`:106–110 |\n| \"No capacitor bank yet\" warnings | 28-dashboard-readiness | `src/calc/dashboard.ts`:181–182 |\n| Capacitor bank list for the compliance summary | 25-reports-exports | `src/docs/compliance.ts`:43–44 |\n| PFC section in study/calculation report, PDF + Excel | 25-reports-exports | `studyReport.ts` `pfcSection`:466; `calcReport.ts` `CALC_REPORT_STUDIES`:26; `reportTypes.ts`:23 |\n| Custom-calculation PDF in the export centre | 25-reports-exports | `src/components/docs/exportCatalogue.ts`:110–113 (`pfc-calc`) |\n| BOQ line per capacitor way | 20-equipment-boq-pricing | `src/calc/bom.ts`:228 |\n| Capacitor element in external load flow | 16-load-flow-engines | `engines/python/lvds_engine.py`:395; `src/engines/opendss/exportDss.ts`:155 |\n| IEC 60831 listed in the design basis | 25-reports-exports | `src/docs/designBasis.ts`:93 |\n| Plan/calculator changes recorded in revisions | 26-revisions-changes | `src/model/revisions.ts`:149–150; `src/model/changeClass.ts`:37 |\n| Plan board references checked | 02-project-storage | `src/model/integrity.ts`:55 |\n\n## 5. User flow — from button click to result\n\nDesign study:\n1. Ribbon → \"Power factor\" (`src/components/Ribbon.tsx`:538) sets view `pfc`. `App.tsx`:1625 renders `PfcStudy`.\n2. `PfcStudy` reads the plan with `pfcPlanOf` and runs `planPfc(project, plan)` again on every change, using `useMemo`, which reruns the calculation only when the project changes.\n3. The user picks a strategy, ticks boards, picks step, detuning and light-load %. `setPlan` writes `project.pfc` and the page re-runs.\n4. `planPfc`: for the individual strategy it first sizes fixed capacitors per motor/HVAC load (rounded **down**, 0 at VFDs) (:178–191). Then it sizes each chosen board bank, deepest board first. The bank is `Q − banks below − P·tan φ2`, rounded **up** to whole steps (:195–216). Detuning is 7 % when the non-linear share is ≥ 25 % (`harmonicShare`, `DETUNE_AT`:48). `makeRow` adds the capacitor voltage, bank current, and the breaker and cable from `capacitorFeeder` → `recommend`.\n5. The page shows main-board cards (PF before → after, kVA released, transformer loading, mini power triangle via `triangleFrom` + `powerTriangleSvg`) and a row table.\n6. \"Add all to the SLD\" or the per-row \"Add to SLD\" calls `addPfcBanks`. It enlarges an existing bank on that board or inserts a new `…-CAP` way. Then `onChange`, and the status bar asks the user to run calculations (F5).\n7. \"PDF sheet\" / \"Excel\" calls `exportSheet`, which uses `pfcSection` with `buildStudyReportHtml` / `buildStudyWorkbook`.\n\nCustom calculator:\n1. Mode switch \"Custom calculation\" (`PfcStudy.tsx`:36,71) renders `PfcCalculator`.\n2. Each input edit calls `set`, which saves the full input to `project.pfcCalc`. Then `calcPfc` runs: `loadOf` gives P and Q, then the required kvar, a standard bank (`STANDARD_BANKS`), the steps, `operatingState` (the steps switched in), detuning, `capVoltage`, the breaker and the before/after values.\n3. \"Report (PDF)\" calls `pfcReportHtml` and then `savePdf`.\n4. \"Add bank\" calls `toDesign`, which uses `capacitorFeeder` on the chosen board.\n\n## 6. Linked to (working connections)\n\n- 06-network-sld-editor: banks written to the SLD by `addPfcBanks`/`toDesign`. Board totals count them through `switchedOnBoard`. Running `planPfc` again after adding gives 0 kvar more (tested: `src/calc/pfc.test.ts` \"add to SLD\").\n- 07-load-schedule-panels: per-phase P/Q uses the same switching rule (`loadSchedule.ts`:210–214).\n- 11-breaker-cable-selection: breaker In ≥ 1.43 × Ib (IEC 60831: 1.3 × 1.1) in `recommend`:270. The cable is then chosen with Iz ≥ In, so the cable also carries ≥ 1.43 × bank current. This is inside the 1.3–1.5 × In range in the brief.\n- 20-equipment-boq-pricing: each capacitor way becomes a BOQ line with kvar, steps and detuning (`bom.ts`:228).\n- 25-reports-exports: study report section, calculation report, export catalogue, design basis (IEC 60831).\n- 28-dashboard-readiness: dashboard warning; `projectReadiness.ts`:12 includes the `pfc` scope.\n- 26-revisions-changes and 02-project-storage: `pfc` and `pfcCalc` are saved, tracked in revisions and integrity-checked.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"14-busbar","name":"Busbar & busway","full":"Busbar & busway","group":"Studies","summary":"Sizes busbar trunking risers for high-rise buildings (demand with diversity, In, ambient derating, Cu/Al selection from a data table, floor-by-floor voltage drop, Icw vs source fault level, size, weight, BOQ parts) and checks a board's typed busbar Icw against its fault level.","files":[{"path":"src/calc/busbar.ts","kind":"calc","symbols":["TYPICAL_BUSBAR_DATA","iecDiversity","ambientFactor","sizeRiser","riserVd","riserFromBuilding","busbarTypeFrom","newRiser"]},{"path":"src/calc/busbarIcw.ts","kind":"calc","symbols":["busbarIcwCheck","busbarIcwChecks"]},{"path":"src/components/studies/BusbarStudy.tsx","kind":"screen","symbols":["BusbarStudy","exportSheet","fromBoards","addG10Mockup","setData"]},{"path":"src/components/BoardFields.tsx","kind":"screen","symbols":["busbarMaterial","busbarIcwKa"]},{"path":"src/types.ts","kind":"model","symbols":["Board.ratedCurrentA","Board.busbarMaterial","Board.busbarIcwKa","Project.busRisers","Project.busbarData"]},{"path":"src/database/database.ts","kind":"model","symbols":["applyDatabase","databaseSeeds"]},{"path":"src/database/catalog.ts","kind":"model","symbols":["CatalogBusbar","catalogRate"]},{"path":"src/model/riserMockup.ts","kind":"model","symbols":["addG10RiserMockup"]},{"path":"src/docs/studyReport.ts","kind":"report","symbols":["buildSection"]},{"path":"src/docs/riserForm.ts","kind":"report","symbols":["buildRiserForm"]},{"path":"src/calc/bom.ts","kind":"calc","symbols":["busway lines"]},{"path":"src/model/dbRiser.ts","kind":"report","symbols":["run.breaker"]},{"path":"src/diagram/boardSheet.ts","kind":"report","symbols":["busbarIcwCheck"]}],"links":[{"to":"06-network-sld-editor","dir":"in","status":"working","what":"fault level at source board and at each board","ref":"src/calc/busbar.ts:sizeRiser"},{"to":"07-load-schedule-panels","dir":"in","status":"working","what":"floor demand kW / signed kvar from a board","ref":"src/calc/busbar.ts:sizeRiser"},{"to":"04-building-load-assessment","dir":"in","status":"working","what":"floors and demand per level","ref":"src/calc/busbar.ts:riserFromBuilding"},{"to":"03-parameters-rules","dir":"in","status":"working","what":"voltage, ambient, VD limit","ref":"src/calc/busbar.ts:sizeRiser"},{"to":"08-voltage-drop","dir":"out","status":"working","what":"riser VD in VD study and report","ref":"src/components/studies/VoltageDropStudy.tsx:risers"},{"to":"25-reports-exports","dir":"out","status":"working","what":"busbar riser study section and riser form","ref":"src/docs/studyReport.ts:buildSection"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"to-do for failed Icw and risers above the data","ref":"src/calc/dashboard.ts:184"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"busRisers, busbarData, busbarIcwKa tracked","ref":"src/model/revisions.ts"}],"gaps":[],"md":"# 14 — Busbar sizing and Icw check\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThe module has two separate parts:\n\n1. **Busbar trunking risers (busway)** for high-rise buildings — `src/calc/busbar.ts`. A riser starts at a source board, runs horizontally to the riser foot, then up the building with one tap-off unit per floor. For each riser the app works out:\n   - demand: floor loads (typed kW/PF, or a board's maximum demand) × a diversity factor (by default the IEC 61439-1 Table 101 \"rated diversity factor\" by number of tap-offs);\n   - design current Ib, the next standard feeding-breaker In ≥ Ib, and the busway rating needed = In ÷ ambient derating (1 % per °C above 40 °C);\n   - the smallest busway in the data table (copper or aluminium) with rating ≥ that value, plus the other material for comparison;\n   - current density at Ib (A/mm², shown only);\n   - voltage drop section by section (feed, riser foot → first tap-off, then floor to floor);\n   - short-circuit withstand: the busway's Icw (1 s) against the 3-phase prospective fault current at the source board;\n   - physical data: width × height, weight, length, number of straight lengths, tap-off unit rating per floor, and BOQ lines.\n2. **Board busbar Icw check** — `src/calc/busbarIcw.ts`. For any board where the user typed the busbar Icw (kA, 1 s, from the panel builder), it is compared with the board's prospective fault current. Nothing is assumed when the f
