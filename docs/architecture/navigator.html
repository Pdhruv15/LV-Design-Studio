ield is blank.\n\n## 2. Files, components, functions and stores\n\n(\"Store\" = the place the app keeps the project in memory; here the project object passed through `onChange`.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/busbar.ts` | calc | `TYPICAL_BUSBAR_DATA` (:34), `iecDiversity` (:98), `ambientFactor` (:101), `sizeRiser` (:160), `busbarTypeFrom` (:248), `riserFromBuilding` (:258), `riserVd` (:307), types `BusRiser`, `RiserFloor`, `BusbarType`, `RiserResult`, `RiserVd` | All riser sizing, VD, Icw-vs-fault, length/weight. `TYPICAL_BUSBAR_DATA` is a typed-in table of 10 Cu and 9 Al ratings (630–5000 A). |\n| `src/calc/busbarIcw.ts` | calc | `busbarIcwCheck` (:9), `busbarIcwChecks` (:16) | Board busbar Icw ≥ fault level at the board (`boardSummary(...).faultKA`). |\n| `src/components/studies/BusbarStudy.tsx` | screen | `BusbarStudy` (default export), `exportSheet` (:69), `fromBoards` (:60), `addG10Mockup` (:54), `setData` (:67) | \"Busbar trunking risers\" page: riser setup, floors table, results cards, Cu/Al comparison, editable busway data table, PDF/Excel sheet. |\n| `src/components/BoardFields.tsx` | screen | busbar material select (:121–127), Busbar Icw input (:129–133) | Where the board's `busbarMaterial` and `busbarIcwKa` are typed. |\n| `src/types.ts` | model | `Board.ratedCurrentA` (:321), `Board.busbarMaterial` (:322), `Board.busbarIcwKa` (:324), `Project.busRisers` (:658), `Project.busbarData` (:659) | Saved fields in the project file. |\n| `src/database/catalog.ts` | model | `CatalogBusbar` (:13), `catalogRate` (:56, `busway` key) | Busbar rows from the component database workbook; rate per m for the BOQ. |\n| `src/database/database.ts` | model | busbar row parser (:213–220), `applyDatabase` (:291, overwrites `TYPICAL_BUSBAR_DATA` in place :303–304), `databaseSeeds` (:320) | Loads `Busbar.xlsx` and replaces the built-in table. |\n| `electron/databaseSpec.json` | model | sheet `busbar` (:483) | Column definition of `Busbar.xlsx`. |\n| `src/model/riserMockup.ts` | model | `addG10RiserMockup` (:22) | Demo: G+10 building, 11 SMDBs, a riser and a riser sheet. |\n| `src/docs/studyReport.ts` | report | `buildSection` branch `key === 'busbar'` (:348–371) | Busbar riser study report (PDF / Excel tables). |\n| `src/docs/riserForm.ts` | report | `buildRiserForm` (:44) | Authority \"busbar riser\" connected load / MD form. |\n| `src/docs/formWorkbook.ts` | report | `addRiserSheet` call (:439) | Riser form sheet in the load-schedule workbook. |\n| `src/docs/voltageDropReport.ts` | report | uses `RiserVd` | Riser VD in the VD report. |\n| `src/calc/bom.ts` | calc | busway lines (:321–330) | BOQ group G: straight length (m), elbows, feed unit, end cap, tap-offs, fixings. |\n| `src/calc/dashboard.ts` | calc | risers in quantities (:111), to-do items (:184–185) | Dashboard to-do for failed board Icw and failed riser (no type / Icw). |\n| `src/model/dbRiser.ts`, `src/diagram/feederRiserLayout.ts`, `src/diagram/riserLayout.ts`, `src/diagram/boardSheet.ts` | report (drawings) | `sizeRiser` callers (:262, :185, :116); `busbarIcwCheck` (:93) | Riser drawings label the busway rating and tap-off ratings; board sheet prints \"Isc ≤ Icw\". |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Floor load from a board (demand kW and signed kvar) | 07-load-schedule-panels / 06-network-sld-editor | `src/calc/summary.ts` `boardTotals`, read in `sizeRiser` (:166–168) |\n| Floors from building levels (demand per floor, typical floor count, height) | 04-building-load-assessment | `src/calc/building.ts` `summarizeBuilding`, read in `riserFromBuilding` (:258) |\n| Fault current at the riser's source board | 06-network-sld-editor | `src/calc/electrical.ts` `faultCurrentKA(impedanceToBoard(...))` in `sizeRiser` (:189–192) |\n| Fault current at a board (for board Icw) | 06-network-sld-editor | `src/calc/summary.ts` `boardSummary(...).faultKA` (:117) in `busbarIcwCheck` (:12) |\n| Voltage drop upstream of the source board | 08-voltage-drop / 06-network-sld-editor | `src/calc/electrical.ts` `upstreamVoltageDropPct` in `riserVd` (:309) |\n| System voltage, ambient, VD limit | 03-parameters-rules | `project.voltageV`, `project.ambientC`, `project.vdLimitPct` in `sizeRiser` / `riserVd` |\n| Standard breaker ratings | 11-breaker-cable-selection | `src/calc/sizing.ts` `STANDARD_BREAKER_A` in `sizeRiser` (:184) |\n| Busway catalogue (rating, area, R, X, Icw, size, weight, rate) | 32-component-database | `src/database/database.ts` `applyDatabase` (:303–304) mutates `TYPICAL_BUSBAR_DATA`; or `project.busbarData` typed on the page |\n| Board Icw, busbar material | 06-network-sld-editor | `src/components/BoardFields.tsx` (:121–133) |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Riser study report tables (PDF / Excel) | 25-reports-exports | `src/docs/studyReport.ts` `buildSection('busbar')` (:348); listed in `src/docs/reportTypes.ts` (:23) |\n| Riser VD (exact + uniform) in VD study and VD report | 08-voltage-drop | `src/components/studies/VoltageDropStudy.tsx` (:67), `src/components/docs/exportCatalogue.ts` (:107) |\n| BOQ / bill of materials busway lines | 20-equipment-boq-pricing | `src/calc/bom.ts` (:321–330); rate from `src/database/catalog.ts` `catalogRate` (:62) |\n| Riser drawings (busway rating, tap-off ratings) | 24-drawings-sld-sheets | `src/model/dbRiser.ts` (:262–267), `src/diagram/feederRiserLayout.ts` (:185–190), `src/diagram/riserLayout.ts` (:116–118) |\n| Board sheet Icw text \"Isc ≤ Icw / > Icw — CHECK\" | 24-drawings-sld-sheets | `src/diagram/boardSheet.ts` (:93, :133–143, :194) |\n| Busbar riser authority form | 07-load-schedule-panels / 25-reports-exports | `src/docs/riserForm.ts` `buildRiserForm` (:44), `src/docs/formWorkbook.ts` (:439) |\n| To-do items and riser quantities | 28-dashboard-readiness | `src/calc/dashboard.ts` (:111, :184–185) |\n| Change tracking of `busRisers`, `busbarData`, `busbarIcwKa` | 26-revisions-changes | `src/model/revisions.ts` (:133, :148), `src/model/changeClass.ts` (:28, :37) |\n\n## 5. User flow — from button click to result\n\n1. Ribbon → **Busbar riser** (`src/components/Ribbon.tsx` :535) sets view `busbar`; `src/App.tsx` (:1624) renders `BusbarStudy`.\n2. **+ Riser** → `add` → `newRiser` (`busbar.ts` :92): Cu, 10 m feed, 3.6 m floor height, 6 floors of 60 kW / 0.9 PF, fed from the first main board.\n3. User sets source board, material, feed length, floor height, floors before the first tap-off, diversity (blank = auto), ambient (blank = project), straight length, elbows.\n4. Floors: typed per row, or **Take floors from the boards** (`fromBoards`, one tap-off per board fed from the source), or **Take floors from \u003cbuilding>** (`riserFromBuilding`).\n5. Every edit calls `onChange` → project saved in memory with an undo step (`App.tsx` :1624 `{ step: true }`); `sizeRiser` re-runs in `useMemo` (`BusbarStudy.tsx` :34) and again for the other material (:35).\n6. Results cards show Ib, In, required rating, selected busway, area and A/mm², Icw vs fault, VD at the top tap-off (warn at > half the VD limit), size, weight, parts; notes list Icw failure, \"above the data\", auto diversity, derating.\n7. Optional: edit the **Busway data** table (`setData`), saved as `project.busbarData`.\n8. **PDF sheet / Excel** → `exportSheet` → `buildSection('busbar')` → `savePdf` / `saveBinary`.\n9. Board Icw: in the board properties (`BoardFields.tsx` :129) the user types Icw; `busbarIcwCheck` runs when the board sheet is drawn and when the dashboard is built.\n\n## 6. Linked to (working connections)\n\n- 06-network-sld-editor → fault level at the source board (`faultCurrentKA(impedanceToBoard)`), same formula as `boardSummary.faultKA`.\n- 07-load-schedule-panels → floor demand from a board (`boardTotals`), including signed (leading) kvar.\n- 04-building-load-assessment → floors from building levels (`riserFromBuilding`).\n- 08-voltage-drop → `riserVd` adds upstream VD and shows each riser on the VD study and report.\n- 20-equipment-boq-pricing → busway straight length, elbows, feed unit, end cap, tap-offs, fixings; rate per m from the catalogue.\n- 24-drawings-sld-sheets → riser drawings and board sheet Icw text.\n- 25-reports-exports → study report section `busbar`; riser authority form.\n- 28-dashboard-readiness → to-do for failed Icw (boards and risers) and risers above the data.\n- 32-component-database → `Busbar.xlsx` replaces the typical table.\n- 26-revisions-changes, 02-project-storage → fields tracked and integrity-checked.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"15-ups-solar","name":"UPS & solar PV","full":"UPS & solar PV","group":"Studies","summary":"Sizes each UPS from a UPS board's demand or a typed load list. The UPS must cover both kVA and kW (output PF). The battery is sized for constant power with capacity-at-rate, ageing, temperature and margin, with optional manufacturer table, BMS, surge, recharge and generator leading-kvar checks. Sizes one PV array: strings from temperature-corrected Voc/Vmp against the inverter limits (IEC 62548), yield from peak sun hours × PR, and one PV generation feeder on the SLD.","files":[{"path":"src/calc/ups.ts","kind":"calc","symbols":["UpsSystem","UPS_DEFAULTS","upsLoad","sizeUps","capacityAtRate","checkUpsSurge","checkUpsLeading","upsSourceMissing","VRLA_BLOCK_AH","LI_MODULE_AH","DC_VOLTAGES"]},{"path":"src/calc/solar.ts","kind":"calc","symbols":["PvSystem","PvPanel","PvInverter","PV_DEFAULTS","DEFAULT_PANEL","DEFAULT_INVERTER","INVERTER_KW","VMP_COEFF_ESTIMATE_PCT","sizePv","acConnection"]},{"path":"src/model/pvFeeder.ts","kind":"model","symbols":["pvToSld","pvConnection"]},{"path":"src/components/studies/UpsStudy.tsx","kind":"screen","symbols":["UpsStudy","UpsCard"]},{"path":"src/components/studies/SolarStudy.tsx","kind":"screen","symbols":["SolarStudy"]},{"path":"src/docs/upsSolarReport.ts","kind":"report","symbols":["buildUpsReportHtml","buildPvReportHtml"]},{"path":"src/calc/sizing.ts","kind":"calc","symbols":["STANDARD_UPS_KVA","upsForBoard","upsLoadingPct","recommend"]},{"path":"src/types.ts","kind":"model","symbols":["Project.upsSystems","Project.pv","Board.upsKva"]}],"links":[{"to":"06-network-sld-editor","dir":"in","status":"working","what":"UPS load from the board demand (boardTotals)","ref":"src/calc/ups.ts:upsLoad"},{"to":"06-network-sld-editor","dir":"out","status":"working","what":"selected UPS kVA written to board.upsKva","ref":"src/components/studies/UpsStudy.tsx:UpsStudy"},{"to":"12-transformer-generator","dir":"in","status":"working","what":"standby generator kVA for the leading-kvar check","ref":"src/calc/ups.ts:checkUpsLeading"},{"to":"03-parameters-rules","dir":"in","status":"working","what":"project voltage for the PV AC current","ref":"src/components/studies/SolarStudy.tsx:SolarStudy"},{"to":"16-load-flow-engines","dir":"out","status":"working","what":"PV feeder as sgen (Python) / Generator (OpenDSS)","ref":"engines/python/lvds_engine.py:397"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"PV modules, inverters, DC isolators, SPDs, connectors in the BOM","ref":"src/calc/bom.ts:263"},{"to":"25-reports-exports","dir":"out","status":"working","what":"UPS and PV PDF reports in the export centre","ref":"src/components/docs/exportCatalogue.ts:114"},{"to":"25-reports-exports","dir":"out","status":"working","what":"one-line UPS / PV entries in the design basis","ref":"src/docs/designBasis.ts:163"},{"to":"28-dashboard-readiness","dir":"out","status":"working","what":"UPS failures and PV status in the to-do list","ref":"src/calc/dashboard.ts:186"},{"to":"26-revisions-changes","dir":"out","status":"working","what":"UPS diff, proposals and re-run flags; PV re-run flag","ref":"src/model/designImpact.ts:83"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"report export only; no sizing tool","ref":"src/components/docs/exportCatalogue.ts:114"}],"gaps":[],"md":"# 15 — UPS & battery, solar PV, PV feeder\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nTwo separate sizing studies and one SLD link:\n\n- **UPS & battery** (`view === 'ups'`): for each UPS, finds the load (the demand of a UPS board on the SLD, or a typed list of loads), adds growth, divides by the design loading, and picks the smallest standard UPS whose kVA **and** kW (kVA × output PF) both cover it. It then sizes the battery for constant power over the backup time: `P_dc = kW × (1 + growth) ÷ η_inverter`, `Ah(C10) = P_dc × t ÷ V_string ÷ capacity-at-rate × ageing × temperature × design margin` (÷ usable SOC window for Li-ion). It also covers optional checks: a manufacturer constant-power table (W/block), Li-ion BMS current, the inverter starting surge, the recharge time, the battery-bus DC breaker, and the leading kvar from UPS input filters on a standby generator.\n- **Solar PV** (`view === 'solar'`): sizes one PV array by target kWp, roof area or daily energy. String length comes from Voc at the minimum ambient (≤ inverter max DC V), Vmp at the hottest cell temperature (≥ MPPT min) and Vmp at the minimum ambient (≤ MPPT max), following IEC 62548. The MPPT current check is 1.25 × Isc × strings ≤ the inverter input limit. Yield = kWp × peak sun hours × performance ratio, plus the AC current and AC breaker (1.25 × I).\n- **PV feeder**: \"Add / Update PV-\u003cboard> on the SLD\" writes one generation feeder (`generation: true`, `loadType: 'pv'`) and sizes its breaker and cable with the general SLD sizing.\n\nTerm used below: *store / project* = the in-memory `Project` object that is saved to the project file. *Feeder* = one outgoing circuit on a board in the SLD.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/ups.ts` | calc | `UpsSystem`, `UPS_DEFAULTS`, `upsLoad`, `sizeUps`, `capacityAtRate`, `checkUpsSurge`, `checkUpsLeading`, `upsSourceMissing`, constants `VRLA_BLOCK_AH`, `LI_MODULE_AH`, `DC_VOLTAGES`, `DC_BREAKERS`, `UPS_FILTER_KVAR_PCT`, `GEN_LEADING_KVAR_PCT` | All UPS and battery maths and the data type saved in the project |\n| `src/calc/solar.ts` | calc | `PvSystem`, `PvPanel`, `PvInverter`, `PV_DEFAULTS`, `DEFAULT_PANEL`, `DEFAULT_INVERTER`, `INVERTER_KW`, `VMP_COEFF_ESTIMATE_PCT`, `sizePv`, `acConnection` | PV array, strings, inverters, yield and AC breaker |\n| `src/model/pvFeeder.ts` | model | `pvToSld`, `pvConnection` | Creates/updates the `PV-\u003cboard>` generation feeder and previews its breaker/cable |\n| `src/components/studies/UpsStudy.tsx` | screen | `UpsStudy`, `UpsCard`, `fromBoards`, `add`, `exportPdf`, `onApply` | UPS page: one card per UPS, writes `project.upsSystems`, can write `board.upsKva` back to the SLD |\n| `src/components/studies/SolarStudy.tsx` | screen | `SolarStudy`, `addToSld`, `exportPdf` | Solar page: writes `project.pv`, adds the PV feeder |\n| `src/docs/upsSolarReport.ts` | report | `buildUpsReportHtml`, `buildPvReportHtml` | A4 portrait black-and-white PDF sheets |\n| `src/calc/sizing.ts` | calc (shared) | `STANDARD_UPS_KVA` (:82), `upsForBoard` (:136), `upsLoadingPct` (:141), `recommend` (:265) | UPS size list, SLD UPS loading, general breaker/cable sizing used by the PV feeder |\n| `src/types.ts` | model | `Project.upsSystems` (:578), `Project.pv` (:580), `Board.upsKva` (:360) | Where the data lives in the project file |\n| `src/App.tsx` | screen | lines 36–37, 1650–1651 | Lazy-loads and shows the two pages |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| UPS load from a board's demand kW / kvar (all downstream boards) | 06-network-sld-editor, 07-load-schedule-panels | `src/calc/ups.ts:upsLoad` → `src/calc/summary.ts:boardTotals` |\n| UPS boards (`kind === 'UPS'`) and `board.upsKva` | 06-network-sld-editor | `UpsStudy.tsx:UpsStudy` (`upsBoards`), `ups.ts:filterKvar` |\n| Standby generator kVA above a UPS (`board.standby.kva`) | 12-transformer-generator | `ups.ts:generatorBoard`, `checkUpsLeading` |\n| Standard UPS sizes | 06-network-sld-editor (shared sizing) | `src/calc/sizing.ts:STANDARD_UPS_KVA` |\n| Project voltage (`project.voltageV`) for the PV AC current | 03-parameters-rules / 02-project-storage | `SolarStudy.tsx` → `sizePv(s, project.voltageV)` |\n| Shared breaker list for the PV AC breaker | 11-breaker-cable-selection | `solar.ts:breakers` → `STANDARD_BREAKER_A` |\n| PV feeder breaker + cable sizing | 11-breaker-cable-selection / 06-network-sld-editor | `pvFeeder.ts:pvToSld` → `sizing.ts:recommend`, `applyRecommendation` |\n| Boards in supply order (board picker) | 06-network-sld-editor | `summary.ts:boardsInSupplyOrder` |\n| Revision stamp on reports | 26-revisions-changes | `upsSolarReport.ts:head` → `revisionStamp` |\n| Panel, inverter, battery data | none: typed by the user, or the generic defaults in code | `solar.ts:DEFAULT_PANEL`, `DEFAULT_INVERTER`; `ups.ts:UPS_DEFAULTS` |\n| Site irradiance and temperatures | none: Dubai defaults in code | `solar.ts:PV_DEFAULTS` (:94) |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| `project.upsSystems`, `project.pv` saved in the project file | 02-project-storage | `UpsStudy.tsx:set`, `SolarStudy.tsx:set`; labels in `src/model/saveSafety.ts:42` |\n| Selected UPS kVA written to the SLD board (`board.upsKva`) | 06-network-sld-editor | `UpsStudy.tsx` `onApply` |\n| PV generation feeder `PV-\u003cboard>` | 06-network-sld-editor, 16-load-flow-engines | `pvFeeder.ts:pvToSld`; `summary.ts:boardTotalsOf` (`generationKw`), `engines/python/lvds_engine.py:397` (`create_sgen`), `src/engines/opendss/exportDss.ts:160` |\n| UPS and PV PDFs (page button, export centre, headless export) | 25-reports-exports, 31-headless-cli-mcp | `upsSolarReport.ts:buildUpsReportHtml`, `buildPvReportHtml`; `src/components/docs/exportCatalogue.ts:114–121` |\n| UPS table in the compliance report | 25-reports-exports | `src/docs/compliance.ts:45, 62` |\n| One-line UPS / PV entries in the design basis | 25-reports-exports | `src/docs/designBasis.ts:163–166` |\n| Dashboard extras and to-do list (UPS failures, PV status) | 28-dashboard-readiness | `src/calc/dashboard.ts:113–115, 186–203, 212–215` |\n| BOM: UPS (from `board.upsKva` only), PV modules, mounting, inverters, DC cable sets, connectors, DC isolators, DC SPDs, AC isolator | 20-equipment-boq-pricing | `src/calc/bom.ts:177`, `:263–284` |\n| Proposals / design changes and revision compare for UPS systems | 26-revisions-changes, 27-review-submissions-authority | `src/model/designChanges.ts:81–91, 262`, `src/model/proposalPreview.ts:82–89`, `src/model/revisions.ts:264` |\n| \"Study needs re-run\" flags | 26-revisions-changes | `src/model/designImpact.ts:83–87` |\n\n## 5. User flow — from button click to result\n\nUPS:\n1. The user opens UPS & battery. `App.tsx:1650` renders `UpsStudy`.\n2. **From UPS boards** → `UpsStudy.fromBoards` adds one `UpsSystem` (copied from `UPS_DEFAULTS`) for each `kind === 'UPS'` board that has none. **+ UPS** → `add` creates one with a typed load list.\n3. Each `UpsCard` calls `sizeUps(project, s)` on every render. That runs `upsLoad` → `boardTotals`, picks the size from `STANDARD_UPS_KVA`, then does the battery sizing, `checkUpsSurge`, `checkUpsLeading`, the DC breaker and the recharge estimate.\n4. Edits call `onPatch` → `UpsStudy.patch` → `onChange` → `setProject`, which updates the store and the undo history.\n5. **Set \u003cboard> to N kVA on the SLD** → `onApply` writes `board.upsKva`.\n6. **Export PDF** → `buildUpsReportHtml` → `savePdf`.\n\nSolar PV:\n1. `App.tsx:1651` renders `SolarStudy`. The page merges `PV_DEFAULTS` with `project.pv` and calls `sizePv(s, project.voltageV)` on every render.\n2. Edits call `set` → `onChange({ ...project, pv })`.\n3. `pvConnection` previews the SLD breaker/cable by running `pvToSld` on a throw-away copy.\n4. **Add / Update PV-\u003cboard>** → `addToSld` → `pvToSld` → `recommend(p0, f, 'optimise')` → `applyRecommendation`, then the project is saved with the feeder and `pv.boardId`. The user must then press Run (F5).\n5. **Export PDF** → `buildPvReportHtml`.\n\n## 6. Linked to (working connections)\n\n- 06-network-sld-editor: the UPS load is read live from the board demand (`upsLoad` → `boardTotals`). The UPS kVA is written back to `board.upsKva`. The PV feeder is written to `project.feeders`.\n- 12-transformer-generator: the leading-kvar check walks up to the first board with `standby.kva` (`generatorBoard`).\n- 11-breaker-cable-selection: the PV feeder uses the shared `recommend` and the shared breaker list.\n- 16-load-flow-engines: PV feeders are static generators in the Python engine (`lvds_engine.py:397`) and `Generator` elements in the OpenDSS export (`exportDss.ts:160`). The built-in totals keep them separate (`generationKw`).\n- 25-reports-exports / 31-headless-cli-mcp: both reports are in `exportCatalogue.ts` (headless `export_report`, tested in `src/headless/exportTools.test.ts:64, 101`).\n- 28-dashboard-readiness: UPS failures and PV status reach the to-do list.\n- 20-equipment-boq-pricing: PV items are in the BOM from `sizePv`.\n- 26-revisions-changes: UPS systems are diffed, proposable and flagged for re-run. PV is flagged when its fields change.\n- Tests: `src/calc/upsSolar.test.ts` (10 cases), `upsBatteryData.test.ts` (5), `upsSurge.test.ts` (5), `upsLeading.test.ts` (4). `pvToSld` and `pvConnection` are covered in `src/model/eng006.test.ts`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"16-load-flow-engines","name":"Load flow engines","full":"Load flow engines","group":"Studies","summary":"Runs the project's network through the built-in IEC hand-calculation and, in the desktop app, through OpenDSS or pandapower via a Python helper, and compares Ib, voltage drop and fault levels per circuit. Engine results can also replace the built-in labels on the SLD. A separate TypeScript per-phase (unbalanced) load flow with the neutral feeds the Phase balance study report.","files":[{"path":"src/engines/types.ts","kind":"model","symbols":["CalcEngine","StudyResults","EngineFeederResult","EngineBoardResult","EngineProbe"]},{"path":"src/engines/builtin.ts","kind":"calc","symbols":["builtinEngine"]},{"path":"src/engines/external.ts","kind":"calc","symbols":["openDssEngine","pandapowerEngine","pythonEngine","probeEngines","engineRequest","engineCableData"]},{"path":"src/engines/index.ts","kind":"model","symbols":["EXTERNAL_ENGINES"]},{"path":"src/engines/opendss/exportDss.ts","kind":"calc","symbols":["exportDss","dssName","uniqueDssNames","dssComment"]},{"path":"engines/python/lvds_engine.py","kind":"calc","symbols":["main","probe","run_opendss","run_pandapower","check_project","check_dss_line","overload_hints","supply_board_of","dss_name","CABLES"]},{"path":"engines/python/requirements.txt","kind":"model","symbols":[]},{"path":"electron/engineRunner.cjs","kind":"store","symbols":["runJsonProcess"]},{"path":"electron/main.cjs","kind":"store","symbols":["runEngine","pythonPath","engineScript","engines:probe","engines:run","settings:choosePython"]},{"path":"electron/ipcValidate.cjs","kind":"store","symbols":["engineRequest"]},{"path":"src/components/EngineCompare.tsx","kind":"screen","symbols":["EngineCompare","delta","formatDelta","COLUMNS"]},{"path":"src/App.tsx","kind":"screen","symbols":["runSimulation","engineRun","engineFresh","exportOpenDss","resultsNote"]},{"path":"src/components/DiagramResultsBar.tsx","kind":"screen","symbols":["DiagramResultsBar"]},{"path":"src/diagram/annotations.ts","kind":"calc","symbols":["buildAnnotations"]},{"path":"src/calc/unbalancedFlow.ts","kind":"calc","symbols":["unbalancedFlow","flow","cableZ","VOLTAGE_UNBALANCE_LIMIT_PCT"]},{"path":"tests/engines/engines.test.ts","kind":"calc","symbols":[]}],"links":[{"to":"06-network-sld-editor","dir":"in","status":"working","what":"built-in results (evaluateProject), R factor, X/R default, transformer impedance","ref":"src/engines/builtin.ts:builtinEngine"},{"to":"02-project-storage","dir":"in","status":"working","what":"boards, feeders, ties, voltage, frequency, vdTempC","ref":"src/types.ts:Project"},{"to":"07-load-schedule-panels","dir":"in","status":"working","what":"per-phase demand for the unbalanced flow","ref":"src/calc/unbalancedFlow.ts:flow"},{"to":"12-transformer-generator","dir":"in","status":"working","what":"transformer kVA/%Z/X-R and closed bus ties (parallel transformers)","ref":"src/engines/opendss/exportDss.ts:exportDss"},{"to":"25-reports-exports","dir":"out","status":"working","what":"unbalanced flow tables in the Phase balance study report; .dss file save","ref":"src/docs/studyReport.ts:buildSection"},{"to":"23-cad-sheets-plot-titleblock","dir":"out","status":"working","what":"data link","ref":"src/components/cad/CadSheets.tsx:CadSheets"},{"to":"34-electron-desktop","dir":"both","status":"working","what":"Python process runner, IPC validation, Python path setting","ref":"electron/engineRunner.cjs:runJsonProcess"}],"gaps":[],"md":"# 16 — Load flow engines\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThis module runs a project's network through more than one calculation method, so the engineer can check the app's own results.\n\n- **Built-in engine.** This is the app's own TypeScript calculation (`evaluateProject` in `src/calc/electrical.ts`, module 06), wrapped so it can be called the same way as the other engines. It is a hand-calculation method: Ib at nominal voltage, voltage drop by the (R cos φ + X sin φ) formula, and Ik″ to IEC 60909 with c = 1.05.\n- **External engines (OpenDSS, pandapower).** A Python helper (`engines/python/lvds_engine.py`) runs a true load flow (an iterative solution of the network voltages) and a fault study. OpenDSS and pandapower are free power-system programs. Both must be installed separately with `pip`, and they run only in the desktop app.\n- **OpenDSS export.** This writes the network as an OpenDSS script (`.dss`, a text file of OpenDSS commands). The engineer can open the file in OpenDSS. The OpenDSS engine runs the same script.\n- **Engine compare screen.** This is the \"Load flow\" left-menu view (`view === 'engines'`). It shows Ib, total voltage drop, Ik″ at the breaker and Ik″ at the cable end for every circuit: built-in value, external value and the difference between them.\n- **SLD results source.** On the network SLD (single-line diagram), the results bar can switch the labels from the built-in values to OpenDSS or pandapower results.\n- **Unbalanced flow.** This is a TypeScript per-phase load flow (`src/calc/unbalancedFlow.ts`). It models R, Y and B separately with the neutral conductor, and reports per-phase voltage drop, neutral current, neutral shift and voltage unbalance. Its results appear only in the \"Phase balance\" study report.\n\n- a second translator from the project to a network model (`run_pandapower`), separate from `exportDss`;\n- a hand voltage-drop estimate used only in error hints (`overload_hints`);\n- its own topology checks (`check_project`).\n\n| Quantity | Built-in (`electrical.ts`) | OpenDSS (Python) | pandapower (Python) | Unbalanced flow (TS) |\n|---|---|---|---|---|\n| Ib | Nominal-voltage formula. Incomer = most-loaded phase (`designCurrentA`, `incomerBasis`) | Load-flow line current, highest phase | Load-flow `i_from_ka`, balanced 3-phase only. Not given for 2-core circuits | Per-phase current internally. Not reported as Ib |\n| Voltage drop | Formula summed from the main busbar (`voltageDropPct`, `upstreamVoltageDropPct`) | (V main busbar − V end) in pu | Same as OpenDSS | Per phase, (\\|U main\\| − \\|U\\|) ÷ U0, worst phase |\n| Busbar voltage | 100 − drop from the main busbar (`boardSummary`) | Includes the transformer's own drop | Includes the transformer drop | Includes the transformer drop |\n| Ik″ max | c = 1.05, cable R at 20 °C, infinite MV, no KT (`faultCurrentKA`, `cableImpedance`) | c = 1.0, **cable R at operating temperature**, 100 GVA MV | c = 1.10 + KT, **cable R at operating temperature** | — |\n| Single-phase circuits | L-N, phase allocation used | All on node 1 (phase R) | Treated as balanced 3-phase | On their labelled phase, with the neutral |\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/engines/types.ts` | model | `CalcEngine`, `StudyResults`, `EngineFeederResult`, `EngineBoardResult`, `EngineProbe` | The shared \"engine\" interface. The per-feeder fields are optional: `ib`, `vdTotalPct`, `breakerFaultKA`, `endFaultKA`. The per-board fields are `voltagePct` and `faultKA`. |\n| `src/engines/builtin.ts` | calc | `builtinEngine` | Wraps `evaluateProject` (module 06) as an engine. Always available. |\n| `src/engines/external.ts` | calc | `openDssEngine`, `pandapowerEngine`, `pythonEngine`, `probeEngines`, `engineRequest`, `engineCableData` | Sends the project, the cable table (`cables()`) and the R factor (`resistanceFactor`) to the Python helper over IPC (inter-process messages between the screen and the desktop main process). The probe result is cached in `probeCache`. |\n| `src/engines/index.ts` | model | `EXTERNAL_ENGINES`, `builtinEngine` | Lists the engines shown in the drop-downs. |\n| `src/engines/opendss/exportDss.ts` | calc / export | `exportDss`, `dssName`, `uniqueDssNames`, `dssComment` | Builds the OpenDSS script and warnings, then runs a load flow and a fault study in it. |\n| `engines/python/lvds_engine.py` | calc (Python) | `main`, `probe`, `run_opendss`, `run_pandapower`, `check_project`, `check_dss_line`, `overload_hints`, `supply_board_of`, `CABLES` | Reads one JSON request on stdin and writes one JSON answer on stdout. Allows only these OpenDSS commands: `ALLOWED_DSS`, `ALLOWED_DSS_SET`. |\n| `engines/python/requirements.txt` | config | — | Pins pandapower 3.2.2, opendssdirect.py 0.9.4 and dss-python. `tested_versions` reads it to warn when a different version is installed. |\n| `electron/engineRunner.cjs` | desktop process | `runJsonProcess` | Starts Python with no shell. Limits output size, applies a timeout (120 s for a run, 30 s for the probe), stops the child process, and always answers with JSON or `{error}`. |\n| `electron/main.cjs` (:461–487) | desktop process | `engineScript`, `pythonPath`, `runEngine`, IPC `engines:probe`, `engines:run`, `settings:choosePython` | Finds the script (dev folder, or `resources/python` in the installed app). Uses the saved Python path, otherwise `python3` (`python` on Windows). |\n| `electron/ipcValidate.cjs` | desktop process | `engineRequest` (:115) | Checks the engine name, the request size (≤ 20 MB) and that a project / dss script is present. |\n| `electron/preload.cjs` (:52–54) | desktop process | `lvds.engines.probe/run`, `lvds.settings.choosePython` | The bridge the screen code calls. |\n| `src/components/EngineCompare.tsx` | screen | `EngineCompare`, `delta`, `formatDelta`, `COLUMNS` | The comparison table. Tolerances: Ib 5 %, VD 0.25 points, Ik 5 %. Also shows install hints and \"Choose Python…\". |\n| `src/components/DiagramResultsBar.tsx` (:79–86) | screen | \"Results: … load flow\" select, \"Run simulation\" | Chooses the SLD result source. |\n| `src/diagram/annotations.ts` | calc / screen | `buildAnnotations` | Puts engine values in place of the built-in Ib, VD, end fault, busbar voltage and busbar fault on the SLD labels. |\n| `src/calc/unbalancedFlow.ts` | calc | `unbalancedFlow`, `flow`, `cableZ`, `VOLTAGE_UNBALANCE_LIMIT_PCT` | Per-phase backward/forward sweep (an iterative method for radial networks) with the neutral. |\n| `src/docs/studyReport.ts` (:293–330) | report | `buildSection` key `'phase'` | The only consumer of `unbalancedFlow`. |\n| `tests/engines/engines.test.ts`, `tests/engines/referenceNetworks.ts`, `tests/engines/golden/*.json` | test | — | Golden results, hand calculation, OpenDSS vs pandapower agreement and error messages. CI installs the engines (`.github/workflows/ci.yml:59–73`). |\n| `src/engines/opendss/exportDss.test.ts`, `src/calc/unbalancedFlow.test.ts`, `src/model/engineRunner.test.ts` | test | — | Unit tests. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Boards, feeders, ties, voltage, frequency, `vdTempC`, `vdLimitPct` | 02-project-storage | `src/types.ts` `Project`, `Board`, `Feeder`, `BusTie` |\n| Transformer kVA, %Z, X/R per main board | 12-transformer-generator / 06-network-sld-editor | `Board.sourceKva`, `sourceImpedancePct`, `sourceXr` |\n| Built-in results, R factor, X/R default, demand | 06-network-sld-editor | `src/calc/electrical.ts` `evaluateProject`, `resistanceFactor`, `rOperatingOhmPerKm`, `runsOf`, `DEFAULT_TRANSFORMER_XR`, `boardDemandKw`, `transformerImpedance`, `feederRating` |\n| Cable R20, X, ampacity | 11-breaker-cable-selection / 32-component-database | `src/calc/cableTable.ts` `cables`, `getCable`, `cablesSource` |\n| Per-phase demand of each board | 07-load-schedule-panels | `src/calc/loadSchedule.ts` `boardPhasePQ` |\n| Board supply order | 06-network-sld-editor | `src/calc/summary.ts` `boardsInSupplyOrder`, `src/calc/network` `withNetwork` |\n| Python executable path | 34-electron-desktop | `electron/main.cjs` `pythonPath`, `readSettings` |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Comparison table (screen only) | this module | `src/components/EngineCompare.tsx` |\n| Engine Ib / VD / end fault / busbar V / busbar Ik on SLD labels, and the \"✕ Icu \u003c Ik\" tag | 06-network-sld-editor | `src/App.tsx` `annotations` → `src/diagram/annotations.ts` `buildAnnotations` → `src/components/SystemDiagram.tsx` `feederTags`, `icuShort`, `boardTags` |\n| The same annotations in the system summary cards | 28-dashboard-readiness / 06 | `src/App.tsx:1521` `SystemSummaryCards annotations=` |\n| The same annotations on the design shown beside CAD sheets | 23-cad-sheets-plot-titleblock | `src/App.tsx:1588` → `src/components/cad/CadSheets.tsx` `SystemDiagram annotations=` |\n| `.dss` file saved to disk | 25-reports-exports | `src/App.tsx` `exportOpenDss` ← Ribbon \"Export OpenDSS (.dss)\" (`src/components/Ribbon.tsx:1191`) |\n| Unbalanced flow tables (busbars, circuits) | 25-reports-exports | `src/docs/studyReport.ts` `buildSection('phase')` → `StudyReportsView`, Word / workbook |\n\n## 5. User flow — from button click to result\n\n**Compare screen**\n1. The user opens \"Load flow\" in the left menu (`src/App.tsx:195` view list) and `EngineCompare` mounts.\n2. `useEffect` → `probeEngines()` (`external.ts`) → `window.lvds.engines.probe()` → IPC `engines:probe` → `runEngine({engine:'probe'}, 30000)` → `runJsonProcess` starts `python3 lvds_engine.py`. `probe()` tries to import `opendssdirect` and `pandapower` and compares the versions with `requirements.txt`.\n4. The user picks an engine and clicks \"Run study\". `runStudy` runs `builtinEngine.run(project)` and `engine.run(project)` together.\n5. `engine.run` → `engineRequest(id, project)`. For OpenDSS this adds `exportDss(project).script`. For both engines it adds `engineCableData` → IPC `engines:run` → `ipcValidate.engineRequest` → Python `main` → `run_opendss` or `run_pandapower`.\n7. The table shows each circuit with its difference. A cell is coloured `warn` when the difference is above the tolerance. Below the table come the engine messages and a fixed \"Expected differences\" note. If the project has changed since the run, a warning appears.\n\n**SLD**\n1. In the results bar, the user chooses \"Results: OpenDSS load flow\" and clicks \"Run simulation\" (`DiagramResultsBar`) → `runSimulation` → `setEngineRun`.\n2. `engineFresh` is true while the project object is unchanged, so `buildAnnotations` uses the engine values. Any edit falls back to the built-in values and shows the note \"Project changed — showing built-in values; run again\".\n\n**OpenDSS export**\n1. Ribbon \"Export OpenDSS (.dss)\" → `exportOpenDss` → `exportDss(project)` → `saveText(name.dss)`. Warnings appear in the status line.\n\n**Unbalanced flow**\n1. Reports → Study reports → \"Phase balance\" → `buildSection('phase')` → `unbalancedFlow(p)`. The busbar and circuit tables are added to the report.\n\n## 6. Linked to (working connections)\n\n- **06-network-sld-editor (in):** `builtinEngine` calls `evaluateProject`. `exportDss` and `unbalancedFlow` reuse `rOperatingOhmPerKm`, `runsOf`, `DEFAULT_TRANSFORMER_XR` and `transformerImpedance`, so cable R and the transformer split match the built-in method.\n- **06-network-sld-editor (out):** engine results replace the built-in SLD labels while they are fresh (`App.tsx:463`, `annotations.ts` `buildAnnotations`).\n- **11 / 32 (in):** the cable table actually in use (Cables.xlsx or reference) and the R factor are sent with every run (`engineCableData`), so pandapower uses the same R and X as the app.\n- **07-load-schedule-panels (in):** `unbalancedFlow` takes per-phase demand from `boardPhasePQ`, so circuits with R/Y/B allocation are modelled on their own phase.\n- **25-reports-exports (out):** the unbalanced flow appears in the Phase balance study report (`studyReport.ts:293`). The `.dss` file is saved through `saveText`.\n- **34-electron-desktop (both):** `runJsonProcess` sets the timeout and output limits, `ipcValidate.engineRequest` checks the request, and the Python path is kept in settings.\n- **12-transformer-generator (in):** closed bus ties between main boards become parallel transformers in OpenDSS (`exportDss.ts:106`) and in pandapower (`lvds_engine.py:368`).\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"33-quick-calcs-existing","name":"Quick calcs & existing checks","full":"Quick calcs & existing checks","group":"Studies","summary":"A stand-alone Quick calculators screen with 11 tabs (current/power, cable and breaker, voltage drop, transformer, motor, PF correction, fault at cable end, lux, Ohm's law, energy, units). motor.ts holds the starter multiples and starting kVA used across the app. Existing-installation checks turn a board's recorded maximum demand into covering load and check transformer, incomer, existing feeders, spare ways, shared supply and RMU, shown on the sizing page and in the sizing report section.","files":[{"path":"src/components/QuickCalcs.tsx","kind":"screen","symbols":["QuickCalcs","useInputs","restore","useTab","Card","Field","Pick","BreakerOutput","sizeCable"]},{"path":"src/components/QuickAsides.tsx","kind":"screen","symbols":["PowerTriangle","Steps","SupplyStrip","CandidatesTable","LineChart","RefTable","PfcTriangles"]},{"path":"src/components/quickInputs.ts","kind":"screen","symbols":["quickNumber","quickInputErrors"]},{"path":"src/calc/quick.ts","kind":"calc","symbols":["currentFromPower","powerFromCurrent","triangle","voltageDrop","nextBreaker","cableFor","transformer","motor","pfCorrection","faultAtCableEnd","faultFromTransformer","ohm","energy","awgToMm2","mm2ToAwg","kcmilToMm2","cableCandidates","TX_RATINGS_KVA","pfcBank","startingDip"]},{"path":"src/calc/motor.ts","kind":"calc","symbols":["STARTERS","isMotor","starterOf","starterInfo","runningKva","startingKva","GENERATOR_XD_TRANSIENT_PCT","MOTOR_START_DIP_LIMIT_PCT","motorStartDipPct"]},{"path":"src/model/existing.ts","kind":"model","symbols":["DEFAULT_EXISTING_PF","isExisting","otherKva","recordedKva","othersKva","existingLoad","recordedPQ","recordedText"]},{"path":"src/calc/existing.ts","kind":"calc","symbols":["ExistingCheck","newDemandKva","newWaysOn","existingChecks"]},{"path":"src/components/studies/ExistingChecks.tsx","kind":"screen","symbols":["ExistingChecksCard"]},{"path":"src/types.ts","kind":"model","symbols":["ExistingInfo","OtherBuilding","Board.existing","Feeder.existing","Feeder.starter","StarterType"]}],"links":[{"to":"03-parameters-rules","dir":"in","status":"working","what":"project voltage, ambient, VD limit as quick defaults; transformer loading limit for existing check","ref":"src/components/QuickCalcs.tsx:QuickCalcs"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"R/X, cable impedance, fault formula, selectCableRuns reused by quick cards","ref":"src/calc/quick.ts:cableFor"},{"to":"06-network-sld-editor","dir":"out","status":"working","what":"recorded MD as covering P/Q in board totals; MD label on system diagram","ref":"src/model/existing.ts:recordedPQ"},{"to":"07-load-schedule-panels","dir":"out","status":"working","what":"recorded MD in panel load totals","ref":"src/calc/loadSchedule.ts:boardPhasePQ"},{"to":"08-voltage-drop","dir":"out","status":"working","what":"starter multiple for motor-start voltage drop","ref":"src/calc/voltageDrop.ts:starterInfo"},{"to":"12-transformer-generator","dir":"out","status":"working","what":"ExistingChecksCard on the sizing page; starting kVA and dip for generator sizing","ref":"src/components/studies/SizingStudy.tsx:SizingStudy"},{"to":"18-lighting-emergency","dir":"in","status":"working","what":"lumen method for the lux tab","ref":"src/components/QuickCalcs.tsx:lumenMethod"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"existing boards and feeders left out of the BOQ","ref":"src/calc/bom.ts"},{"to":"25-reports-exports","dir":"out","status":"working","what":"existing checks table in sizing section of study and calculation report","ref":"src/docs/studyReport.ts:buildSection"},{"to":"31-headless-cli-mcp","dir":"out","status":"working","what":"seven quick formulas as MCP/CLI tools","ref":"src/headless/tools.ts:calc_cable_size"},{"to":"32-component-database","dir":"in","status":"working","what":"cable table and breaker ratings from database","ref":"src/calc/cableTable.ts:cables"},{"to":"01-app-shell","dir":"in","status":"working","what":"view 'calculators' renders QuickCalcs","ref":"src/App.tsx:QuickCalcs"}],"gaps":[],"md":"# 33 — Quick calculators, motor calc, existing-installation checks\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThe module has three parts.\n\n   - Power & current: three modes. Power → current (`currentFromPower`), current → power (`powerFromCurrent`), and any two of kW / kVA / kVAr / PF (`triangle`).\n   - Cable & breaker: the next standard breaker In ≥ Ib (`nextBreaker`). Then the smallest Cu cable, adding parallel runs when needed, with Iz ≥ max(Ib, In) after ambient × grouping derating and the voltage drop within the limit (`cableFor`, which calls `selectCableRuns` in `electrical.ts`). Also a table of nearby sizes (`cableCandidates`).\n   - Voltage drop: ΔV = √3 (or 2 for 1-phase) · I · L · (R cosφ + X sinφ) ÷ runs (`voltageDrop`). Also max length, other sizes and a chart.\n   - Transformer: FLC = S ÷ √3U. LV terminal fault Ik″ = c · In ÷ uk, with c = 1.05 and an infinite MV source (`transformer`).\n   - Motor: FLC from output kW, PF and η. Starting current = FLC × starter multiple (`motor`, `STARTERS`). Screening voltage dip at the source = S_start ÷ (S_start + S_source ÷ Z) (`startingDip`).\n   - PF correction: Q = P (tan φ1 − tan φ2) (`pfCorrection`) and a bank of equal steps (`pfcBank`).\n   - Fault level at cable end: from a transformer (`faultFromTransformer`) or from a known fault level at the start (`faultAtCableEnd`, X/R = 5). Both use `cableImpedance` (R at 20 °C) and `faultCurrentKA`.\n   - Lighting lux (lumen method, `lumenMethod` from `src/calc/lighting.ts`, owned by 18-lighting-emergency), Ohm's law (`ohm`), energy & cost (`energy`), unit conversions (`awgToMm2`, `mm2ToAwg`, `kcmilToMm2`, `HP_KW`).\n2. **Motor starting data** (`src/calc/motor.ts`). The starter table (`STARTERS`: DOL 6×, star-delta 2×, soft starter 3×, VFD 1.2×), the motor test (`isMotor`), `starterOf`, `runningKva`, `startingKva` and the generator dip `motorStartDipPct` (fixed X′d = 25 %, limit 15 %). These are used by the quick motor card and by the network, voltage-drop, generator and scenario calculations.\n3. **Existing-installation checks** (`src/model/existing.ts`, `src/calc/existing.ts`, `src/components/studies/ExistingChecks.tsx`). A board can be marked *existing* and given a recorded maximum demand (kVA, or A converted at √3·U), PF, margin %, date and source, spare ways found at the survey, and \"other buildings\" on a shared supply. The recorded MD **covers** all existing load at and below the board, and new load is added on top (`existingLoad`, `recordedPQ`, used inside the load totals of `electrical.ts`, `summary.ts`, `loadSchedule.ts`). `existingChecks` builds six kinds of check row:\n   - transformer spare capacity against kVA × the design loading limit;\n   - incomer / busbar loading;\n   - each existing feeder's Ib ≤ In ≤ Iz, Icu and voltage drop;\n   - new ways against spare ways;\n   - load kept for each other building;\n   - a new transformer on an existing RMU (at most 2 per RMU).\n\n## 2. Files, components, functions and stores\n\n(\"Store\" = the place the app keeps data. Here the project object, plus browser `localStorage` for quick-calculator inputs.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/components/QuickCalcs.tsx` | screen | `QuickCalcs` (default, :153), `useInputs` (:38), `restore` (:29), `useTab` (:122), `Card`, `Field`, `Pick`, `BreakerOutput` (:137), `sizeCable` (:234) | The \"Quick calculators\" page, its 11 tabs, input memory and the right-hand panels (steps, tables, charts). \"Size the cable for … A\" carries a current from the Power tab into the Cable tab. |\n| `src/components/QuickAsides.tsx` | screen | `PowerTriangle` (:10), `Steps` (:33), `SupplyStrip` (:38), `CandidatesTable` (:59), `LineChart` (:94), `RefTable` (:133), `PfcTriangles` (:148) | Drawing and table helpers. `SupplyStrip` works out the current again and a capacitor for PF 0.95. |\n| `src/calc/quick.ts` | calc | `currentFromPower` (:34), `powerFromCurrent` (:43), `triangle` (:60), `voltageDrop` (:93), `nextBreaker` (:112), `cableFor` (:125), `transformer` (:145), `motor` (:153), `pfCorrection` (:167), `faultAtCableEnd` (:179), `faultFromTransformer` (:190), `ohm` (:198), `energy` (:215), `awgToMm2`/`mm2ToAwg`/`kcmilToMm2` (:222–226), `cableCandidates` (:234), `TX_RATINGS_KVA` (:248), `pfcBank` (:252), `startingDip` (:264) | The quick formulas. Cable data, R/X, breaker list and fault formulas come from `cableTable.ts`, `electrical.ts` and `sizing.ts`. |\n| `src/calc/motor.ts` | calc | `STARTERS` (:7), `isMotor` (:14), `starterOf` (:17), `starterInfo` (:19), `runningKva` (:22), `startingKva` (:25), `GENERATOR_XD_TRANSIENT_PCT` (:28), `MOTOR_START_DIP_LIMIT_PCT` (:30), `motorStartDipPct` (:34) | Starter multiples and motor starting kVA for the whole app. |\n| `src/model/existing.ts` | model | `DEFAULT_EXISTING_PF` (:17), `isExisting` (:19), `otherKva` (:22), `recordedKva` (:25), `othersKva` (:34), `drawnExistingKva` (:37), `existingLoad` (:58), `recordedPQ` (:66), `recordedText` (:74) | Turns the survey data on a board into an existing load (kVA, or P/Q) that covers the load below it. Also the \"MD 610 kVA (DEWA reading, …)\" label. |\n| `src/calc/existing.ts` | calc | `ExistingCheck` (:19), `newDemandKva` (:33), `newWaysOn` (:36), `existingChecks` (:38) | Builds the check rows. |\n| `src/components/studies/ExistingChecks.tsx` | screen | `ExistingChecksCard` (:9) | \"Existing installation\" card at the top of the Transformer & generator sizing page. Shown only when a board is existing. |\n| `src/types.ts` | model | `ExistingInfo` (:281), `OtherBuilding` (:301), `Board.existing` (:367), `Feeder.existing` (:215), `Feeder.starter` (:238), `StarterType` (:142) | Saved fields in the project file. |\n| `src/components/BoardFields.tsx` | screen | existing block (:87–110) | Where the recorded MD, A, PF, margin, date, source, spare ways and other buildings are typed (owned by 06/07). |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Default voltage, ambient, VD limit for the quick cards | 03-parameters-rules / 02-project-storage | `QuickCalcs.tsx:QuickCalcs` reads `project.voltageV`, `project.ambientC`, `project.vdLimitPct` (:154–155, :222, :237) |\n| Cable sizes, R20, X, ampacity (method E), ambient factor | 11-breaker-cable-selection / 32-component-database | `cableTable.ts:cables`, `getCable`, `ambientCorrectionFactor` |\n| R at operating temperature (always 1.2 × R20 in quick) | 06-network-sld-editor | `electrical.ts:rOperatingOhmPerKm` (:31), `resistanceFactor` (:38) |\n| Cable search (sizes, runs, VD) | 06-network-sld-editor | `electrical.ts:selectCableRuns` (:220) |\n| Standard breaker ratings | 11-breaker-cable-selection / 32-component-database | `sizing.ts:breakerRatings` (:18) |\n| Transformer / cable impedance, c max, Ik″ | 06-network-sld-editor | `electrical.ts:transformerImpedance` (:253), `cableImpedance` (:271), `C_MAX` (:335), `faultCurrentKA` (:343) |\n| Lumen method, lux targets, reflectances | 18-lighting-emergency | `lighting.ts:lumenMethod`, `LUX_TARGETS`, `REFLECTANCES` |\n| Board survey data (recorded MD, PF, margin, spares, other buildings) | 06-network-sld-editor | `BoardFields.tsx` existing block → `Board.existing` |\n| Existing flag on feeders | 06-network-sld-editor / 07-load-schedule-panels | `Feeder.existing` |\n| Feeder results (Ib, Iz, Vd, Icu status) for existing feeders | 06-network-sld-editor | `electrical.ts:evaluateProject` (:427), called in `ExistingChecks.tsx:ExistingChecksCard` and `calcReport.ts:calcReportData` |\n| Board totals and summary | 06-network-sld-editor / 07-load-schedule-panels | `summary.ts:boardSummary`, `boardTotals` |\n| Transformer design loading limit | 03-parameters-rules | `settingsOf(project).transformerMaxLoadingPct` in `existing.ts:existingChecks` (:40) |\n| Transformer units per board (for the RMU check) | 09-earthing / 12-transformer-generator | `earthingPlan.ts:txUnits` |\n| Motor starter per feeder | 06-network-sld-editor | `FeederForm.tsx` starter select (:167), `sldEdit.ts` starter palette (:127, :460) |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| Recorded MD covering existing load (P, Q) | 06-network-sld-editor, 07-load-schedule-panels, 12-transformer-generator | `electrical.ts:boardDemandKw` (:62), `summary.ts` (:44), `loadSchedule.ts` (:190, :228) call `recordedPQ` |\n| \"MD … kVA (source, date)\" label on the system diagram | 06-network-sld-editor | `SystemDiagram.tsx` (:371, :994, :1689) call `recordedKva`, `recordedText` |\n| Existing checks on screen | 12-transformer-generator | `SizingStudy.tsx` (:89) renders `ExistingChecksCard` |\n| Existing checks in the sizing study section (PDF / Word / Excel) | 25-reports-exports | `studyReport.ts:buildSection` 'sizing' (:382 filter, :398 method text, :422 table) |\n| Existing checks in the calculation report | 25-reports-exports | `calcReport.ts:CALC_REPORT_STUDIES` includes 'sizing' (:26), with real results (:34) |\n| Existing boards / feeders left out of the BOQ | 20-equipment-boq-pricing | `bom.ts` (:106, :194, :211, :221, :298) skip `b.existing` / `f.existing` |\n| Starter multiples, running / starting kVA | 12-transformer-generator | `txGen.ts` (:248–271), `sizing.ts` (:179–181) |\n| Starter multiple for motor-start voltage drop | 08-voltage-drop | `voltageDrop.ts` (:90) `starterInfo(starterOf(f)).multiple` |\n| Generator dip in outage scenarios | 12-transformer-generator / 06-network-sld-editor | `scenario.ts` (:62–69), `SystemDiagram.tsx` (:1471, :1510) |\n| Starter symbol / label on SLD | 24-drawings-sld-sheets / 06-network-sld-editor | `sldDevices.ts` (:27–30), `IecSymbols.tsx` (:83) |\n| Quick formulas as CLI / MCP tools | 31-headless-cli-mcp | `headless/tools.ts` `calc_current`, `calc_voltage_drop`, `calc_cable_size`, `calc_transformer`, `calc_fault_level`, `calc_motor`, `calc_pf_correction` (:196–281) |\n| Starter list in component / preset editors | 32-component-database / 03-parameters-rules | `ComponentEditor.tsx` (:46), `PresetEditor.tsx` (:69) |\n\n## 5. User flow — from button click to result\n\n**Quick calculators**\n1. Left menu → Calculators: `App.tsx` (:1644) renders the lazily loaded `QuickCalcs` with the project (view `calculators`).\n2. `useTab` restores the last tab from `localStorage` (`lvds.quick.tab`). `useInputs` restores each card's inputs. `restore` drops a saved value when its default (e.g. project voltage) has changed since it was saved.\n3. The user types a value. `Field` → `set` → `useInputs` saves to `localStorage` and re-renders.\n4. `quickInputErrors(card, values)` checks the inputs. If there is any error, `Card` shows \"Correct the highlighted inputs\" and no result.\n5. Otherwise the card's calc runs. For example the Cable tab calls `cableFor` → `nextBreaker` → `selectCableRuns` → `voltageDrop`, and `cableCandidates` fills the side table.\n6. Asides (`Steps`, `RefTable`, `LineChart`) show the worked steps. On the Power tab, \"Size the cable for … A\" (`SupplyStrip.onCable` → `sizeCable`) copies the current into the Cable tab.\n7. Nothing is written to the project. \"Reset inputs\" clears the card's `localStorage` key.\n\n**Existing installation**\n1. On the system diagram the user opens a board and ticks Existing in its properties (`BoardFields.tsx`). They then enter the recorded MD, PF, margin, spares and other buildings → `Board.existing`.\n2. Every load total reads `recordedPQ` (via `existingLoad`). The recorded MD replaces the existing feeders below that board, and new feeders are added on top.\n3. Studies → Transformer & generator sizing: `SizingStudy` renders `ExistingChecksCard`. That runs `evaluateProject` and then `existingChecks`, and shows the table with status counts.\n4. Reports: the sizing section of the study report / calculation report calls `existingChecks(p, data.results)`. For a partial scope it keeps only rows of the boards in scope.\n\n## 6. Linked to (working connections)\n\n- **06-network-sld-editor**: quick VD, fault and cable sums reuse `rOperatingOhmPerKm`, `cableImpedance`, `transformerImpedance`, `faultCurrentKA`, `C_MAX` and `selectCableRuns`. These are the same R/X data and fault formulas. The recorded MD enters every board total through `recordedPQ`.\n- **11-breaker-cable-selection / 32-component-database**: the quick cards use the same cable table (`cables()`, which is Cables.xlsx when loaded) and breaker list (`breakerRatings()`).\n- **12-transformer-generator**: `ExistingChecksCard` sits on the sizing page. `STARTERS`, `runningKva`, `startingKva` and `motorStartDipPct` drive generator sizing for motor starting.\n- **08-voltage-drop**: the motor-start voltage drop uses `starterInfo(...).multiple`.\n- **25-reports-exports**: existing checks appear in the sizing section of the calculation report and of the study reports.\n- **20-equipment-boq-pricing**: existing boards and feeders are left out of the BOQ.\n- **31-headless-cli-mcp**: seven quick formulas are exposed as MCP / CLI tools.\n- **18-lighting-emergency**: the lux tab calls the shared `lumenMethod`.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"17-enclosure-form4","name":"Enclosure & Form 4","full":"Enclosure & Form 4","group":"Equipment & containment","summary":"Sizes the physical space of boards. DBs/EDBs are checked by DIN-module count (equipment + spare \u003c= the supplier catalogue's usable modules for the ELCB/incomer case). The chosen size is frozen on the board and printed in the BOQ.","files":[{"path":"src/calc/enclosure.ts","kind":"calc","symbols":["BUILTIN_CATALOGUES","MODULAR","FABRICATED","WEATHERPROOF","applicableRules","sizeEnclosure","selectionFrom","spareFromPct","DEFAULT_SPARE_PCT","EnclosureSelection"]},{"path":"src/calc/form4.ts","kind":"calc","symbols":["FORM4_COLUMNS","FORM4_GROUPS","FORM4_HEIGHT","FORM4_DEPTH","FORM4_PLINTH","FORM4_STACK","sizeForm4","stackSections","form4Selection","form4SizeText"]},{"path":"src/model/form4Count.ts","kind":"model","symbols":["FORM4_ROLES","isForm4Board","riserColumn","capacitorColumn","outgoingColumn","form4IncomerA","form4FromSld"]},{"path":"src/model/enclosureLibrary.ts","kind":"store","symbols":["allCatalogues","saveUserCatalogues","duplicateCatalogue","emptyCatalogue","validateCatalogue","exportLibrary","importLibrary","DeviceDim","loadDevices","saveDevices","TYPICAL_DEVICES","neededDevices","matchDevice","scheduleModules"]},{"path":"src/model/enclosureWorkbook.ts","kind":"model","symbols":["catalogueWorkbook","readCatalogueWorkbook"]},{"path":"src/data/brandDevices.ts","kind":"model","symbols":["BRAND_DEVICES"]},{"path":"src/diagram/form4Drawing.ts","kind":"report","symbols":["FORM4_LAYERS","form4Drawing","form4Dxf","form4DrawingSvg"]},{"path":"src/components/EnclosureSizing.tsx","kind":"screen","symbols":["EnclosureSizing","DbSizing","preview","addWidth","use","exportSheet"]},{"path":"src/components/Form4Sizing.tsx","kind":"screen","symbols":["Form4Sizing","CONFIRM","use","exportSheet","exportDxf"]},{"path":"src/components/CatalogueManager.tsx","kind":"screen","symbols":["CatalogueManager","exportJson","exportXlsx"]},{"path":"src/types.ts","kind":"model","symbols":["Board.enclosure","Board.form4"]},{"path":"src/components/BoardPanel.tsx","kind":"screen","symbols":["BoardPanel (enclosure line)"]}],"links":[{"to":"07-load-schedule-panels","dir":"in","status":"working","what":"final circuits, ELCB groups, spare ways for the DB device list","ref":"src/model/enclosureLibrary.ts:neededDevices"},{"to":"06-network-sld-editor","dir":"in","status":"working","what":"MDB/SMDB feeders and ratings counted into Form-4 columns; incomer from feeder above","ref":"src/model/form4Count.ts:form4FromSld"},{"to":"12-transformer-generator","dir":"in","status":"working","what":"ACB mains/generator changeover adds a second incomer cubicle","ref":"src/model/form4Count.ts:form4FromSld"},{"to":"09-earthing","dir":"in","status":"working","what":"breakerTypeOf default (MCB \u003c= 63 A, else MCCB) used for device kind","ref":"src/calc/earthing.ts:breakerTypeOf"},{"to":"02-project-storage","dir":"out","status":"working","what":"frozen Board.enclosure / Board.form4 saved in project file with undo step","ref":"src/components/EnclosureSizing.tsx:use"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"enclosure size and supplier extra busbar written into panel BOQ line and key","ref":"src/calc/bom.ts:110"},{"to":"03-parameters-rules","dir":"out","status":"working","what":"page gated to the detailed design stage","ref":"src/model/designStage.ts:42"},{"to":"34-electron-desktop","dir":"out","status":"working","what":"A4 PDF size sheets via savePdf; DXF via saveText","ref":"src/components/Form4Sizing.tsx:exportSheet"}],"gaps":[],"md":"# 17 — Enclosure sizing, Form 4 sizing, enclosure library and workbook\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\n1. **Distribution boards (DB / EDB): module counting against a supplier catalogue.** The check is `src/calc/enclosure.ts:sizeEnclosure`:\n   *equipment modules + future spare modules ≤ usable modules of the enclosure for the allowance case that applies.*\n   - A module is one 18 mm DIN-rail width.\n   - An **allowance case** is the supplier's deduction for terminals and incoming-cable space. It depends on the ELCB (RCCB) count and, for fabricated boxes, on the incomer current.\n   - Equipment modules can be typed by hand (\"Manual\"), or counted from the board's load schedule (\"From schedule\"). In schedule mode, each device takes its width from a **device dimension record**: the user's own record first, then the built-in manufacturer data, then the built-in \"typical\" widths.\n   - Three built-in catalogues are typed into the code: modular (rows × 16/24), fabricated, and weatherproof (`MODULAR`, `FABRICATED`, `WEATHERPROOF`).\n2. **MDB / SMDB: Form-4 line-up width (`src/calc/form4.ts:sizeForm4`).** This follows the owner's worksheet \"LV PANEL SIZE SELECTION.xlsx — FORM-4 Design Work Sheet\":\n   - width = Σ(quantity × fixed cubicle width) for incomers, busbar risers, capacitor-bank breakers and large outgoings;\n   - plus stacked 600 mm sections (1800 mm usable height each) for the smaller MCCBs;\n   - plus 300 mm cable chambers.\n   - Height H2100 + 100 mm plinth and depth D800 are fixed.\n   - Quantities can be counted from the SLD (`src/model/form4Count.ts:form4FromSld`) or typed by hand.\n   - The result is drawn as a dimensioned front view and plan view (`src/diagram/form4Drawing.ts`). The same geometry feeds the screen (SVG), the PDF and an R12 DXF.\n\nThe chosen size is kept on the board as a **frozen copy**: `Board.enclosure` or `Board.form4` (`src/types.ts:384–386`). It is then printed in the BOQ/BOM panel description (`src/calc/bom.ts:110–120`).\n\n**No temperature-rise or heat-dissipation check exists anywhere.** That would be IEC 61439-1 §10.10 verification, or the IEC TR 60890 calculation method. Both tabs only print a disclaimer saying it is a separate check (`EnclosureSizing.tsx:161,168`, `Form4Sizing.tsx:72`, `enclosure.ts:13`, `form4.ts:14`).\n\n## 2. Files, components, functions and stores\n\n(\"Store\" = the place the app keeps the project in memory. Here that is the project object passed through `onChange`. \"localStorage\" = a small per-computer browser store inside the app.)\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/enclosure.ts` | calc | `MODULAR` (:59), `FABRICATED` (:79), `WEATHERPROOF` (:106), `BUILTIN_CATALOGUES` (:125), `applicableRules` (:142), `sizeEnclosure` (:173), `selectionFrom` (:210), `spareFromPct` (:139), `DEFAULT_SPARE_PCT` (:137); types `EnclosureCatalogue`, `EnclosureConfig`, `AllowanceRule`, `SizingInput`, `Candidate`, `EnclosureSelection` | Built-in supplier charts, typed into the code. Finds which allowance cases apply, lists every size × case as fits / too-small / not-listed / confirm, and builds the frozen selection. |\n| `src/calc/form4.ts` | calc | `FORM4_COLUMNS` (:34), `FORM4_GROUPS` (:58), `FORM4_HEIGHT/PLINTH/DEPTH/STACK` (:68–71), `sizeForm4` (:96), `stackSections` (:130), `form4Selection` (:154), `form4SizeText` (:160) | The Form-4 worksheet as code: 21 columns with fixed cubicle widths (500/600/800 mm) or stacked heights (200–400 mm). Gives the width build-up and the section count, and saves a frozen copy. |\n| `src/model/form4Count.ts` | model | `FORM4_ROLES` (:7), `isForm4Board` (:8), `riserColumn` (:22), `capacitorColumn` (:33), `outgoingColumn` (:41), `form4IncomerA` (:55), `form4FromSld` (:61) | Sorts an MDB/SMDB's SLD breakers into worksheet columns by rating and role (incomer, riser ≥ 800 A to another board, capacitor, outgoing, spare). |\n| `src/model/enclosureWorkbook.ts` | model (import/export) | `catalogueWorkbook` (:10), `readCatalogueWorkbook` (:32) | Excel template, export and import of a catalogue (sheets Catalogue, Cases, Sizes). |\n| `src/data/brandDevices.ts` | data | `ROWS` (:11), `BRAND_DEVICES` (:30) | 16 built-in manufacturer device rows (W × H × D mm). DIN width ÷ 18 gives modules; chassis and door devices get 0 modules. |\n| `src/diagram/form4Drawing.ts` | report / drawing | `FORM4_LAYERS` (:9), `hDim`/`vDim` (:21,:34), `form4Drawing` (:46), `form4Dxf` (:105), `form4DrawingSvg` (:111) | Front and plan views in real mm. Output as DXF primitives, R12 DXF, or SVG (colour on screen, black for the PDF). |\n| `src/components/EnclosureSizing.tsx` | screen | `EnclosureSizing` (:60, tab switch), `DbSizing` (:68), `preview` (:22), `addWidth` (:87), `choosePanel` (:120), `use` (:139), `exportSheet` (:146) | DB tab: inputs, device list, catalogue matches, preview SVG, \"Use for \u003cpanel>\" (saves `Board.enclosure`), A4 PDF size sheet. |\n| `src/components/Form4Sizing.tsx` | screen | `Form4Sizing` (:19), `CONFIRM` (:12), `use` (:47), `exportSheet` (:54), `exportDxf` (:79) | Form-4 tab: SLD or manual quantities, width build-up, drawing, \"Use for \u003cpanel>\" (saves `Board.form4`), A4 PDF and DXF export. |\n| `src/components/CatalogueManager.tsx` | screen | `CatalogueManager` (:21), `persist` (:32), `exportJson` (:44), `exportXlsx` (:48) | Modal for editing catalogues (cases, sizes, usable figures) and device dimension records; JSON and Excel in and out. |\n| `src/types.ts` | model | `Board.enclosure` (:384), `Board.form4` (:386) | Saved in the project file. |\n| `src/components/BoardPanel.tsx` | screen | enclosure line (:77–81) | Shows the saved DB enclosure on the board's General tab (DB/EDB only), with a link to the page. |\n\n## 3. Inputs — where its data comes from\n\n| Data | From module (ID) | File + function |\n|---|---|---|\n| Boards, feeders, board role (DB/EDB/MDB/SMDB/…) | 02-project-storage, 06-network-sld-editor | `src/types.ts` `Board`/`Feeder`; `src/model/emergency.ts:roleOf` (:28) |\n| Final circuits of a DB and their ELCB groups | 07-load-schedule-panels | `src/calc/loadSchedule.ts:scheduleCircuits`, `elcbGroups` (called in `enclosureLibrary.ts:neededDevices` :135–136) |\n| Spare breakers and spaces | 07-load-schedule-panels | `src/model/spareWays.ts:spareWaysOf`, `spareBreaker` (used in `neededDevices` :144 and `form4FromSld` :88) |\n| Breaker type default (MCB ≤ 63 A, else MCCB) | 09-earthing (function lives in earthing calc) | `src/calc/earthing.ts:breakerTypeOf` (:22) |\n| Incomer rating | 06-network-sld-editor | feeder with `feedsBoardId` (`EnclosureSizing.tsx:96`, `form4Count.ts:form4IncomerA` :55), `Board.supply.ratingA`, `Board.ratedCurrentA` |\n| Generator ACB changeover (2nd incomer cubicle) | 12-transformer-generator | `Board.standby.changeover === 'ACB'` (`form4Count.ts:78`) |\n\n## 4. Outputs — where its results go\n\n| Result | Used by module (ID) | File + function |\n|---|---|---|\n| `Board.enclosure` (frozen DB selection) | 02-project-storage (saved with project; undo step) | `EnclosureSizing.tsx:use` (:142); `App.tsx:1648` `setProject(p, { step: true })` |\n| `Board.form4` (frozen Form-4 selection) | 02-project-storage | `Form4Sizing.tsx:use` (:50) |\n| Enclosure text and key on the panel BOQ line; supplier \"extra\" busbar line | 20-equipment-boq-pricing | `src/calc/bom.ts` (:110–120); `src/model/boqScope.ts` (:165) warns about legacy panel rates whose key lacks the enclosure |\n| Saved DB size shown on board | 06-network-sld-editor / 07-load-schedule-panels | `src/components/BoardPanel.tsx` (:79) |\n| Change tracking of `enclosure` / `form4` fields | 26-revisions-changes | `src/model/revisions.ts` (:134), `src/model/changeClass.ts` (:29), `src/model/sheetChanges.ts:BOARD_DRAWN` (:20, `form4` only) |\n| Design-stage gating of the page (detailed stage) | 03-parameters-rules | `src/model/designStage.ts` (:42) |\n| A4 PDF size sheets (DB and Form-4) | 34-electron-desktop (PDF render), 25-reports-exports (not in export centre) | `EnclosureSizing.tsx:exportSheet`, `Form4Sizing.tsx:exportSheet` → `src/util/files.ts:savePdf` |\n| Form-4 DXF (R12, 1:1 mm) | 24-drawings-sld-sheets (shares `toDxf`) | `form4Drawing.ts:form4Dxf` → `src/docs/dxf.ts:toDxf`; `Form4Sizing.tsx:exportDxf` |\n| `matchDevice` / `BRAND_DEVICES` reused for BOQ brand references | 20-equipment-boq-pricing | `src/calc/bom.ts:brandRef` (:65) |\n\n## 5. User flow — from button click to result\n\n**DB tab**\n1. The user opens Design → Enclosure sizing. `App.tsx:1648` mounts `EnclosureSizing`, keyed on the selected board. If the board's role is in `FORM4_ROLES`, the Form-4 tab opens (`EnclosureSizing.tsx:62`). Otherwise the DB tab opens.\n2. `DbSizing` lists the DB/EDB boards (:70). The panel's saved selection (if any) sets the method, catalogue, mounting and inputs (:72–78).\n3. **From schedule**: `neededDevices` (:85) builds the device list:\n   - the incomer;\n   - one breaker per circuit (RCBO if the circuit has its own RCD);\n   - spares and spaces;\n   - one RCCB per ELCB group.\n   `matchDevice` maps each to a width record. `scheduleModules` (:95) sums the modules and counts the ELCBs. The user can type a width for an unmapped device. `addWidth` (:87) then saves a new device record to localStorage.\n4. **Manual**: the user types equipment modules, ELCB count and incomer current.\n5. Spare is a % of the equipment space (`spareFromPct`, default 20 %) or a module count (:101).\n6. `sizeEnclosure` (:103) runs `applicableRules` and lists the candidates. The user can force rows or modules per row (:106–111) or click a row. `chosen` is the picked row, or else the first fit (:112).\n7. `preview` (:113) draws the front and side views. The \"Catalogue matches\" table shows the other sizes.\n9. **Export size sheet** → `exportSheet` (:146) → A4 PDF in black and white.\n\n**Form-4 tab**\n1. `Form4Sizing` lists boards where `isForm4Board` is true (:20). `form4FromSld` (:29) counts the SLD breakers into worksheet columns, with notes.\n2. The user may switch to \"Enter manually\" and change quantities (`setQty` :41).\n3. `sizeForm4` (:31) gives the width build-up. `form4DrawingSvg` (:32) draws the front and plan views.\n5. **Export size sheet** (PDF, :54) or **Export DXF** (:79, `form4Dxf`).\n\n## 6. Linked to (working connections)\n\n- **07-load-schedule-panels**: circuits, ELCB groups and spare ways feed the DB device list (`neededDevices`). Spare ways also feed Form-4 (`form4FromSld` :88).\n- **06-network-sld-editor**: feeders and ratings on the SLD give the Form-4 counts. The incomer is the feeder from the board above.\n- **12-transformer-generator**: an ACB mains/generator changeover adds a second incomer cubicle (`form4Count.ts:78`).\n- **20-equipment-boq-pricing**: the saved size is written into the panel BOQ description and key. The supplier \"extra\" (e.g. 800 mm busbar) becomes its own BOQ line (`bom.ts:120`).\n- **02-project-storage**: `Board.enclosure` / `Board.form4` are saved in the project file. Each save is one undo step.\n- **26-revisions-changes**: the fields are labelled and classed for change tracking.\n- **32-component-database** (library sync only): the catalogues and device records travel in Library.json (`librarySync.ts:6`).\n- **24-drawings-sld-sheets**: the Form-4 DXF uses the shared `toDxf` writer.\n\n\n\n---\n\n*Public summary: describes what the module does and how it connects. The engineering review of open issues is kept separately.*\n"},{"id":"18-lighting-emergency","name":"Lighting & emergency lighting","full":"Lighting & emergency lighting","group":"Equipment & containment","summary":"Lumen-method lux design (quick calculator for rectangles, and Light room for any room outline on a CAD plan) and emergency escape lighting by the spacing-table method after BS 5266-1 / EN 1838 (routes, points of emphasis, open areas, exit signs). Placed lights become lighting points on a circuit and a luminaire schedule that feeds the BOQ.","files":[{"path":"src/calc/lighting.ts","kind":"calc","symbols":["LUX_TARGETS","REFLECTANCES","roomIndex","estimateUf","gridLayout","lumenMethod"]},{"path":"src/calc/roomLighting.ts","kind":"calc","symbols":["LUMINAIRES","luminairesOf","roomIndexOf","gridInOutline","roomLighting","roomLightingDefaults"]},{"path":"src/calc/emergencyLighting.ts","kind":"calc","symbols":["EMPHASIS_LABEL","EMPHASIS_REACH_M","TYPICAL_FITTING","project","pointAt","escapeRoute","OPEN_AREA_M2","needsOpenArea","openArea","signViewingM","durationH","emergencyLayout"]},{"path":"src/model/roomLights.ts","kind":"model","symbols":["placeRoomLights"]},{"path":"src/model/emergencyPlace.ts","kind":"model","symbols":["placeEmergency"]},{"path":"src/model/luminaireSchedule.ts","kind":"model","symbols":["luminaireSchedule","LuminaireType"]},{"path":"src/model/cadDevices.ts","kind":"model","symbols":["LvPoint","PointLuminaire","EMERGENCY_ITEMS","placeLvPoint","removeLvPoint","withCount"]},{"path":"src/model/emergency.ts","kind":"model","symbols":["PANEL_ROLES","roleOf","planEmergency"]},{"path":"src/components/QuickCalcs.tsx","kind":"screen","symbols":["lux card","lumenMethod call"]},{"path":"src/components/LuxLayoutPlan.tsx","kind":"screen","symbols":["LuxLayoutPlan"]},{"path":"src/components/cad/RoomLightingPanel.tsx","kind":"screen","symbols":["LuxSettings","LUX_START","lightingOf","RoomLightingPanel"]},{"path":"src/components/cad/EmergencyPanel.tsx","kind":"screen","symbols":["EmSettings","EM_START","EM_PROMPT","emFitting","EmergencyPanel"]},{"path":"src/components/cad/CadPage.tsx","kind":"store","symbols":["luxRoom","luxSet","em","emSet","placeLux","finishRoute","placeEm"]},{"path":"src/calc/bom.ts","kind":"calc","symbols":["luminaireSchedule loop"]},{"path":"src/docs/boqWorkbook.ts","kind":"report","symbols":["Luminaire schedule sheet"]}],"links":[{"to":"22-cad-electrical","dir":"both","status":"working","what":"room outlines in; lighting and emergency points out as LvPoints","ref":"src/model/cadDevices.ts:placeLvPoint"},{"to":"04-building-load-assessment","dir":"in","status":"working","what":"room type target lux and level height for defaults","ref":"src/calc/roomLighting.ts:roomLightingDefaults"},{"to":"32-component-database","dir":"in","status":"working","what":"Luminaires.xlsx lumens, watts, SHR max, manufacturer","ref":"src/calc/roomLighting.ts:luminairesOf"},{"to":"20-equipment-boq-pricing","dir":"out","status":"working","what":"luminaire types and counts as BOQ lines and a Luminaire schedule sheet","ref":"src/calc/bom.ts:buildBom"},{"to":"24-drawings-sld-sheets","dir":"out","status":"working","what":"emergency symbols drawn on plan sheets","ref":"src/docs/planLayout.ts"},{"to":"33-quick-calcs-existing","dir":"out","status":"working","what":"quick lux calculator and setting-out plan","ref":"src/components/QuickCalcs.tsx:lumenMethod"}],"gaps":[],"md":"# 18 — Lighting / lux design, room lighting, emergency lighting, luminaire schedule\n[← Index](00-index.md) · [Integration map](99-integration-map.md)\n\n## 1. What it does\n\nThe module has four parts:\n\n1. **Quick lux calculator** (rectangular room) — `src/calc/lighting.ts` `lumenMethod`, shown in Quick calculators (`src/components/QuickCalcs.tsx`, card \"Lighting — lux (lumen method)\") with a 2D setting-out plan (`src/components/LuxLayoutPlan.tsx`). It works out:\n   - mounting height above the working plane Hm = ceiling − suspension − working plane;\n   - room index K = L·W ÷ (Hm·(L + W)) (`roomIndex`);\n   - utilisation factor UF: typed by the user (manufacturer value) **or** estimated from a built-in table of UF against K for six ceiling/wall/floor reflectance sets (`estimateUf`, `UF_TABLE`, linear interpolation, clamped at K = 0.6 and K = 5);\n   - number of luminaires N = E·A ÷ (Φ·UF·MF), rounded up and laid out as a rows × columns grid (`gridLayout`), then the achieved average E = N·Φ·UF·MF ÷ A;\n   - spacing along L and W, spacing-to-height ratio SHR = max spacing ÷ Hm (warning above 1.5), total W, W/m² and W/m² per 100 lx.\n2. **Light room on the CAD plan** (any room outline: rectangle, L-shape, angled walls) — `src/calc/roomLighting.ts` `roomLighting`. Same lumen method, but with the general room index K = 2A ÷ (Hm·P) (`roomIndexOf`), luminaire points placed on a grid inside the outline (`gridInOutline`), and warnings for: achieved lux below target, SHR above the luminaire's data-sheet maximum, lighting power density (W/m²) above the room type's limit, UF estimated. Starting values per room come from `roomLightingDefaults` (target lux from the room type, ceiling = floor-to-floor height − 0.6 m clamped 2.4–3.5 m, working plane 0.85 m or 0 m for lobby/parking/store/plant, MF 0.8, reflectances 0.5/0.3/0.2). The result is placed as lighting points on a chosen circuit (`src/model/roomLights.ts` `placeRoomLights`).\n3. **Emergency escape lighting on the CAD plan** — `src/calc/emergencyLighting.ts`, after BS 5266-1:2016 / EN 1838:2013, by the **spacing-table method** (no illuminance calculation):\n   - points of emphasis more than 2 m from any route get their own fitting (`emergencyLayout`);\n   - open (anti-panic) areas: a grid of fittings in a room outline, cell ≤ min(open spacing, 2 × wall distance) (`openArea`);\n   - exit signs at the exit end and direction signs at each change of direction; the farthest distance from any point of the route to a sign is checked against the sign's viewing distance d = z × h, z = 200 internally lit / 100 externally lit (`signViewingM`);\n   - duration rule 3 h / 1 h (`durationH`) — shown only.\n   The layout is placed as lighting points tagged as emergency fitting / exit sign / direction sign (`src/model/emergencyPlace.ts` `placeEmergency`).\n4. **Luminaire schedule** — `src/model/luminaireSchedule.ts` `luminaireSchedule`: the typed lights on the plans grouped by type (L1, L2… per catalogue entry and wattage; EM1, EX1, DS1 for emergency items) with count per board and floors. It feeds the BOM/BOQ and a \"Luminaire schedule\" sheet in the BOQ workbook.\n\n## 2. Files, components, functions and stores\n\n| File | Kind | Key functions or components | What they do |\n|---|---|---|---|\n| `src/calc/lighting.ts` | calc | `LUX_TARGETS`, `REFLECTANCES`, `UF_TABLE` (private), `roomIndex`, `estimateUf`, `gridLayout`, `lumenMethod`, `LuxInput`, `LuxResult` | Rectangular lumen method, UF estimate table, target lux list for the quick calculator |\n| `src/calc/roomLighting.ts` | calc | `LUMINAIRES`, `luminairesOf`, `roomIndexOf`, `gridInOutline`, `roomLighting`, `roomLightingDefaults` | Lumen method for any room outline on a CAD level; default inputs from room type and level height; built-in luminaire list |\n| `src/calc/emergencyLighting.ts` | calc | `EMPHASIS_LABEL`, `EMPHASIS_REACH_M`, `TYPICAL_FITTING`, `project`, `pointAt`, `escapeRoute`, `OPEN_AREA_M2`, `needsOpenArea`, `openArea`, `signViewingM`, `durationH`, `emergencyLayout` | Escape-route, open-area and sign layout by spacing table |\n| `src/model/roomLights.ts` | model | `placeRoomLights` | Puts the room's light points on one circuit; with `replace`, first removes every lighting point inside the room |\n| `src/model/emergencyPlace.ts` | model | `placeEmergency` | Puts each emergency fitting and sign on one circuit as an `ltg` point with an `emergency` tag |\n| `src/model/luminaireSchedule.ts` | model | `luminaireSchedule`, `LuminaireType` | Groups typed lights on the plans into L1…/EM1/EX1/DS1 with counts per board and floor |\n| `src/model/cadDevices.ts` (shared with 22) | model | `LvPoint` (`emergency`, `luminaire` fields), `PointLuminaire`, `EMERGENCY_ITEMS`, `placeLvPoint`, `removeLvPoint`, `withCount` | The saved plan point; placing/removing one changes the circuit's `points.ltg` count |\n| `src/components/QuickCalcs.tsx` (card `lux`) | screen | `lumenMethod` call at :288, card at :562 | Quick lux calculator inputs/outputs; validation via `src/components/quickInputs.ts` `quickInputErrors('lux')` |\n| `src/components/LuxLayoutPlan.tsx` | screen | `LuxLayoutPlan` | SVG plan of the rows × columns grid with setting-out dimensions (quick calculator only) |\n| `src/components/cad/RoomLightingPanel.tsx` | screen | `LuxSettings`, `LUX_START`, `lightingOf`, `RoomLightingPanel` | CAD \"Light room\" side panel: target lux, ceiling, working plane, reflectances, luminaire, MF, UF, circuit, Replace, result, Place |\n| `src/components/cad/EmergencyPanel.tsx` | screen | `EmSettings`, `EM_START`, `EM_PROMPT`, `emFitting`, `EmergencyPanel` | CAD \"Emergency\" side panel: mode (route / open area / point of emphasis), spacing table values, sign height, premises
